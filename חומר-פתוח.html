<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>חומר פתוח — מנהיגות בניהול</title>
<style>
/* ---------- בסיס ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{background:#8a8f96}
body{font:12.4px/1.46 "Segoe UI","Arial Hebrew",Arial,sans-serif;color:#12161c;direction:rtl}

/* ---------- עמוד ---------- */
/* A4 = 210×297mm. הריפוד הימני רחב יותר — שם הכריכה/הסיכה. */
.pg{position:relative;width:209.9mm;height:296.8mm;padding:13mm 11mm 11mm 16mm;
    background:#fff;margin:0 auto 7mm;overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pg.over{outline:3px solid #d92b2b}
.pg.over::after{content:"גלישה";position:absolute;left:2mm;bottom:2mm;
    background:#d92b2b;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px}

/* כותרת רצה */
.hd{position:absolute;top:5mm;right:11mm;left:16mm;display:flex;
    justify-content:space-between;align-items:baseline;
    border-bottom:1.6px solid var(--c,#333);padding-bottom:1.5mm;
    font-size:10px;letter-spacing:.2px}
.hd b{font-size:12.5px;color:var(--c,#333)}
.hd span{color:#7a828c}
.pgn{position:absolute;bottom:4.5mm;left:16mm;font-size:10px;color:#7a828c}
.pgn b{color:#333}

/* לשונית צד — המיקום האנכי משתנה לפי הנושא, כך שבערימת דפים
   נראות "מדרגות" וניתן לדפדף ישר לנושא בלי לקרוא. */
.tab{position:absolute;left:0;width:11mm;background:var(--c,#333);color:#fff;
     display:flex;align-items:center;justify-content:center;
     writing-mode:vertical-rl;font-size:9.5px;font-weight:700;letter-spacing:.4px;
     padding:2mm 0;border-radius:3px 0 0 3px}

/* ---------- תוכן ---------- */
.body{margin-top:6.5mm;column-gap:7mm}
.body.c2{column-count:2;column-rule:1px solid #dfe3e8}
h2{font-size:13.5px;color:#fff;background:var(--c,#333);padding:1.3mm 2.5mm;
   border-radius:2.5px;margin:0 0 1.6mm;break-after:avoid}
h2:not(:first-child){margin-top:3mm}
h3{font-size:12px;color:var(--c,#333);margin:2.4mm 0 1mm;break-after:avoid;
   border-bottom:1px dotted #c3c9d0;padding-bottom:.6mm}
h3:first-child{margin-top:0}
dl{margin:0 0 1.2mm}
dt{font-weight:700;font-size:12.2px;display:inline}
dd{display:inline;margin:0}
dl>div{margin-bottom:.9mm;break-inside:avoid;text-indent:-3.2mm;padding-right:3.2mm}
dt::before{content:"▪ ";color:var(--c,#333);font-weight:700}
dt::after{content:" — ";font-weight:400;color:#7a828c}
.n{color:#0b4f9e;font-weight:700;font-feature-settings:"tnum"}
.q{color:#3d4650;font-style:italic}
em{font-style:normal;background:#fff2b8;padding:0 1px;border-radius:2px}
.warn{background:#fdeaea;border-right:2.5px solid #d92b2b;padding:1.2mm 2mm;
      margin:1.2mm 0;break-inside:avoid;border-radius:0 2.5px 2.5px 0}
.warn b{color:#a51b1b}

/* טבלאות */
table{border-collapse:collapse;width:100%;font-size:11.2px;margin:0 0 2mm;break-inside:avoid}
th{background:var(--c,#333);color:#fff;text-align:right;padding:1mm 2mm;font-size:10px}
td{border-bottom:1px solid #dfe3e8;padding:.9mm 2mm;vertical-align:top}
tr:nth-child(even) td{background:#f6f8fa}
td.k{font-weight:700;white-space:nowrap;color:#0b4f9e;font-feature-settings:"tnum"}

/* ---------- שער ---------- */
.cover{text-align:center;padding-top:24mm}
.cover h1{font-size:30px;letter-spacing:-.5px;margin-bottom:2mm}
.cover .sub{font-size:13px;color:#5b6470;margin-bottom:12mm}
.toc{text-align:right;max-width:150mm;margin:0 auto}
.toc a{display:flex;align-items:baseline;gap:2mm;text-decoration:none;color:#12161c;
       padding:1.5mm 2mm;border-radius:3px;font-size:13px}
.toc a:nth-child(odd){background:#f2f5f8}
.toc .sw{width:4mm;height:4mm;border-radius:2px;flex:none}
.toc .nm{flex:1;font-weight:700}
.toc .dots{flex:1;border-bottom:1.5px dotted #b9c0c8;transform:translateY(-2px)}
.toc .pn{font-weight:700;color:#0b4f9e;font-feature-settings:"tnum"}
.tip{max-width:150mm;margin:10mm auto 0;background:#f2f5f8;border-radius:4px;
     padding:4mm 5mm;font-size:11px;line-height:1.55}
.tip b{display:block;margin-bottom:1.5mm;font-size:12px}

/* ---------- מפתח ---------- */
.idx{column-count:3;column-gap:6mm;font-size:10.6px;line-height:1.5}
.idx div{break-inside:avoid}
.idx .t{font-weight:700}
.idx .p{color:#0b4f9e;font-weight:700}
.idx h3{column-span:all}

/* ---------- הדפסה ---------- */
@page{size:A4;margin:0}
@media print{
  html{background:#fff}
  .pg{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pg.over{outline:none}
  .pg.over::after{display:none}
  .noprint{display:none}
}
.noprint{position:fixed;top:8px;left:8px;z-index:99;background:#12161c;color:#fff;
  border-radius:6px;padding:7px 11px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.noprint button{background:#2d6cdf;color:#fff;border:0;border-radius:4px;
  padding:4px 9px;font-size:12px;cursor:pointer;margin-right:6px}
.noprint a{color:#9ec5ff;text-decoration:none;font-size:12px;margin-right:9px}
.noprint a:hover{text-decoration:underline}
</style>
</head>

"מה נבדק :: מפעל האות'ורן של «חברת החשמל המערבית לציוד חשמלי» ב**שיקאגו** — מפעל להרכבת ממסרים. נבדקה השפעת **תנאי עבודה והעסקה חומריים** (תאורה, זמני מנוחה) על הפריון.",
"מה שינו :: זמני מנוחה · ארוחות קלות · חופשות · תמריצים כספיים · אורך יום ושבוע העבודה — **פעם לטובה ופעם לרעה**.",
"הנחת המחקר :: ככל שיחמירו את התנאים תרד התפוקה, וככל שישפרו אותם היא תעלה.",
"התוצאה :: __שיפור בתנאי העבודה אינו מבטיח עלייה בפריון.__ **ללא קשר** לשינויים בתנאים הייתה **עלייה בפריון וירידה בהיעדרויות**.",
]},
{h3:"מה גילו בפועל"},
{items:[
"מבנה בלתי פורמלי :: יחסים בינאישיים, עבודת צוות ואמון יצרו **קבוצה הומוגנית** עם מבנה בלתי פורמלי — שנוצר **ללא קשר** להיררכיה ולנורמות העבודה של המפעל.",
"נורמות קבוצתיות :: הקבוצה יצרה נורמות משלה — **לא אפשרו לאיטיים להתעצל, אך גם לא עודדו את המהירים מדי**. התפוקה הוגבלה למה שנתפס כ«תפוקה הולמת», **בלי קשר למדיניות ההנהלה**.",
"לכידות חברתית :: התגלו **תת-קבוצות ומנהיגים בלתי פורמליים**, ומבנה חברתי ברור של קבוצה מלוכדת שחבריה **נאמנים יותר לקבוצה מאשר להנהלה**.",
]},
{h3:"מסקנות"},
{items:[
"מסקנות האות'ורן :: ⟨1⟩ תגמולים **לא כספיים**, פרסים או סנקציות משפיעים על הביצועים ⟨2⟩ לצד היחסים הפורמליים מתנהלת **מערכת בלתי פורמלית** שמשפיעה על יעילות ואפקטיביות — ולכן יש **לטפח קשרים חברתיים** ⟨3⟩ __רמות הביצוע נקבעות על ידי נורמות חברתיות__ ולא על ידי יכולות גופניות ⟨4⟩ על המנהלים **לזהות את ההתנהגות הקבוצתית** ולפעול בהתאם.",
]},
{h2:"אפקטים נלווים"},
{items:[
"אפקט הות'ורן ⟦Hawthorne Effect⟧ :: תופעה שבה אנשים **משנים את התנהגותם כשהם יודעים שהם תחת תצפית** — רק בשל תשומת הלב שהם זוכים לה והשינויים שהם רואים בסביבת עבודתם.",
"חוללות עצמית ⟦Self-Efficacy · בנדורה⟧ :: **האמונה של האדם ביכולתו** לבצע פעולות מסוימות ולהשיג מטרות בתחום מסוים. מסוגלות גבוהה → התמדה, יוזמה והתמודדות עם אתגרים; מסוגלות נמוכה → הימנעות וכישלון.",
]},
{warn:"__אל תבלבל:__ **חוללות עצמית** = אמונת האדם בעצמו (בנדורה). **פיגמליון** = ציפיות של אחרים כלפיו."},
{h2:"גישת יחסי האנוש — מאיו"},
{items:[
"אופי הגישה :: **הומאנית (אנושית)**.",
"תפיסת העובד :: **אדם מורכב ולא מכונה**. יש להתחשב בו ולקבוע **תקנים אינדיבידואליים** ולא כלליים וכפויים.",
"מה למדוד :: להפחית **עייפות אנושית** ולאו דווקא להגדיל תפוקה · למדוד **קצב עבודה** ולא זמן עבודה · להתבונן ב**מניעים, כישורים ואישיות** כמנבאי יעילות.",
"תפיסת הניהול :: המנהל צריך **להתייחס לצורכי העובדים ולטפח אותם**, כדי להשיג מטרות ארגוניות באמצעות האנשים שיש לו.",
"תרבות ארגונית :: העובדים צריכים להיות **שותפים למטרות הארגון ולהזדהות איתן**. __זה לא יכול להיעשות בכפייה או בנהלים נוקשים.__",
]},
{h2:"גישת X/Y — מקגרגור"},
{tbl:{head:["","עובדים X — גישה מכנית","עובדים Y"],rows:[
["טבע","**עצלנים מטבעם**, עובדים בעיקר בגלל סטטוס וכסף","**פעילים מטבעם**, מחפשים סיפוק מהיבטים שונים בעבודה"],
["עצמאות","תלויים במנהיגים, לא רוצים לחשוב בעצמם, זקוקים לפיקוח והדרכה","שואפים לעצמאות, הגשמה עצמית ואחריות; מכוונים את התנהגותם"],
["אופק","דואגים לצורכיהם המיידיים, אוהבים שגרה, נשארים סטטיים","מחפשים משמעות, מתעייפים משגרה, צומחים ומתפתחים"],
["יצירתיות","נובעת מ**פחד מפיטורין** או מהורדה בדרגה","נובעת מ**רצון להשיג** מטרות אישיות וחברתיות"],
["תוצאה ניהולית","__ניהול סמכותי ופיקוח הדוק__","__ניהול משתף ומתייחס__"],
]}},
]},

/* ══════════════════════════════ 4 · גישות מודרניות */
{name:"גישות מודרניות", color:"#00838f", sub:"TQM · הינדוס · מערכת · תלות", cols:2, blocks:[
{h2:"ניהול איכות כוללת — TQM"},
{items:[
"עקרונות :: התמקדות ב**לקוח — פנימי וחיצוני** · תהליך של **שיפור מתמיד** · שיפור האיכות של **כל** מה שעושה הארגון · **מדידות מדויקות** (מדדים ותקנים) · **העצמה**.",
]},
{h2:"הינדוס מחדש — Re-engineering"},
{items:[
"מהו :: **הגדרה מחדש של הארגון** — עיסוקים, מבנה ארגוני, עבודה. «להפוך הכל ולארגן מחדש».",
"השאלה המנחה :: «**אילו התחלנו הכל מחדש — איך היינו עושים את הדברים?**»",
"מתי מתאים :: לשינויים סביבתיים. **שינויים מערכתיים גדולים** ולא של רכיב בתוכה. מחייב **מחשבה שונה, יצירתיות וגמישות**.",
"עיקרון :: __על הארגון להשתנות כל הזמן.__",
]},
{h2:"גישת המערכת"},
{items:[
"התפיסה :: הארגון הוא **מערכת שלמה ודינמית** המורכבת מחלקים הפועלים יחד ומשפיעים זה על זה; הוא **אינו פועל בבידוד** אלא בקשר מתמיד עם הסביבה.",
]},
{tbl:{head:["","מערכת סגורה","מערכת פתוחה"],rows:[
["הגדרה","ארגון הפועל **במנותק מהסביבה**, לא מושפע ממנה ולא משפיע עליה — __מצב נדיר בעולם האמיתי__","**השפעות הדדיות** עם הסביבה: קולטת מידע, משאבים ועובדים מהחוץ ומגיבה לשינויים"],
["מקור הבעיות","**רק מהמציאות הארגונית** הפנימית","מירב הבעיות **נגרמות ומושפעות מסביבת הארגון**"],
["פתרון","הסיבה (**דיאגנוזה**) והפתרון (**פרוגנוזה**) — שניהם **בתוך** המערך הארגוני","הסתגלות, גמישות ותיאום בין חלקי הארגון לסביבה המשתנה"],
]}},
{items:[
"מדוע התחזקה התלות :: בשל תהליכי **גלובליזציה** — כלכלית, חינוכית, ערכית וכדומה.",
]},
{h2:"גישת התלות — Contingency"},
{items:[
"הטענה :: __אין דרך ניהול אחת נכונה לכל מצב.__ ההתנהלות והמבנה צריכים להתאים לתנאים המשתנים: סוג הסביבה, טכנולוגיה, גודל הארגון.",
"הצלחה ניהולית :: תלויה ב**התאמה בין שיטת הניהול לבין ההקשר** שבו פועל הארגון.",
"משתנים :: **תלויים** — יעילות, ביצועים (תוצאה). **בלתי תלויים** — סוג ההנהלה, תנאי סביבה (הגורמים). קיימים גם ב**מיקרו** (עובד, צוות) וגם ב**מאקרו** (מבנה הארגון, קשרים עם השוק).",
"המסקנה :: אין פתרון אחד שמתאים לכולם — **כל ארגון מתאים את דרכי פעולתו לנסיבות הספציפיות שלו**.",
]},
]},

/* ══════════════════════════════ 7 · תכונות והתנהגות */
{name:"תכונות והתנהגות", color:"#ad1457", sub:"התכונות · מישיגן · אוהיו · הסריג", cols:2, blocks:[
{h2:"גישת התכונות"},
{items:[
"הטענה :: מנהיגים ניחנים ב**תכונות וכישורים מיוחדים** המבדילים אותם מאחרים; התכונות **מולדות, קבועות בכל מצב**, והן מובילות את האדם לתפקידי מנהיגות.",
"תיאוריית האדם הדגול ⟦קרלייל⟧ :: תכונות **תורשתיות ומולדות**. אם לא קיבל מגיל צעיר — התכונה יציבה ולא נרכשת. «**פעם מנהיג — תמיד מנהיג**»; המנהיג **מורם מהעם**. נשענת גם על התיאוריה **הדרוויניסטית** — החזק שורד.",
]},
{h3:"מה נבדק"},
{items:[
"תכונות פיזיות ⟨1⟩ :: משקל, גובה",
"תכונות אישיות ⟨2⟩ :: הסתגלות, אגרסיביות, יצירתיות, עמידה בלחץ, ביטחון עצמי",
"יכולות ⟨3⟩ :: אינטליגנציה, כושר ביטוי ושכנוע, כישורים בינאישיים, יכולות קוגניטיביות",
"צרכים ומניעים ⟨4⟩ :: הישג, השתייכות, עוצמה",
"ערכים ⟨5⟩ :: יושר, אמינות, לויאליות",
]},
{items:[
"מחקרי סטוגדיל ⟨1948⟩ ⟦Meta Analysis⟧ :: אסף מאות מחקרים. נמצאו תכונות **נפוצות** בקרב מנהיגים: **אמביציה, ביטחון עצמי, הסתגלות, התמודדות עם לחצים, חברתיות, עקשנות, אסרטיביות, דומיננטיות**. __אך לא נמצאו תכונות זהות בין המנהיגים.__",
"כשלא מצאו תכונות — דיברו על מיומנויות :: ⟨1⟩ **טכניות** — הפעלת מכונות ⟨2⟩ **בינאישיות** — תקשורת, השפעה, הבחנת תפיסה ⟨3⟩ **קונספטואליות** — יכולת המשגה וביטוי ⟨4⟩ **ניהוליות** — ארגון, תכנון, תיאום, תזמון, הקצאת משאבים. __זו המהפכה: מנהיגות אינה מולדת אלא נרכשת.__",
"לקראת סוף 1970 — יכולות :: קונספטואליות · קוגניטיביות (אינטליגנציה) · אמביציה · יצירתיות · רטוריקה ושטף דיבור · יכולת שכנוע · יכולת הסתגלות.",
]},
{h3:"מקללנד — שלושת הצרכים"},
{items:[
"צורך בהישג :: שאיפה להצטיינות, ביצוע חשוב ומאתגר, לקיחת סיכונים, **צורך במשוב מיידי**.",
"צורך בעוצמה :: רצון להוביל, לתת עצות, יוקרה, תפקיד עם סטטוס, השפעה על אנשים.",
"צורך בהשתייכות :: רצון להיות פופולרי, שיחשבו עליו טובות, יחסים חבריים, לא אוהב להיות לבד, אוהב לעזור.",
"מה נמצא אצל מנהיגים :: __צורך גבוה בשליטה חברתית · מניע הישג ברמה בינונית · צורך במקובלות נמוך.__",
]},
{h3:"ביקורות ותרומה"},
{items:[
"התרומה :: יודעים ש**הכריזמה** שמחפשים במנהלים מגיעה מתיאוריית האדם הדגול · יודעים **מי לא יכול** להיות מנהיג · יודעים ש**ניתן לשפר** מנהיגות.",
"הביקורות :: **חוסר עקביות** — לא נמצאו תכונות שניבאו בעקביות · קיימים מנהיגים אפקטיביים **ללא** התכונות ולא-אפקטיביים **עם** התכונות · בעלי תכונות זהות שונים ביכולתם ולהיפך · הגישה «**מונעת**» מאנשים להיהפך למנהיגים · **מתעלמת מהמצב** · בחברות דמוקרטיות מנהיגים צומחים בכל מקום · **סתירות** בין התכונות · __ניתן ללמוד להיות מנהיג.__",
]},
{h2:"הגישה ההתנהגותית"},
{items:[
"מה בחנו :: **התנהגויות בפועל** של מנהיגים במקום הפוטנציאל להתנהג (תכונות).",
"היתרונות :: התנהגויות **קלות יותר למדידה** · השפעתן על האפקטיביות **ישירה יותר** · **התנהגות ניתנת ללמידה**.",
"מדד האפקטיביות :: מידת **השגת המטרות** ו**עמדות הכפיפים** כלפי המנהיג.",
]},
{h3:"מחקרי אוניברסיטת מישיגן"},
{items:[
"המסקנה :: סגנון המנהיגות נחלק לשתיים — **ממוקד משימה** (task oriented) ו**ממוקד בעובד** (people oriented). __מנהיגים אינם יכולים לבטא את שני סוגי ההתנהגות בו-זמנית.__",
]},
{h3:"מחקרי אוניברסיטת אוהיו"},
{items:[
"הכלי :: «**שאלון תיאור ההתנהגות**» — מנהלים הוערכו על ידי **ממונים, עמיתים וכפיפים** לפי התנהגויות שהם מפגינים.",
"הממצא :: שני סגנונות **נפרדים, שאינם תלויים זה בזה** — מנהיג יכול להיות גבוה באחד, בשניהם, או באף אחד.",
"סגנון משימתי ⟦יזום מבנה⟧ :: מתמקד בעבודה, במשימות, בעמידה בזמנים, בפתרון בעיות ובביצועים. מציב מטרות ברורות, מבקר כשצריך, מציע פתרונות.",
"סגנון מתחשב ⟦מתייחס לאנשים⟧ :: מתמקד בקשרים אנושיים, באכפתיות, בהוקרה וביצירת אווירה טובה. דואג לרגשות, מחמיא, שומר על מורל גבוה.",
"המסקנה :: __המנהיג האפקטיבי צריך לשלב את שני הסגנונות__ — לנהל עבודה ביעילות מבלי להזניח את הצרכים האנושיים.",
]},
{h2:"הסריג הניהולי"},
{items:[
"הרעיון :: המשימתי והמתייחס כ**רצף של תשיעונים** (רצף עוצמות). הרבה מנהלים נמצאים ב-**5,5** ולפי המודל הם צריכים להיות ב-**9,9**.",
]},
{tbl:{head:["משבצת","הכינוי","מאפיינים","בפתרון קונפליקטים"],rows:[
["**1,1**","ההנהלי","מתנהג לפי תקנות, «שולחן נקי», אינו מתערב, הקבוצה פועלת לבד","**הימנעות** — אי-הגררות לקונפליקט בכל מחיר"],

/* ══════════════════════════════ 8 · הגישה המצבית */
{name:"הגישה המצבית", color:"#ef6c00", sub:"פידלר · הרסי ובלנשארד", cols:2, blocks:[
{h2:"הגישה המצבית — מודלים קונטינגנטיים"},
{items:[
"התפיסה :: «**מנהיג נולד מתוך מצב כלשהו**». דגש על התנהגות המנהיג או תכונותיו **בתוך ההקשר המצבי** שבו הוא פועל.",
"שני קווי מחקר :: **המצב כמשתנה בלתי תלוי** — איך מאפייני המצב משפיעים על התנהגות המנהל? · **המצב כמשתנה ממתן** — איך מאפייני המצב ממתנים את הקשר בין התנהגות המנהיג לאפקטיביות שלו?",
"מנהיגות כתולדה של נסיבות :: מהות הקבוצה וסוג האתגרים **יכתיבו את סוג המנהיגות** שתתפתח. __ההיסטוריה היא שעושה את המנהיג — ולא להפך. דטרמיניזם.__",
"תפקיד הקבוצה :: הקבוצה בארגון היא **האמצעי העיקרי להשגת מטרות המנהל**.",
"שלושה מאפיינים במפגש בין סגנון לאפקטיביות :: ⟨1⟩ **היחסים האישיים** בין המנהל לעובדיו ⟨2⟩ **מבנה המשימות** העומדות בפני הקבוצה ⟨3⟩ **מעמדו וכוחו** של המנהל בקבוצה.",
]},
{h2:"תיאוריית התלות — פידלר ⟨1967⟩"},
{items:[
"שאלון LPC :: **Least Preferred Co-worker** — בודק אם המנהיג **מכוון אנשים** (חברתי) או **מכוון משימה** (משימתי).",
"איך זה עובד :: נותנים למנהיג לתאר את **האדם הכי פחות מועדף עליו** במושגים: נעים-לא נעים, חברותי-לא חברותי, חם-קר.",
"פענוח :: דירג את העובד הלא-מועדף **גבוה** (למרות דעתו השלילית) → __מכוון אנשים__. נתן ציון **נמוך** → __מכוון מטרה (משימתי)__.",
]},
{tbl:{head:["","מנהיג משימתי","מנהיג חברתי"],rows:[
["מתי מתבלט","כשצריך **לבצע תפקיד או משימה** מסוימת","כשנדרש **לגבש את הקבוצה** מבחינה חברתית"],
["מה עושה","נותן עצות, מספק מידע, מעביר ביקורת, מתכנן פעילויות, מארגן ומתרכז בהשלמת המשימה","מגן על אנשיו, מעודד, מפייס, מטפח יחסי חברות, מספר בדיחות, מפיג מתח, דואג לסולידריות, מיישב סכסוכים, מעלה מורל"],
["משך הכהונה","__זמנית — פגה עם השלמת המשימה__","__יכול להנהיג לאורך זמן__"],
]}},
{items:[
"סגנון המנהיגות :: **מרכיב קבוע/קשיח** — הוא חלק מהאישיות ולכן **לא ניתן לשנותו**. מי שמכוון משימה יישאר כזה.",
"אין סגנון אפקטיבי אחד :: __במצבים קיצוניים (קלים מאוד או קשים מאוד) — מנהיג מכוון משימה יעיל יותר. במצבי ביניים — מנהיג מכוון אנשים יעיל יותר.__",
"המסקנה המעשית :: אין ללמד את המנהיג להתאים סגנון למצב — אלא **לבנות את המצב המתאים לסגנונו**. מינוי לפי סוג המשימה; פיתוח מנהיגים ביצירת התנאים הנוחים להם.",
"ביקורת :: ⟨1⟩ סגנון המנהיגות אינו ניתן לשינוי ⟨2⟩ התיאוריה לא מסבירה איך ציון LPC משפיע על ביצועי הקבוצה ⟨3⟩ **הגדרה מצומצמת מדי** של גורמי המצב ⟨4⟩ במציאות הדינמית **גם המצב וגם המנהיגים משתנים כל הזמן**.",
]},
{h2:"הרסי ובלנשארד ⟨1972⟩ — מיצוב המנהיגות"},
{items:[
"סגנון המנהיגות הרצוי תלוי בשני גורמים :: **⟨1⟩ בשלות מקצועית/תפקודית** — ידע · ניסיון וביטחון עצמי בעבודה · מיומנות. מידת העצמאות, היכולת ליטול אחריות ומניע ההישג. **⟨2⟩ בשלות פסיכולוגית** — ביטחון בביצוע המשימה · מחויבות למשימה · מוטיבציה.",
"במה תלויה רמת הבגרות :: ב**השכלת** העובדים, ב**גילם**, ב**ניסיונם** בעבודה וב**תרבות הארגונית**.",
"אופי הבשלות :: __הבשלות אינה מאפיין אישיות אלא כלפי משימה.__ ייתכן שאדם יהיה בעל רמות בשלות שונות כלפי משימות שונות.",
"בשלות קבוצה :: אי אפשר לאפיין אותה כ**סך בשלות משתתפיה** אלא לפי בשלות המשימה. __בשלות הקבוצה אינה מדד לבשלות עובד בודד.__",
]},

/* ══════════════════════════════ 9 · הטווח המלא */
{name:"הטווח המלא", color:"#c62828", sub:"בס ואבוליו · מעצבת · מתגמלת", cols:2, blocks:[
{h2:"מנהיגות — הטווח המלא (Bass & Avolio)"},
{items:[
"הגדרת מנהיגות :: **הנעת אנשים לביצוע משימות לאורך זמן**, תוך **מיצוי אמצעי ההנעה** ותוך **שימוש מזערי באמצעי כפייה**.",
"שלושת הסגנונות :: **אי-מנהיגות** · **מנהיגות מתגמלת (עסקתית)** · **מנהיגות מעצבת (מתמירה)**.",
]},
{h2:"אי-מנהיגות — «שב והנח» / לסה פייר"},
{items:[
"התנהגות המנהיג :: **אין הגדרה ברורה** של ציפיות, יעדים, תפקידים, תגמולים או עונשים · **הימנעות** מנקיטת עמדה ומקבלת החלטות · נטייה **לעכב** דברים · הפגנת **אדישות** · **אין מעורבות פעילה** בעבודת המונהגים.",
"תגובת המונהגים ⟦טפלון⟧ :: אדישות וחוסר אכפתיות · התמקדות ב**יעדים אישיים** גם בסתירה ליעדי הארגון. __«טפלון».__",
]},
{h2:"מנהיגות מתגמלת (עסקתית) — «מקלות וגזרים»"},
{h3:"⟨1⟩ תגמול בונה / מותנה"},
{items:[
"המנהיג :: **הצבה ברורה ומובנת** של היעדים ומי אחראי להשגתם · **איתור צרכי המונהגים** · **הבהרת התגמול/«העונש»** בתמורה להשגה או לאי-השגה · נוטל **חלק פעיל** · מתן **משוב בונה ושבח** — או מניעתם.",
"המונהגים :: שיתוף פעולה **משיקולי כדאיות** · המאמץ תלוי ב**אטרקטיביות התגמול** או ב**רתיעה מהעונש** · הגעה ל**רמת הביצוע הנדרשת**.",
]},
{h3:"⟨2⟩ מנהיגות מתקנת אקטיבית"},
{items:[
"המנהיג :: התמקדות ב**איתור חריגים, סטיות וכישלונות** · אנרגיה ב**מעקב ובקרה צמודה** · **מעקב פעיל** אחר תחומים מועדים לפורענות · ניסיון לאתר ולתקן **במהירות המרבית**.",
"המונהגים :: **הימנעות מסיכונים** ומטעויות · שימור שיטות מסורתיות והימנעות מחדשנות · __סכנה לצייתנות עיוורת, «ראש קטן» ו«כסת״ח».__",
]},
{h3:"⟨3⟩ מנהיגות מתקנת פסיבית — «כיבוי שריפות»"},
{items:[
"המנהיג :: התבססות על **איתור טעויות ותיקונן** · הגדרת **תקנים כלליים** · **הימנעות מכל מעורבות** כל עוד לא מתגלות טעויות · מתערב **רק כשתקלה מגיעה לידיעתו**. __«אם זה לא שבור — אל תתקן!»__",
"המונהגים :: הנעה המבוססת על **חשש מתגובה חריפה** בכל תקלה · **שמירת הרמה הקיימת**.",
]},
{h2:"מנהיגות מעצבת — ארבעת המרכיבים"},
{h3:"כריזמה (מיוחסת והתנהגותית)"},
{items:[
"מהי :: יכולת **להלהיב** לביצוע משימה, **להשרות נאמנות** לארגון, לראות את המהותי והחשוב. **תחושת שליחות**.",
"המנהיג :: מפגין **ביטחון ואמונה ביכולת המונהגים** · לוקח **אחריות מלאה** לפעולותיהם · ממקד אותם בחשיבות היותם **גוף מלוכד** · מעדיף את צורכיהם על אינטרסים אישיים · **דבקות** בהשגת המטרות · **דוגמה אישית** · **סטנדרטים אתיים ומוסריים גבוהים** · מתנהג **עקבי ולא שרירותי**.",
"המונהגים :: המנהיג ומטרותיו הופכים ל**מודל לחיקוי והזדהות** · **הערצה, הערכה, כבוד ואמון** · משקיעים כמיטב יכולתם כדי להראות תמיכה.",
]},
{h3:"הנעה באמצעות השראה"},
{items:[
"מהי :: יכולת **לעורר רגשות, להחיות, להלהיב**. אפשר בשיחה רציונלית, בהברקה שבפריצה קדימה או ביופי שבהצגת טיעון — __ובכולן ההשפעה היא קודם כל על הרגשות.__",
"המנהיג :: נותן **תחושת משמעות ואתגר** · מפגין **התלהבות ואופטימיות** · מציג **חזון ברור** למצבים עתידיים רצויים · יכולת **לחלחל חזון** · **מיישר קו** בין מטרות אישיות למטרות צוותיות/ארגוניות.",
"המונהגים :: מוכנים להשקיע **מאמץ יתר** · נלהבים לקחת **משימות אתגריות** · רואים בחזון הארגוני את **החזון האישי** שלהם.",
]},
{h3:"אתגור אינטלקטואלי — «מונה ליזה»"},
{items:[
"מהו :: מציג **דרכים חדשות ומאתגרות** של תפיסת המציאות — הפיכת **משבר להזדמנות**, **כישלון ללמידה**, **הצלחה לציון דרך**.",
"המנהיג :: מעורר להסתכל על בעיות **בדרכים שונות מהמקובל** · מעריך רעיונות של אחרים · מעודד **חלופות יצירתיות** · **קורא תגר על מחשבה ישנה** · מפתח חשיבה **עצמאית-ביקורתית** · מפגין ביקורת גם כלפי רעיונותיו · __לא נותן ביקורת ציבורית על טעויות אישיות__ · מערב את המונהגים בחשיבה.",
]},
{h3:"התייחסות פרטנית"},
{items:[
"מהי :: **גישה התפתחותית** לאנשים. יודע להעריך את **הפוטנציאל של כל אחד** · מטיל מטלות **בדרגת קושי עולה** · משתמש בהשפעה אישית ו**מגע קרוב פנים אל פנים** · **מכיר היטב את הכפופים לו** ויודע איך להפעיל כל אחד.",
"המנהיג :: תשומת לב לצורכי **ההישג וההתפתחות** של כל פרט · יוצר **תחושת שייכות** · פועל כ**חונך ומנטור** · מאבחן ומקבל הבדלים · **אקלים תומך** · מאציל משימות מתאימות · מראה **דאגה לצרכים האישיים** · **זמין ונגיש**.",
"המונהגים :: **מיצוי מלוא הפוטנציאל** האישי · שאיפה להתפתחות · רצון למשימות שמאפשרות **ללמוד דברים חדשים**.",
]},
{warn:"**לפי הטווח המלא:** __ככל שמאמצים דפוסי מנהיגות מעצבת — המנהיגות אפקטיבית יותר.__ · **מנהל שהוא מנהיג** יתאפיין במנהיגות **מתמירה/מעצבת**. · **E של אדיג'ס** מקביל למנהיגות מעצבת."},
]},

/* ---- עזרי בנייה ---- */
function E(t,a,h){var e=document.createElement(t);for(var k in a)e.setAttribute(k,a[k]);
  if(h!=null)e.innerHTML=h;return e;}

/* טקסט עשיר: **מודגש** ⟨מספר⟩ «ציטוט» __הדגשה__ */
function rt(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/__(.+?)__/g,'<em>$1</em>')
    .replace(/«(.+?)»/g,'<span class="q">"$1"</span>')
    .replace(/⟨(.+?)⟩/g,'<span class="n">$1</span>');
}

/* ---- הופך בלוק לאלמנט ---- */
function block(b){
  if(b.h2) return E('h2',{},rt(b.h2));
  if(b.h3) return E('h3',{},rt(b.h3));
  if(b.warn) return E('div',{'class':'warn'},rt(b.warn));
  if(b.tbl){
    var t=E('table'),th=E('tr');
    (b.tbl.head||[]).forEach(function(c){th.appendChild(E('th',{},rt(c)));});
    if(b.tbl.head)t.appendChild(th);
    b.tbl.rows.forEach(function(r){
      var tr=E('tr');
      r.forEach(function(c,i){tr.appendChild(E('td',{'class':i===0?'k':''},rt(c)));});
      t.appendChild(tr);
    });
    return t;
  }
  var dl=E('dl');
  b.items.forEach(function(it){
    var d=E('div'), p=String(it).split(' :: ');
    /* ⟦כינוי · כינוי⟧ בכותרת — לא מוצג, אך נכנס למפתח הא״ב. נועד לכותרות
       שנוסחו כשאלה ("מה נכלל") ואי אפשר לחפש אותן לפי מונח. */
    var head=p[0], alias='', ma=head.match(/⟦([^⟧]*)⟧/);
    if(ma){ alias=ma[1]; head=head.replace(/\s*⟦[^⟧]*⟧/,''); }
    var dt=E('dt',{},rt(head));
    if(alias) dt.setAttribute('data-idx',alias);
    d.appendChild(dt);
    d.appendChild(E('dd',{},rt(p.slice(1).join(' :: '))));
    dl.appendChild(d);
  });
  return dl;
}

/* ---- דפדוף: ממלא עמוד עד שהוא מתמלא, ואז פותח חדש ---- */
var out=document.getElementById('out'), pages=[];
function newPage(sec,cont){
  var p=E('div',{'class':'pg','style':'--c:'+sec.color});
  p.appendChild(E('div',{'class':'hd'},
    '<b>'+sec.name+'</b><span>'+(cont?'המשך':(sec.sub||''))+'</span>'));
  var tabTop = 14 + sec.idx*(70/Math.max(1,DATA.sections.length-1));
  p.appendChild(E('div',{'class':'tab',
    'style':'top:'+tabTop+'mm;height:34mm'},sec.name));
  var bd=E('div',{'class':'body'+(sec.cols===2?' c2':'')});
  p.appendChild(bd); p.appendChild(E('div',{'class':'pgn'}));
  out.appendChild(p); pages.push(p);
  return bd;
}
function fits(pg){return pg.scrollHeight<=pg.clientHeight+1;}

DATA.sections.forEach(function(sec,si){
  sec.idx=si;
  var bd=newPage(sec,false), pg=bd.parentNode;
  sec.blocks.forEach(function(b){
    var el=block(b);
    bd.appendChild(el);
    if(!fits(pg)){
      bd.removeChild(el);
      /* כותרת בסוף עמוד — מעבירים אותה יחד עם מה שבא אחריה */
      var trail=[];
      while(bd.lastChild && /^H[23]$/.test(bd.lastChild.tagName)){
        trail.unshift(bd.lastChild); bd.removeChild(bd.lastChild);
      }
      bd=newPage(sec,true); pg=bd.parentNode;
      trail.forEach(function(t){bd.appendChild(t);});
      bd.appendChild(el);
      /* בלוק גדול מעמוד שלם — טבלה ארוכה או רשימה ארוכה — נחתך לשורות */
      while(!fits(pg) && el.rows && el.rows.length>1){
        var cut=E(el.tagName), moved=false;
        while(!fits(pg) && el.rows.length>1){
          cut.insertBefore(el.rows[el.rows.length-1], cut.firstChild);
          moved=true;
        }
        if(!moved) break;
        bd=newPage(sec,true); pg=bd.parentNode;
        bd.appendChild(cut); el=cut;
      }
      while(!fits(pg) && el.children && el.children.length>1 && !el.rows){
        var cut2=E(el.tagName,{'class':el.getAttribute('class')||''}), moved2=false;
        while(!fits(pg) && el.children.length>1){
          cut2.insertBefore(el.lastElementChild, cut2.firstChild);
          moved2=true;
        }
        if(!moved2) break;
        bd=newPage(sec,true); pg=bd.parentNode;
        bd.appendChild(cut2); el=cut2;
      }
    }
  });
});

/* ---- מספור, שער ומפתח ---- */
var first={};
pages.forEach(function(p,i){
  p.querySelector('.pgn').innerHTML='עמ׳ <b>'+(i+2)+'</b>';
  var nm=p.querySelector('.hd b').textContent;
  if(first[nm]===undefined)first[nm]=i+2;
});

var cover=E('div',{'class':'pg'});
cover.innerHTML='<div class="cover"><h1>מנהיגות בניהול</h1>'+
  '<div class="sub">חומר פתוח למבחן · בר-אילן<br>'+
  '<b>נבנה מהסיכום המקוצר למבחן</b> — כל החומר בדפי A4, עם לשוניות ניווט ומפתח א״ב</div></div>';
var toc=E('div',{'class':'toc'});
DATA.sections.forEach(function(s){
  var a=E('a',{href:'#'},'<span class="sw" style="background:'+s.color+'"></span>'+
    '<span class="nm">'+s.name+'</span><span class="dots"></span>'+
    '<span class="pn">'+first[s.name]+'</span>');
  toc.appendChild(a);
});
cover.querySelector('.cover').appendChild(toc);
cover.querySelector('.cover').appendChild(E('div',{'class':'tip'},
  '<b>איך מנווטים כאן מהר</b>'+rt(
  '__שני הפרקים הראשונים הם מה שתפתחו בו הכי הרבה__ — **מילון ראשי התיבות וטבלת כל המספרים**, '+
  'ואחריו **הביבליוגרפיה** (⟨4⟩ שאלות במבחן). שאר הפרקים לפי נושא. '+
  'הלשוניות בשוליים השמאליים יורדות מדרגה-מדרגה לפי סדר הפרקים — בערימת דפים '+
  'רואים אותן מהצד ומדפדפים ישר לפרק, בלי לקרוא כותרות. '+
  'בסוף החוברת **מפתח מונחים לפי א״ב** עם מספרי עמודים. '+
  '⟨מספרים⟩ מודגשים בכחול · __הדגשה צהובה__ = נקודה שהמרצה חזר עליה · '+
  '«מירכאות אלכסוניות» = ציטוט מהכיתה.')));
out.insertBefore(cover,out.firstChild);
cover.appendChild(E('div',{'class':'pgn'},'עמ׳ <b>1</b>'));

/* מפתח א״ב — נבנה מהמונחים שסומנו, כך שמספרי העמודים תמיד נכונים */
var terms={};
pages.forEach(function(p,i){
  p.querySelectorAll('dt').forEach(function(d){
    var t=d.textContent.replace(/^▪\s*/,'').replace(/\s*—\s*$/,'').trim();
    var keys=[t];
    var al=d.getAttribute('data-idx');
    if(al) keys=keys.concat(al.split('·'));
    keys.forEach(function(k){
      k=k.trim();
      if(k.length<2||k.length>44)return;
      (terms[k]=terms[k]||[]).push(i+2);
    });
  });
});
var keys=Object.keys(terms).sort(function(a,b){return a.localeCompare(b,'he');});
var ixSec={name:'מפתח',color:'#3d4650',sub:'לפי א״ב',idx:DATA.sections.length-1};
/* המפתח מתפרס על פני כמה עמודים בדיוק כמו התוכן — אחרת הוא גולש. */
var ixFirst=pages.length+2;          /* לשורת התוכן שתתווסף בהמשך */
var ibd=newPage(ixSec,false), ipg=ibd.parentNode, idx=E('div',{'class':'idx'});
ibd.appendChild(idx);
keys.forEach(function(k){
  var u=terms[k].filter(function(v,i,a){return a.indexOf(v)===i;});
  var row=E('div',{},'<span class="t">'+k+'</span> <span class="p">'+u.join(', ')+'</span>');
  idx.appendChild(row);
  if(!fits(ipg)){
    idx.removeChild(row);
    ibd=newPage(ixSec,true); ipg=ibd.parentNode;
    idx=E('div',{'class':'idx'}); ibd.appendChild(idx); idx.appendChild(row);
  }
});
pages.forEach(function(p,i){var e=p.querySelector('.pgn');if(e)e.innerHTML='עמ׳ <b>'+(i+2)+'</b>';});

/* המפתח נבנה אחרי שהשער כבר נוצר, ולכן שורתו מתווספת לתוכן העניינים רק כאן */
toc.appendChild(E('a',{href:'#'},
  '<span class="sw" style="background:'+ixSec.color+'"></span>'+
  '<span class="nm">מפתח מונחים לפי א״ב</span><span class="dots"></span>'+
  '<span class="pn">'+ixFirst+'</span>'));

/* הקישור חזרה — שם הקובץ שונה בין הרפו לתיקיית הקורס */
(function(){
  var me=decodeURIComponent(location.pathname.split('/').pop()||'');
  if(me.indexOf('חומר פתוח')===0)
    document.getElementById('back').setAttribute('href','בוחן תרגול - מנהיגות בניהול.html');
})();

/* ---- בקרת גלישה ---- */
var over=0;
document.querySelectorAll('.pg').forEach(function(p){
  if(p.scrollHeight>p.clientHeight+1){p.classList.add('over');over++;}
});
document.getElementById('stat').textContent=
  document.querySelectorAll('.pg').length+' עמודים'+(over?' · '+over+' בגלישה':' · תקין');
</script>
