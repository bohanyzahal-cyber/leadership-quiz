<title>חומר פתוח — מנהיגות בניהול</title>
<style>
/* ---------- בסיס ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{background:#8a8f96}
body{font:13px/1.32 "Segoe UI","Arial Hebrew",Arial,sans-serif;color:#12161c;direction:rtl}

/* ---------- עמוד ---------- */
/* A4 = 210×297mm. הריפוד הימני רחב יותר — שם הכריכה/הסיכה. */
.pg{position:relative;width:209.9mm;height:296.8mm;padding:8mm 6mm 6mm 11mm;
    background:#fff;margin:0 auto 7mm;overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pg.over{outline:3px solid #d92b2b}
.pg.over::after{content:"גלישה";position:absolute;left:2mm;bottom:2mm;
    background:#d92b2b;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px}

/* כותרת רצה */
.hd{position:absolute;top:5mm;right:11mm;left:16mm;display:flex;
    justify-content:space-between;align-items:baseline;
    border-bottom:1.6px solid var(--c,#333);padding-bottom:1.5mm;
    font-size:10px;letter-spacing:.2px}
.hd b{font-size:12.5px;color:var(--c,#333)}
.hd span{color:#7a828c}
.pgn{position:absolute;bottom:4.5mm;left:16mm;font-size:10px;color:#7a828c}
.pgn b{color:#333}
.pgn a{color:#333;text-decoration:none}

/* לשונית צד — המיקום האנכי משתנה לפי הנושא, כך שבערימת דפים
   נראות "מדרגות" וניתן לדפדף ישר לנושא בלי לקרוא. */
.tab{position:absolute;left:0;width:9mm;background:var(--c,#333);color:#fff;
     display:flex;align-items:center;justify-content:center;
     writing-mode:vertical-rl;font-size:9.5px;font-weight:700;letter-spacing:.4px;
     padding:2mm 0;border-radius:3px 0 0 3px}

/* ---------- תוכן ---------- */
.body{margin-top:4mm;column-gap:4.5mm}
.body.c2{column-count:2;column-rule:1px solid #dfe3e8}
h2{font-size:11.4px;color:#fff;background:var(--c,#333);padding:1mm 2mm;
   border-radius:2.5px;margin:0 0 1.6mm;break-after:avoid}
h2:not(:first-child){margin-top:3mm}
h3{font-size:11px;color:var(--c,#333);margin:1.9mm 0 .8mm;break-after:avoid;
   border-bottom:1px dotted #c3c9d0;padding-bottom:.6mm}
h3:first-child{margin-top:0}
dl{margin:0 0 1.2mm}
dt{font-weight:700;font-size:13px;display:inline}
dd{display:inline;margin:0}
dl>div{margin-bottom:.5mm;break-inside:avoid;text-indent:-3.2mm;padding-right:3.2mm}
dt::before{content:"▪ ";color:var(--c,#333);font-weight:700}
dt::after{content:" — ";font-weight:400;color:#7a828c}
.n{color:#0b4f9e;font-weight:700;font-feature-settings:"tnum"}
.q{color:#3d4650;font-style:italic}
em{font-style:normal;background:#fff2b8;padding:0 1px;border-radius:2px}
.fig{margin:1mm 0 1.6mm;break-inside:avoid;text-align:center}
.fig img{max-width:100%;max-height:38mm;height:auto;border:1px solid #d7dce1;border-radius:2px}
/* פסקאות שהודבקו לוורד בלי תבליט קיבלו מרווח כפול מזה של הפריטים,
   והעמודים האחרונים נראו מרווחים מדי. כאן הן מיושרות לאותה צפיפות.
   תבליט ותלייה נוסו ונפסלו: הם הוסיפו גלישות שורה ועמוד שלם. */
.ptxt{margin:0 0 .5mm;break-inside:avoid;color:#2b3138}
.warn{background:#fdeaea;border-right:2.5px solid #d92b2b;padding:1.2mm 2mm;
      margin:1.2mm 0;break-inside:avoid;border-radius:0 2.5px 2.5px 0}
.warn b{color:#a51b1b}
.lookup{background:#f1f3f5;padding:1mm 1.5mm;margin:0 0 1.6mm;
    font-size:13px;line-height:1.25;break-inside:avoid}

/* טבלאות */
table.wide{column-span:all;font-size:10.5px}
table.wide td,table.wide th{padding:.5mm .8mm;line-height:1.25}
/* הריפוד צמצם: אחרי שהוחזרו לתאים הפסקאות שנחתכו בייבוא, הטבלאות גדלו
   בכ-47% מעמוד והחוברת חזרה ל-11. ריפוד של שורה ב-13 שורות הוא סנטימטרים. */
table{border-collapse:collapse;width:100%;font-size:12px;margin:0 0 1.2mm;break-inside:avoid}
th{background:var(--c,#333);color:#fff;text-align:right;padding:.7mm 1.4mm;font-size:10.8px}
td{border-bottom:1px solid #dfe3e8;padding:.55mm 1.4mm;vertical-align:top}
tr:nth-child(even) td{background:#f6f8fa}
td.k{font-weight:700;color:#0b4f9e;font-feature-settings:"tnum"}

/* ---------- שער ---------- */
.secbreak{column-span:all;border-top:2.5px solid var(--c,#333);margin:3mm 0 2mm;
  padding-top:1.2mm;display:flex;justify-content:space-between;align-items:baseline}
.secbreak b{font-size:12px;color:var(--c,#333)}
.secbreak span{font-size:8px;color:#7a828c}
.coverbar{column-span:all;height:58mm;border-bottom:2px solid #333;
  margin-bottom:2.5mm;padding-bottom:1mm}
.cover{text-align:right}
.cover h1{font-size:15px;letter-spacing:-.3px;margin:0 0 .5mm;display:inline-block}
.cover .sub{font-size:8.4px;color:#5b6470;margin:0 0 1.5mm}
.toc{display:flex;flex-wrap:wrap;gap:1mm 3mm;margin:1mm 0 1.5mm}
.toc a{display:inline-flex;align-items:center;gap:1mm;text-decoration:none;color:#222;font-size:12px}
.toc a:nth-child(odd){background:#f2f5f8}
.toc .sw{width:2mm;height:2mm;border-radius:1px;flex:none}
.toc .nm{flex:1;font-weight:700}
.toc .dots{display:none}
.toc .pn{font-weight:700;color:#0b4f9e;font-feature-settings:"tnum"}
.tip{font-size:11.5px;line-height:1.25;color:#3d4650;background:#f2f5f8;border-right:2px solid #333;padding:1mm 2mm;border-radius:0 2px 2px 0}
.tip b{display:block;margin-bottom:.5mm;font-size:12px}

/* ---------- מפתח ---------- */
/* column-span:all קריטי כשהמפתח יושב בזנב עמוד דו-טורי: בלעדיו הוא
   מכולה רב-טורית בתוך מכולה רב-טורית, וגובהו הנמדד (offsetHeight) קטן
   מגובהו בפועל (scrollHeight) — כך שבדיקת ההתאמה מאשרת אותו והוא נחתך. */
/* חמישה טורים ולא ארבעה: כך המפתח נכנס לזנב העמוד של הנושא המארח
   במקום לתפוס עמוד שלם — עמוד אחד מתוך עשרה. */
.idx{column-count:5;column-gap:3mm;font-size:12.666px;line-height:1.21;column-span:all}
.idx div{break-inside:avoid}
.idx .t{font-weight:400}
.idx .p{color:#0b4f9e;font-weight:700}
.idx a{color:inherit;text-decoration:none}
.idx h3{column-span:all}

/* ---------- הדפסה ---------- */
@page{size:A4;margin:0}
@media print{
  html{background:#fff}
  .pg{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pg.over{outline:none}
  .pg.over::after{display:none}
  .noprint{display:none}
}
.noprint{position:fixed;top:8px;left:8px;z-index:99;background:#12161c;color:#fff;
  border-radius:6px;padding:7px 11px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.4);
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;max-width:calc(100vw - 16px)}
.noprint button{background:#2d6cdf;color:#fff;border:0;border-radius:4px;
  padding:4px 9px;font-size:12px;cursor:pointer;margin-right:6px}
.noprint a{color:#9ec5ff;text-decoration:none;font-size:12px;margin-right:9px}
.noprint a:hover{text-decoration:underline}
</style>

"**הדרך הטובה ביותר** :: יש דרך מיטבית לביצוע העבודה ויש למצוא אותה באופן מדעי, באמצעות חקר זמן ותנועה ומדידה.",
"**תפיסת העובד** :: אדם כלכלי ורציונלי המבקש למכור את יכולותיו בשכר גבוה ובמאמץ מועט. ההנהלה מבקשת תפוקה ורווחים; המודל מניח אינטרס משותף.",
"**דרך הגדלת הפריון** :: הפרדת ניהול מביצוע, חלוקת עבודה לפעולות פשוטות, מדידת כמות, איכות וזמן וקשירת שכר לתפוקה.",
"**עקרונות יישום** :: תגמול לפי ביצוע; מומחים ומנהלי עבודה מדריכים ומפקחים; שינוי תקני תפוקה על בסיס מדידה אובייקטיבית.",
"**זיהוי בתרחיש** :: פירוק עבודה, מדידת זמנים ותפוקות ותמריץ כספי מצביעים על טיילור. השאלה היא איך הפעולה מקדמת יעילות, ומה היא מחמיצה בממד האנושי.",
]},
{h2:"**וובר והארגון הבירוקרטי**"},
{items:[
"**הטיפוס האידאלי** :: עליונות טכנית, דייקנות, אובייקטיביות וחד־משמעיות באמצעות התאמה רציונלית בין מטרות לאמצעים.",
"**תשעת העקרונות** :: חוקים ותקנות; התמחות וחלוקת עבודה; היררכיה וסמכויות; כוח עבודה מוכשר טכנית; משרות מובחנות וקבלה לפי ידע; תקשורת כתובה ותיעוד; הפרדת רכוש הפרט והארגון; גיוס וקידום לפי יכולות וידע; תגמול לפי מומחיות.",
"**סמכות התפקיד** :: הדגש הוא על המשרה והכללים הפורמליים. כישורים וידע אמורים להנחות גיוס וקידום, במקום היכרות אישית.",
"**השוואה לטיילור** :: שתי הגישות מדגישות רציונליות, סדר ויעילות. טיילור מתמקד בביצוע העבודה ובפריון; וובר במבנה המוסדי, בכללים ובמשרות.",
]},
{p:"מקורות: מצגת ‎01‎, שקפים ‎8–37‎ ו־‎59–60‎. בשיעור ‎28.7‎ הוזכר הסרט \"זמנים מודרניים\" כהמחשה לגישות המכניסטיות."},
]},

/* ══════════════ אורגניות וגישות מודרניות */
{name:"אורגניות וגישות מודרניות", color:"#2e7d32", sub:"האות׳ורן · מאיו · X/Y · TQM · מערכת ותלות", cols:2, blocks:[
{h2:"**האות׳ורן והמערכת החברתית**"},
{items:[
"**מטרת המחקרים** :: לבדוק כיצד תנאי עבודה חומריים, כגון תאורה, מנוחה ואורך יום עבודה, משפיעים על הפריון במפעל ‎Western Electric‎.",
"**הנחת המוצא** :: החמרת תנאים תפחית תפוקה ושיפורם יעלה אותה. הממצאים הראו ששינוי בתנאים הפיזיים אינו הסבר מספק לפריון.",
"**ממצאים מרכזיים** :: עלייה בפריון וירידה בהיעדרויות לצד שינויים שונים בתנאים. נוצרו יחסים בין־אישיים, אמון, צוות ומבנה בלתי פורמלי.",
"**נורמות הקבוצה** :: הקבוצה הגבילה גם עובדים איטיים מדי וגם מהירים מדי, וקבעה תפוקה שנתפסה הולמת. נורמות חברתיות עשויות לגבור על מדיניות ההנהלה.",
"**מנהיגות בלתי פורמלית** :: צמחו מנהיגים ותת־קבוצות; נאמנות לקבוצה עשויה להיות חזקה מנאמנות להנהלה. למנהל כדאי לזהות את המבנה החברתי.",
"**אפקט האות׳ורן** :: מודעות לצפייה ותשומת לב עשויות לשנות התנהגות גם ללא ידיעת פרטי המחקר. אין לייחס כל שינוי בתפוקה רק לתנאי העבודה.",
"**המסקנה** :: בצד המערכת הפורמלית קיימת מערכת חברתית המשפיעה על ביצוע. תגמולים וסנקציות לא כספיים חשובים גם הם.",
]},
{h2:"**מאיו ויחסי האנוש**"},
{items:[
"**העובד כאדם** :: יצור מורכב בעל כישורים, אישיות ומניעים. יש לבחון צרכים ותקנים אישיים ולהפחית עייפות, לצד בחינת התפוקה.",
"**ניהול באמצעות אנשים** :: מטרות מושגות דרך עובדים שיש לטפח ולשתף במטרות. יש לבנות תרבות ארגונית המעודדת הזדהות וקשרים חברתיים.",
"**הבדל מטיילור** :: תשומת לב לקצב העבודה, לעייפות ולמכלול הגורמים האנושיים, במקום התמקדות רק בזמן, במדידה ובתמריץ כלכלי.",
]},
{h2:"**מקגרגור ושתי מערכות ההנחות**"},
{tbl:{head:["**היבט**","**תיאוריה ‎X‎**","**תיאוריה ‎Y‎**"],rows:[
  ["תפיסת העובד","עצל, תלוי במנהיג, מונע בעיקר מכסף וסטטוס.","פעיל, מבקש סיפוק, משמעות ואחריות."],
  ["עצמאות","זקוק להדרכה ולפיקוח; אינו רוצה לחשוב בעצמו.","יכול לכוון את התנהגותו ולשפר ביצועים."],
  ["שגרה והתפתחות","אוהב שגרה ונשאר סטטי.","מבקש חוויות חדשות, צומח ומתפתח."],
  ["יצירתיות","נובעת מפחד מפיטורין או מהורדה בדרגה.","נובעת מרצון להשיג מטרות אישיות וחברתיות."],
  ["משמעות ניהולית","פיקוח וסמכות בהתאם להנחות ‎X‎.","מרחב אחריות והאצלה בהתאם להנחות ‎Y‎."],
]}},
{p:"‎X‎ ו־‎Y‎ הן הנחות של המנהל לגבי העובדים. אין להסיק מהטבלה שכל עובד משתייך תמיד לסוג קבוע, או שכל עובד מתאים לאותה מידת האצלה."},
{h2:"**ניהול איכות והינדוס מחדש**"},
{items:[
"**‎TQM‎** :: לקוח פנימי וחיצוני; שיפור מתמיד; שיפור איכות בכל פעילויות הארגון; מדדים ותקנים מדויקים; העצמת עובדים.",
"**הינדוס מחדש** :: בחינה מחדש של העיסוקים, המבנה והעבודה: איך היינו עושים זאת אילו התחלנו מחדש? שינוי מערכתי כולל, המותאם לסביבה ודורש גמישות ויצירתיות.",
"**הבחנה ביישום** :: שיפור מתמיד ומדדים מכוונים ל־‎TQM‎. הגדרה מחודשת של תהליכים ומבנה מכוונת להינדוס מחדש. עצם השימוש במילה שינוי אינו מספיק לזיהוי.",
]},
{h2:"**מערכת פתוחה וסגורה**"},
{tbl:{head:["**מערכת סגורה**","**מערכת פתוחה**"],rows:[
  ["הבעיה מוסברת בעיקר מתוך הארגון; האבחון והפתרון בתוך המערכת.","הארגון והסביבה משפיעים זה על זה; גם מקור הבעיה והפתרון עשויים להיות חיצוניים."],
  ["לסביבה החיצונית אין השפעה במודל.","קלט מהסביבה, עיבוד בארגון, פלט לסביבה ומשוב."],
]}},
{items:[
"**מודל המערכת** :: תשומות, עיבוד, תפוקות ומשוב. במודל המלא מופיעים יבוא, יצוא ומשוב פנימי וחיצוני.",
"**גלובליזציה** :: תלות הארגון בסביבה מתחזקת דרך תהליכים כלכליים, חינוכיים וערכיים.",
"**גישת התלות** :: אין להבין את הארגון ללא גורמים מצביים המשפיעים זה על זה. שבעת המשתנים בשקף: גודל, תרבות, טכנולוגיה, סביבה, מבנה, מוטיבציה ומנהיגות; הם פועלים במיקרו ובמאקרו.",
]},
{p:"מקור: מצגת ‎01‎, שקפים ‎38–60‎. דיאגנוזה היא אבחון הבעיה; פרוגנוזה היא קביעת כיוון הפתרון בהקשר המצגת."},
]},

/* ══════════════ אדיג׳ס וסגנונות ניהול */
{name:"אדיג׳ס וסגנונות ניהול", color:"#6a1b9a", sub:"PAEI · אופקי זמן · מתחים · נורמות", cols:2, blocks:[
{h2:"**ארבע פונקציות הניהול**"},
{items:[
"**הגדרת הניהול** :: קבלת החלטות טובות ויישומן ביעילות, כדי להבטיח אפקטיביות ויעילות בטווח הקצר והארוך.",
"**‎PAEI‎** :: ‎P‎ הפקת תוצאות; ‎A‎ מנהלנות, ארגון וייעול; ‎E‎ יזמות, חזון וצרכי העתיד; ‎I‎ שילוב אנשים, צוות ושיתוף פעולה.",
]},
{tbl:{head:["**פונקציה**","**מיקוד מרכזי**","**שאלת המנהל**"],rows:[
  ["‎P‎ היצרן","תוצאה ומשימה בטווח הקצר.","מה לבצע?"],
  ["‎A‎ המנהלן","סדר, תהליך ויעילות בטווח הקצר.","איך לבצע?"],
  ["‎E‎ היזם","הסתגלות לעתיד, שינוי ויוזמה.","למה ולאן?"],
  ["‎I‎ המשלב","שיתוף, לכידות ויעילות לטווח הארוך.","מי ואיך נחבר?"],
]}},
{h2:"**מקרי הקצה של סגנון לקוי**"},
{items:[
"**‎P‎ זאב בודד** :: חרוץ, ישיר וממוקד תוצאות; עושה בעצמו, אינו מאציל או מלמד. כפיפים עלולים להיות שליחים. מקצוע אופייני: מכירות.",
"**‎A‎ המנהלן** :: שיטתי, מדויק, פרוצדורות ושגרה; איטי לשינוי, פועל לפי הספר ומחפש חריגות. מעדיף כפיפים שלא מפרים כללים. מקצוע: חשבונאות.",
"**‎E‎ הפירומן** :: חזון ורעיונות, יצירתיות וסיכון; מתאים לסביבה אך אינו עוקב אחר פרטים ופרויקטים. ליקוי: עניין ברעיון יותר מבתוצאה.",
"**‎I‎ האינטגרטור** :: מגבש צוות ודן עם כפיפים; הופך סכסוך לנסבל ומועיל. ליקוי: קונצנזוס בכל מחיר והימנעות מעמדה. מקצוע: משאבי אנוש.",
"**הבחנה** :: מקרי קצה של ניהול לקוי. פונקציה כשלעצמה אינה ליקוי, ואין טיפוס מיטבי לכל משימה.",
]},
{h2:"**אפקטיביות יעילות ומתחים**"},
{tbl:{head:["**אופק**","**אפקטיביות**","**יעילות**"],rows:[
  ["קצר","‎P‎ השגת תוצאות נדרשות.","‎A‎ ביצוע עם מינימום בזבוז."],
  ["ארוך","‎E‎ זיהוי צרכי העתיד ויוזמה.","‎I‎ עבודת צוות ותיאום בין אנשים."],
]}},
{items:[
"**‎P‎ מול ‎I‎** :: הישג מהיר מול פיתוח צוות; משימה מול אנשים.",
"**‎P‎ מול ‎E‎** :: מענה מידי מול זמן חשיבה; ייצור מול שינוי.",
"**‎P‎ מול ‎A‎** :: השגת תוצאה מול שיטה וסדר הביצוע.",
"**‎A‎ מול ‎E‎** :: נהלים ושיטתיות מול יוזמה ושינוי.",
]},
{h2:"**טיפוסים וניקוד השאלון**"},
{items:[
"**המנהל מספר הלימוד** :: אידאל חזק בארבע הפונקציות; אין אדם כזה. בול עץ יבש חסר את כולן. הפתרון: צוות משלים של חוזקות שונות (‎PDF 04‎, עמ׳ ‎7‎).",
"**סגנון מעורב** :: במינוח המצגת, חסרה פונקציה אחת. אינו הדירוג הנורמטיבי משני.",
"**העיקרון הפיטרי** :: קידום לפי מצוינות בתפקיד קודם עלול להביא לאי־יכולת, כשהתפקיד הבא דורש פונקציות נוספות.",
]},

/* ══════════════ מנהיגות כוח והשפעה */
{name:"מנהיגות כוח והשפעה", color:"#ad1457", sub:"מנהיג ומנהל · בסיסי כוח · שש טקטיקות", cols:2, blocks:[
{h2:"**מנהיגות מנהל ומונהגים**"},
{items:[
"**מנהיגות** :: תהליך של השפעה המתרחש בין אנשים ומכוון למטרות. בהגדרת ‎Yukl‎ המופיעה בקורס, נבחן התהליך ולא רק התוצאה.",
"**מנהיגות פורמלית** :: הארגון מעניק לפרט סמכות להשפיע לקידום יעדים. מנהיגות בלתי פורמלית היא השפעה שאינה נובעת ממינוי כזה.",
"**משל הלהבה** :: קליין והאוס: ניצוץ הוא המנהיג, חומר הגלם המונהגים והחמצן הנסיבות. התופעה תלויה באינטראקציה של שלושתם.",
"**הגדרות וסיווג** :: ברנס, ‎1978‎: מנהיגות היא מהתופעות הנצפות ביותר והבלתי מובנות ביותר. ההגדרות מסווגות: תכונות אישיות, מוקד של תהליכים חברתיים, צורת התנהגות, תהליך השפעה. ארבע הגישות: תכונות, התנהגותיות, מצבית, וכריזמה והטווח המלא. שלושה קריטריונים לסיווג התיאוריות: מנהיג מול מצב; מנהיג מול מונהגים; אוניברסלית מול תלות.",
]},
{tbl:{head:["**ניהול**","**מנהיגות**"],rows:[
  ["יציבות, סדר, יעילות ואופן עשיית הדברים.","שינוי, חדשנות, הסכמה ואילו דברים ייעשו."],
  ["תכנון, לוח זמנים, תקצוב, חלוקת משאבים ובקרה.","חזון, הסבר החזון והנעת אנשים למימושו."],
  ["איך ומתי; מערכות; טווח קצר; עושים דברים נכון.","מה ולמה; אנשים; טווח ארוך; הדברים הנכונים."],
]}},
{h2:"**כוח סמכות והשפעה**"},
{items:[
"**כוח** :: יכולת להשפיע על האחר, הקשורה גם לשליטה ולנגישות למשאבים. ככל שהמשאב נדיר, מיוחס לו כוח רב יותר.",
"**סמכות** :: הרשאה ולגיטימציה פורמלית להפעלת אחרים במסגרת הארגון.",
"**השפעה** :: שינוי בהתנהגות או בעמדות של האחר. מקור כוח אינו זהה לפעולת השפעה מסוימת.",
]},
{tbl:{head:["**בסיס כוח מקורי**","**ממה נובע**"],rows:[
  ["לגיטימי","סמכות של נושא תפקיד."],
  ["תגמול","שליטה בשכר, בפרסים ובתועלות."],
  ["כפייה","פחד, ענישה ואיום."],
  ["מומחיות","ידע וטכנולוגיה החיוניים לאחרים."],
  ["התייחסות","הזדהות, מסירות ומודל לחיקוי; מופת או כריזמה."],
]}},
{items:[
"**שתי רשימות הרחבה** :: **במצגת ‎05‎:** אידיאולוגיה ובירוקרטיה. **בשאלון ‎07‎:** מידע וקשרים. אלה שתי הרחבות שונות של חמשת הבסיסים.",
"**מידע וקשרים** :: מידע הוא מידע בעל ערך המצוי בידי האדם; קשרים הם זיקה לאנשים בעלי השפעה. אין להחליף ביניהם או בינם לבין ידע מקצועי.",
"**הכלי של שבעת הבסיסים** :: ‎21‎ זוגות, חלוקת שלוש נקודות בכל זוג, סך ‎63‎. לפי המצגת וההסבר בכיתה: כוח העמדה הוא לגיטימי, תגמול וכפייה; כוח אישי הוא מומחיות והתייחסות.",
]},
{h2:"**שש טקטיקות קיפניס ושמידט**"},
{tbl:{head:["**טקטיקה**","**סימן בתרחיש**"],rows:[
  ["פנייה מעלה","מבקש גיבוי או התערבות מדרג בכיר."],
  ["קואליציות","מגייס תמיכת עמיתים או גורמים נוספים."],
  ["הפעלת לחץ","מנדנד, חוזר על בקשה או נכנס לעימות תקיף."],
  ["מיקוח","תן וקח, החלפת טובות והצעת עזרה תמורת ביצוע."],
  ["פנייה לרגש","חביבות, אהדה, ענווה, תחושת חשיבות ועיתוי מתאים."],
  ["פנייה לשכל","היגיון, נתונים, עובדות והסבר מנומק."],
]}},
{items:[
"**אחוזון** :: מיקום הציון ביחס לנורמות של הטקטיקה. אין לחשב אחוזון על ידי חלוקת הציון הגולמי בציון המרבי.",
"**השוואת טקטיקות** :: משתמשים בטור הנורמות של כל טקטיקה. מספר היגדים שונה עשוי לגרום לסכומים שונים גם ללא נטייה חזקה יותר.",
"**דוגמת הבחנה** :: מומחיות היא מקור כוח; הצגת נתונים מקצועיים היא פנייה לשכל. סמכות היא מקור כוח; פנייה לבכיר לקבלת גיבוי היא פנייה מעלה.",
"**סוגיות בחקר מנהיגות** :: מקום המנהיגות, היקף ההשפעה, סוג התהליך ותוצאותיו, מטרת ההשפעה, השפעה רציונלית או רגשית וההבדל בין מנהיגות לניהול.",
]},
{p:"מקורות: מצגת ‎05‎, שקפים ‎7–29‎; שאלונים ‎06‎ ו־‎07‎; הקלטת ‎18.8‎. דירוגי גבוה, בינוני ונמוך תלויים בכלי ובכלל הפרשנות שלו."},
]},

/* ══════════════ תכונות ואישיות */
{name:"תכונות ואישיות", color:"#4527a0", sub:"מיומנויות · מקללנד · BFI · מבחני אישיות", cols:2, blocks:[
{h2:"**גישת התכונות**"},
{items:[
"**הנחת הגישה המוקדמת** :: למנהיג תכונות וכישורים מיוחדים, מולדים וקבועים, המבדילים אותו מאחרים ומובילים אותו לעמדת מנהיגות.",
"**האדם הדגול** :: במצגת מיוחס לקרלייל הדגש על תורשה, יציבות והמנהיג המורם מהעם: פעם מנהיג, תמיד מנהיג.",
"**חמש קבוצות שנחקרו** :: פיזיות: גובה ומשקל; אישיות: הסתגלות, יצירתיות וביטחון; יכולות: אינטליגנציה ושכנוע; צרכים: הישג, השתייכות ועוצמה; ערכים: יושר, אמינות ונאמנות.",
"**ממצאים שהוזכרו** :: במחקרי סטוגדיל הופיעו אמביציה, ביטחון עצמי, הסתגלות, חברתיות, אסרטיביות, דומיננטיות והתמודדות עם לחץ.",
]},
{h2:"**מעבר מתכונות למיומנויות**"},

  ["בינאישית","תקשורת, השפעה והבחנת תפיסה."],
  ["קונספטואלית","יכולת המשגה וביטוי."],
  ["ניהולית","ארגון, תכנון, תיאום, תזמון והקצאת משאבים."],
]}},
{items:[
"**משמעות המעבר** :: מיומנויות ניתנות לפיתוח. במצגת זהו מעבר מהנחת מנהיגות מולדת להכרה במנהיגות נרכשת.",
"**יכולות נוספות** :: קונספטואליות, אינטליגנציה, אמביציה, יצירתיות, רטוריקה ושטף דיבור, שכנוע והסתגלות.",
]},

{tbl:{head:["**צורך**","**תיאור**"],rows:[
  ["הישג","הצטיינות, ביצוע מאתגר, סיכון ומשוב מיידי."],
  ["עוצמה","הובלה, יוקרה, עצה, סטטוס והשפעה על אנשים."],
  ["השתייכות","מקובלות, קשרים חבריים, פופולריות ועזרה לאחרים."],

{p:"התמהיל בשקף ‎43‎: **שליטה חברתית גבוהה, הישג בינוני ומקובלות נמוכה**."},
{h2:"**ביקורת ותרומה**"},
{items:[
"**חוסר עקביות** :: לא נמצאה סדרת תכונות המנבאת בעקביות צמיחה או אפקטיביות. מנהיגים אפקטיביים עשויים להיעדר תכונה מסוימת, ואנשים בעלי אותה תכונה עשויים להיבדל באפקטיביות.",
"**התעלמות מהמצב** :: אותן תכונות עשויות לקבל משמעות שונה במצבים שונים. הנחת תורשה בלבד מגבילה את האפשרות לפתח מנהיגות.",
"**התרומה** :: הגישה הפנתה תשומת לב לאדם, לכריזמה ולכישורים, והדיון שהתפתח בעקבותיה תרם להכרה ביכולת לשפר מנהיגות.",
"**מגבלת המסקנה** :: ביקורת על המחקרים המוקדמים אינה קביעה שלאישיות אין קשר למנהיגות. יש להבחין בין נטייה לבין אפקטיביות בפועל.",
]},

{tbl:{head:["**ממד**","**מאפיינים**","**קצה אחר**"],rows:[

{items:[
"**המפתח הכתוב** :: סולם ‎1–5‎. בעמ׳ ‎4‎, מפתח ‎SPSS‎ הופך פריטים מסומנים: ‎6−x‎; ‎2‎ הופך ל־‎4‎. **בכיתה ‎25.8‎:** המרצה הורתה על חישוב מהיר ללא היפוך. יש להבחין בין שתי ההוראות.",
"**ממוצע ממד** :: במפתח הכתוב, ממוצע הפריטים לאחר ההיפוך; בכיתה סוכמו הפריטים שצוינו בחישוב המהיר. תשובה חסרה אינה אפס. בדקות ‎33–35‎ המרצה אמרה שלא יהיו חישובים כאלה בבחינה.",
"**ממדים ויישום** :: ‎BFI‎ שונה מ־‎PAEI‎ ומשאלוני ההשפעה. בדוגמאות ‎25.8‎, הפרופיל הרצוי תלוי בתפקיד; אין פרופיל אחיד. דוגמת הסייבר קישרה דריכות לתפקיד.",
]},
{h2:"**מבחני אישיות ומיון — נלמדו ב־‎25.8‎ וב־‎1.9‎**"},
{p:"**שאלון אובייקטיבי:** פריטים מוגדרים ודיווח גלוי על תכונות, המאפשרים השוואה. **השלכה:** תגובה פתוחה לגירוי ופירוש תכנים אישיים. בנדר הוא משימה מובנית ולא מילולית; במצגת נזכר גם פירוש השלכתי."},

  ["‎MMPI‎","שאלון רב־ממדי; הוצגו סולמות קליניים."],

  ["בנדר","העתקת תשע צורות בעיפרון; יכולת ויזו־מוטורית."],
  ["‎TAT‎","סיפור על תמונה: גיבור, מחשבות, רגשות, עבר–הווה–עתיד."],

{p:"**ב־‎TAT‎:** תוכן — הדמות, הטון הרגשי, הצרכים, הסביבה, הסיום והתמודדות עם מכשולים; מבנה — היענות להוראות, סטייה מהעלילה, תיאור במקום סיפור ושטף. מקור: ‎1.9‎, דקות ‎46–53‎."},
{p:"**עוד בהסבר ‎1.9‎:** סובלימציה — תיעול דחף לערוץ מקובל בחברה, למשל ספורט. מיקוד שליטה פנימי — לקיחת אחריות על הפעולות; חיצוני — הטלת אחריות על אחרים (דקות ‎47–52‎)."},
{p:"מקורות: מצגת ‎05‎, שקפים ‎33–47‎; שאלון ‎08‎, עמ׳ ‎4–5‎; הקלטות ‎25.8‎ (‎33–74‎) ו־‎1.9‎ (‎2–53‎). ציר: תכונות ‎1930–1940‎, התנהגות ‎1950–1960‎, מצב ‎1960–1970‎, תהליך מ־‎1980‎."},
]},

/* ══════════════ הגישה ההתנהגותית */
{name:"הגישה ההתנהגותית", color:"#1565c0", sub:"מישיגן · אוהיו · הסריג · קונפליקטים", cols:2, blocks:[
{h2:"**מתכונות להתנהגות בפועל**"},
{items:[
"**מושא המחקר** :: מה מנהיג עושה בפועל, במקום רק התכונות והפוטנציאל שלו. מחפשים הבדלים בין התנהגות מנהיג אפקטיבי להתנהגות שאינה אפקטיבית.",
"**יתרונות** :: קל יותר למדוד התנהגות; הקשר לאפקטיביות ישיר יותר; התנהגות ניתנת ללמידה.",
"**מדדי אפקטיביות** :: מידת השגת המטרות ועמדות הכפיפים כלפי המנהיג.",
"**שלושה דפוסים** :: ריכוזי או סמכותי, דמוקרטי ולא מתערב או לסה פייר. בחלק מהמחקר הריכוזי והדמוקרטי נתפסו כקצוות של רצף, והלא מתערב כאנטיתזה למנהיג.",
"**הנחה אוניברסלית** :: המחקרים ביקשו דפוס אפקטיבי תמיד. הביקורת המאוחרת הדגישה את חשיבות המצב והמונהגים.",
"**השלמה לגישת התכונות** :: תיאוריית האדם הדגול נשענת על הדרוויניזם: החזק שורד. ביקורת נוספת: בחברה דמוקרטית מנהיגים צומחים בכל מקום ובכל משפחה, ולכן המנהיגות אינה תורשתית.",
]},
{h2:"**מישיגן**"},
{items:[
"**שתי קטגוריות** :: מכוונות למשימה ומכוונות לעובד. לפי הצגת המחקר בקורס, אלה קצוות רצף ולא שני ממדים עצמאיים.",
"**סמכותי** :: מרכז את כל הסמכויות; מיקוד במשימה.",
"**סמכותי נדיב** :: מקשיב יותר, אך ממשיך לרכז סמכות.",
"**דמוקרטי מתייעץ** :: מתייעץ עם העובדים, אך מחליט לבדו.",
"**דמוקרטי משתף** :: משתף גם בהחלטות; המיקוד באנשים.",
"**סדר הרצף** :: סמכותי, סמכותי נדיב, דמוקרטי מתייעץ, דמוקרטי משתף בהחלטות.",
]},
{h2:"**אוהיו ושני ממדים עצמאיים**"},
{tbl:{head:["**ייזום מבנה**","**התחשבות**"],rows:[
  ["ציפיות ביצוע ברורות, לוחות זמנים, ביקורת על ביצוע וגישות לפתרון בעיות.","התחשבות ברגשות, הוקרה, מורל ויחס אישי."],
  ["מכוונות למשימה.","מכוונות לאנשים."],
]}},
{items:[
"**‎LBDQ‎** :: שאלון תיאור התנהגות מנהיג. מנהלים מעריכים את עצמם; עמיתים, ממונים וכפיפים מעריכים את התנהגותם.",
"**הממצא המרכזי** :: **נשבר קשר התלות: שני הממדים בלתי תלויים.** אפשר להיות גבוה או נמוך בכל אחד מהם, ולכן נוצרים ארבעה צירופים.",
"**המנהיג האפקטיבי** :: לפי מסקנת המצגת, משימתי ומתייחס גם יחד. זו שאיפת ‎High–High‎; אין להסיק שכל מחקר מצבי מחייב אותו צירוף.",
"**ההבדל ממישיגן** :: מישיגן מוצג כרצף של שני קצוות; אוהיו מאפשר שילוב במידות שונות של שני הממדים.",
"**ניהול מובנה** :: כינוי לייזום מבנה גבוה: לוחות זמנים, ביצוע וביקורת, למשל בקו ייצור.",
]},
{h2:"**הסריג הניהולי של בלייק ומוטון**"},
{p:"שני צירים בני תשע דרגות: דאגה לתפוקה ודאגה לאנשים. בחוברת הזוג נכתב בסדר משימה, אנשים, כפי שנקראים הסגנונות בטבלת הקורס."},
{tbl:{head:["**משבצת**","**סגנון**","**דפוס**","**קונפליקט**"],rows:[

  ["‎1,9‎","קאונטרי קלאב או מתחשב","מורל ויחסים, מבקש ולא פוקד.","ויתור"],

  ["‎9,1‎","משימתי או סמכותי","ציות, פיקוח וסנקציות.","ראש בראש"],
  ["‎9,9‎","צוותי או משקיע","מחויבות לתוצאה ולאנשים, אמון הדדי.","פתרון בעיות"],
]}},
{items:[
"**פתרון בעיות** :: העמקה בניסיון להגשים את מירב הרצונות של שני הצדדים. פשרה היא הגעה לעמק השווה, ולא אותו תהליך.",
"**טפלון** :: בקורס הכינוי טפלוני או אנמי שייך ל־‎5,5‎. אי־מנהיגות בטווח המלא נקראת שב והנח.",
"**מגבלות הגישה** :: כיוון סיבתיות לא ברור; הזנחת גורמים מתווכים; התעלמות מהקשר, מאופי המשימה ומהמונהגים; אין דפוס אוניברסלי המתאים לכל מצב.",

{p:"מקורות: מצגת ‎12‎, שקפים ‎3–28‎; שאלון ‎11‎; הקלטת ‎8.9‎, דקות ‎32–81‎. הגישה המצבית ורמות הבשלות בפרקים הבאים."},
]},

/* ══════════════ הגישה המצבית ופידלר */
{name:"הגישה המצבית ופידלר", color:"#37474f", sub:"", cols:2, blocks:[
{h2:"**הגישה המצבית**"},
{items:[
"**המוקד** :: תכונות המנהיג או התנהגותו בתוך ההקשר שבו הוא פועל. אין להסיק על אפקטיביות בלי לתאר את המצב.",
"**המצב כמשתנה בלתי תלוי** :: כיצד מאפייני המצב משפיעים על התנהגות המנהל.",
"**המצב כמשתנה ממתן** :: כיצד המצב משנה את הקשר בין תכונות או התנהגות המנהיג לבין האפקטיביות שלו.",
"**מנהיגות כתולדת נסיבות** :: הקבוצה והאתגרים עשויים להכתיב את סוג המנהיגות המתפתח. זו ההצגה הדטרמיניסטית בשקף ‎8‎. המחקר עסק בזיהוי ובמיפוי של תנאי המצב שהצמיחו מנהיגים.",
]},
{h2:"**פידלר ושלושת משתני המצב**"},
{tbl:{head:["**משתנה**","**השאלה באבחון**"],rows:[
  ["יחסי מנהיג ומונהגים","האם קיימים יחסים טובים, אמון וקבלה?"],
  ["מובנות המשימה","האם ברור מה לבצע וכיצד אפשר לבדוק את התוצאה?"],
  ["כוח העמדה","כמה סמכות וכוח מעניק התפקיד למנהל?"],
]}},
{items:[
"**‎LPC‎** :: ‎Least Preferred Co-worker‎: תיאור האדם שעמו הכי קשה לעבוד, באמצעות זוגות תארים. זה אינו בהכרח האדם שהמנהיג הכי פחות מחבב.",
"**משמעות הציון** :: ‎LPC‎ גבוה מצביע על מכוונות לאנשים; ‎LPC‎ נמוך על מכוונות למשימה. זהו סגנון, לא ציון גבוה או נמוך של איכות המנהיג.",
"**המרכיב הקשיח** :: פידלר רואה את הסגנון כתלוי אישיות. המסקנה היא ליצור מצב המתאים למנהיג, במקום להניח שיוכל להחליף סגנון בכל משימה.",
]},
{h2:"**שני מפתחות הניקוד בקורס**"},
{tbl:{head:["**מקור**","**משימתי**","**לא מובהק**","**חברתי**"],rows:[
  ["מצגת ‎16‎, שקף ‎12‎","‎57‎ ומטה","‎58–62‎","‎63‎ ומעלה"],
  ["שאלון ‎09‎, עמ׳ ‎3‎","‎8–50‎","‎51–69‎","‎70–128‎"],
]}},
{p:"**בשאלה מספרית משתמשים במפתח המקור שצוין.** לדוגמה, ‎65‎ הוא חברתי לפי המצגת, אך אינו מובהק לפי השאלון. ‎75‎ חברתי לפי שניהם. אין למזג את הספים."},
{h2:"**התאמה בין סגנון למצב**"},
{tbl:{head:["**מצב**","**צירוף לדוגמה**","**יתרון יחסי**"],rows:[
  ["נוח מאוד","יחסים טובים, משימה מובנית וכוח עמדה גבוה.","משימתי, ‎LPC‎ נמוך"],
  ["ביניים","תנאים מעורבים; למשל יחסים גרועים לצד מבנה וכוח.","חברתי, ‎LPC‎ גבוה"],
  ["לא נוח מאוד","יחסים גרועים, משימה מעורפלת וכוח חלש.","משימתי, ‎LPC‎ נמוך"],
]}},
{items:[
"**מסקנה מעשית** :: התאמת מינוי לתפקיד ולמשימה, או שינוי התנאים סביב המנהיג. הפתרון אצל פידלר אינו אימון להחלפת סגנון לפי כל מצב.",
"**מנהיג משימתי** :: מארגן, מתכנן, נותן עצות ומידע ומתרכז בהשלמת המשימה. כהונתו זמנית, ופגה עם סיום המשימה.",
"**מנהיג חברתי** :: מעודד, מפייס, מגבש, מגן ומטפל בלכידות ובמורל. יכול להנהיג לאורך זמן.",
"**ביקורת** :: קשיחות הסגנון; חוסר הסבר ברור כיצד ‎LPC‎ משפיע על ביצוע; שימוש ברצף אחד בעל שני קצוות.",
"**ירד מהמבחן** :: תיאוריית המשאבים הקוגניטיביים. המרצה הורידה אותה בשיעור החזרה ב־‎6.10‎, ולכן אינה בחוברת.",
]},
{p:"מקורות: מצגת ‎16‎, שקפים ‎4–25‎; שאלון ‎09‎. פידלר מתמקד בשינוי המצב סביב הסגנון; הגישות בפרק הבא מדגישות גם גמישות התנהגותית."},
]},

/* ══════════════ הרסי ובלנשארד ודגשי המרצה */
{name:"הרסי ובלנשארד ודגשי המרצה", color:"#37474f", sub:"", cols:2, blocks:[
{h2:"**הרסי ובלנשארד**"},
{items:[
"**בשלות תפקודית** :: ידע, ניסיון וביטחון בעבודה ומיומנות.",
"**בשלות פסיכולוגית** :: ביטחון בביצוע, מחויבות ומוטיבציה.",
"**יחס למשימה** :: בשלות אינה תכונת אישיות קבועה. אותו עובד יכול להיות בשל למשימה אחת ופחות בשל למשימה אחרת; בשלות קבוצה אינה סכום בשלות חבריה. בגרות: מידת העצמאות, היכולת ליטול אחריות ומניע ההישג; קשורה בהשכלה, בגיל, בניסיון ובתרבות הארגונית.",
]},
{tbl:{head:["**סגנון**","**משימה ויחסים**","**מונהגים ודוגמה**"],rows:[

  ["‎S2‎ משווק או מוכר","משימה ויחסים גבוהים; הסבר ושכנוע.","יכולת נמוכה, מוכנות גבוהה: טירוני יחידה מובחרת."],
  ["‎S3‎ משתף","משימה נמוכה, יחסים גבוהים; שיתוף ותמיכה.","יכולת גבוהה, מוכנות נמוכה: ותיקים במשבר."],
  ["‎S4‎ מאציל","משימה ויחסים נמוכים; העברת אחריות.","יכולת ומוכנות גבוהות: חיילים בסוף מסלול."],
]}},
{items:[
"**שמות באנגלית** :: צריך לדעת אותם למבחן: ‎S1 Telling‎; ‎S2 Selling‎; ‎S3 Participating‎; ‎S4 Delegating‎. שאלה ממבחן קודם, לפי המרצה ב־‎15.9‎: יכולת ומוכנות נמוכות, והתשובה פוקד ומורה, ‎Telling‎.",
"**בסיס המטריצה** :: שני הממדים עצמאיים לפי אוהיו. התייחסות נמוכה ב־‎S4‎ אינה הזנחה: העובד כבר מסוגל ומוכן לקבל אחריות.",
"**ביקורת** :: מעט תמיכה אמפירית, קושי להבחין ולמדוד רמות בגרות, והסבר חסר למנגנון השפעת ההתנהגות.",
]},
{h2:"**ביקורת על הגישה המצבית**"},
{items:[
"**ביקורת כללית** :: תמיכה מוגבלת, מורכבות שאינה משתקפת במודל, שונות בין אבחונים וקושי ביישום.",
"**הדרישה מהמנהיג** :: דרישה ליכולת אבחון, גמישות והסתגלות גבוהה, כאשר מנהלים בפועל נוטים לדבוק בסגנון אחד.",
"**החולשה המרכזית** :: הגישה טשטשה את ייחוד המנהיגות: אם הכול תלוי במצב, לא ברור במה ניכרת השפעת המנהיג. מכאן הכמיהה למנהיגות חזקה, והמעבר לטווח המלא.",
"**השוואת המודלים** :: פידלר: התאמת המצב לסגנון קשיח. הרסי ובלנשארד: התאמת ההתנהגות לבשלות המונהגים.",
]},
{h2:"**דגשי המרצה למבחן**"},
{items:[
"**ירדו מהמבחן** :: המודל של רדין (שיעור ‎15.9‎); נתיב המטרה של האוס, המשאבים הקוגניטיביים ומודל קבלת ההחלטות הנורמטיבי (שיעור החזרה ‎6.10‎). פידלר והרסי ובלנשארד נשארים.",
"**דף התשובות** :: משאירים בדיוק ‎33‎ סימונים. אחרת נבדקות ‎33‎ הראשונות, ואין ערעור. כדאי להחליט קודם בטופס השאלות, ורק אז להעתיק לדף התשובות.",
"**אדיג׳ס** :: לדעת את האותיות ‎PAEI‎ בעברית ובאנגלית, ואיזה סגנון ניהול מתאים לכל שלב במחזור החיים; למשל בינקות: ‎P‎. הקודים בעמוד ‎3‎. עוד מהמצגת: ‎I‎ נקרא גם מתכלל. בטבלה ‎E‎ מסומן גם באנשים וגם במשימה: אפקטיבי, לטווח ארוך. לנהל את המנהל: לזהות אילו דפוסים חסרים לו ולסייע לו בהם.",
"**צוותים** :: שלבי טאקמן ותפקיד המנהל בכל שלב. בצוות חדש, בגישוש ובהתמודדות: מנהיגות מתגמלת. בצוות בשל, בגיבוש ובעבודת הצוות: מנהיגות מעצבת. עמוד ‎10‎.",
"**עוד נושאים שהודגשו** :: טקטיקות ההשפעה של קיפניס ושמידט, חשיבת יחד וסימניה, אפקט הגולם ואפקט פיגמליון, סוגי הצוותים.",
"**מינוח** :: עונים במונחים של המצגות. המרצה הזהירה מסיכומים שמשתמשים במונחים אחרים.",
]},
{p:"מקורות: מצגת ‎16‎, שקפים ‎26–51‎; שאלון ‎13‎; הקלטות ‎15.9‎ ו־‎6.10‎."},
]},

/* ══════════════ מודל הטווח המלא */
{name:"מודל הטווח המלא", color:"#5d4037", sub:"בס ואבוליו · התנהגות ומונהגים · MLQ", cols:2, blocks:[
{h2:"**שלוש משפחות סגנונות**"},
{items:[
"**הגדרת המנהיגות בפרק** :: הנעת אנשים לביצוע לאורך זמן תוך מיצוי אמצעי ההנעה ושימוש מזערי בכפייה.",
"**הטווח המלא** :: אי־מנהיגות; מנהיגות מתגמלת; מנהיגות מעצבת. יש לזהות התנהגות לפי התרחיש, ולא רק לפי תואר התפקיד. המתגמלת מכונה מקלות וגזרים.",
"**שמות נוספים** :: במצגת החזרה למבחן אי־המנהיגות נקראת מנהיגות לסה פייר, והמנהיגות המתגמלת נקראת מנהיגות עיסקתית. בגישה ההתנהגותית לסה פייר הוא הדפוס הלא מתערב.",
"**האפקטיבי ביותר** :: המנהיגות המעצבת. בתרשים המודל היא בקצה האפקטיבי והאקטיבי, ואי־המנהיגות בקצה הלא אפקטיבי והפסיבי. ככל שמאמצים דפוסים מעצבים, המנהיגות אפקטיבית יותר.",
]},
{h2:"**אי מנהיגות ומתגמלת**"},
{tbl:{head:["**סגנון**","**התנהגות מנהיג**","**תגובת מונהגים**"],rows:[
  ["שב והנח","אינו מגדיר ציפיות, נמנע מהחלטה ומעכב תגובה; אדיש ולא מעורב.","אדישות; קידום יעדים אישיים אף בניגוד ליעדי הארגון."],
  ["תגמול בונה או מותנה","מגדיר יעדים ואחריות, מזהה צרכים, מבהיר תגמול ונותן משוב ושבח.","שיתוף פעולה משיקולי כדאיות; הגעה לביצוע הנדרש."],
  ["חריגים אקטיבי","ניטור פעיל של סטיות ותחומים בעייתיים, בקרה ותיקון מהיר.","הימנעות מסיכון ומחדשנות; סכנת צייתנות וראש קטן."],
  ["חריגים פסיבי","תקנים כלליים; מתערב כשנודע על תקלה. אם לא שבור, לא מתקנים.","חשש מתגובה בעת כשל, ושמירת הרמה הקיימת."],
]}},
{items:[
"**אקטיבי מול פסיבי** :: האקטיבי מחפש חריגים מראש; הפסיבי מחכה שהתקלות יתגלו. שניהם שונים משב והנח, שבו קיימת הימנעות מהתערבות ומהחלטה.",
"**תגמול מותנה** :: התנאי הוא קשר ברור בין ביצוע לתגמול. עצם מתן כסף אינו ראיה מספקת אם אין בתרחיש קשר לביצוע.",
]},
{h2:"**ארבעת מרכיבי המנהיגות המעצבת**"},
{tbl:{head:["**מרכיב**","**פעולת המנהיג**","**השפעה על המונהגים**"],rows:[
  ["כריזמה","דוגמה אישית, אמונה באנשים, אחריות, אתיקה, דאגה לצורכיהם ועקביות.","הזדהות, הערכה, כבוד ואמון."],
  ["השראה","משמעות, אתגר, אופטימיות, חזון ברור ויישור מטרות אישיות וצוותיות.","מאמץ נוסף, התלהבות ומשימות מאתגרות."],
  ["אתגור אינטלקטואלי","חלופות, חשיבה עצמאית, שינוי תפיסה ולמידה ממשבר וכישלון.","יצירתיות, סיכון מחושב וחיפוש דרך טובה יותר."],
  ["התייחסות פרטנית","חניכה, נגישות, הבנת הבדלים, תמיכה ומשימות לפי פוטנציאל.","מיצוי יכולת, שאיפה להתפתחות וללמידה."],
]}},

/* ---- עזרי בנייה ---- */
function E(t,a,h){var e=document.createElement(t);for(var k in a)e.setAttribute(k,a[k]);
  if(h!=null)e.innerHTML=h;return e;}

/* טקסט עשיר: **מודגש** ⟨מספר⟩ «ציטוט» __הדגשה__ */
function rt(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/__(.+?)__/g,'<em>$1</em>')
    .replace(/«(.+?)»/g,'<span class="q">"$1"</span>')
    .replace(/⟨(.+?)⟩/g,'<span class="n">$1</span>');
}

/* ---- הופך בלוק לאלמנט ---- */
function block(b){
  if(b.h2) return E('h2',{},rt(b.h2));
  if(b.h3) return E('h3',{},rt(b.h3));
  if(b.warn) return E('div',{'class':'warn'},rt(b.warn));
  /* פסקת טקסט חופשי — מגיעה מוורד שנערך ביד, שם לא כל שורה היא
     פריט "מונח — הגדרה". */
  if(b.p) return E('div',{'class':'ptxt'},rt(b.p));
  /* דיאגרמות וצילומי טבלאות מהמצגות. הגובה מוגבל כדי שתמונה בודדת
     לא תבלע טור שלם — במגבלת 5 דפים זה יקר מדי. */
  /* width/height מפורשים הם קריטיים: העימוד רץ לפני שהתמונות מפוענחות,
     ובלעדיהם גובהן בזמן החישוב הוא 0, בדיקת ההתאמה עוברת, ואז הן גדלות
     ודוחפות את התוכן אל מחוץ לעמוד (עמוד אחד חרג ב-579px). עם המידות
     הדפדפן יודע את יחס הממדים מיד ושומר את המקום. */
  if(b.img){var f=E('figure',{'class':'fig'});
    var a={src:b.img,alt:''};
    if(b.w&&b.h){a.width=b.w;a.height=b.h;}
    f.appendChild(E('img',a));return f;}
  if(b.tbl){
    /* טבלה רחבה (5 עמודות ומעלה) נפרסת על שני הטורים — בטור בודד
       העמודות נמעכות והטקסט נעשה בלתי קריא. */
    var wide=(b.tbl.head||b.tbl.rows[0]||[]).length>=5;
    var t=E('table',wide?{'class':'wide'}:null),th=E('tr');
    (b.tbl.head||[]).forEach(function(c){th.appendChild(E('th',{},rt(c)));});
    if(b.tbl.head)t.appendChild(th);
    b.tbl.rows.forEach(function(r){
      var tr=E('tr');
      r.forEach(function(c,i){tr.appendChild(E('td',{'class':i===0?'k':''},rt(c)));});
      t.appendChild(tr);
    });
    return t;
  }
  var dl=E('dl');
  b.items.forEach(function(it){
    var d=E('div'), p=String(it).split(' :: ');
    /* ⟦כינוי · כינוי⟧ בכותרת — לא מוצג, אך נכנס למפתח הא״ב. נועד לכותרות
       שנוסחו כשאלה ("מה נכלל") ואי אפשר לחפש אותן לפי מונח. */
    var head=p[0], alias='', ma=head.match(/⟦([^⟧]*)⟧/);
    if(ma){ alias=ma[1]; head=head.replace(/\s*⟦[^⟧]*⟧/,''); }
    var dt=E('dt',{},rt(head));
    if(alias) dt.setAttribute('data-idx',alias);
    d.appendChild(dt);
    d.appendChild(E('dd',{},rt(p.slice(1).join(' :: '))));
    dl.appendChild(d);
  });
  return dl;
}

/* ---- דפדוף: ממלא עמוד עד שהוא מתמלא, ואז פותח חדש ---- */
var out=document.getElementById('out'), pages=[];
var NAV=DATA.navigation.chapters;
function newPage(sec,cont){
  var p=E('div',{'class':'pg','style':'--c:'+sec.color});
  p.appendChild(E('div',{'class':'hd'},
    '<b>'+sec.name+'</b><span>'+(cont?'המשך':(sec.sub||''))+'</span>'));
  var tabTop = 20 + sec.idx*24.5;
  p.appendChild(E('div',{'class':'tab',
    'style':'top:'+tabTop+'mm;height:24mm'},(sec.idx+1)+' '+(NAV[sec.idx]?NAV[sec.idx].tab:sec.name)));
  var bd=E('div',{'class':'body'+(sec.cols===2?' c2':'')});
  p.appendChild(bd); p.appendChild(E('div',{'class':'pgn'}));
  out.appendChild(p); pages.push(p);
  return bd;
}
/* בדיקת התאמה אמיתית.

   הגרסה הקודמת בדקה pg.scrollHeight<=pg.clientHeight, ושתי התכונות האלה
   שוות תמיד: ל-.pg יש overflow:hidden, ו-.body הוא מכולה רב-טורית שגדלה
   לפי תוכנה. כלומר הבדיקה השוותה את העמוד לעצמו והחזירה "מתאים" תמיד,
   בעוד התוכן חרג מאות פיקסלים מתחת לשוליים ונחתך בשקט.

   כאן נמדד המרחק האמיתי: תחתית התוכן מול תחתית שטח ההדפסה, פחות מקום
   שמור למספר העמוד. */
var FOOTER_PX = 20;
function bottomLimit(pg){
  var pr = pg.getBoundingClientRect();
  var padBottom = parseFloat(getComputedStyle(pg).paddingBottom) || 0;
  return pr.bottom - padBottom - FOOTER_PX;
}
/* soft — תקציב גובה לעמוד, לאיזון המילוי בין עמודי אותו נושא. לעולם אינו
   רופף מהגבול הפיזי, ולכן אינו יכול לגרום לגלישה. */
function fits(pg, soft){
  var bd = pg.querySelector('.body');
  if (!bd) return true;
  var br = bd.getBoundingClientRect();
  var limit = bottomLimit(pg);
  if (soft) limit = Math.min(limit, br.top + soft);
  return br.top + bd.scrollHeight <= limit + 1;
}
function usedH(pg){ return pg.querySelector('.body').scrollHeight; }
function availH(pg){
  return bottomLimit(pg) - pg.querySelector('.body').getBoundingClientRect().top;
}
function dropPages(from){
  for (var i = pages.length-1; i >= from; i--) pages[i].remove();
  pages.length = from;
}

/* השער מוזרק לגוף העמוד הראשון לפני התוכן, ולא כעמוד נפרד: במגבלת
   5 דפים עמוד שלם לשער הוא 10% מהחוברת. הוא נוסף כאן, לפני מילוי
   העמוד, כדי שבדיקת ההתאמה תדחוף את התוכן העודף לעמוד הבא. */
var coverHost=null;

/* כל נושא פותח עמוד חדש. קודם מקטע היה ממשיך בעמוד קיים כדי לחסוך
   עמודים, אבל אז נושא התחיל באמצע עמוד של נושא אחר — קשה לאיתור
   בזמן מבחן. עדיף עמוד נקי לכל נושא, גם במחיר עמודים נוספים. */
function layoutSection(sec, si, soft){
  var from = pages.length;
  var bd = newPage(sec,false), pg = bd.parentNode;
  if(si===0){ coverHost=E('div',{'class':'coverbar'}); bd.insertBefore(coverHost,bd.firstChild); }
  bd.appendChild(E('div',{'class':'lookup'},rt(NAV[si].cue.replace(' :: ',' — '))));
  sec.blocks.forEach(function(b){
    var el=block(b);
    bd.appendChild(el);
    /* בלוק ראשון בעמוד נשאר בו גם אם חרג מהתקציב הרך — אחרת נפתח עמוד
       ריק והלולאה לא מתקדמת. */
    if(!fits(pg,soft) && bd.children.length>1){
      bd.removeChild(el);
      /* כותרת בסוף עמוד — מעבירים אותה יחד עם מה שבא אחריה */
      var trail=[];
      while(bd.lastChild && /^H[23]$/.test(bd.lastChild.tagName)){
        trail.unshift(bd.lastChild); bd.removeChild(bd.lastChild);
      }
      bd=newPage(sec,true); pg=bd.parentNode;
      trail.forEach(function(t){bd.appendChild(t);});
      bd.appendChild(el);
    }
    /* בלוק גדול מעמוד שלם — טבלה ארוכה או רשימה ארוכה — נחתך לשורות.
       כאן תמיד הגבול הפיזי: מדובר במניעת חיתוך, לא באיזון. */
    while(!fits(pg,0) && el.rows && el.rows.length>1){
      /* המחלקה נשמרת: טבלה רחבה שנחתכה בין עמודים איבדה את class="wide"
         והמשכה נדחס לטור בודד. */
      var cut=E(el.tagName,{'class':el.getAttribute('class')||''}), moved=false;
      while(!fits(pg,0) && el.rows.length>1){
        cut.insertBefore(el.rows[el.rows.length-1], cut.firstChild);
        moved=true;
      }
      if(!moved) break;
      bd=newPage(sec,true); pg=bd.parentNode;
      bd.appendChild(cut); el=cut;
    }
    while(!fits(pg,0) && el.children && el.children.length>1 && !el.rows){
      var cut2=E(el.tagName,{'class':el.getAttribute('class')||''}), moved2=false;
      while(!fits(pg,0) && el.children.length>1){
        cut2.insertBefore(el.lastElementChild, cut2.firstChild);
        moved2=true;
      }
      if(!moved2) break;
      bd=newPage(sec,true); pg=bd.parentNode;
      bd.appendChild(cut2); el=cut2;
    }
  });
  return {bd:bd, from:from, count:pages.length-from};
}

/* מעבר א׳ — מילוי חמדני, רק כדי לדעת כמה עמודים כל נושא צורך וכמה
   תוכן יש בו. מעבר ב׳ מפזר את אותו תוכן שווה בשווה על אותם עמודים,
   כדי שהעמוד האחרון של נושא לא ייראה חתוך באמצע. */
var plan=[];
DATA.sections.forEach(function(sec,si){
  sec.idx=si;
  var r=layoutSection(sec,si,0);
  var tot=0;
  for(var i=r.from;i<pages.length;i++) tot+=usedH(pages[i]);
  plan.push({sec:sec, si:si, count:r.count, total:tot,
             avail:availH(pages[r.from]), slack:r.count*availH(pages[r.from])-tot});
});

/* ---- המפתח ----
   נבנה מהמונחים שסומנו, כך שמספרי העמודים תמיד נכונים. */
function collectTerms(){
  var terms={};
  pages.forEach(function(p,i){
    var chapter=DATA.sections.findIndex(function(s){return s.name===p.querySelector('.hd b').textContent;});
    (NAV[chapter]?NAV[chapter].terms:[]).forEach(function(k){if(!terms[k])terms[k]=[i+1];});
  });
  return terms;
}
function buildIndexEl(terms){
  var wrap=E('div',{'class':'idxwrap'});
  wrap.appendChild(E('div',{'class':'secbreak idxhd','style':'--c:#3d4650'},
    '<b>מפתח מונחים</b><span>לפי א״ב</span>'));
  var idx=E('div',{'class':'idx'});
  Object.keys(terms).sort(function(a,b){return Number(/^[A-Za-z]/.test(a))-Number(/^[A-Za-z]/.test(b))||a.localeCompare(b,'he');})
    .forEach(function(k){
      var u=terms[k].filter(function(v,i,a){return a.indexOf(v)===i;});
      idx.appendChild(E('div',{},'<a href="#page-'+u[0]+'"><span class="t">'+k+'</span>&nbsp;'+
                                 '<span class="p">'+u.join(', ')+'</span></a>'));
    });
  wrap.appendChild(idx);
  return wrap;
}

/* גובה המפתח נמדד על עמוד אמיתי — הרוחב והטורים קובעים אותו. */
var probePg=pages[pages.length-1], probe=buildIndexEl(collectTerms());
var beforeH=usedH(probePg);
probePg.querySelector('.body').appendChild(probe);
var IDX_H=usedH(probePg)-beforeH;
probe.remove();

/* המפתח אינו "נושא", ולכן מותר לו לשבת בזנב עמוד קיים — הכלל
   "נושא פותח עמוד" נועד למנוע נושא שמתחיל באמצע נושא אחר. מארחים אותו
   בנושא שנשאר בו הכי הרבה מקום, וסופרים אותו כחלק מתקציב אותו נושא,
   כך שגם עמודיו נשארים מאוזנים. אם אין מקום — עמוד משלו. */
var host=plan[plan.length-1];
if(host.slack<IDX_H+4)host=null;

/* ---- מעבר ב׳: פריסה מאוזנת ----
   התקציב מתחיל בחלוקה שווה של התוכן, אבל בלוקים הם יחידות בדידות: עמוד
   נעצר לפני התקציב ולא בדיוק עליו, והשארית הצטברה לעמוד נוסף כמעט ריק
   (הנושאים תפחו מ-2 עמודים ל-3). לכן התקציב מתרופף עד שהפריסה חוזרת
   למספר העמודים של המילוי החמדני — הכי מאוזן שאפשר בלי לשלם עמוד. */
function balanced(pl, reserve){
  var target=(pl.total+reserve)/pl.count;
  for(var k=0;k<16;k++){
    var from=pages.length, r=layoutSection(pl.sec,pl.si,target);
    if(r.count<=pl.count) return r;
    dropPages(from);
    target*=1.04;
  }
  return layoutSection(pl.sec,pl.si,0);
}
/* הנושא המארח נפרס כך שבעמוד האחרון יישאר מקום למפתח — ואת זה בודקים
   במדידה, לא בחשבון: חלוקה שווה של תוכן+מפתח החטיאה בשני אחוזים, כי
   פיזור מחדש בין הטורים משנה מעט את הגובה הכולל. */
function layoutHost(pl, idxH){
  var target=(pl.total+idxH)/pl.count;
  for(var k=0;k<40;k++){
    var from=pages.length, r=layoutSection(pl.sec,pl.si,target);
    var lp=pages[pages.length-1];
    if(r.count<=pl.count && usedH(lp)+idxH<=availH(lp)-4) return r;
    dropPages(from);
    if(target>=pl.avail) break;
    target=Math.min(pl.avail,target*1.03);
  }
  return null;
}
dropPages(0);
plan.forEach(function(pl){
  if(pl===host){
    var r=layoutHost(pl,IDX_H);
    if(r){ pl.res=r; return; }
    host=null;                       /* לא נכנס — המפתח יקבל עמוד משלו */
  }
  pl.res=(pl.count>1)?balanced(pl,0):layoutSection(pl.sec,pl.si,0);
});

var ixSec={name:'מפתח',color:'#3d4650',sub:'לפי א״ב',idx:DATA.sections.length};
var idxWrap=buildIndexEl(collectTerms()), ixFirst;
if(host){
  var hbd=host.res.bd;
  hbd.appendChild(idxWrap);
  if(fits(hbd.parentNode,0)) ixFirst=pages.indexOf(hbd.parentNode)+1;
  else { hbd.removeChild(idxWrap); host=null; }
}
if(!host){
  var ibd=newPage(ixSec,false); ixFirst=pages.length;
  idxWrap.querySelector('.idxhd').remove();   /* הכותרת הרצה כבר אומרת "מפתח" */
  ibd.appendChild(idxWrap);
  var iel=idxWrap.querySelector('.idx');      /* ארוך מעמוד — נחתך */
  while(!fits(ibd.parentNode,0) && iel.children.length>1){
    var icut=E('div',{'class':'idx'}), imoved=false;
    while(!fits(ibd.parentNode,0) && iel.children.length>1){
      icut.insertBefore(iel.lastElementChild,icut.firstChild); imoved=true;
    }
    if(!imoved) break;
    ibd=newPage(ixSec,true); ibd.appendChild(icut); iel=icut;
  }
}

/* ---- מספור ושער ---- */
var first={};
pages.forEach(function(p,i){
  p.id='page-'+(i+1);
  p.querySelector('.pgn').innerHTML='עמ׳ <b>'+(i+1)+'</b> · '+
    '<a href="#page-1">מפת עמודים</a> · <a href="#page-'+ixFirst+'">מפתח מונחים</a>';
  var nm=p.querySelector('.hd b').textContent;
  if(first[nm]===undefined)first[nm]=i+1;
});

var cover=E('div',{});
cover.innerHTML='<div class="cover"><h1>מנהיגות בניהול</h1>'+
  '<div class="sub">חומר פתוח למבחן · בר-אילן · לפי חומרי הקורס<br>'+
  '<b>מצגות, שאלונים והקלטות שנבדקו</b> · הסיכום המקיף של הכיתה יתווסף בהמשך</div></div>';
var toc=E('div',{'class':'toc'});
DATA.sections.forEach(function(s){
  var a=E('a',{href:'#page-'+first[s.name]},'<span class="sw" style="background:'+s.color+'"></span>'+
    '<span class="nm">'+NAV[s.idx].label+'</span><span class="dots"></span>'+
    '<span class="pn">'+first[s.name]+'</span>');
  toc.appendChild(a);
});
cover.querySelector('.cover').appendChild(toc);
cover.querySelector('.cover').appendChild(E('div',{'class':'tip'},
  '<b>איך מנווטים מהר</b> '+rt('נושא מוכר — מפת העמודים כאן. מונח או כינוי — **המפתח לפי א״ב בסוף**. תיאור מקרה — **זיהוי בתרחיש** בראש הפרק. הלשוניות הממוספרות בשוליים מסמנות את הפרקים.')));
if(coverHost) coverHost.appendChild(cover.firstChild);

toc.appendChild(E('a',{href:'#page-'+ixFirst},
  '<span class="sw" style="background:'+ixSec.color+'"></span>'+
  '<span class="nm">מפתח מונחים לפי א״ב</span><span class="dots"></span>'+
  '<span class="pn">'+ixFirst+'</span>'));
/* המפתח יושב בזנב נושא קיים, ולכן מספר עמודו קטן משל הנושא האחרון —
   בלי המיון הזה תוכן העניינים היה קופץ אחורה בשורה האחרונה. */
[].slice.call(toc.children)
  .sort(function(a,b){return a.querySelector('.pn').textContent-b.querySelector('.pn').textContent;})
  .forEach(function(a){toc.appendChild(a);});

/* הקישור חזרה — שם הקובץ שונה בין הרפו לתיקיית הקורס */
(function(){
  var me=decodeURIComponent(location.pathname.split('/').pop()||'');
  if(me.indexOf('חומר פתוח')===0)
    document.getElementById('back').setAttribute('href','בוחן תרגול - מנהיגות בניהול.html');
})();

/* ---- בקרת גלישה ----
   חייבת להשתמש באותה מדידה כמו fits(). הגרסה הקודמת בדקה
   p.scrollHeight>p.clientHeight, ולעמוד יש overflow:hidden — כלומר שתי
   התכונות שוות תמיד, הבדיקה השוותה את העמוד לעצמו, והסטטוס דיווח
   «תקין» גם כשתוכן נחתך. */
var over=0;
document.querySelectorAll('.pg').forEach(function(p){
  if(!fits(p)){p.classList.add('over');over++;}
});
document.getElementById('stat').textContent=
  document.querySelectorAll('.pg').length+' עמודים'+(over?' · '+over+' בגלישה':' · תקין');
</script>
</body>
</html>
