<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>חומר פתוח — מנהיגות בניהול</title>
<style>
/* ---------- בסיס ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{background:#8a8f96}
body{font:8.9px/1.27 "Segoe UI","Arial Hebrew",Arial,sans-serif;color:#12161c;direction:rtl}

/* ---------- עמוד ---------- */
/* A4 = 210×297mm. הריפוד הימני רחב יותר — שם הכריכה/הסיכה. */
.pg{position:relative;width:209.9mm;height:296.8mm;padding:8mm 6mm 6mm 11mm;
    background:#fff;margin:0 auto 7mm;overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pg.over{outline:3px solid #d92b2b}
.pg.over::after{content:"גלישה";position:absolute;left:2mm;bottom:2mm;
    background:#d92b2b;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px}

/* כותרת רצה */
.hd{position:absolute;top:5mm;right:11mm;left:16mm;display:flex;
    justify-content:space-between;align-items:baseline;
    border-bottom:1.6px solid var(--c,#333);padding-bottom:1.5mm;
    font-size:10px;letter-spacing:.2px}
.hd b{font-size:12.5px;color:var(--c,#333)}
.hd span{color:#7a828c}
.pgn{position:absolute;bottom:4.5mm;left:16mm;font-size:10px;color:#7a828c}
.pgn b{color:#333}

/* לשונית צד — המיקום האנכי משתנה לפי הנושא, כך שבערימת דפים
   נראות "מדרגות" וניתן לדפדף ישר לנושא בלי לקרוא. */
.tab{position:absolute;left:0;width:9mm;background:var(--c,#333);color:#fff;
     display:flex;align-items:center;justify-content:center;
     writing-mode:vertical-rl;font-size:9.5px;font-weight:700;letter-spacing:.4px;
     padding:2mm 0;border-radius:3px 0 0 3px}

/* ---------- תוכן ---------- */
.body{margin-top:4mm;column-gap:4.5mm}
.body.c2{column-count:2;column-rule:1px solid #dfe3e8}
h2{font-size:9.9px;color:#fff;background:var(--c,#333);padding:1mm 2mm;
   border-radius:2.5px;margin:0 0 1.6mm;break-after:avoid}
h2:not(:first-child){margin-top:3mm}
h3{font-size:9px;color:var(--c,#333);margin:1.9mm 0 .8mm;break-after:avoid;
   border-bottom:1px dotted #c3c9d0;padding-bottom:.6mm}
h3:first-child{margin-top:0}
dl{margin:0 0 1.2mm}
dt{font-weight:700;font-size:8.9px;display:inline}
dd{display:inline;margin:0}
dl>div{margin-bottom:.5mm;break-inside:avoid;text-indent:-3.2mm;padding-right:3.2mm}
dt::before{content:"▪ ";color:var(--c,#333);font-weight:700}
dt::after{content:" — ";font-weight:400;color:#7a828c}
.n{color:#0b4f9e;font-weight:700;font-feature-settings:"tnum"}
.q{color:#3d4650;font-style:italic}
em{font-style:normal;background:#fff2b8;padding:0 1px;border-radius:2px}
.fig{margin:1mm 0 1.6mm;break-inside:avoid;text-align:center}
.fig img{max-width:100%;max-height:38mm;height:auto;border:1px solid #d7dce1;border-radius:2px}
/* פסקאות שהודבקו לוורד בלי תבליט קיבלו מרווח כפול מזה של הפריטים,
   והעמודים האחרונים נראו מרווחים מדי. כאן הן מיושרות לאותה צפיפות.
   תבליט ותלייה נוסו ונפסלו: הם הוסיפו גלישות שורה ועמוד שלם. */
.ptxt{margin:0 0 .5mm;break-inside:avoid;color:#2b3138}
.warn{background:#fdeaea;border-right:2.5px solid #d92b2b;padding:1.2mm 2mm;
      margin:1.2mm 0;break-inside:avoid;border-radius:0 2.5px 2.5px 0}
.warn b{color:#a51b1b}

/* טבלאות */
table.wide{column-span:all;font-size:8.6px}
table.wide td,table.wide th{padding:.5mm .8mm;line-height:1.25}
table{border-collapse:collapse;width:100%;font-size:8.2px;margin:0 0 1.2mm;break-inside:avoid}
th{background:var(--c,#333);color:#fff;text-align:right;padding:1mm 2mm;font-size:10px}
td{border-bottom:1px solid #dfe3e8;padding:.9mm 2mm;vertical-align:top}
tr:nth-child(even) td{background:#f6f8fa}
td.k{font-weight:700;white-space:nowrap;color:#0b4f9e;font-feature-settings:"tnum"}

/* ---------- שער ---------- */
.secbreak{column-span:all;border-top:2.5px solid var(--c,#333);margin:3mm 0 2mm;
  padding-top:1.2mm;display:flex;justify-content:space-between;align-items:baseline}
.secbreak b{font-size:12px;color:var(--c,#333)}
.secbreak span{font-size:8px;color:#7a828c}
.coverbar{column-span:all;height:41mm;overflow:hidden;border-bottom:2px solid #333;
  margin-bottom:2.5mm;padding-bottom:1mm}
.cover{text-align:right}
.cover h1{font-size:15px;letter-spacing:-.3px;margin:0 0 .5mm;display:inline-block}
.cover .sub{font-size:8.4px;color:#5b6470;margin:0 0 1.5mm}
.toc{display:flex;flex-wrap:wrap;gap:1mm 3mm;margin:1mm 0 1.5mm}
.toc a{display:inline-flex;align-items:center;gap:1mm;text-decoration:none;color:#222;font-size:8.4px}
.toc a:nth-child(odd){background:#f2f5f8}
.toc .sw{width:4mm;height:4mm;border-radius:2px;flex:none}
.toc .nm{flex:1;font-weight:700}
.toc .dots{display:none}
.toc .pn{font-weight:700;color:#0b4f9e;font-feature-settings:"tnum"}
.tip{font-size:7.8px;line-height:1.3;color:#3d4650;background:#f2f5f8;border-right:2px solid #333;padding:1mm 2mm;border-radius:0 2px 2px 0}
.tip b{display:block;margin-bottom:1.5mm;font-size:12px}

/* ---------- מפתח ---------- */
/* column-span:all קריטי כשהמפתח יושב בזנב עמוד דו-טורי: בלעדיו הוא
   מכולה רב-טורית בתוך מכולה רב-טורית, וגובהו הנמדד (offsetHeight) קטן
   מגובהו בפועל (scrollHeight) — כך שבדיקת ההתאמה מאשרת אותו והוא נחתך. */
/* חמישה טורים ולא ארבעה: כך המפתח נכנס לזנב העמוד של הנושא המארח
   במקום לתפוס עמוד שלם — עמוד אחד מתוך עשרה. */
.idx{column-count:5;column-gap:4mm;font-size:9px;line-height:1.38;column-span:all}
.idx div{break-inside:avoid}
.idx .t{font-weight:700}
.idx .p{color:#0b4f9e;font-weight:700}
.idx h3{column-span:all}

/* ---------- הדפסה ---------- */
@page{size:A4;margin:0}
@media print{
  html{background:#fff}
  .pg{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pg.over{outline:none}
  .pg.over::after{display:none}
  .noprint{display:none}
}
.noprint{position:fixed;top:8px;left:8px;z-index:99;background:#12161c;color:#fff;
  border-radius:6px;padding:7px 11px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.noprint button{background:#2d6cdf;color:#fff;border:0;border-radius:4px;
  padding:4px 9px;font-size:12px;cursor:pointer;margin-right:6px}
.noprint a{color:#9ec5ff;text-decoration:none;font-size:12px;margin-right:9px}
.noprint a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="noprint"><span id="stat">בונה…</span><button onclick="print()">הדפסה</button><a id="back" href="index.html">לתרגול ←</a></div>
<div id="out"></div>

<script>
var DATA = /*DATA*/null/*DATA*/;

/* ---- עזרי בנייה ---- */
function E(t,a,h){var e=document.createElement(t);for(var k in a)e.setAttribute(k,a[k]);
  if(h!=null)e.innerHTML=h;return e;}

/* טקסט עשיר: **מודגש** ⟨מספר⟩ «ציטוט» __הדגשה__ */
function rt(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/__(.+?)__/g,'<em>$1</em>')
    .replace(/«(.+?)»/g,'<span class="q">"$1"</span>')
    .replace(/⟨(.+?)⟩/g,'<span class="n">$1</span>');
}

/* ---- הופך בלוק לאלמנט ---- */
function block(b){
  if(b.h2) return E('h2',{},rt(b.h2));
  if(b.h3) return E('h3',{},rt(b.h3));
  if(b.warn) return E('div',{'class':'warn'},rt(b.warn));
  /* פסקת טקסט חופשי — מגיעה מוורד שנערך ביד, שם לא כל שורה היא
     פריט "מונח — הגדרה". */
  if(b.p) return E('div',{'class':'ptxt'},rt(b.p));
  /* דיאגרמות וצילומי טבלאות מהמצגות. הגובה מוגבל כדי שתמונה בודדת
     לא תבלע טור שלם — במגבלת 5 דפים זה יקר מדי. */
  /* width/height מפורשים הם קריטיים: העימוד רץ לפני שהתמונות מפוענחות,
     ובלעדיהם גובהן בזמן החישוב הוא 0, בדיקת ההתאמה עוברת, ואז הן גדלות
     ודוחפות את התוכן אל מחוץ לעמוד (עמוד אחד חרג ב-579px). עם המידות
     הדפדפן יודע את יחס הממדים מיד ושומר את המקום. */
  if(b.img){var f=E('figure',{'class':'fig'});
    var a={src:b.img,alt:''};
    if(b.w&&b.h){a.width=b.w;a.height=b.h;}
    f.appendChild(E('img',a));return f;}
  if(b.tbl){
    /* טבלה רחבה (5 עמודות ומעלה) נפרסת על שני הטורים — בטור בודד
       העמודות נמעכות והטקסט נעשה בלתי קריא. */
    var wide=(b.tbl.head||b.tbl.rows[0]||[]).length>=5;
    var t=E('table',wide?{'class':'wide'}:null),th=E('tr');
    (b.tbl.head||[]).forEach(function(c){th.appendChild(E('th',{},rt(c)));});
    if(b.tbl.head)t.appendChild(th);
    b.tbl.rows.forEach(function(r){
      var tr=E('tr');
      r.forEach(function(c,i){tr.appendChild(E('td',{'class':i===0?'k':''},rt(c)));});
      t.appendChild(tr);
    });
    return t;
  }
  var dl=E('dl');
  b.items.forEach(function(it){
    var d=E('div'), p=String(it).split(' :: ');
    /* ⟦כינוי · כינוי⟧ בכותרת — לא מוצג, אך נכנס למפתח הא״ב. נועד לכותרות
       שנוסחו כשאלה ("מה נכלל") ואי אפשר לחפש אותן לפי מונח. */
    var head=p[0], alias='', ma=head.match(/⟦([^⟧]*)⟧/);
    if(ma){ alias=ma[1]; head=head.replace(/\s*⟦[^⟧]*⟧/,''); }
    var dt=E('dt',{},rt(head));
    if(alias) dt.setAttribute('data-idx',alias);
    d.appendChild(dt);
    d.appendChild(E('dd',{},rt(p.slice(1).join(' :: '))));
    dl.appendChild(d);
  });
  return dl;
}

/* ---- דפדוף: ממלא עמוד עד שהוא מתמלא, ואז פותח חדש ---- */
var out=document.getElementById('out'), pages=[];
function newPage(sec,cont){
  var p=E('div',{'class':'pg','style':'--c:'+sec.color});
  p.appendChild(E('div',{'class':'hd'},
    '<b>'+sec.name+'</b><span>'+(cont?'המשך':(sec.sub||''))+'</span>'));
  var tabTop = 14 + sec.idx*(70/Math.max(1,DATA.sections.length-1));
  p.appendChild(E('div',{'class':'tab',
    'style':'top:'+tabTop+'mm;height:34mm'},sec.name));
  var bd=E('div',{'class':'body'+(sec.cols===2?' c2':'')});
  p.appendChild(bd); p.appendChild(E('div',{'class':'pgn'}));
  out.appendChild(p); pages.push(p);
  return bd;
}
/* בדיקת התאמה אמיתית.

   הגרסה הקודמת בדקה pg.scrollHeight<=pg.clientHeight, ושתי התכונות האלה
   שוות תמיד: ל-.pg יש overflow:hidden, ו-.body הוא מכולה רב-טורית שגדלה
   לפי תוכנה. כלומר הבדיקה השוותה את העמוד לעצמו והחזירה "מתאים" תמיד,
   בעוד התוכן חרג מאות פיקסלים מתחת לשוליים ונחתך בשקט.

   כאן נמדד המרחק האמיתי: תחתית התוכן מול תחתית שטח ההדפסה, פחות מקום
   שמור למספר העמוד. */
var FOOTER_PX = 20;
function bottomLimit(pg){
  var pr = pg.getBoundingClientRect();
  var padBottom = parseFloat(getComputedStyle(pg).paddingBottom) || 0;
  return pr.bottom - padBottom - FOOTER_PX;
}
/* soft — תקציב גובה לעמוד, לאיזון המילוי בין עמודי אותו נושא. לעולם אינו
   רופף מהגבול הפיזי, ולכן אינו יכול לגרום לגלישה. */
function fits(pg, soft){
  var bd = pg.querySelector('.body');
  if (!bd) return true;
  var br = bd.getBoundingClientRect();
  var limit = bottomLimit(pg);
  if (soft) limit = Math.min(limit, br.top + soft);
  return br.top + bd.scrollHeight <= limit + 1;
}
function usedH(pg){ return pg.querySelector('.body').scrollHeight; }
function availH(pg){
  return bottomLimit(pg) - pg.querySelector('.body').getBoundingClientRect().top;
}
function dropPages(from){
  for (var i = pages.length-1; i >= from; i--) pages[i].remove();
  pages.length = from;
}

/* השער מוזרק לגוף העמוד הראשון לפני התוכן, ולא כעמוד נפרד: במגבלת
   5 דפים עמוד שלם לשער הוא 10% מהחוברת. הוא נוסף כאן, לפני מילוי
   העמוד, כדי שבדיקת ההתאמה תדחוף את התוכן העודף לעמוד הבא. */
var coverHost=null;

/* כל נושא פותח עמוד חדש. קודם מקטע היה ממשיך בעמוד קיים כדי לחסוך
   עמודים, אבל אז נושא התחיל באמצע עמוד של נושא אחר — קשה לאיתור
   בזמן מבחן. עדיף עמוד נקי לכל נושא, גם במחיר עמודים נוספים. */
function layoutSection(sec, si, soft){
  var from = pages.length;
  var bd = newPage(sec,false), pg = bd.parentNode;
  if(si===0){ coverHost=E('div',{'class':'coverbar'}); bd.insertBefore(coverHost,bd.firstChild); }
  sec.blocks.forEach(function(b){
    var el=block(b);
    bd.appendChild(el);
    /* בלוק ראשון בעמוד נשאר בו גם אם חרג מהתקציב הרך — אחרת נפתח עמוד
       ריק והלולאה לא מתקדמת. */
    if(!fits(pg,soft) && bd.children.length>1){
      bd.removeChild(el);
      /* כותרת בסוף עמוד — מעבירים אותה יחד עם מה שבא אחריה */
      var trail=[];
      while(bd.lastChild && /^H[23]$/.test(bd.lastChild.tagName)){
        trail.unshift(bd.lastChild); bd.removeChild(bd.lastChild);
      }
      bd=newPage(sec,true); pg=bd.parentNode;
      trail.forEach(function(t){bd.appendChild(t);});
      bd.appendChild(el);
    }
    /* בלוק גדול מעמוד שלם — טבלה ארוכה או רשימה ארוכה — נחתך לשורות.
       כאן תמיד הגבול הפיזי: מדובר במניעת חיתוך, לא באיזון. */
    while(!fits(pg,0) && el.rows && el.rows.length>1){
      /* המחלקה נשמרת: טבלה רחבה שנחתכה בין עמודים איבדה את class="wide"
         והמשכה נדחס לטור בודד. */
      var cut=E(el.tagName,{'class':el.getAttribute('class')||''}), moved=false;
      while(!fits(pg,0) && el.rows.length>1){
        cut.insertBefore(el.rows[el.rows.length-1], cut.firstChild);
        moved=true;
      }
      if(!moved) break;
      bd=newPage(sec,true); pg=bd.parentNode;
      bd.appendChild(cut); el=cut;
    }
    while(!fits(pg,0) && el.children && el.children.length>1 && !el.rows){
      var cut2=E(el.tagName,{'class':el.getAttribute('class')||''}), moved2=false;
      while(!fits(pg,0) && el.children.length>1){
        cut2.insertBefore(el.lastElementChild, cut2.firstChild);
        moved2=true;
      }
      if(!moved2) break;
      bd=newPage(sec,true); pg=bd.parentNode;
      bd.appendChild(cut2); el=cut2;
    }
  });
  return {bd:bd, from:from, count:pages.length-from};
}

/* מעבר א׳ — מילוי חמדני, רק כדי לדעת כמה עמודים כל נושא צורך וכמה
   תוכן יש בו. מעבר ב׳ מפזר את אותו תוכן שווה בשווה על אותם עמודים,
   כדי שהעמוד האחרון של נושא לא ייראה חתוך באמצע. */
var plan=[];
DATA.sections.forEach(function(sec,si){
  sec.idx=si;
  var r=layoutSection(sec,si,0);
  var tot=0;
  for(var i=r.from;i<pages.length;i++) tot+=usedH(pages[i]);
  plan.push({sec:sec, si:si, count:r.count, total:tot,
             avail:availH(pages[r.from]), slack:r.count*availH(pages[r.from])-tot});
});

/* ---- המפתח ----
   נבנה מהמונחים שסומנו, כך שמספרי העמודים תמיד נכונים. */
function collectTerms(){
  var terms={};
  pages.forEach(function(p,i){
    p.querySelectorAll('dt').forEach(function(d){
      var t=d.textContent.replace(/^▪\s*/,'').replace(/\s*—\s*$/,'').trim();
      var ks=[t];
      var al=d.getAttribute('data-idx');
      if(al) ks=ks.concat(al.split('·'));
      ks.forEach(function(k){
        k=k.trim();
        if(k.length<2||k.length>44)return;
        (terms[k]=terms[k]||[]).push(i+1);
      });
    });
  });
  return terms;
}
function buildIndexEl(terms){
  var wrap=E('div',{'class':'idxwrap'});
  wrap.appendChild(E('div',{'class':'secbreak idxhd','style':'--c:#3d4650'},
    '<b>מפתח מונחים</b><span>לפי א״ב</span>'));
  var idx=E('div',{'class':'idx'});
  Object.keys(terms).sort(function(a,b){return a.localeCompare(b,'he');})
    .forEach(function(k){
      var u=terms[k].filter(function(v,i,a){return a.indexOf(v)===i;});
      idx.appendChild(E('div',{},'<span class="t">'+k+'</span> '+
                                 '<span class="p">'+u.join(', ')+'</span>'));
    });
  wrap.appendChild(idx);
  return wrap;
}

/* גובה המפתח נמדד על עמוד אמיתי — הרוחב והטורים קובעים אותו. */
var probePg=pages[pages.length-1], probe=buildIndexEl(collectTerms());
var beforeH=usedH(probePg);
probePg.querySelector('.body').appendChild(probe);
var IDX_H=usedH(probePg)-beforeH;
probe.remove();

/* המפתח אינו "נושא", ולכן מותר לו לשבת בזנב עמוד קיים — הכלל
   "נושא פותח עמוד" נועד למנוע נושא שמתחיל באמצע נושא אחר. מארחים אותו
   בנושא שנשאר בו הכי הרבה מקום, וסופרים אותו כחלק מתקציב אותו נושא,
   כך שגם עמודיו נשארים מאוזנים. אם אין מקום — עמוד משלו. */
var host=null;
plan.forEach(function(pl){ if(pl.slack>=IDX_H+4 && (!host||pl.slack>host.slack)) host=pl; });

/* ---- מעבר ב׳: פריסה מאוזנת ----
   התקציב מתחיל בחלוקה שווה של התוכן, אבל בלוקים הם יחידות בדידות: עמוד
   נעצר לפני התקציב ולא בדיוק עליו, והשארית הצטברה לעמוד נוסף כמעט ריק
   (הנושאים תפחו מ-2 עמודים ל-3). לכן התקציב מתרופף עד שהפריסה חוזרת
   למספר העמודים של המילוי החמדני — הכי מאוזן שאפשר בלי לשלם עמוד. */
function balanced(pl, reserve){
  var target=(pl.total+reserve)/pl.count;
  for(var k=0;k<16;k++){
    var from=pages.length, r=layoutSection(pl.sec,pl.si,target);
    if(r.count<=pl.count) return r;
    dropPages(from);
    target*=1.04;
  }
  return layoutSection(pl.sec,pl.si,0);
}
/* הנושא המארח נפרס כך שבעמוד האחרון יישאר מקום למפתח — ואת זה בודקים
   במדידה, לא בחשבון: חלוקה שווה של תוכן+מפתח החטיאה בשני אחוזים, כי
   פיזור מחדש בין הטורים משנה מעט את הגובה הכולל. */
function layoutHost(pl, idxH){
  var target=(pl.total+idxH)/pl.count;
  for(var k=0;k<40;k++){
    var from=pages.length, r=layoutSection(pl.sec,pl.si,target);
    var lp=pages[pages.length-1];
    if(r.count<=pl.count && usedH(lp)+idxH<=availH(lp)-4) return r;
    dropPages(from);
    if(target>=pl.avail) break;
    target=Math.min(pl.avail,target*1.03);
  }
  return null;
}
dropPages(0);
plan.forEach(function(pl){
  if(pl===host){
    var r=layoutHost(pl,IDX_H);
    if(r){ pl.res=r; return; }
    host=null;                       /* לא נכנס — המפתח יקבל עמוד משלו */
  }
  pl.res=(pl.count>1)?balanced(pl,0):layoutSection(pl.sec,pl.si,0);
});

var ixSec={name:'מפתח',color:'#3d4650',sub:'לפי א״ב',idx:DATA.sections.length};
var idxWrap=buildIndexEl(collectTerms()), ixFirst;
if(host){
  var hbd=host.res.bd;
  hbd.appendChild(idxWrap);
  if(fits(hbd.parentNode,0)) ixFirst=pages.indexOf(hbd.parentNode)+1;
  else { hbd.removeChild(idxWrap); host=null; }
}
if(!host){
  var ibd=newPage(ixSec,false); ixFirst=pages.length;
  idxWrap.querySelector('.idxhd').remove();   /* הכותרת הרצה כבר אומרת "מפתח" */
  ibd.appendChild(idxWrap);
  var iel=idxWrap.querySelector('.idx');      /* ארוך מעמוד — נחתך */
  while(!fits(ibd.parentNode,0) && iel.children.length>1){
    var icut=E('div',{'class':'idx'}), imoved=false;
    while(!fits(ibd.parentNode,0) && iel.children.length>1){
      icut.insertBefore(iel.lastElementChild,icut.firstChild); imoved=true;
    }
    if(!imoved) break;
    ibd=newPage(ixSec,true); ibd.appendChild(icut); iel=icut;
  }
}

/* ---- מספור ושער ---- */
var first={};
pages.forEach(function(p,i){
  p.querySelector('.pgn').innerHTML='עמ׳ <b>'+(i+1)+'</b>';
  var nm=p.querySelector('.hd b').textContent;
  if(first[nm]===undefined)first[nm]=i+1;
});

var cover=E('div',{});
cover.innerHTML='<div class="cover"><h1>מנהיגות בניהול</h1>'+
  '<div class="sub">חומר פתוח למבחן · בר-אילן<br>'+
  '<b>נבנה מהסיכום המקוצר למבחן</b> — כל החומר בדפי A4, עם לשוניות ניווט ומפתח א״ב</div></div>';
var toc=E('div',{'class':'toc'});
DATA.sections.forEach(function(s){
  var a=E('a',{href:'#'},'<span class="sw" style="background:'+s.color+'"></span>'+
    '<span class="nm">'+s.name+'</span><span class="dots"></span>'+
    '<span class="pn">'+first[s.name]+'</span>');
  toc.appendChild(a);
});
cover.querySelector('.cover').appendChild(toc);
cover.querySelector('.cover').appendChild(E('div',{'class':'tip'},
  '<b>איך מנווטים מהר</b> '+rt('הלשוניות בשוליים יורדות מדרגה לפי סדר הפרקים — בערימת דפים רואים אותן מהצד ומדפדפים ישר לפרק. בסוף — **מפתח מונחים לפי א״ב** עם מספרי עמודים. __הדגשה צהובה__ = דגש של המרצה · «מירכאות» = ציטוט · ⟨מספרים⟩ בכחול.')));
if(coverHost) coverHost.appendChild(cover.firstChild);

toc.appendChild(E('a',{href:'#'},
  '<span class="sw" style="background:'+ixSec.color+'"></span>'+
  '<span class="nm">מפתח מונחים לפי א״ב</span><span class="dots"></span>'+
  '<span class="pn">'+ixFirst+'</span>'));
/* המפתח יושב בזנב נושא קיים, ולכן מספר עמודו קטן משל הנושא האחרון —
   בלי המיון הזה תוכן העניינים היה קופץ אחורה בשורה האחרונה. */
[].slice.call(toc.children)
  .sort(function(a,b){return a.querySelector('.pn').textContent-b.querySelector('.pn').textContent;})
  .forEach(function(a){toc.appendChild(a);});

/* הקישור חזרה — שם הקובץ שונה בין הרפו לתיקיית הקורס */
(function(){
  var me=decodeURIComponent(location.pathname.split('/').pop()||'');
  if(me.indexOf('חומר פתוח')===0)
    document.getElementById('back').setAttribute('href','בוחן תרגול - מנהיגות בניהול.html');
})();

/* ---- בקרת גלישה ----
   חייבת להשתמש באותה מדידה כמו fits(). הגרסה הקודמת בדקה
   p.scrollHeight>p.clientHeight, ולעמוד יש overflow:hidden — כלומר שתי
   התכונות שוות תמיד, הבדיקה השוותה את העמוד לעצמו, והסטטוס דיווח
   «תקין» גם כשתוכן נחתך. */
var over=0;
document.querySelectorAll('.pg').forEach(function(p){
  if(!fits(p)){p.classList.add('over');over++;}
});
document.getElementById('stat').textContent=
  document.querySelectorAll('.pg').length+' עמודים'+(over?' · '+over+' בגלישה':' · תקין');
</script>
</body>
