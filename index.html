<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בוחן תרגול — מנהיגות בניהול</title>
<style>
:root{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#6b3fa0; --accentSoft:#f0e9f8;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#0f6e56; --clsBg:#e1f5ee;
  --chipBg:#efeee9;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
    --border:#37372f; --borderS:#4a4a46; --accent:#a78bda; --accentSoft:#2e2340;
    --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
    --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
    --warnTx:#fac775; --warnBg:#4a2b06;
    --clsTx:#9fe1cb; --clsBg:#0d4438;
    --chipBg:#2f2f2a;
  }
}
html.dark{
  --bg:#1a1a18; --surface:#242421; --surface2:#2f2f2c; --text:#ececea; --muted:#a3a39c;
  --border:#37372f; --borderS:#4a4a46; --accent:#a78bda; --accentSoft:#2e2340;
  --okBg:#16331f; --okBd:#2f6b3f; --okTx:#7fd49a;
  --errBg:#3a1d1d; --errBd:#7a3535; --errTx:#e89393;
  --warnTx:#fac775; --warnBg:#4a2b06;
  --clsTx:#9fe1cb; --clsBg:#0d4438;
  --chipBg:#2f2f2a;
}
html.light{
  --bg:#f7f6f3; --surface:#ffffff; --surface2:#f1efe8; --text:#1f1f1d; --muted:#6b6b66;
  --border:#e3e1da; --borderS:#cfccc2; --accent:#6b3fa0; --accentSoft:#f0e9f8;
  --okBg:#e6f4ea; --okBd:#9bd3ad; --okTx:#1a6b1a;
  --errBg:#fceaea; --errBd:#e6a3a3; --errTx:#b23030;
  --warnTx:#854f0b; --warnBg:#faeeda;
  --clsTx:#0f6e56; --clsBg:#e1f5ee;
  --chipBg:#efeee9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Arial,'Helvetica Neue',sans-serif;line-height:1.65;
  overflow-wrap:break-word;-webkit-text-size-adjust:100%;}
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 60px;}
header h1{font-size:23px;margin:0 0 4px;font-weight:650;}
header .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;}
/* קישור לחוברת החומר הפתוח */
.aids{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.aid{display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:var(--chipBg);border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;color:var(--text);font-size:13.5px;transition:.15s;flex:1 1 260px;}
.aid:hover{border-color:var(--accent);}
.aid b{font-weight:650;}
.aid i{font-style:normal;font-size:16px;line-height:1;flex:none;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.scopehint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px;padding-right:2px;}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px;}
.chip{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.chip small{opacity:.75;font-size:11px;}
.lbl{font-size:12px;color:var(--muted);margin-left:4px;align-self:center;min-width:44px;}
.spacer{flex:1;}
.iconbtn{background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;}
.iconbtn:hover{border-color:var(--accent);}
.note{background:var(--accentSoft);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:13px;margin-bottom:14px;}
.note b{color:var(--accent);}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-bottom:12px;color:var(--muted);}
.stats b{color:var(--text);}
.bar{height:7px;background:var(--chipBg);border-radius:999px;overflow:hidden;margin-bottom:18px;}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);}
.qtext{font-size:17.5px;font-weight:600;margin-bottom:15px;line-height:1.6;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--borderS);
  border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.12s;
  background:var(--surface);width:100%;text-align:right;font:inherit;color:var(--text);}
.opt:hover{border-color:var(--accent);background:var(--accentSoft);}
.opt .ltr{font-weight:700;color:var(--accent);min-width:19px;}
.opt.correct{background:var(--okBg);border-color:var(--okBd);}
.opt.correct .ltr{color:var(--okTx);}
.opt.wrong{background:var(--errBg);border-color:var(--errBd);}
.opt.wrong .ltr{color:var(--errTx);}
.opt.locked{cursor:default;}
.opt.locked:hover{background:var(--surface);border-color:var(--borderS);}
.opt.correct.locked:hover{background:var(--okBg);border-color:var(--okBd);}
.opt.wrong.locked:hover{background:var(--errBg);border-color:var(--errBd);}
/* במצב מבחן אין משוב עד ההגשה — הבחירה מסומנת בסגול נייטרלי,
   באותה שפה חזותית של "נענתה" במפת השאלות. ירוק אומר "נכון". */
.opt.picked{background:var(--accentSoft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.opt.picked .ltr{color:var(--accent);}
.opt.picked:hover{background:var(--accentSoft);border-color:var(--accent);}
.opt.picked .ltr::after{content:" ✓";font-size:12px;}
.expl{margin-top:8px;padding:13px 15px;border-radius:10px;background:var(--accentSoft);
  border:1px solid var(--border);font-size:14px;}
.expl .tag{font-weight:700;color:var(--accent);}
.nav{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;background:var(--chipBg);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit;}
.btn:hover{border-color:var(--accent);}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:190px;overflow-y:auto;}
.pbtn{width:33px;height:33px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;}
.pbtn.cur{outline:2px solid var(--accent);outline-offset:1px;}
.pbtn.ok{background:var(--okBg);border-color:var(--okBd);color:var(--okTx);}
.pbtn.bad{background:var(--errBg);border-color:var(--errBd);color:var(--errTx);}
.pbtn.ans{background:var(--accentSoft);border-color:var(--accent);color:var(--accent);}
.ptitle{font-size:12.5px;color:var(--muted);margin-bottom:7px;}
.result{text-align:center;}
.result .big{font-size:46px;font-weight:800;color:var(--accent);line-height:1.1;}
.result .grade{font-size:17px;margin:8px 0 16px;}
.clock{font-variant-numeric:tabular-nums;font-weight:650;}
.rev{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface2);font-size:14px;text-align:right;}
.rev .rq{font-weight:600;margin-bottom:6px;}
.rev .ra{color:var(--errTx);}
.rev .rc{color:var(--okTx);}
@media (max-width:540px){
  .wrap{padding:16px 14px 48px;} .card{padding:16px;} .qtext{font-size:16px;}
  header h1{font-size:19px;} .pbtn{width:29px;height:29px;font-size:11.5px;}
  .opt{padding:11px 12px;} .stats{gap:11px;font-size:13px;}
}

/* ---------- תצוגת הדפסה של השאלות ---------- */
/* דף נפרד מהאפליקציה: הכל נפרש ברצף, בלי אינטראקציה, ובצפיפות
   שמתאימה לנייר. המבחן פתוח-חומר ולכן זה נועד להיכנס איתו לכיתה. */
#print{display:none;}
.pq{break-inside:avoid;margin-bottom:9px;}
.pq .pn{font-weight:700;color:var(--accent);}
.pq .po{margin:1px 0 0 0;padding-right:15px;}
.pq .pa{color:var(--okTx);font-weight:600;}
.pq .pe{color:var(--muted);}
.prhead{display:none;}
@media print{
  @page{size:A4;margin:11mm 10mm;}
  html,body{background:#fff!important;color:#000!important;}
  html{--accent:#1a4f8a;--muted:#444;--okTx:#0a5c22;--border:#bbb;}
  .wrap{max-width:none;padding:0;}
  header,#app,.foot{display:none!important;}
  #print{display:block!important;font-size:9.6pt;line-height:1.34;}
  #print.cols{column-count:2;column-gap:8mm;column-rule:1px solid #ccc;}
  .prhead{display:block;border-bottom:1.5px solid #000;padding-bottom:2mm;
    margin-bottom:3mm;column-span:all;}
  .prhead h2{font-size:13pt;margin:0;}
  .prhead div{font-size:8.6pt;color:#444;margin-top:1mm;}
  .pq{margin-bottom:2.6mm;}
  .pq .pt{font-size:7.6pt;color:#666;}
  .pq .pe{font-size:8.8pt;}
}
</style>
</head>

<script>
var BANK=[
/* ===================== 1. מבוא: התנהגות ארגונית וניהול ===================== */
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"סטודנט שואל היכן ממוקם תחום המנהיגות מבחינה אקדמית. מהי התשובה לפי הסיכום?",o:["התנהגות ארגונית — עולם תוכן רב-תחומי הבוחן את ההשפעה על ההתנהגות בארגון","ניהול משאבי אנוש — תחום העוסק בגיוס, במיון, בהכשרה ובתגמול של עובדי הארגון ובפיתוחם","פסיכולוגיה תעסוקתית — תחום העוסק באבחון ובהתאמה של פרטים לתפקידים","סוציולוגיה של העבודה — תחום העוסק ביחסי עבודה ובמעמדות מקצועיים"],c:0,e:"המנהיגות נמצאת בעולם של פרקטיקה ומחקר הנקרא התנהגות ארגונית — עולם תוכן רב-תחומי הניזון מסוציולוגיה, פסיכולוגיה, כלכלה, אנתרופולוגיה, מדע המדינה ותקשורת."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"לפי ההגדרה בסיכום, מה בוחנת ההתנהגות הארגונית ולשם מה?",o:["השפעת הטכנולוגיה והמיכון על תהליכי הייצור בארגון — לשיפור הפריון והתפוקה","השפעת אנשים, קבוצות, מבנים ותהליכים על ההתנהגות בארגון — לשיפור האפקטיביות","השפעת השוק, המתחרים והרגולציה על רווחיות הארגון — לשיפור מעמדו התחרותי בענף שבו הוא פועל","השפעת המבנה הפיננסי והתקציב על תפוקות הארגון — לשיפור יחס העלות-תועלת"],c:1,e:"התנהגות ארגונית היא בחינת ההשפעה של אנשים, קבוצות, מבנים ותהליכים ארגוניים על התנהגויות בארגונים — מתוך כוונה לשפר את האפקטיביות של ארגונים אלו."},
{t:"מבוא והתנהגות ארגונית",s:"שאלות מבחן",q:"מה נכון באשר לתיאוריה ארגונית בהשוואה לתיאוריה ניהולית?",o:["שתיהן מספקות מרשמים יישומיים למנהל, ונבדלות זו מזו רק ברמת הניתוח — מיקרו למול מאקרו בארגון","שתיהן מתארות ומנבאות בלבד, ונבדלות זו מזו רק בשאלה אם הארגון סגור או פתוח","הארגונית מציגה מבנים תיאורטיים המבטאים קשרים בין משתנים, והניהולית מספקת מרשמים ליישום","הארגונית מספקת מרשמים יישומיים למנהל, והניהולית מתארת קשרים בין משתנים בארגון"],c:2,e:"תיאוריה ארגונית היא מערך של מבנים תיאורטיים הקשורים זה לזה — פונקציה תיאורית וניבויית (לתאר, להסביר, לנבא). תיאוריה ניהולית מספקת \"מרשמים\" יישומיים — פונקציה יישומית (להשפיע)."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"מהי הפונקציה של תיאוריה ארגונית, בניגוד לזו של תיאוריה ניהולית?",o:["להשפיע, לשנות ולהשיג תוצאה — פונקציה יישומית ומעשית","למדוד ולתקנן — פונקציה בקרתית ומדידתית","לתקצב ולהקצות — פונקציה כלכלית ומשאבית","לצפות, לתאר, להסביר ולנבא — זוהי פונקציה תיאורית וניבויית"],c:3,e:"התיאוריה הארגונית ממלאת פונקציה תיאורית-ניבויית: לצפות, לתאר ולהסביר. התיאוריה הניהולית ממלאת פונקציה יישומית: להשפיע ולהשיג תוצאה מסוימת."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"לפי ההגדרה שנלמדה, ניהול הוא תהליך של ארבעה מרכיבים. מהם?",o:["תכנון, ארגון, הנהגה ובקרה של האנשים והמשימות לשם השגת מטרות הארגון","גיוס, מיון, הכשרה ותגמול של האנשים לשם התאמתם המלאה לדרישות התפקיד בארגון","חזון, השראה, אתגור והתייחסות פרטנית לשם הנעת האנשים לעבר החזון","תשומות, עיבודים, תפוקות ומשוב לשם קיום קשרי גומלין עם הסביבה"],c:0,e:"ניהול הוא תהליך של תכנון, ארגון, הנהגה ובקרה של האנשים העובדים בארגון ושל המשימות והפעילויות שעליהם לבצע, מתוך מטרה להשיג את מטרות הארגון."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"מהי, לפי הסיכום, התכלית המרכזית של גישות ניהוליות — מעבר להשגת יעילות ואפקטיביות?",o:["לסייע למנהל להגדיל את נתח השוק","לסייע למנהל להתמודד עם אי-ודאות בסביבה","לסייע למנהל לצמצם את עלויות השכר","לסייע למנהל לעמוד בדרישות הרגולציה"],c:1,e:"גישות ניהוליות הן צורת מחשבה, כלים ושיטות לניהול ארגונים במטרה להגיע למקסימום יעילות ואפקטיביות — ובנוסף לכך תפקידן לסייע למנהל להתמודד עם אי-ודאות."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"לפי ההגדרה שנלמדה, מהם המאפיינים של ארגון?",o:["ישות היררכית ובירוקרטית, בעלת חוקים ותקנות כתובים, הפועלת לפי כללים אובייקטיביים","ישות טכנולוגית מורכבת, בעלת מערך ייצור ותשתיות, הפועלת לפי תקנים ונהלים מוגדרים","ישות חברתית מכוונת מטרה, בעלת מערך פעולות מובנה וגבולות ברורים, הפועלת בסביבה נתונה","ישות משפטית רשומה, בעלת הון מניות, דירקטוריון והנהלה, הפועלת למטרות רווח בשוק תחרותי"],c:2,e:"ארגונים הם ישויות חברתיות המכוונות להשגת מטרה, יש להם מערך פעולות מובנה וגבולות ברורים, והם פועלים במסגרת של סביבה נתונה. במרכז יש מטרה הבנויה על טכנולוגיה, ומעל הכל — הסביבה."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"מנהיגות, מוטיבציה, עמדות ועבודת צוות — באיזה ממד ניתוח ארגוני הם נמצאים?",o:["ברמת המאקרו — רמת הארגון","ברמת המזו — רמת המחלקה","ברמת המטא — רמת הענף","ברמת המיקרו — רמת הפרט בארגון"],c:3,e:"ממדי הניתוח הארגוניים: במיקרו (הפרט) — מוטיבציה, עמדות, מנהיגות ועבודת צוות. במאקרו (הארגון) — מבנה, סביבה, תקשורת וטכנולוגיה של הארגון. המנהיגות ממוקמת ברמת המיקרו."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"אילו נושאים שייכים לממד ניתוח המאקרו — רמת הארגון?",o:["מבנה, סביבה, תקשורת וטכנולוגיה","מוטיבציה, עמדות, מנהיגות ועבודת צוות","תכנון, ארגון, הנהגה ובקרה של משימות","כריזמה, השראה, אתגור והתייחסות פרטנית"],c:0,e:"ברמת המאקרו — הארגון — נבחנים המבנה, הסביבה, התקשורת והטכנולוגיה. הנושאים של הפרט (מוטיבציה, עמדות, מנהיגות, עבודת צוות) שייכים לרמת המיקרו."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"מנכ\"ל מבקש להגביר את תפקוד העובדים בארגון. אילו נושאים, לפי הסיכום, נוגעים ישירות לדרך להשפיע על התנהגותם?",o:["תמחיר, תקצוב, ניתוח כדאיות והערכת השקעות הוניות בארגון","יחסי ארגון-סביבה, פיקוח ובקרה, תיאום בארגונים והאצלת סמכויות","עבודת צוות, ניהול קונפליקטים, משא ומתן ושיתופי פעולה בין-ארגוניים","מבנה ארגוני, טכנולוגיית ייצור, מערך לוגיסטי וניהול שרשרת האספקה"],c:1,e:"הדרך להשפיע על התנהגות אנשים בארגון כדי להגביר את תפקוד העובד כוללת יחסי ארגון-סביבה, פיקוח ובקרה ארגונית, תיאום בארגונים והאצלת סמכויות — וכן גישות וסגנונות ניהול ומנהיגות ותקשורת."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"אילו מרכיבים, לפי הסיכום, משפיעים על הצלחת הארגון בהשגת מטרותיו?",o:["עוצמת המותג, נאמנות הלקוחות, פריסת הסניפים והשקעה בשיווק ובפרסום","גודל הארגון, ותק הארגון בשוק, מספר האתרים והיקף ההון העצמי שברשותו","עבודת צוות, ניהול קונפליקטים, משא ומתן ופתרון בעיות ושיתופי פעולה בין-ארגוניים","רמת השכר, היקף התקנים, ותק העובדים והיקף ההשקעה בהדרכה ובפיתוח מקצועי של צוות העובדים"],c:2,e:"המרכיבים המשפיעים על הצלחת הארגון בהשגת מטרותיו הם עבודת צוות, ניהול קונפליקטים, משא ומתן ופתרון בעיות ושיתופי פעולה בין-ארגוניים."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"\"תפקידו של מנהיג הוא לקחת את אנשיו מהיכן שהם למקום בו עדיין לא היו\" — למי מיוחסת האמירה?",o:["ג'יימס מקגרגור ברנס","גארי יוקל","מקס וובר","הנרי קיסינג'ר, מדינאי אמריקאי"],c:3,e:"האמירה מיוחסת להנרי קיסינג'ר, ומשמשת בסיכום כהגדרה פותחת לתפקיד המנהיג. ברנס הוא בעל האמירה על מנהיגות כתופעה הנצפית והבלתי מובנת ביותר."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"מאילו דיסציפלינות ניזון תחום ההתנהגות הארגונית, לפי הפירוט בסיכום?",o:["סוציולוגיה, פסיכולוגיה, כלכלה, אנתרופולוגיה, מדע המדינה ותקשורת","הנדסת תעשייה, חקר ביצועים, סטטיסטיקה, לוגיסטיקה, בקרת איכות ומדעי המחשב","משפטים, חשבונאות, מימון, כלכלה ומינהל עסקים בלבד","היסטוריה, פילוסופיה, מדעי הדתות, ספרות ואמנות בלבד"],c:0,e:"התנהגות ארגונית היא עולם תוכן רב-תחומי: סוציולוגיה ופסיכולוגיה חברתית (קבוצות ומנהיגות), כלכלה (רציונליות), אנתרופולוגיה (תרבות ארגונית), מדע המדינה (כוח ופוליטיקה), תקשורת ופסיכולוגיה."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"אילו נושאים תורם תחום מדע המדינה להתנהגות הארגונית?",o:["לחץ, תפיסה ולמידה של הפרט","מצבי קונפליקט, כוח ופוליטיקה בארגון","תרבות ארגונית ומחקרים השוואתיים בין-תרבותיים","רציונליות, יתרון יחסי וטעמים"],c:1,e:"מדע המדינה תורם את מצבי הקונפליקט, הכוח והפוליטיקה. אנתרופולוגיה תורמת תרבות ארגונית ומחקרים בין-תרבותיים משווים, כלכלה את הרציונליות והיתרון היחסי, ופסיכולוגיה את הלחץ, התפיסה והלמידה."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"אילו נושאים תורמת האנתרופולוגיה לתחום ההתנהגות הארגונית?",o:["רשתות תקשורת פורמליות ובלתי פורמליות","רציונליות, יתרון יחסי וטעמים","תרבות ארגונית ומחקרים בין-תרבותיים","קבוצות, מנהיגות ועמדות במקום העבודה"],c:2,e:"האנתרופולוגיה תורמת את התרבות הארגונית ואת המחקרים הבין-תרבותיים. הסוציולוגיה והפסיכולוגיה החברתית תורמות את הקבוצות והמנהיגות, והתקשורת את הרשתות בארגונים."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"ראש אגף מציג בפני ההנהלה \"מרשם\" מעשי — מה לעשות כדי להימנע ממצב לא רצוי ולהיות מנהל טוב יותר. באיזה סוג תיאוריה מדובר?",o:["תיאוריה ארגונית — בעלת פונקציה תיאורית וניבויית","תיאוריה מצבית — בעלת פונקציה אבחונית","תיאוריה נורמטיבית — בעלת פונקציה ערכית","תיאוריה ניהולית — בעלת פונקציה יישומית"],c:3,e:"תיאוריה ניהולית מספקת \"מרשמים\" יישומיים לגבי מה לעשות כדי להשפיע, להשיג תוצאה מסוימת, להימנע ממצב לא רצוי ולהיות מנהל טוב יותר — פונקציה יישומית ולא תיאורית."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"מהי, לפי הסיכום, המשמעות של \"גישות ניהוליות\"?",o:["צורת מחשבה, כלים ושיטות לניהול ארגונים למקסימום יעילות ואפקטיביות","אוסף החוקים והתקנות המחייבים את הארגון מכוח הרגולציה, הדין וההסכמים","מערך התפקידים והדרגות שמגדיר את ההיררכיה הפורמלית בארגון","סדרת התכונות המולדות שמאפיינות מנהלים מצליחים בכל מצב"],c:0,e:"גישות ניהוליות עונות על השאלה \"איך לנהל\" — צורת מחשבה, כלים ושיטות לניהול ארגונים, מתוך מטרה להגיע למקסימום יעילות ואפקטיביות, ומתוך סיוע למנהל להתמודד עם אי-ודאות."},
{t:"מבוא והתנהגות ארגונית",s:"סיכום",q:"אילו שלוש קבוצות מרכזיות מתארות את התפתחות הגישות הניהוליות לאורך הזמן?",o:["גישות אוטוקרטיות, גישות ייעוציות וגישות קבוצתיות","גישות מכניות-רציונליות, גישות חברתיות/אורגניות וגישות מודרניות","גישות תכונתיות, גישות התנהגותיות, גישות מצביות וגישות כריזמטיות","גישות תוכן, גישות תהליך וגישות מוטיבציה פנימית"],c:1,e:"התפתחות הגישות הניהוליות: גישות מכניות-רציונליות (פיול, טיילור, בירוקרטיה, X), גישות חברתיות/אורגניות (האות'ורן, יחסי אנוש, Y) וגישות מודרניות (TQM, הינדוס מחדש, מערכות ותלות מצב)."}
];

/* ===================== 2. גישות מכניות-רציונליות ===================== */
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"מהם עקרונות המנהל לפי המודל של פיול?",o:["תשומות, עיבודים, תפוקות, ייצוא ומשוב","גיוס, מיון, הכשרה, תגמול ופיתוח","תכנון, ארגון, תיאום, שליטה ובקרה בארגון","חזון, השראה, אתגור, חניכה והעצמה"],c:2,e:"המודל של פיול מגדיר את עקרונות המנהל: תכנון, ארגון, תיאום, שליטה ובקרה. זהו אחד המודלים הקלאסיים בגישה המכנית-רציונלית."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"כיצד רואה גישת הניהול המדעי של טיילור את הארגון ואת העובדים שבו?",o:["כישות חיה ומתפתחת, שהעובדים בה הם יצורים מורכבים ורב-ממדיים","כרשת של יחסים חברתיים בלתי פורמליים שקובעים את נורמות התפוקה","כמערכת פתוחה הנמצאת בקשרי גומלין מתמידים עם סביבתה החיצונית","כמכונה חברתית משומנת, שהעובדים בה הם רכיבים שיש לתאם ביניהם"],c:3,e:"הניהול המדעי הוא גישה נורמטיבית המציגה ארגונים כמכונה חברתית משומנת הפועלת להשיג מטרות מוגדרות. לכן יש להתייחס לעובדים כרכיבים במכונה, ולהשיג תיאום מקסימלי ביניהם. נקודת המוצא רציונלית-מכנית."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"מהי הנחת היסוד של טיילור לגבי אופן ביצוע העבודה?",o:["קיימת \"דרך אחת טובה ביותר\", ועל המנהל למצוא אותה באופן מדעי","הדרך הנכונה נקבעת בקבוצה, ומשתנה לפי נורמות חברתיות","הדרך תלויה במצב, ומשתנה לפי מורכבות המשימה והעובדים","לכל עובד יש דרך משלו, והמנהל צריך לכבד את סגנונו האישי ולא להתערב בו"],c:0,e:"לפי טיילור קיימת \"הדרך הטובה ביותר לבצע את העבודה\" (One Best Way), ועל המנהל למצוא את הדרך הזו באופן מדעי — באמצעות חקר זמן ותנועה."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"מהי תפיסת טיילור לגבי האינטרס של ההנהלה ושל העובדים?",o:["האינטרסים נקבעים על ידי הקבוצה הבלתי פורמלית ולא על ידי הפרט","קיים אינטרס משותף — שני הצדדים רוצים להימנע מקונפליקטים ולהרוויח יותר","קיים ניגוד אינטרסים מובנה — ההנהלה רוצה תפוקה מרבית והעובד רוצה מנוחה ופנאי","האינטרסים אינם ניתנים להשוואה — כל צד פועל בעולם מושגים אחר"],c:1,e:"לפי טיילור קיים אינטרס משותף להנהלה ולעובדים: שני הצדדים מעוניינים להימנע מקונפליקטים ולהרוויח יותר — העובד בתגמול כספי, המעביד בתפוקה וברווחים. בסופו של דבר האינטרסים חופפים."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"כיצד מתאר טיילור את העובד?",o:["פרט אוטונומי המחפש משמעות, שליטה בחייו ושייכות למשהו גדול","יצור חברתי המונע בעיקר מהשתייכות לקבוצה ומהכרה של עמיתיו לעבודה ושל הממונים","אדם כלכלי-רציונלי, שבא לעבודה משיקולים כלכליים ומודע ליכולותיו","יצור מורכב המונע ממכלול של צרכים פיזיים, חברתיים והגשמתיים"],c:2,e:"לפי טיילור העובד הוא אדם כלכלי — רציונלי — הבא לעבודה משיקולים כלכליים. הוא מודע ליכולותיו ולכישוריו ומעוניין למכור אותן במחיר גבוה במינימום מאמץ."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"לפי טיילור, כיצד תגדיל השיטה את הפריון?",o:["באמצעות העשרת התפקיד, הגדלת האוטונומיה ומתן משוב שוטף לעובד","באמצעות התאמת סגנון הניהול לרמת הבשלות המקצועית של כל עובד","באמצעות טיפוח יחסים בינאישיים ולכידות חברתית גבוהה בקבוצת העבודה ובצוות","באמצעות הפרדה בין פונקציית הניהול לפונקציית הביצוע וחלוקת עבודה מפורטת"],c:3,e:"טיילור מגדיל פריון על ידי הפרדה בין פונקציית הניהול לפונקציית הביצוע, חלוקת עבודה מפורטת לפעולות מצומצמות הניתנות ללמידה, מדידת כמות, איכות וזמן לכל פעולה, וקשירת השכר לתפוקה."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"אילו מהבאים הם עקרונות הניהול המדעי של טיילור?",o:["חקר זמן ותנועה, תגמול לפי ביצוע, הסתייעות במומחים ושינוי תקנים לפי מדידה","הצבת יעדים ספציפיים ומדידים, מתן משוב שוטף ושיתוף העובד בקביעת היעד ובלוח הזמנים","הגדלת התפקיד, העשרתו, מתן אוטונומיה ומשוב ישיר על התוצאות","זיהוי המנהיגות הבלתי פורמלית בקבוצה ושימוש בה להנעת העובדים"],c:0,e:"עקרונות הגישה: שימוש בחקר זמן ותנועה לקביעת הדרך האופטימלית לביצוע מטלה, מתן תגמול לעובד לפי ביצוע, הסתייעות במומחים או מנהלי עבודה להדרכה ולפיקוח, ושינוי בסטנדרטי התפוקה על סמך מדידות אובייקטיביות."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"מה משמעות הכינוי \"ניהול מכאניסטי-אינסטרומנטלי\" בהתייחסות לניהול משאבי אנוש?",o:["הניהול מתבסס על נהלים כתובים ועל תיעוד מלא ומסודר של כל החלטה בארגון ובכל דרג","הניהול רואה את האדם בארגון ככלי עבודה, ומודד את תוצריו מול קצב המכונה","הניהול מתאים את עצמו לנסיבות ולמצב שבו נמצאים העובדים והמשימה","הניהול משתף את העובדים בקבלת ההחלטות ומאציל להם סמכויות רחבות"],c:1,e:"\"ניהול מכאניסטי-אינסטרומנטלי\" רואה את האדם בארגון ככלי עבודה או מכונה. המשמעות: מדידת תפוקות העובד כמו מדידת כלי עבודה, ותוצריו נמדדים בהשוואה לקצב המכונה — ובהתאם לכך שיטות התגמול."},
{t:"גישות מכניות-רציונליות",s:"שאלות מבחן",q:"הגישה הטוענת כי יש לפקח על העובדים ולמדוד את תפוקתם היא:",o:["הגישה האורגנית — יחסי אנוש","הגישה הבירוקרטית — הטיפוס האידאלי של וובר","הגישה הטיילוריסטית — גישת הניהול המדעי של טיילור","גישת התלות — קונטינגנציה"],c:2,e:"הגישה הטיילוריסטית — הניהול המדעי — היא הגישה הדוגלת בפיקוח על העובדים ובמדידת תפוקתם. מדידת כמות, איכות וזמן לכל פעולה היא ליבת השיטה."},
{t:"גישות מכניות-רציונליות",s:"שאלות מבחן",q:"פונקציית הערכת הביצועים בארגון נובעת בראש ובראשונה מאיזו גישה?",o:["מגישת יחסי האנוש, הדוגלת בתשומת לב לעובד","מגישת המערכות, הדוגלת במשוב סביבתי","מגישת התלות, הדוגלת בהתאמה למצב","מהגישה הטיילוריסטית, הדוגלת במדידה אובייקטיבית"],c:3,e:"פונקציית הערכת הביצועים נובעת מהגישה הטיילוריסטית — הניהול המדעי — הדוגלת במדידה אובייקטיבית של תפוקות העובד ובקשירת התגמול לביצוע."},
{t:"גישות מכניות-רציונליות",s:"שאלות מבחן",q:"הסרט \"זמנים מודרניים\" של צ'רלי צ'פלין הוא דוגמה לאיזו גישה, ולאיזה סוג מנהיג?",o:["לגישה המכניסטית-רציונלית ולמנהיג ממוקד משימה","לגישת המערכות ולמנהיג מאציל סמכויות","לגישה המצבית ולמנהיג מותאם-מצב","לגישה האורגנית-חברתית ולמנהיג ממוקד אנשים"],c:0,e:"\"זמנים מודרניים\" מדגים את הגישה המכניסטית — את המודל של טיילור, שבו העובד הוא רכיב במכונה — ואת המנהיג ממוקד המשימה."},
{t:"גישות מכניות-רציונליות",s:"שאלות מבחן",q:"מה נכון באשר לגישה המכניסטית?",o:["היא כוללת את גישת התלות, מודל פידלר ומודל הרסי ובלנשארד","היא כוללת את המודל הטיילוריסטי, גישת המכונה, הבירוקרטיה ומודל X","היא כוללת את מחקרי האות'ורן, יחסי אנוש ומודל Y של מקגרגור","היא כוללת את ניהול האיכות הכוללת, את ההינדוס מחדש ואת גישת המערכות"],c:1,e:"הגישה המכניסטית/רציונלית מאגדת תחתיה את גישת הניהול המדעי (טיילור), הגישה המכנית, הגישה הבירוקרטית ואת גישת X/Y בדגש על X."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"במה מתמקד הדיון התיאורטי בגישה המכאנית?",o:["בצרכים הפנימיים של העובד: אוטונומיה, מיומנות ומטרה","ביחסים הבלתי פורמליים ובנורמות שיוצרת לעצמה קבוצת העבודה","ביעילות הארגונית: מבנים, נהלים ומנגנוני פיקוח ובקרה","בהתאמת סגנון המנהיגות לרמת הבשלות של הכפיפים"],c:2,e:"בגישה המכאנית הארגון מדומה למכונה המתוכננת היטב על ידי המנהלים. הדיון התיאורטי מתמקד ביעילות הארגונית על כל היבטיה: מבנים ארגוניים, נהלים והליכים, ומנגנוני פיקוח ובקרה."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"מקס וובר מציע \"טיפוס אידאלי\" של ארגון בירוקרטי. באילו יתרונות הוא ניחן, וכיצד הם מושגים?",o:["בגמישות, ביצירתיות, בחדשנות ובמהירות תגובה — באמצעות האצלת סמכויות רחבה לכל דרג בארגון","בלכידות, מוראל גבוה, נאמנות ושביעות רצון — באמצעות טיפוח קשרים חברתיים בקבוצה","בהתאמה לשוק, מיקוד בלקוח ושיפור מתמיד — באמצעות מדידות מדויקות ותקנים","בכניות, דייקנות, אובייקטיביות וחד-משמעיות — באמצעות התאמה רציונלית בין מטרות ואמצעים"],c:3,e:"וובר מציע טיפוס אידאלי של ארגון בירוקרטי בעל עליונות כנית, דייקנות, אובייקטיביות וחד-משמעיות — המושגות על ידי התאמה רציונלית בין מטרות ואמצעים ושימוש בטכנולוגיה מתאימה."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"אילו מהבאים הם עקרונות של הארגון הבירוקרטי לפי וובר?",o:["חוקים ותקנות, היררכיה וסמכויות, תקשורת כתובה ותיעוד מלא","גיוון מיומנויות, זהות המשימה, אוטונומיה ומשוב על הביצוע","ישיבות סדירות, בקרת חריגים אקטיבית ומעקב צמוד אחר טעויות","נורמות קבוצתיות, מנהיגות בלתי פורמלית ולכידות חברתית גבוהה"],c:0,e:"הארגון הבירוקרטי (בירו=משרד, קרטיה=תורה) מבוסס על חוקים ותקנות, התמחות וחלוקת עבודה, היררכיה וסמכויות, כוח עבודה מוכשר טכנית, משרות מובחנות, תקשורת כתובה ותיעוד, והפרדה בין רכוש הפרט לרכוש הארגון."},
{t:"גישות מכניות-רציונליות",s:"שאלות מבחן",q:"הגישה הטוענת שיש לתגמל עובדים על פי מומחיות היא:",o:["גישת המערכות הפתוחות","הגישה הבירוקרטית של וובר","הגישה הטיילוריסטית","גישת יחסי האנוש"],c:1,e:"תגמול בהתאם למומחיות הוא אחד מעקרונות הארגון הבירוקרטי של וובר, לצד גיוס וקידום על פי יכולות וידע העובד וקבלה כתוצר של ידע."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"לפי וובר, על בסיס מה נעשים הגיוס והקידום בארגון הבירוקרטי?",o:["על פי המלצות חברתיות ורשת קשרים בארגון","על פי ותק בארגון ועל פי סדר ההצטרפות לתפקיד","על פי יכולות וידע העובד, וקבלה כתוצר של ידע","על פי נאמנות אישית לממונה ולהנהלה הבכירה"],c:2,e:"בארגון הבירוקרטי הגיוס והקידום נעשים על פי יכולות וידע העובד, והקבלה לתפקיד היא תוצר של ידע. זהו ביטוי לעיקרון האובייקטיביות שבבסיס הגישה."},
{t:"גישות מכניות-רציונליות",s:"שאלות מבחן",q:"מהו אחד החסרונות הבולטים של הגישה הבירוקרטית?",o:["הסתמכות יתר על הקשרים הבלתי פורמליים בקבוצה","קושי לשמור על עקביות ואחידות בין בעלי תפקידים","התעלמות מוחלטת מהצורך במדידת תפוקות ובבקרה","היצמדות לנהלים עד שהם הופכים מאמצעי למטרה בפני עצמה"],c:3,e:"בין חסרונות הגישה הבירוקרטית: היצמדות לנהלים עד שהם הופכים מאמצעי למטרה בפני עצמה — הנוהל מפסיק לשרת את מטרת הארגון והופך לתכלית."},
{t:"גישות מכניות-רציונליות",s:"שאלות מבחן",q:"מה משותף לגישה של טיילור ולגישה הבירוקרטית של וובר?",o:["שתיהן נותנות סט של פעולות שאם נבצע אותן ננהל נכון","שתיהן טוענות שסגנון הניהול חייב להשתנות לפי המצב","שתיהן מדגישות את השפעת הסביבה החיצונית על הארגון","שתיהן רואות בעובד יצור חברתי המונע מהשתייכות לקבוצה"],c:0,e:"המשותף לטיילור ולבירוקרטיה: שתיהן גישות נורמטיביות הנותנות סט של פעולות ועקרונות שאם נבצע אותם ננהל נכון — \"מרשם\" אוניברסלי לניהול תקין."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"מהי משמעות ההפרדה בין רכוש הפרט לרכוש הארגון בעקרונות וובר?",o:["היא מבטיחה שהעובד יזוהה עם מטרות הארגון ויפנים אותן כשלו","היא מבטיחה שההחלטות יתקבלו על בסיס אובייקטיבי ולא על בסיס אינטרס אישי","היא מבטיחה שהעובד יקבל תגמול ההולם את מומחיותו ואת תרומתו הכוללת לארגון ולמטרותיו","היא מבטיחה שהתקשורת בארגון תהיה כתובה ומתועדת בכל הדרגים"],c:1,e:"ההפרדה בין רכוש הפרט לרכוש הארגון היא אחד מתשעת עקרונות הארגון הבירוקרטי, ותכליתה לשמר את האובייקטיביות — הליבה של הטיפוס האידאלי שוובר מתאר."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"מנהל עבודה מפרק את התפקיד לסדרה של פעולות קצרות, מודד לכל פעולה כמות, איכות וזמן, וקושר את השכר לתפוקה. באיזו גישה הוא נוקט?",o:["בגישת התלות של קונטינגנציה","בגישה הבירוקרטית של וובר","בניהול המדעי של טיילור","בגישת יחסי האנוש של מאיו"],c:2,e:"זהו יישום מובהק של הניהול המדעי: חלוקת עבודה מפורטת לפעולות מצומצמות הניתנות ללמידה, מדידת כמות, איכות וזמן לכל פעולה, וקשירת השכר לתפוקה משום שהאדם נתפס כיצור רציונלי."},
{t:"גישות מכניות-רציונליות",s:"סיכום",q:"מדוע מכונה גישת הניהול המדעי \"גישה נורמטיבית\"?",o:["משום שהיא נשענת על הנורמות החברתיות שיוצרת לעצמה קבוצת העבודה הבלתי פורמלית","משום שהיא משתנה מארגון לארגון בהתאם לתרבות ולנסיבות הפעולה","משום שהיא מתארת מה קורה בפועל בארגונים ואינה מנחה מה לעשות","משום שהיא קובעת מהי הדרך הנכונה לנהל ומחייבת את המנהל לפעול לפיה"],c:3,e:"הגישה נורמטיבית משום שהיא קובעת מהי הדרך הנכונה — קיימת \"דרך אחת טובה ביותר\" שעל המנהל למצוא באופן מדעי ולפעול לפיה. זו הנחיה, לא רק תיאור."}
]);

/* ===================== 3. גישות אורגניות-חברתיות ===================== */
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"מה בדקו מחקרי האות'ורן, והיכן נערכו?",o:["את השפעת תנאי העבודה החומריים על הפריון, במפעל האות'ורן בשיקאגו","את השפעת סגנון המנהיגות על ביצועי הקבוצה, באוניברסיטת מדינת אוהיו","את השפעת התגמול הכספי על התפוקה, במפעלי פורד בדטרויט","את השפעת המבנה הארגוני על היעילות, באוניברסיטת מישיגן"],c:0,e:"מחקרי האות'ורן (1927-1929) היו סדרת מחקרים ותצפיות במפעל האות'ורן של \"חברת החשמל המערבית לציוד חשמלי\" בשיקאגו. הם בדקו את השפעתם של תנאי עבודה והעסקה חומריים — תאורה, זמני מנוחה וכדומה — על הפריון."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"מה הייתה הנחת המוצא של חוקרי האות'ורן לפני תחילת הניסויים?",o:["שהפריון נקבע על ידי נורמות חברתיות של הקבוצה ולא על ידי תנאים","שהחמרת תנאי העבודה תוריד את התפוקה ושיפורם יעלה אותה בחזרה","שתשומת הלב לעובדים היא המשתנה המרכזי המשפיע על הפריון","שסגנון הפיקוח של מנהל העבודה יקבע את רמת התפוקה בפועל"],c:1,e:"הנחת המחקר הייתה שככל שיחמירו את תנאי העבודה כך תרד התפוקה, וככל שישפרו אותם כך תעלה. הממצאים הפתיעו את החוקרים והפריכו את ההנחה."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"מה גילו חוקרי האות'ורן, להפתעתם, לגבי הקשר בין תנאי העבודה לפריון?",o:["שהתפוקה ירדה בכל פעם ששונו התנאים, בשל ההפרעה לשגרה","שהתפוקה נותרה קבועה לחלוטין בכל אחד משלבי הניסוי","שהתפוקה עלתה וההיעדרויות ירדו ללא קשר לשינויים בתנאי העבודה","שהתפוקה עלתה רק כאשר שופרו התנאים הפיזיים, בהתאם להנחת המחקר המקורית"],c:2,e:"להפתעת החוקרים, המחקרים הוכיחו כי ללא קשר לשינויים בתנאי העבודה הייתה עלייה בפריון וירידה בהיעדרויות. הטבת התנאים הפיזיים אינה ערובה לעליית הפריון."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"אילו נורמות יצרה קבוצת העבודה במחקרי האות'ורן?",o:["נורמות שהותירו כל עובד חופשי לקבוע לעצמו את קצב עבודתו","נורמות שחייבו את כל חברי הקבוצה לעמוד ביעדי ההנהלה במדויק ובזמן","נורמות שעודדו את המהירים ביותר להוביל ולהגדיל את התפוקה","נורמות שלא אפשרו לאיטיים להתעצל, אך גם לא עודדו את המהירים מדי"],c:3,e:"הקבוצה יצרה נורמות משלה: היא לא אפשרה לעובדים איטיים מדי להתעצל, אך גם לא עודדה עובדים שקצב עבודתם מהיר מדי. התפוקה הוגבלה למה שנתפס בעיני הקבוצה כתפוקה הולמת — בלי קשר למדיניות ההנהלה."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"מה גילו התצפיות באות'ורן לגבי המבנה החברתי של קבוצת העבודה?",o:["שנוצרו תת-קבוצות ומנהיגים בלתי פורמליים, ושהנאמנות לקבוצה עלתה על זו להנהלה","שהעובדים פעלו כפרטים נפרדים ולא נוצרה ביניהם לכידות חברתית","שהמנהיגות הפורמלית הצליחה לשלוט במלואה בנורמות הקבוצתיות","שהמבנה הבלתי פורמלי של הקבוצה חפף במדויק את המבנה הפורמלי ואת נורמות העבודה של המפעל"],c:0,e:"התצפיות גילו תת-קבוצות, מנהיגים בלתי פורמליים ומבנה חברתי ברור של קבוצה מלוכדת, שחבריה גילו נאמנות רבה יותר לקבוצה מאשר להנהלה. המבנה הבלתי פורמלי לא חפף את הפורמלי."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"מהן המסקנות המרכזיות של מחקרי האות'ורן לגבי קביעת רמות הביצוע?",o:["רמות הביצוע נקבעות על ידי מידת הפיקוח הישיר של מנהל העבודה","רמות הביצוע נקבעות על ידי נורמות חברתיות ולא על ידי יכולות גופניות","רמות הביצוע נקבעות על ידי היכולת הפיזית של העובד ועל ידי קצב המכונה","רמות הביצוע נקבעות על ידי גובה התגמול הכספי שמציעה ההנהלה"],c:1,e:"מסקנות המחקר: רמות הביצוע נקבעות על ידי נורמות חברתיות ולא על ידי יכולות גופניות; תגמולים לא כספיים וסנקציות משפיעים על ביצועי העובדים; ועל המנהלים לזהות את ההתנהגות הקבוצתית ולפעול בהתאם."},
{t:"גישות אורגניות-חברתיות",s:"שאלות מבחן",q:"מהו אפקט ההות'ורן?",o:["תגמול חיצוני מותנה הופך מטלה מעניינת למשעממת ומוריד מוטיבציה","ציפייה חיובית של מנהל כלפי עובד מובילה לשיפור ניכר בביצועי העובד בפועל","ידיעת המשתתפים שצופים בהם ותשומת הלב שהם מקבלים מובילה להגברת התפוקה","הטבת תנאי העבודה הפיזיים מובילה בהכרח לעלייה מתמשכת בפריון"],c:2,e:"אפקט הות'ורן: כשהמשתתפים במחקר מודעים לצפייה בהם, עשויה התנהגותם להשתנות — גם אם אינם יודעים את פרטי המחקר — רק בשל תשומת הלב שהם זוכים לה והשינויים בסביבת עבודתם."},
{t:"גישות אורגניות-חברתיות",s:"שאלות מבחן",q:"מה נכון לגבי תרומתם של מחקרי האות'ורן להתפתחות התיאוריה הניהולית?",o:["הם הובילו לגישת הניהול המדעי של טיילור","הם הובילו לגישה הבירוקרטית של וובר","הם הובילו לתיאוריית התכונות של קרלייל","הם הובילו לגישת יחסי האנוש של אלטון מאיו"],c:3,e:"מחקרי האות'ורן הובילו לגישת יחסי האנוש של מאיו — לתפיסה שהעובד הוא אדם ולא מכונה, ושליחסים הבינאישיים בקבוצה יש השפעה על יעילות ואפקטיביות העבודה."},
{t:"גישות אורגניות-חברתיות",s:"שאלות מבחן",q:"איזו גישה מרכזת תחתיה את גישת יחסי האנוש של מאיו, את מחקרי האות'ורן ואת גישת Y של מקגרגור?",o:["הגישה האורגנית-חברתית של הארגון","גישת המערכות הפתוחות","הגישה המצבית תלוית-הנסיבות","הגישה המכניסטית-רציונלית"],c:0,e:"הגישה האורגנית/חברתית מאגדת את מחקרי האות'ורן, את גישת יחסי האנוש ואת גישת X/Y בדגש על Y. הגישה המכניסטית מאגדת את טיילור, המכונה, הבירוקרטיה ואת דגש X."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"כיצד רואה גישת יחסי האנוש של מאיו את העובד?",o:["כרכיב במכונה ארגונית משומנת שיש לתאם בינו לבין יתר הרכיבים במערכת","כאדם ולא כמכונה — יצור מורכב שיש לקבוע לו תקנים אינדיבידואליים","כיצור רציונלי שבא לעבודה משיקולים כלכליים בלבד","ככלי עבודה שיש למדוד את תוצריו מול קצב המכונה"],c:1,e:"גישת יחסי האנוש רואה את העובד כאדם ולא כמכונה, קובעת תקנים אינדיבידואליים ולא כלליים וכפויים, ורואה בעובד יצור מורכב. זוהי הגישה ההומנית."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"מהי תפיסת הניהול לפי גישת יחסי האנוש?",o:["ניהול פירושו התאמה רציונלית בין המטרות לאמצעים באמצעות נהלים","ניהול פירושו איתור סטיות וחריגות ותיקונן במהירות המרבית","ניהול פירושו השגת מטרות באמצעות אנשים שיש להתייחס לצרכיהם ולטפח אותם","ניהול פירושו מציאת הדרך המדעית הטובה ביותר לביצוע כל מטלה ומטלה בארגון"],c:2,e:"התפיסה של גישת יחסי האנוש: ניהול פירושו השגת מטרות באמצעות אנשים שיש להתייחס לצרכיהם ולטפח אותם. הדגש הוא על העובדים כקבוצה חברתית, וכל עובד מביא איתו לצד הידע גם צרכים אישיים וחברתיים."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"על מה שמה גישת יחסי האנוש את הדגש, בהשוואה למדידת זמן העבודה שבניהול המדעי?",o:["על מדידת התפוקה לשעת עבודה ועל קשירת השכר לכמות היחידות שיוצרו בפועל על ידי העובד","על מדידת החריגות מהתקן ועל תיקונן במהירות המרבית האפשרית","על מדידת שביעות הרצון של הלקוח הפנימי והחיצוני של הארגון","על מדידת קצב העבודה ועל הפחתת עייפות אנושית, ולא בהכרח על הגדלת תפוקה"],c:3,e:"הגישה מדגישה הפחתת עייפות אנושית ולאו דווקא הגדלת תפוקה, מדידת קצב העבודה ולא זמן העבודה, והתבוננות במכלול גורמים — מניעים, כישורים ואישיות כמנבאי יעילות."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"מה גורסת גישת יחסי האנוש לגבי תרבות ארגונית?",o:["יש לפתח תרבות ארגונית שבה העובדים שותפים למטרות הארגון ומזדהים איתן","יש לקבע תרבות ארגונית של נהלים כתובים ותיעוד מלא של כל החלטה","יש להימנע מתרבות ארגונית אחידה ולאפשר לכל יחידה נורמות משלה","יש לבנות תרבות ארגונית המבוססת על תגמול כספי ועל סנקציות ברורות ומוגדרות"],c:0,e:"גישת יחסי האנוש דוגלת בפיתוח תרבות ארגונית — העובדים צריכים להיות שותפים למטרות הארגון ולהזדהות איתן, לצד הדגש על הצרכים האישיים והחברתיים שכל עובד מביא."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"אילו הנחות מאפיינות את תיאוריה X של מקגרגור?",o:["אנשים פעילים מטבעם, שואפים לעצמאות, להגשמה עצמית, לאחריות ולהתפתחות","אנשים עצלים מטבעם, תלויים במנהיגים, זקוקים לפיקוח ואוהבים שגרה","אנשים מחפשים משמעות, מתעייפים משגרה ונהנים מחוויות חדשות","אנשים מכוונים את התנהגותם ויכולים לדאוג לשיפור ביצועיהם"],c:1,e:"תיאוריה X: אנשים עצלים מטבעם, עובדים בעיקר בגלל סטטוס וכסף, תלויים במנהיגים, לא רוצים לחשוב בעצמם, זקוקים להדרכה ולפיקוח, דואגים לצורכיהם המיידיים, אוהבים שגרה ונשארים סטטיים."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"לפי תיאוריה X, ממה נובעת היצירתיות של העובד?",o:["מסקרנות ומעניין פנימי בעבודה","מרצון להשיג מטרות אישיות וחברתיות","מפחד מפיטורין או מהורדה בדרגה בארגון","משאיפה למימוש עצמי ולהגשמה"],c:2,e:"לפי תיאוריה X, היצירתיות נובעת מפחד מפיטורין או מהורדה בדרגה. לפי תיאוריה Y, לעומת זאת, היצירתיות נובעת מרצון להשיג מטרות אישיות וחברתיות."},
{t:"גישות אורגניות-חברתיות",s:"שאלות מבחן",q:"לפי גישת Y של מקגרגור, מה מאפיין את תפיסת המנהל?",o:["המנהל מאמין שהעובדים זקוקים לפיקוח הדוק ולהוראות ביצוע מפורטות","המנהל מאמין שרק תגמול כספי מניע את העובדים לפעולה","המנהל מאמין שיש לקבוע לעובדים תקנים אחידים וכפויים","המנהל מאמין שהעובדים מסוגלים, ולכן ניתן להאציל להם סמכויות"],c:3,e:"לפי גישת Y, אנשים אינם פסיביים מטבעם אלא הפכו לכאלה כתוצאה מהיחס לו זכו; יש להם פוטנציאל להתפתח ולקחת אחריות. לכן המנהל מאמין שהעובדים מסוגלים וניתן להאציל להם סמכויות — התוצאה היא ניהול משתף ומתייחס."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"לאיזה סוג ניהול מובילה, לפי מקגרגור, תפיסת מנהלים מסוג X?",o:["ניהול סמכותי ופיקוח הדוק וצמוד","ניהול מאציל ומעצים","ניהול מותאם למצב ולבשלות","ניהול משתף, מאציל ומתייחס"],c:0,e:"תפיסת מנהלים מסוג X — אנשים עצלים, חסרי מוטיבציה, לא רוצים אחריות — מובילה לניהול סמכותי ולפיקוח הדוק. תפיסת Y מובילה לניהול משתף ומתייחס."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"במה התמקד מקגרגור (1960) כגורם ממריץ, ומה הראו התצפיות שנערכו באותה תקופה?",o:["בהתאמת המשימה ליכולת העובד — התצפיות הראו שהתאמה נכונה מייתרת כל תמריץ","באקלים הרגשי של מקום העבודה — התצפיות הראו שכסף, תנאים וענישה אינם תמריץ מתמיד","בגובה השכר ובתנאי ההעסקה — התצפיות הראו שהם התמריץ החזק והיציב ביותר לאורך כל התקופה","במבנה הארגוני ובחלוקת הסמכויות — התצפיות הראו שהם קובעים את רמת המוטיבציה"],c:1,e:"מקגרגור התמקד באקלים הרגשי של מקום העבודה כגורם ממריץ. תצפיות שנערכו באותה תקופה הצביעו שלא כסף, לא תנאי עבודה ולא ענישה שימשו כתמריץ מתמיד, וטען שגישות לעובדים והיחס הנובע מהן משפיעים על הביצועים."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"מדוע מתוארת המוטיבציה של העובד אצל מקגרגור כ\"נבואה המגשימה את עצמה\"?",o:["משום שהעובד מחשב מראש את כדאיות המאמץ ופועל לפי תוצאת החישוב","משום שהארגון מתגמל את מי שכבר מצליח, ובכך מגדיל את פערי הביצוע","משום שתפיסת המנהל את העובד מעצבת את היחס אליו, והיחס מעצב את התנהגות העובד בפועל","משום שהעובד יודע מראש מהי רמת התפוקה שהקבוצה שלו תאשר, ומכוון את עצמו אליה מלכתחילה"],c:2,e:"אצל מקגרגור המוטיבציה של העובד היא פונקציה של תפיסות המנהל — תהליך של נבואה המגשימה עצמה. מנהל X מפקח ומצמצם ובכך יוצר עובד פסיבי; מנהל Y מאציל ומעצים ובכך יוצר עובד אחראי."},
{t:"גישות אורגניות-חברתיות",s:"שאלות מבחן",q:"מה מאפיין את הגישה האורגנית ביחס לעובד?",o:["היא מתייחסת לעובד כרכיב במכונה שיש לתאם בינו לבין השאר","היא מתייחסת לעובד רק דרך התפוקה הנמדדת שלו ביחידת זמן","היא מתייחסת לעובד רק דרך הנהלים והחוקים החלים עליו","היא מתייחסת לעובד ולאינטראקציה שלו עם הסביבה החברתית"],c:3,e:"הגישה האורגנית/חברתית מתייחסת לעובד כאדם ולאינטראקציה שלו עם הסביבה החברתית — בניגוד לגישה המכניסטית הרואה בו רכיב במכונה."},
{t:"גישות אורגניות-חברתיות",s:"שאלות מבחן",q:"\"כדאי לזהות את המנהיגות הבלתי פורמלית שהצמיח הצוות ולעשות בה שימוש להנעתו\" — מאילו מחקרים עולה עיקרון ניהולי זה?",o:["ממחקרי האות'ורן במפעל החשמל המערבי","ממחקרי פידלר על התאמת הסגנון לנסיבות","ממחקרי הרלו ודיסי על מוטיבציה פנימית","ממחקרי אוניברסיטת אוהיו על יזום מבנה והתחשבות"],c:0,e:"מחקרי האות'ורן גילו מנהיגים בלתי פורמליים ותת-קבוצות בעלות נורמות משלהן. מכאן העיקרון שעל המנהלים לזהות את ההתנהגות הקבוצתית ואת המנהיגות הבלתי פורמלית ולפעול בהתאם אליה."},
{t:"גישות אורגניות-חברתיות",s:"סיכום",q:"מהי \"חוללות עצמית\" (Self-Efficacy) לפי בנדורה?",o:["תהליך שבו העובד משווה את יחס התגמול-תשומה שלו לזה של עמיתיו לתפקיד","האמונה של האדם ביכולתו לבצע פעולות ולהשיג מטרות בתחום מסוים","תופעה שבה ציפייה חיובית של אדם אחד משפיעה על התנהגותו של האחר","תופעה שבה הקבוצה מגבילה את התפוקה לרמה שנתפסת בעיניה כהולמת"],c:1,e:"חוללות עצמית (Self-Efficacy) של בנדורה היא האמונה של האדם ביכולתו לבצע פעולות מסוימות ולהשיג מטרות בתחום מסוים. תחושת מסוגלות גבוהה תורמת להתמדה, ליוזמה ולהתמודדות עם אתגרים; תחושת מסוגלות נמוכה עלולה להוביל להימנעות ולכישלון. אין לבלבל בינה לבין אפקט פיגמליון, שעניינו ציפיות של אחרים."}
]);

/* ===================== 4. גישות מודרניות, מערכות ותלות ===================== */
{t:"גישות מודרניות ותלות",s:"סיכום",q:"אילו מהבאים הם עקרונות של ניהול איכות כוללת (TQM)?",o:["חוקים ותקנות, היררכיה, תקשורת כתובה ותגמול לפי מומחיות","התאמת סגנון המנהיגות לרמת הבשלות המקצועית והפסיכולוגית","התמקדות בלקוח הפנימי והחיצוני, שיפור מתמיד, מדידות מדויקות והעצמת עובדים","חלוקת עבודה מפורטת, חקר זמן ותנועה ותגמול לפי תפוקה נמדדת ואובייקטיבית"],c:2,e:"עקרונות TQM: התמקדות בלקוח — פנימי וחיצוני, תהליך של שיפור מתמיד, שיפור האיכות של כל מה שעושה הארגון, מדידות מדויקות — מדדים ותקנים — והעצמה."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מיהו \"הלקוח\" שבמרכז גישת ניהול האיכות הכוללת?",o:["בעלי המניות והדירקטוריון שמולם נמדד הארגון","הלקוח החיצוני בלבד — הרוכש את המוצר או השירות","הלקוח הפנימי בלבד — היחידה המקבלת את התוצר בארגון","גם הלקוח הפנימי וגם הלקוח החיצוני של הארגון"],c:3,e:"TQM מתמקדת בלקוח הפנימי והחיצוני כאחד. הלקוח הפנימי הוא היחידה בארגון המקבלת את התוצר של יחידה אחרת, ולכן שרשרת האיכות עוברת בכל הארגון."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מהי השאלה המנחה של גישת ההינדוס מחדש (Re-engineering)?",o:["איך היינו עושים את הדברים אילו התחלנו את הכל מחדש?","איזה סגנון ניהול מתאים למצב ולעובדים שלפנינו?","כיצד נשפר בהדרגה ובאופן מתמיד כל תהליך קיים?","מהי הדרך המדעית הטובה ביותר לבצע כל מטלה בארגון?"],c:0,e:"הינדוס מחדש הוא הגדרה מחדש של הארגון — עיסוקים, מבנה ארגוני ועבודה. \"להפוך הכל ולארגן מחדש\". השאלה המנחה: איך היינו עושים את הדברים אילו התחלנו הכל מחדש?"},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מהי היחידה שעליה חל השינוי בגישת ההינדוס מחדש?",o:["רכיב בודד בתוך המערכת הקיימת, המשופר בהדרגה ובאופן מתמיד","המערכת כולה, ולא רכיב בתוכה — שינוי כולל ולא נקודתי","הפרט העובד בלבד, באמצעות הכשרה ופיתוח מקצועי","סגנון המנהיגות בלבד, באמצעות התאמתו לנסיבות"],c:1,e:"הינדוס מחדש הוא שינוי של המערכת ולא של רכיב בתוכה. הוא מתאים לשינויים סביבתיים, ומחייב מחשבה שונה ואחרת, יצירתיות וגמישות."},
{t:"גישות מודרניות ותלות",s:"שאלות מבחן",q:"לפי גישת ההינדוס מחדש (Reengineering), מה נדרש מהארגון?",o:["על הארגון להתמקד בשיפור מדורג של רכיבים בודדים במערכת בלבד","על הארגון להימנע משינוי כל עוד המערכת מתפקדת כראוי","על הארגון להשתנות כל הזמן ולהתאים עצמו לשינויים בסביבה","על הארגון לשמר את הנהלים הקיימים ולהקפיד על יישומם"],c:2,e:"גישת ההינדוס מחדש מתאימה לשינויים סביבתיים ומחייבת את הארגון להשתנות — \"להפוך הכל ולארגן מחדש\" מתוך מחשבה שונה, יצירתיות וגמישות."},
{t:"גישות מודרניות ותלות",s:"שאלות מבחן",q:"בארגון הפועל כמערכת סגורה מתגלה בעיה בתפקוד. היכן נצפה למצוא את הסיבה לה?",o:["בממשק שבין הארגון לסביבתו — בקשרי הגומלין ביניהם","בשילוב של גורמים פנימיים וחיצוניים במידה שווה","בסביבה החיצונית של הארגון — בשוק, ברגולציה ובמתחרים","בסביבה הפנימית של הארגון — בתוך המערך הארגוני עצמו"],c:3,e:"גישת המערכות הסגורות רואה את הבעיות בארגון כנובעות אך ורק מהמציאות הארגונית. לכן הדיאגנוזה מחפשת את הסיבה בתוך הארגון בלבד, וגם הפרוגנוזה — הפתרון — תהיה בתוך המערך הארגוני."},
{t:"גישות מודרניות ותלות",s:"שאלות מבחן",q:"מהי מערכת פתוחה?",o:["מערכת שמשפיעה על הסביבה שלה והסביבה משפיעה עליה בחזרה","מערכת שכל תהליכיה גלויים ומתועדים בפני כל העובדים","מערכת שאין בה היררכיה ושכל אחד רשאי לקבל בה החלטות","מערכת שאינה מוגבלת בגבולות ברורים או במטרה מוגדרת"],c:0,e:"גישת המערכות הפתוחות רואה את הארגון כנמצא בקשרי גומלין עם סביבתו: מירב הבעיות בארגון נובעות ומושפעות מסביבתו, ומאידך גיסא הארגון משפיע על הנעשה בסביבתו החיצונית."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מהו המודל הפשוט ביותר של מערכת ארגונית פתוחה?",o:["ציפייה ← תכליתיות ← ערכיות, המוכפלות זו בזו לכדי מוטיבציה","תשומות (חיצוניות) ← תהליך (פנימי) ← תפוקות (חיצוניות), ובין לבין משוב","תכנון ← ארגון ← הנהגה ← בקרה, ובין לבין הערכת ביצועים","צורך ← התנהגות ← תגמול ← משוב, בתוך מחזור מוטיבציוני סגור וחוזר על עצמו"],c:1,e:"המודל הפשוט של מערכת ארגונית פתוחה: תשומות (חיצוניות) ← תהליך (פנימי) ← תפוקות (חיצוניות), ובין לבין משוב. מבנה מלא: תשומות ← עיבודים ← תפוקות ← ייצוא לסביבה, עם משוב פנימי וחיצוני."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מדוע התחזקה בתקופה המודרנית התלות בין ארגונים לסביבתם החיצונית?",o:["בשל המעבר לתגמול לפי תפוקה ולמדידה אובייקטיבית","בשל הירידה בחשיבות היחסים הבינאישיים בקבוצות עבודה","בשל תהליכי גלובליזציה — כלכלית, חינוכית וערכית","בשל התרחבות הבירוקרטיה והנהלים הכתובים בארגונים"],c:2,e:"התלות בין הארגונים לסביבתם החיצונית התחזקה בתקופה המודרנית בשל תהליכי הגלובליזציה — הכלכלית, החינוכית, הערכית וכדומה."},
{t:"גישות מודרניות ותלות",s:"שאלות מבחן",q:"מערכת הערכת הביצועים בארגון היא, מבחינת גישת המערכות:",o:["סוג של מערכת סגורה","מנגנון חיצוני לארגון","תת-מערכת ניטרלית","סוג של מערכת פתוחה בסביבתה"],c:3,e:"מערכת הערכת הביצועים היא סוג של מערכת פתוחה — היא מקבלת תשומות מהסביבה, מעבדת אותן, מייצרת תפוקות ומחזירה משוב פנימי וחיצוני."},
{t:"גישות מודרניות ותלות",s:"מחוץ להיקף",q:"לפי פרידמן, לפי אילו ממדים יש לנתח את הסביבה החיצונית של ארגון הפועל כמערכת פתוחה?",o:["סביבה כלכלית, חברתית ומוסדית — לרבות מערכת התחיקה","סביבה טכנולוגית, פיזית ואקלימית — לרבות מגבלות התשתית","סביבה תחרותית, שיווקית ומותגית — לרבות נתח השוק","סביבה פנים-ארגונית, מבנית ותרבותית — לרבות הנהלים"],c:0,e:"לפי פרידמן, ניתוח הסביבה החיצונית של ארגון כמערכת פתוחה נעשה לפי הסביבה הכלכלית, החברתית והמוסדית — לרבות מערכת התחיקה."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מה גורסת גישת התלות (Contingency) לגבי ניהול והבנה של ארגונים?",o:["יש לקבוע מראש את סגנון הניהול לפי אישיותו של המנהל ולדבוק בו","יש לקחת בחשבון גורמים מצביים ומשתנים המשפיעים זה על זה ועל הפעילות הארגונית","יש לאמץ את הדרך הטובה ביותר שנמצאה באופן מדעי ולהחיל אותה בכל מצב ובכל ארגון באשר הוא","יש להתמקד אך ורק בסביבה הפנימית של הארגון בעת אבחון בעיות ופתרונן"],c:1,e:"לפי גישת התלות, בניהול ובהבנה של ארגונים יש לקחת בחשבון גורמים מצביים ומשתנים שונים המשפיעים זה על זה ועל הפעילות הארגונית בכללה — משתנים תלויים ובלתי תלויים, ברמת המיקרו וברמת המאקרו."},
{t:"גישות מודרניות ותלות",s:"שאלות מבחן",q:"מה הכי נכון באשר לגישת התלויות?",o:["ישנה תלות בין אישיות המנהל לבין רמת הפריון של עובדיו","ישנה תלות בין גודל הארגון לבין מידת הבירוקרטיזציה שלו","ישנה תלות בין נתוני המצב לבין הגישה הניהולית האפקטיבית","ישנה גישה ניהולית אחת אפקטיבית שנכונה לכל מצב ולכל ארגון"],c:2,e:"גישת התלויות גורסת שקיימת תלות בין נתוני המצב לבין הגישה הניהולית האפקטיבית — אין דרך אחת נכונה לנהל, זה תלוי מצב."},
{t:"גישות מודרניות ותלות",s:"שאלות מבחן",q:"כיצד מנוסחת בקצרה המסקנה המרכזית של גישת התלות?",o:["\"הסביבה החיצונית אינה משפיעה על הנעשה בארגון\"","\"סגנון הניהול נקבע על ידי אישיות המנהל בלבד\"","\"תמיד יש דרך אחת נכונה — ועל המנהל למצוא אותה\"","\"אין דרך אחת נכונה לנהל — זה תלוי מצב\""],c:3,e:"המסקנה המרכזית של גישת התלות: אין דרך אחת נכונה לנהל — זה תלוי מצב. זוהי הגישה המשלבת, שבאה אחרי הגישות הקלאסיות, האורגניות והמודרניות."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"באילו רמות ניתוח באים לידי ביטוי המשתנים של גישת התלות?",o:["הן ברמת המיקרו והן ברמת המאקרו","ברמה הבין-ארגונית בלבד — מול ארגונים אחרים","ברמת המיקרו בלבד — ברמת הפרט העובד","ברמת המאקרו בלבד — ברמת הארגון כולו"],c:0,e:"לפי גישת התלות, המשתנים המצביים באים לידי ביטוי הן ברמת המיקרו (הפרט) והן ברמת המאקרו (הארגון) — ולכן היא נחשבת לגישה המשלבת."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מהו הסדר הכרונולוגי-תיאורטי של התפתחות הגישות הניהוליות?",o:["גישות אורגניות ← גישות קלאסיות ← גישות מערכתיות ← גישות תלות","גישות קלאסיות-מכניות ← גישות אורגניות-חברתיות ← גישות מודרניות ← גישת התלות","גישות מודרניות ← גישות מערכתיות ← גישות קלאסיות ← גישות אורגניות","גישות מצביות ← גישות התנהגותיות ← גישות תכונתיות ← גישות מודרניות ומשלבות תלויות-מצב"],c:1,e:"ההתפתחות: גישות קלאסיות מכניות/רציונליות (פיול, טיילור, בירוקרטיה, X) ← גישות אורגניות/חברתיות (האות'ורן, יחסי אנוש) ← גישות מודרניות (TQM, הינדוס מחדש) ← גישת המערכות ← הגישה המשלבת תלוית-מצב."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"בגישות המודרניות חל שינוי במיקוד. מהו?",o:["מיקוד בהיררכיה ובנהלים הכתובים של הארגון הבירוקרטי הקלאסי","מיקוד בתכונות המולדות של המנהיג ובכריזמה שלו","מיקוד בעובד כלקוח — ניהול איכות כוללת והינדוס מחדש","מיקוד במכונה ובתפוקה הנמדדת של כל פעולה ופעולה"],c:2,e:"הגישות המודרניות מתאפיינות במיקוד העובד כלקוח: ניהול איכות כוללת (TQM) והינדוס מחדש. אליהן מצטרפות גישת המערכות והגישה המשלבת תלוית-המצב."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מהם המונחים המקצועיים לתהליך אבחון הבעיה ולתהליך קביעת הפתרון בגישת המערכות?",o:["תשומות ותפוקות","סינתזה והערכה","אנליזה ואינטגרציה מערכתית","דיאגנוזה ופרוגנוזה ארגונית"],c:3,e:"בגישת המערכות הסגורות מחפשים את הסיבה לבעיה בתוך הארגון (דיאגנוזה), ולכן גם הפתרון (פרוגנוזה) יימצא בתוך המערך הארגוני עצמו."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מהי המשמעות של מדידות מדויקות — מדדים ותקנים — בגישת ה-TQM?",o:["הן מאפשרות לכמת את האיכות ולנהל על בסיסה תהליך של שיפור מתמיד","הן מאפשרות לקבוע לכל עובד תקן תפוקה אישי ולקשור אליו ישירות את שכרו","הן מאפשרות לאתר חריגות ולתקן אותן במהירות המרבית האפשרית","הן מאפשרות להשוות את הארגון למתחרים ולקבוע את מיקומו בשוק"],c:0,e:"מדידות מדויקות — מדדים ותקנים — הן אחד מעקרונות TQM, לצד ההתמקדות בלקוח, השיפור המתמיד, שיפור האיכות של כל מה שעושה הארגון וההעצמה."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מנכ\"ל טוען: \"אין טעם לחפש את הפתרון בתוך המחלקה — מה שקורה כאן נגזר מהשוק, מהרגולציה ומהמתחרים\". באיזו תפיסה מערכתית הוא מחזיק?",o:["בגישת המערכות הסגורות","בגישת המערכות הפתוחות","בגישה הבירוקרטית של וובר","בגישת הניהול המדעי של טיילור"],c:1,e:"גישת המערכות הפתוחות רואה את הארגון בקשרי גומלין עם סביבתו, ולכן מירב הבעיות בארגון נובעות ומושפעות מהסביבה החיצונית — ובמקביל הארגון משפיע עליה."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מה כולל מבנה המערכת הארגונית המלא, מעבר לתשומות, עיבודים ותפוקות?",o:["חקר זמן ותנועה ותקני תפוקה אובייקטיביים","נורמות קבוצתיות ומנהיגות בלתי פורמלית","ייצוא לסביבה, וכן משוב פנימי ומשוב חיצוני","היררכיה, סמכויות, נהלים ותקשורת כתובה מתועדת"],c:2,e:"מבנה המערכת: תשומות ← עיבודים ← תפוקות ← ייצוא לסביבה, כאשר בין השלבים פועלים משוב פנימי ומשוב חיצוני."},
{t:"גישות מודרניות ותלות",s:"סיכום",q:"מה מחייבת גישת ההינדוס מחדש מן המנהלים, מעבר לשינוי המבני עצמו?",o:["הקפדה על נהלים כתובים ועל תיעוד מלא","מדידה שיטתית של זמן ותנועה בכל מטלה","פיקוח צמוד על ביצועי כל עובד בנפרד","מחשבה שונה ואחרת, יצירתיות וגמישות"],c:3,e:"ההינדוס מחדש מתאים לשינויים סביבתיים והוא שינוי של המערכת ולא של רכיב בתוכה — ולכן הוא מחייב מחשבה שונה ואחרת, יצירתיות וגמישות."}
]);

/* ===================== 5. אדיג'ס — סגנונות PAEI ===================== */
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהי הגדרת הניהול של אדיג'ס?",o:["לקבל החלטות טובות וליישם אותן ביעילות, לטווח הקצר ולטווח הארוך","לתכנן, לארגן, להנהיג ולבקר את האנשים ואת המשימות המוטלות עליהם בארגון","להשפיע על קבוצה לעבר השגת מטרות משותפות לאורך זמן","למצוא באופן מדעי את הדרך הטובה ביותר לביצוע כל מטלה"],c:0,e:"לפי אדיג'ס, לנהל פירושו לקבל החלטות טובות וליישם אותן ביעילות — אפקטיביות ויעילות לטווח קצר ולטווח ארוך. זהו \"ניהול על פי השכל הישר\"."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהם ארבעת ה\"ויטמינים\" של אדיג'ס, ומה מייצג כל אחד מהם?",o:["P לחזות, A לאבחן, E להעריך, I ליישם את ההחלטה שהתקבלה בהנהלה","P להשיג תוצאות, A לארגן ולייעל, E ליזום, I לטפח עבודת צוות","P לתכנן, A לארגן, E להנהיג, I לבקר את ביצועי הכפיפים","P לפקח, A למדוד, E לתגמל, I להעניש על חריגה מהתקן"],c:1,e:"ארבעת הוויטמינים PAEI: להשיג תוצאות (P — הגוף), לארגן ולייעל (A — המוח), ליזום ולזהות את צרכי העתיד (E — הרגשות), ולטפח עבודת צוות ושיתוף פעולה (I — הרוח)."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"אילו ארבעה סגנונות אישיות בעבודה זיהה אדיג'ס?",o:["המנחה, התומך, ההישגי והמשתף בהחלטות הקבוצה","האוטוקרט, הייעוצי, הקבוצתי והמאציל סמכויות","האדמיניסטרטור, האינטגרטור, היצרן והיזם","הריכוזי, הדמוקרטי, הלֶסֶה-פֵייר והמעצב"],c:2,e:"אדיג'ס זיהה ארבעה סגנונות אישיות בעבודה המאפיינים מנהלים שונים: האדמיניסטרטור (A), האינטגרטור (I), היצרן (P) והיזם (E)."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהו הכינוי שנותן אדיג'ס ליצרן התוצאות (P), ומה מאפיין אותו?",o:["\"מתכלל\" — חותר לקונצנזוס ומעריך הרמוניה חברתית בצוות","\"איש הספר\" — פועל רק לפי הנהלים ועוסק בביעור חריגות","\"הפירומן\" — איש של רעיונות וחזון האוהב אווירת בהילות","\"זאב בודד\" — מעדיף לעשות את העבודה בעצמו במקום להדריך"],c:3,e:"יצרן התוצאות מכונה \"זאב בודד\": ביצועיסט, בעל צורך עז בתוצאות, אינו מקיים ישיבות, לא סבלני — מעדיף לעשות את העבודה בעצמו במקום להדריך, אינו מאציל, מפתח או מגבש. תפקיד אופייני: מכירות."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהו התפקיד האופייני ליצרן התוצאות (P) לפי אדיג'ס?",o:["מכירות","חשבונאות","משאבי אנוש","מחקר ופיתוח"],c:0,e:"התפקיד האופייני ליצרן התוצאות (P) הוא מכירות. חשבונאות אופיינית למינהלן (A), ומשאבי אנוש לאינטגרטור (I)."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מה תפקידו של המינהלן (A) בארגון, לפי אדיג'ס?",o:["לבנות ולגבש צוות ולכוון את האנשים להרמוניה חברתית","להבטיח שהמטרה הושגה ביעילות — שיטתי, מאורגן, מדויק ולוגי","להבטיח את השגת המטרה עצמה — ישיר, ענייני וביצועיסט","ליזום פעולות ושינויים כדי שהארגון יתאים את עצמו להשתנות הסביבה"],c:1,e:"תפקידו של המינהלן להבטיח שהמטרה הושגה ביעילות. הוא מטפל בפרטים — שיטתי, מאורגן, מדויק וברור, לוגי ואנליטי — ויוצר שיטות ופרוצדורות. תפקיד אופייני: חשבונאות."},
{t:"אדיג'ס — סגנונות PAEI",s:"שאלות מבחן",q:"מי מבין ארבעת הטיפוסים של אדיג'ס נוטה לדיוק, ליסודיות, לתכנון ולהימנעות משגיאות?",o:["האינטגרטור (I)","היצרן (P)","המינהלן (A)","היזם (E)"],c:2,e:"המינהלן (A) הוא הטיפוס הנוטה לדיוק, ליסודיות, לתכנון ולהימנעות משגיאות. הוא זהיר ואיטי, נמנע משינוי, מעוניין להפוך הכל לשגרה, ופועל רק על פי הספר."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"כיצד מנהל המינהלן (A) ישיבות, ומה מאפיין את כפיפיו?",o:["משוחח רבות עם כפיפיו בישיבות פתוחות ומתעניין מאוד בדעתם","מקיים ישיבות לא מתוכננות, וכפיפיו מעריצים אותו ואת רעיונותיו","אינו מקיים ישיבות כלל, וכפיפיו משמשים כשליחים בלבד","מנהל ישיבות סדירות וקבועות גדושות בפרטים, וכפיפיו הם \"Yesman\""],c:3,e:"המינהלן מנהל ישיבות סדירות וקבועות הגדושות בפרטים. סגנון הכפופים לו: \"Yesman\", והקידום אצלו ניתן על אי-הפרת כללים. הוא פועל רק לפי הספר ועוסק בביעור חריגות."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהו הכינוי שנותן אדיג'ס ליזם (E), ומהו תפקידו?",o:["\"הפירומן\" — ליזום פעולות ושינויים כדי שהארגון יתאים עצמו לסביבה","\"זאב בודד\" — להבטיח את השגת המטרה בכוחות עצמו ובמהירות המרבית האפשרית","\"המפשר\" — לחתור לפשרה ולהימנע מקונפליקטים בכל מחיר","\"המשקיע\" — להשקיע במקביל במשימה ובאנשים ברמה גבוהה"],c:0,e:"היזם מכונה \"הפירומן\". תפקידו ליזום פעולות ושינויים כדי שהארגון יתאים עצמו להשתנות הסביבה. הוא איש של רעיונות, חזון, חלומות ותוכניות — יצירתי, מוכן לקחת סיכונים וכריזמתי."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"אילו חולשות מאפיינות את היזם (E) לפי אדיג'ס?",o:["חותר לקונצנזוס בכל מחיר ואין לו מחויבות לשיטה כלשהי","אינו נכנס לפרטים, לא עוקב אחר הפרויקט ומקצה משימות בערפול","נמנע משינוי, זהיר ואיטי, ומעוניין להפוך את הכל לשגרה קבועה","אינו מאציל סמכויות, לא מפתח כפיפים ומתנגד נחרצות לכל שינוי"],c:1,e:"היזם אינו נוטה להיכנס לפרטים ואינו עוקב אחר הפרויקט, דעתו אינה נתונה בהכרח לתוצאות, הוא מקצה משימות בערפול ובחוסר בהירות ומקיים ישיבות לא מתוכננות. הוא אוהב מעריצים."},
{t:"אדיג'ס — סגנונות PAEI",s:"שאלות מבחן",q:"מנהל שאסטרטגיה וחזון מנחים אותו הוא, לפי אדיג'ס, מנהל מסוג:",o:["P — יצרן התוצאות","A — המינהלן","E — היזם","I — האינטגרטור"],c:2,e:"מנהל שמונחה על ידי אסטרטגיה וחזון הוא מסוג E — היזם. תפקידו לזהות את צרכי העתיד וליזום כיווני פעולה חדשים; הוא איש של רעיונות, חזון, חלומות ותוכניות."},
{t:"אדיג'ס — סגנונות PAEI",s:"שאלות מבחן",q:"מהו הדפוס הניהולי האקטיבי ביותר לפי אדיג'ס?",o:["היצרן (P)","המינהלן (A)","האינטגרטור (I)","היזם (E)"],c:3,e:"היזם (E) הוא הדפוס האקטיבי ביותר בניהול לפי אדיג'ס — הוא היוזם, מחולל השינוי, אוהב אווירה של בהילות ודחיפות ופורץ כיוונים חדשים."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מה תפקידו של האינטגרטור (I), ומה מקצועו האופייני?",o:["לבנות ולגבש צוות של אנשים — משאבי אנוש","להבטיח את השגת המטרה במלואה — מכירות","להבטיח שהמטרה הושגה ביעילות — חשבונאות","ליזום שינויים בהתאם לסביבה — פיתוח עסקי"],c:0,e:"תפקידו של האינטגרטור לבנות ולגבש צוות של אנשים. הוא מכוון אנשים ומעריך הרמוניה חברתית, מתעניין בהסכמה כללית על פני נקיטת עמדה. מקצוע אופייני: משאבי אנוש."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהי החולשה המרכזית של האינטגרטור (I) לפי אדיג'ס?",o:["הוא נכנס לפרטים הקטנים ומאבד את התמונה הרחבה של הארגון","הוא חותר לקונצנזוס בכל מחיר ואין לו מחויבות לשיטה מסוימת","הוא מעדיף לבצע בעצמו ואינו מפתח או מגבש את כפיפיו כלל","הוא מקצה משימות בערפול ואינו עוקב אחר התקדמות הפרויקט"],c:1,e:"האינטגרטור חותר לקונצנזוס בכל מחיר ואין לו מחויבות לשיטה מסוימת. הוא מתעניין בהסכמה כללית על פני נקיטת עמדה או העלאת רעיונות, ומתעניין בפוליטיקה הפנימית וברכילות המשרדית."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מה ההבדל בין אפקטיביות ליעילות לפי אדיג'ס?",o:["אפקטיביות היא מדד לטווח הארוך בלבד; יעילות היא מדד לטווח הקצר בלבד, ואין ביניהן קשר ישיר","אפקטיביות היא מדד ברמת הארגון כולו; יעילות היא מדד ברמת העובד הבודד ותפוקתו האישית","אפקטיביות היא השגת התוצאות הדרושות — מיקוד בתוצאה; יעילות היא ביצוע בבזבוז זמן מינימלי — מיקוד בתהליך","אפקטיביות היא ביצוע בבזבוז זמן מינימלי — מיקוד בתהליך; יעילות היא השגת התוצאות הדרושות — מיקוד בתוצאה"],c:2,e:"אפקטיביות = השגת תוצאות הדרושות למישהו — מיקוד בתוצאה. יעילות = ביצוע תוצאות מול בזבוז זמן מינימלי — מיקוד בתהליך."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהו \"המנהל מתוך ספר הלימוד\" אצל אדיג'ס?",o:["מנהל שחסרה לו פונקציה אחת בלבד — בעל סגנון מעורב","מנהל שהתקדם עד לרמת אי-היכולת שלו בהיררכיה הארגונית","מנהל שאינו ניחן באף אחד מארבעת הכישורים — \"בול עץ יבש\"","מנהל תיאורטי הניחן בכל אחד מארבעת הכישורים ברמה גבוהה"],c:3,e:"\"המנהל מתוך ספר הלימוד\" הוא מנהל תיאורטי הניחן בכל אחד מארבעת הכישורים ברמה גבוהה. \"בול עץ יבש\" הוא ההפך — מנהל שאינו ניחן באף לא אחד מהכישורים. שניהם קיימים בתיאוריה בלבד."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מה מאפיין את רוב האנשים מבחינת שילוב סגנונות הניהול, לפי אדיג'ס?",o:["לרובנו יש סגנון דומיננטי אחד וסגנון משני חזק","לרובנו יש ארבעת הסגנונות במידה שווה ומאוזנת","לרובנו אין אף אחד מהסגנונות ברמה שניתן למדוד","לרובנו הסגנון משתנה מדי יום לפי דרישות המצב"],c:0,e:"מרבית האנשים ממזגים כמה סגנונות ניהול, אך אף אחד לא יכול להיות חזק באותה מידה בכולם או לחסר את כולם. רובנו בעלי סגנון דומיננטי אחד וסגנון משני חזק."},
{t:"אדיג'ס — סגנונות PAEI",s:"שאלות מבחן",q:"מהי נוסחת ההצלחה לניהול טוב המביא תוצאות לפי אדיג'ס?",o:["לאתר מנהל יחיד הניחן בכל ארבעת הכישורים ברמה גבוהה","לבנות צוות שלכל אחד מחבריו סגנון ניהולי שונה","למנות מנהל בעל סגנון P דומיננטי, שהוא הקריטי ביותר","להכשיר את המנהל לשנות את סגנונו לפי דרישות המצב"],c:1,e:"נוסחת ההצלחה לניהול טוב שמביא תוצאות לפי אדיג'ס היא לבנות צוות שלכל אחד מחבריו סגנון ניהולי שונה — משום שאיש אינו חזק בכל ארבע הפונקציות."},
{t:"אדיג'ס — סגנונות PAEI",s:"שאלות מבחן",q:"לפי אדיג'ס, כיצד יש \"לנהל את המנהל\"?",o:["להעביר אותו לתפקיד התואם במדויק את סגנונו הקיים","לדרוש ממנו לפתח את ארבעת הדפוסים לרמה שווה","לזהות אילו דפוסי ניהול חסרים לו ולסייע לו בנקודות אלו","לחזק דווקא את הדפוס הדומיננטי שלו ולהתעלם מכל השאר לחלוטין"],c:2,e:"כדי לנהל את המנהל, לפי אדיג'ס, יש להכיר אילו דפוסי ניהול אין לו ולסייע לו בנקודות אלו — משום שאף מנהל אינו חזק בכל ארבעת ה\"ויטמינים\"."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהו \"העיקרון הפיטרי\", ומדוע הוא מתקיים?",o:["אנשים מתקדמים עד לרמת הכשירות המרבית שלהם, כי הארגון בוחן אותם היטב לפני כל קידום","אנשים נשארים בתפקיד אחד לאורך כל הקריירה, כי הארגון מעדיף יציבות","אנשים עוזבים את הארגון ברגע שהם מגיעים לתקרת השכר של תפקידם","אנשים מתקדמים עד לרמת אי-היכולת שלהם, כי מקודמים על בסיס מצוינות בתפקיד הקודם"],c:3,e:"העיקרון הפיטרי: אנשים בארגונים מתקדמים עד לרמת אי-היכולת שלהם. הוא מתקיים מאחר שאנשים מקודמים על בסיס מצוינות באחד או יותר מהתפקידים הנדרשים, אך אינם מסוגלים לבצע את התפקידים הנוספים כשמתקדמים בהיררכיה."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהו המתח הקיים בין הפונקציות A ו-E לפי אדיג'ס?",o:["חוקים ונהלים מעכבים ובולמים יוזמה ושינוי, והשינוי מעכב שיטתיות וסדר","הישגים מהירים מתנגשים בצורך לפתח עבודת צוות ולגבש את האנשים לכדי צוות","הצורך בתוצאות מיידיות מתנגש בצורך בזמן למחשבה ולתכנון מחדש","הצורך להיות אפקטיבי מתנגש בצורך להיות יעיל באותו הזמן ממש"],c:0,e:"המתח בין A ל-E: חוקים ונהלים מעכבים ובולמים יוזמה ושינוי, ומנגד השינוי מעכב שיטתיות, נהלים וסדר. זהו אחד המתחים המובנים בין ארבע הפונקציות."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהו המתח בין הפונקציות P ו-I לפי אדיג'ס?",o:["מתח בין הצורך להיות אפקטיבי לבין הצורך להיות יעיל באותו פרק זמן","מתח בין הצורך בהישגים מהירים לבין פיתוח עבודת צוות — מכוונות למשימה מול מכוונות לאנשים","מתח בין הצורך בשיטתיות, בנהלים ובסדר קבוע לבין הצורך ביוזמה ובשינוי מתמיד בארגון ובסביבתו","מתח בין הצורך בסיפוק דרישות מיידיות לבין הצורך בזמן למחשבה ולתכנון"],c:1,e:"המתח בין P ל-I הוא בין הישגים מהירים לבין פיתוח עבודת צוות — למעשה מתח בין מכוונות למשימה לבין מכוונות לאנשים."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מנהלת מקיימת ישיבות רבות, מתעניינת בדעת כפיפיה, מנסה תמיד להגיע להסכמה ונמנעת מנקיטת עמדה. באיזה סגנון PAEI מדובר?",o:["בסגנון A — המינהלן","בסגנון E — היזם","בסגנון I — האינטגרטור","בסגנון P — יצרן התוצאות"],c:2,e:"האינטגרטור (I) משוחח רבות עם כפיפיו ומתעניין בדעתם, מעריך הרמוניה חברתית, ומתעניין בהסכמה כללית על פני נקיטת עמדה או העלאת רעיונות."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מנהל תמיד עסוק, אינו מקיים ישיבות, מוריד הנחיות לכפיפים המשמשים לו שליחים, ואינו מפתח או מאציל. באיזה סגנון PAEI מדובר?",o:["בסגנון A — המינהלן","בסגנון E — היזם","בסגנון I — האינטגרטור","בסגנון P — יצרן התוצאות"],c:3,e:"יצרן התוצאות (P) — \"זאב בודד\": תמיד עסוק ועובד קשה, אין לו זמן לשיחות חולין, אינו מקיים ישיבות, מוריד הנחיות וכפיפיו שליחים, ואינו מאציל, מפתח או מגבש."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"אילו כישורים נדרשים למנהל לפי אדיג'ס, בהתאם לארבע האותיות?",o:["הפקת תוצאות, מנהלנות-אדמיניסטרציה, יזמות ויצירתיות וגיוס שיתוף פעולה","תכנון, ארגון, תיאום ובקרה של המשימות והאנשים בארגון","כריזמה, הנעה בהשראה, אתגור אינטלקטואלי והתייחסות פרטנית","ידע טכני, מיומנות בינאישית, יכולת קונספטואלית ויכולת ניהולית וארגונית כאחת"],c:0,e:"הכישורים הדרושים למנהל לפי אדיג'ס: הפקת תוצאות (P), מנהלנות-אדמיניסטרציה (A), יזמות ויצירתיות (E) וגיוס שיתוף פעולה (I)."},
{t:"אדיג'ס — סגנונות PAEI",s:"סיכום",q:"מהו \"בעל סגנון מעורב\" לפי הטיפולוגיה של אדיג'ס?",o:["מנהל שמחליף פונקציה דומיננטית לפי דרישות המצב","מנהל שחסרה לו רק פונקציה אחת מבין הארבע","מנהל שניחן בכל ארבע הפונקציות ברמה גבוהה","מנהל שאינו ניחן באף לא אחת מארבע הפונקציות"],c:1,e:"בעל סגנון מעורב הוא מנהל שחסרה לו רק פונקציה אחת מבין הארבע. \"המנהל מתוך ספר הלימוד\" ניחן בכולן ו\"בול עץ יבש\" באף אחת — ושניהם קיימים בתיאוריה בלבד."}
]);

/* ===================== 6. אדיג'ס — מחזור חיי הארגון ===================== */
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מהם תשעת שלבי מחזור החיים הארגוני לפי אדיג'ס, לפי סדרם?",o:["חיזור, זינוק, ינקות, במיטבו, התבגרות, אריסטוקרטיה, רגוע, בירוקרטיה, התחדשות","הקמה, צמיחה, ייצוב, בשלות, התייעלות, התכווצות, מיזוג, פירוק, חיסול משפטי","חיזור, ינקות, זינוק, התבגרות, במיטבו, רגוע, אריסטוקרטיה, בירוקרטיה מוקדמת, בירוקרטיה ומוות","ינקות, חיזור, התבגרות, זינוק, רגוע, במיטבו, בירוקרטיה מוקדמת, אריסטוקרטיה, בירוקרטיה ומוות"],c:2,e:"שלבי מחזור החיים הארגוני לפי אדיג'ס: 1. חיזור 2. ינקות 3. זינוק 4. התבגרות 5. הארגון במיטבו 6. הארגון הרגוע 7. אריסטוקרטיה 8. בירוקרטיה מוקדמת 9. בירוקרטיה ומוות."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מה מאפיין את שלב החיזור במחזור החיים הארגוני?",o:["הארגון נולד זה עתה, אין בו נהלים ואין חלוקת תפקידים ברורה והמנהל עושה הכל","הרעיון פועל, המכירות עולות ותזרים המזומנים נעשה חיובי לראשונה","המבנה הארגוני והמערכות מתגבשים, מופנמים ומאפשרים תפקוד טוב","הארגון טרם נולד וקיים רק כרעיון, והמייסד בונה מחויבות ומשווק את הרעיון"],c:3,e:"בשלב החיזור הארגון טרם נולד וקיים רק כרעיון. המייסד בונה מחויבות שלו ושל אחרים ומשווק את הרעיון; נצברת התלהבות לקחת סיכון. נדרשים רעיון, כסף וגם \"משוגע לדבר\"."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מהם שלושת הדברים הנדרשים בשלב החיזור, לפי אדיג'ס?",o:["רעיון, כסף וגם \"משוגע לדבר\"","נהלים, מבנה ארגוני וחלוקת תפקידים","מועצת מנהלים, בקרת ביצועים ותזרים חיובי","מוצר מוגמר, ערוצי הפצה ולקוחות ראשונים"],c:0,e:"בשלב החיזור יש צורך ברעיון, בכסף וגם ב\"משוגע לדבר\". המחויבות בשלב זה מכוונת מוצר ולא שוק, ויש פיתוח מוצר שבשלב מאוחר יותר יתאים לצורכי השוק."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"למה מכוונת המחויבות בשלב החיזור?",o:["מכוונת מבנה ונהלים","מכוונת מוצר ולא שוק","מכוונת שוק ולא מוצר","מכוונת רווחיות ותזרים"],c:1,e:"בשלב החיזור המחויבות מכוונת מוצר ולא שוק. מתקיים פיתוח מוצר, שרק בשלב מאוחר יותר יותאם לצורכי השוק."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מה מאפיין את שלב הינקות בארגון?",o:["קיימת התמקדות בהישגי עבר במקום בחזון, ותגמול עבור צייתנות","קיימים עימותים ומאבקים פנימיים וירידה בכל הממדים העסקיים","אין נהלים, אין מיסוד ואין חלוקת תפקידים ברורה, והמנהל עושה הכל","קיימים נהלים מפורטים אך אין עדיין מועצת מנהלים ובקרת ביצועים"],c:2,e:"בשלב הינקות הארגון דומה לתינוק שזה עתה נולד: עדיין אין נהלים, אין מיסוד ואין חלוקת תפקידים ברורה. המשימה העיקרית היא לייצר ולשווק, המנהל עושה הכל, ואין עקביות בביצוע ולא עומק ניהולי."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מה מאפיין את שלב הזינוק?",o:["הרעיון קיים אך טרם נוסה בשוק, ונצברת בקרב המייסדים התלהבות לקחת סיכון","הארגון מוציא כסף על מערכות בקרה, הטבות לעובדים ומתקנים","הארגון מאבד שליטה וכיוון, ועובדים טובים עוזבים אותו","הרעיון פועל, המכירות עולות, תזרים המזומנים נעשה חיובי והחברה מתרחבת"],c:3,e:"בשלב הזינוק הרעיון פועל והמכירות עולות, עדיין אין נהלים, תזרים המזומנים נעשה חיובי והחברה מתחילה להתרחב: רוכשים מקומות, מגייסים עובדים חדשים וממשים הזמנות."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"אילו תופעות מאפיינות את שלב ההתבגרות?",o:["תחילת עימותים וחוסר עקביות בין ותיקים לחדשים, ומעבר מיזמות לניהול מקצועי","היעדר מוחלט של נהלים ושל חלוקת תפקידים, כשהמנהל מבצע את הכל בעצמו","ציפיות נמוכות לצמיחה ולכיבוש שווקים חדשים, והתמקדות בבעיות פנימיות","קריסת המערכות, אובדן כיוון וניסיונות בלימה לא ממוקדים שמדרדרים את המצב"],c:0,e:"שלב ההתבגרות: תחילתם של עימותים וחוסר עקביות — ותיקים מול חדשים, במטרות, בשיטת התגמולים ובתזרים. מתחלף סגנון המנהיגות מיזמות לניהול מקצועי, נעשית האצלת סמכויות, המיקוד עובר ממכירות לרווחים, מוקמת מועצת מנהלים ומתחילה בקרה על ביצועים."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"איזה שינוי בסגנון המנהיגות מתרחש בשלב ההתבגרות?",o:["מעבר מניהול מקצועי ליזמות ולחזון","מעבר מיזמות לניהול מקצועי","מעבר ממנהיגות מעצבת למתגמלת","מעבר מסגנון משתף לסגנון אוטוקרטי"],c:1,e:"בשלב ההתבגרות מתרחשת תחלופת סגנון מנהיגות מיזמות לניהול מקצועי, לצד האצלת סמכויות, מעבר במיקוד ממכירות לרווחים, הקמת מועצת מנהלים ותחילת בקרה על ביצועים."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מה מאפיין את השלב שבו הארגון נמצא במיטבו?",o:["זהו שלב היציבות — הארגון מפסיק להשתנות ומתמקד בשימור הקיים בלבד","זהו שלב המעבר — הארגון עובר מהאצלת סמכויות לריכוזיות ולפיקוח הדוק","זוהי נקודת האופטימום — המבנה והמערכות מתגבשים, החזון מופנם והחדשנות בכל הרמות","זוהי נקודת המפנה — המכירות עדיין עולות אך תזרים המזומנים של החברה הופך לשלילי לראשונה"],c:2,e:"השלב שבו הארגון במיטבו הוא נקודת האופטימום על עקומת מחזור החיים: המבנה הארגוני והמערכות מתגבשים ומופנמים ומאפשרים תפקוד טוב, מתגבש חזון ומופנמות חדשנות ויצירתיות בכל הרמות, הארגון מכוון תוצאות ולקוח, הביצועים מצוינים ויש צמיחה במכירות."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מה מאפיין את שלב \"הארגון הרגוע\"?",o:["ציפיות גבוהות לצמיחה מהירה, לפריצות דרך ולכיבוש שווקים חדשים בקצב מואץ במיוחד","עימותים ומאבקים פנימיים חריפים לצד חיפוש מתמיד אחר אשמים","קריסה מלאה של המערכות ועזיבה המונית של העובדים הטובים","ציפיות נמוכות לצמיחה, התמקדות בהישגי עבר במקום בחזון ותגמול עבור צייתנות"],c:3,e:"שלב הארגון הרגוע מאופיין בציפיות נמוכות לצמיחה, לכיבוש שווקים חדשים, לפריצות דרך ולפתיחת חזיתות; התמקדות בהישגי עבר במקום בחזון לעתיד; חדשנות כלפי שינוי; תגמול עבור צייתנות; והתמקדות בבעיות פנימיות."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"על מה מוציא הארגון כסף בשלב האריסטוקרטיה, ובמה הוא מתמקד?",o:["על מערכות בקרה, הטבות לעובדים ומתקנים — ומתמקד ב\"איך עושים\" במקום ב\"מה עושים\"","על מחקר ופיתוח, כניסה לשווקים חדשים וגיוס כישרונות — ומתמקד בחדשנות ובצמיחה עסקית","על שיווק ופרסום אגרסיביים — ומתמקד בהגדלת נתח השוק על חשבון הרווח","על ייעוץ ארגוני והבראה — ומתמקד בצמצום כוח האדם ובקיצוץ בהוצאות"],c:0,e:"בשלב האריסטוקרטיה מוציאים כסף על מערכות בקרה, הטבות לעובדים ומתקנים; ההתמקדות עוברת ל\"איך עושים דברים\" במקום ב\"מה עושים\"; יש דגש על פורמליזציה ושאננות לעניין חדשנות ויצירתיות."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"שאלות מבחן",q:"כאשר חברה נמצאת בשלב האריסטוקרטיה, היא למעשה:",o:["בנקודת האופטימום של מחזור החיים הארגוני","באסקלציה לקראת מוות ארגוני","בשלב הצמיחה המהירה של מכירותיה","בשלב המעבר מיזמות לניהול מקצועי"],c:1,e:"שלב האריסטוקרטיה הוא כבר חלק מהמדרון היורד — אסקלציה למוות ארגוני. אחריו באים שלב הבירוקרטיה המוקדמת ולבסוף הבירוקרטיה והמוות."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מה מאפיין את שלב הבירוקרטיה המוקדמת?",o:["ריבוי יוזמות ופריצות דרך לצד נכונות גבוהה מאוד לקחת סיכונים עסקיים גדולים","היעדר נהלים ומיסוד, כשהמשימה העיקרית היא לייצר ולשווק","ירידה בכל הממדים העסקיים, עימותים ומאבקים פנימיים וחיפוש אחר אשמים","הפנמת החזון והמערכות ותפקוד מיטבי בכל הרמות הארגוניות"],c:2,e:"שלב הבירוקרטיה המוקדמת מאופיין בירידה בכל הממדים העסקיים, בתחילתם של עימותים ומאבקים פנימיים, בחיפוש אחר אשמים ובהטבות לעובדים ולמתקנים."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מה מאפיין את שלב הבירוקרטיה והמוות?",o:["הארגון מתייעל, מקצץ בהוצאות ומצליח להתאושש ולחזור לצמיחה מהירה ומתמשכת","הארגון מתמקד בהישגי עבר אך עדיין שומר על יציבות עסקית","הארגון מגייס מנהלים מקצועיים ומקים מועצת מנהלים לראשונה","הארגון מאבד שליטה וכיוון, המערכות על סף קריסה ועובדים טובים עוזבים"],c:3,e:"בשלב הבירוקרטיה והמוות הארגון מאבד שליטה במצב, מאבד כיוון ודרך, המערכות מתפקדות על סף קריסה, עובדים טובים עוזבים, וניסיונות בלימה לא ממוקדים מדרדרים את המצב לפשיטת רגל."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מה מאפיין את המעבר משלב לשלב במודל מחזור החיים?",o:["המעבר מלווה במשבר מעבר ובקשיים לעבור לסגנון ניהולי חדש","המעבר הוא הדרגתי וחלק, ואינו מחייב שינוי בסגנון הניהול","המעבר נקבע מראש לפי גיל הארגון ואינו תלוי בהתנהלותו","המעבר מתרחש רק כאשר הארגון בוחר בכך באופן מודע ויזום"],c:0,e:"המעבר משלב לשלב מלווה במשבר מעבר, בקשיים לעבור לסגנון ניהולי חדש ובקשיי התארגנות. לכל שלב יש מאפיינים וסיכונים העלולים לגרום לקריסה."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מה מניחה שיטת מחזור החיים לגבי גורלם של ארגונים, וכיצד ניתן למנוע את המשבר?",o:["השיטה מניחה שהמשבר מתרחש פעם אחת בלבד, בשלב המעבר מינקות לזינוק","השיטה מניחה שגורלם מוות, וכי בכל שלב יש להתאים גישה ניהולית ואסטרטגיה מתאימות","השיטה מניחה שגורלם צמיחה מתמדת, וכי די בשמירה על הנהלים כדי להימנע ממשבר","השיטה מניחה שהגורל נקבע בשלב החיזור, וכי לא ניתן להשפיע עליו לאחר מכן"],c:1,e:"השיטה מניחה שגורלם של ארגונים הוא מוות. התיאוריה מניחה שכדי למנוע את המשבר — לכל משבר בכל שלב — יש לעשות התאמה של גישה ניהולית מתאימה ואסטרטגיה מתאימה."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"שאלות מבחן",q:"לפי מודל מחזור החיים הארגוני, מה נכון לגבי גיוס מנהלים?",o:["הארגון צריך לגייס מנהל בעל ארבעת הכישורים במידה שווה","הארגון צריך לגייס מנהל מתוך שורותיו ולא ממקור חיצוני","הארגון צריך לגייס מנהל לפי מיקומו במחזור חיי הארגון","הארגון צריך לגייס תמיד מנהל בעל סגנון P דומיננטי"],c:2,e:"לפי מודל מחזור החיים, הארגון צריך לגייס מנהל לפי מיקומו במחזור חייו — כי לכל שלב מתאימים סגנון ניהולי ואסטרטגיה אחרים. זו התאמה שמונעת את משבר המעבר."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"חברה שרכשה זה עתה מקומות, מגייסת עובדים חדשים ותזרימה הפך חיובי — אך עדיין אין בה נהלים. באיזה שלב היא נמצאת?",o:["בשלב האריסטוקרטיה","בשלב הבירוקרטיה","בשלב החיזור","בשלב הזינוק"],c:3,e:"אלו מאפייני שלב הזינוק: הרעיון פועל והמכירות עולות, תזרים המזומנים נעשה חיובי והחברה מתחילה להתרחב — רוכשים מקומות ומגייסים עובדים חדשים — אך עדיין אין נהלים."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"בארגון מתנהלים ויכוחים בין ותיקים לחדשים, מוקמת מועצת מנהלים ומתחילה בקרה על ביצועים. באיזה שלב הוא נמצא?",o:["בשלב ההתבגרות","בשלב הארגון הרגוע","בשלב הינקות","בשלב הזינוק"],c:0,e:"אלו מאפייני שלב ההתבגרות: תחילת עימותים וחוסר עקביות בין ותיקים לחדשים, האצלת סמכויות, מעבר ממכירות לרווחים, הקמת מועצת מנהלים ותחילת בקרה על ביצועים."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"בארגון עוסקים בעיקר בשאלה איך עושים דברים במקום במה עושים, ומשקיעים במערכות בקרה ובמתקנים. באיזה שלב הוא נמצא?",o:["בשלב ההתבגרות","בשלב האריסטוקרטיה","בשלב הארגון במיטבו","בשלב הבירוקרטיה ומוות"],c:1,e:"אלו מאפייני שלב האריסטוקרטיה: הוצאת כסף על מערכות בקרה, הטבות ומתקנים; התמקדות ב\"איך עושים\" במקום ב\"מה עושים\"; דגש על פורמליזציה; ושאננות לעניין חדשנות."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"מהו ההבדל בין שלב הארגון הרגוע לשלב הבירוקרטיה המוקדמת מבחינת ביצועיו העסקיים?",o:["בשני השלבים הביצועים זהים, וההבדל היחיד הוא במבנה הארגוני","ברגוע הארגון מאבד שליטה; בבירוקרטיה המוקדמת הוא מתאושש חלקית","ברגוע יש ציפיות נמוכות אך אין עדיין ירידה; בבירוקרטיה המוקדמת יש ירידה בכל הממדים","ברגוע יש כבר ירידה חדה בכל הממדים העסקיים; בבירוקרטיה המוקדמת ההידרדרות נעצרת לחלוטין"],c:2,e:"בשלב הרגוע יש ציפיות נמוכות לצמיחה והתמקדות בהישגי עבר, אך טרם החלה נסיגה עסקית. בבירוקרטיה המוקדמת כבר יש ירידה בכל הממדים העסקיים לצד עימותים פנימיים וחיפוש אשמים."},
{t:"אדיג'ס — מחזור חיי הארגון",s:"סיכום",q:"בשלב הארגון במיטבו — לאן מכוון הארגון?",o:["לתהליכים ולנהלים, עם דגש על פורמליזציה ובקרה","לבעיות הפנימיות, עם תגמול הניתן עבור צייתנות","להישרדות ולבלימת נזקים, עם קיצוץ מתמשך בהוצאות","לתוצאות וללקוח, עם ביצועים מצוינים וצמיחה במכירות"],c:3,e:"בשלב שבו הארגון במיטבו הוא מכוון תוצאות ומכוון לקוח, ביצועיו מצוינים ויש צמיחה במכירות. החדשנות והיצירתיות קיימות בכל הרמות והחזון מגובש ומופנם."},

{t:"מנהיגות, כוח וסמכות",s:"סיכום",q:"ממה נובע כוח המומחיות, ומה הוא יוצר?",o:["מיכולת להפעיל שכר ותגמולים, והוא יוצר שיתוף פעולה","מהסמכות הפורמלית של נושא התפקיד בארגון, והוא יוצר ציות מובנה","משליטה על ידע וטכנולוגיה החיונית לארגון, והוא יוצר תלות","מהזדהות בשל מודל לחיקוי ומסירות, והוא יוצר הערצה"],c:2,e:"כוח המומחיות נובע משליטה על ידע וטכנולוגיה החיונית לארגון — וזו יוצרת תלות. כוח ההתייחסות נובע מהזדהות בשל מודל לחיקוי ומסירות."},
{t:"מנהיגות, כוח וסמכות",s:"סיכום",q:"ממה נובע כוח ההתייחסות?",o:["משליטה על ידע וטכנולוגיה חיונית","מהסמכות הפורמלית של נושא התפקיד","מהיכולת להעניש, להפחיד ולכפות","מהזדהות בשל מודל לחיקוי ומסירות"],c:3,e:"כוח ההתייחסות נובע מהזדהות בשל מודל לחיקוי ומסירות — המונהגים מזדהים עם המנהיג ורוצים להידמות לו."},
{t:"מנהיגות, כוח וסמכות",s:"סיכום",q:"אילו מקורות כוח מרכיבים את \"כוח העמדה\", ואילו את \"כוח אישי\"?",o:["עמדה: לגיטימי, תגמול וכפייה. אישי: מומחיות והתייחסות","עמדה: מומחיות והתייחסות. אישי: לגיטימי, תגמול וכפייה","עמדה: לגיטימי ומומחיות. אישי: תגמול, כפייה והתייחסות","עמדה: תגמול והתייחסות. אישי: לגיטימי, כפייה ומומחיות"],c:0,e:"כוח לגיטימי, כוח התגמול וכוח הכפייה מרכיבים יחד את כוח העמדה — הנובע מהתפקיד. כוח המומחיות וכוח ההתייחסות מרכיבים את הכוח האישי — הנובע מן האדם עצמו."},
{t:"מנהיגות, כוח וסמכות",s:"סיכום",q:"מהם שני מקורות הכוח הנוספים שיש המוסיפים לחמשת המקורות הקלאסיים?",o:["עוצמה מקצועית ועוצמה ותיקה","עוצמה אידיאולוגית ועוצמה בירוקרטית","עוצמה כלכלית ועוצמה טכנולוגית-מקצועית","עוצמה חברתית ועוצמה תקשורתית"],c:1,e:"יש המוסיפים שני מקורות כוח: עוצמה אידיאולוגית — להפעיל בשם ערכים ואידיאולוגיה; ועוצמה בירוקרטית — להפעיל בשל מיקום במערכת הבירוקרטית, מתוך עמדת מפתח."},
{t:"מנהיגות, כוח וסמכות",s:"סיכום",q:"מהי הגדרת הסמכות, בהבחנה מהכוח?",o:["שינוי בהתנהגות או בעמדות של האחר בעקבות אינטראקציה עם המנהיג","הזדהות של המונהגים עם המנהיג בשל היותו מודל לחיקוי ולמסירות","הרשאה ולגיטימציה פורמלית הניתנת בארגונים לפרטים מסוימים, שמכוחה הם מפעילים אחרים","היכולת של הסוכן להשפיע על האחר מכוח שליטה ונגישות למשאבים נדירים בארגון וגם מחוצה לו"],c:2,e:"סמכות היא הרשאה ולגיטימציה פורמלית הניתנת בארגונים לפרטים מסוימים, ומעצם קבלתה הם יכולים להפעיל אחרים שאין להם סמכות כזו בארגון."},
{t:"מנהיגות, כוח וסמכות",s:"סיכום",q:"מהי ההגדרה של השפעה, בהבחנה מכוח ומסמכות?",o:["הרשאה פורמלית להפעיל אחרים בארגון","שליטה ונגישות למשאבים נדירים בארגון","ייחוס של יכולות מיוחדות לנושא התפקיד","שינוי ההתנהגות או העמדות של האחר"],c:3,e:"השלישייה שמקנה יכולת השפעה על אחרים היא כוח (יכולת ושליטה במשאבים), סמכות (הרשאה פורמלית) והשפעה — שהיא שינוי ההתנהגות או העמדות של האחר."},
{t:"מנהיגות, כוח וסמכות",s:"סיכום",q:"לפי אילו שלושה קריטריונים ניתן לסווג את תיאוריות המנהיגות השונות?",o:["התמקדות במנהיג לעומת המצב, במנהיג מול המונהגים, ותיאוריה אוניברסלית מול תיאוריית תלות","רמת המיקרו מול רמת המאקרו, פנימי מול חיצוני, וטווח קצר מול טווח ארוך בארגון","תכונות מול התנהגות, פורמלי מול בלתי פורמלי, ופרט מול קבוצה","תוכן מול תהליך, פנימי מול חיצוני, ומולד מול נרכש בלמידה"],c:0,e:"את תיאוריות המנהיגות ניתן לסווג לפי שלושה קריטריונים: תיאוריות המתמקדות במנהיג מול תיאוריות המתמקדות במצב; תיאוריות המתמקדות במנהיג מול תיאוריות המתמקדות במונהגים; ותיאוריה אוניברסלית מול תיאוריית תלות."},
{t:"מנהיגות, כוח וסמכות",s:"שאלות מבחן",q:"לפי המודלים הפסיכודינמיים למנהיגות, מדוע אנשים הולכים אחרי מנהיג?",o:["משום שהוא מתאים את סגנונו לרמת הבשלות שלהם","משום שהוא ממלא צרכים נפשיים ומאוויים של אנשים","משום שהוא נושא בסמכות פורמלית מטעם הארגון","משום שהוא מתגמל אותם כלכלית על שיתוף הפעולה שלהם"],c:1,e:"לפי המודלים הפסיכודינמיים למנהיגות, אנשים הולכים אחרי מנהיג משום שהוא ממלא צרכים נפשיים ומאוויים שלהם."},
{t:"מנהיגות, כוח וסמכות",s:"סיכום",q:"\"מנהיגות היא אחת התופעות הנצפות ביותר, והבלתי מובנות ביותר עלי אדמות\" — של מי האמירה?",o:["פידלר (1964)","הרסי ובלנשארד (1972)","ברנס (1978)","יוקל (1998)"],c:2,e:"האמירה היא של ברנס (1978), והיא פותחת את הדיון בתיאוריית התכונות. יוקל (1998) הוא בעל ההגדרה המרכזית של מנהיגות כתהליך השפעה."},
{t:"מנהיגות, כוח וסמכות",s:"סיכום",q:"כיצד מסווגות ההגדרות השונות של מנהיגות בסיכום?",o:["כמנהיגות פורמלית ובלתי פורמלית, כמנהיגות אישית וכקבוצתית, וכזמנית וכקבועה לאורך זמן רב","כמכניסטית ואורגנית, כמודרנית ומסורתית, וכאוניברסלית ותלוית מצב","כמעצבת ומתגמלת, כאקטיבית ופסיבית, וכריכוזית ומשתפת בהחלטות","כפונקציה של תכונות אישיות, כמוקד של תהליכים חברתיים, כצורת התנהגות וכתהליך של השפעה"],c:3,e:"סיווג ההגדרות של מנהיגות: מנהיגות כפונקציה של תכונות אישיות, מנהיגות כמוקד של תהליכים חברתיים, מנהיגות כצורת התנהגות, ומנהיגות כתהליך של השפעה."},

{t:"מנהיגות, כוח וסמכות",s:"שאלות מבחן",q:"עובד בכיר בארגון משפיע על עמיתיו ומוביל אותם, אף שאין לו כל תפקיד ניהולי. כיצד תוגדר מנהיגותו?",o:["מנהיגות מתקנת פסיבית","מנהיגות בלתי פורמלית","מנהיגות פורמלית","מנהיגות מתגמלת"],c:1,e:"מנהיג בלתי פורמלי הוא אדם המשפיע על אחרים שלא מתוקף קבלת סמכות פורמלית מהארגון — בדיוק כפי שהתגלה במחקרי האות'ורן."},
{t:"מנהיגות, כוח וסמכות",s:"סיכום",q:"אילו ארבע גישות תיאורטיות למנהיגות מונה הסיכום?",o:["תיאוריות תוכן, תיאוריות תהליך, תיאוריות צדק ותיאוריות מחויבות","הגישה האוטוקרטית, הייעוצית, הקבוצתית והמאצילה סמכויות","גישת התכונות, הגישות ההתנהגותיות, הגישה המצבית והכריזמה","גישת המערכות, גישת התלות, הגישה המכניסטית והאורגנית"],c:2,e:"ארבע הגישות התיאורטיות למנהיגות: גישת התכונות, הגישות ההתנהגותיות, הגישה המצבית והכריזמה — שהובילה למנהיגות המעצבת ולמודל הטווח המלא."}
