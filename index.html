{t:"גישת התכונות",s:"סיכום",q:"מה משמעות המעבר מדיבור על תכונות לדיבור על מיומנויות?",o:["המעבר מצביע על כך שהמצב הוא הקובע היחיד באפקטיביות","המעבר מצביע על כך שהמונהגים קובעים את זהות המנהיג","המעבר מצביע על מהפך: המנהיגות אינה מולדת אלא נרכשת","המעבר מצביע על כך שהתכונות המולדות חשובות אף יותר"],c:2,e:"המעבר מתכונות למיומנויות מצביע על מהפיכה בתפיסה: מנהיגות אינה מולדת אלא נרכשת — מיומנויות ניתן ללמוד ולפתח, בניגוד לתכונות המולדות של תיאוריית האדם הדגול."},
{t:"גישת התכונות",s:"סיכום",q:"על אילו יכולות דיברו החוקרים לקראת סוף שנות ה-70?",o:["פיזיות בלבד — גובה, משקל, ספורטיביות ומראה חיצוני מרשים","ניהוליות בלבד — תכנון, ארגון, תיאום, תזמון והקצאת משאבים","חברתיות בלבד — לכידות קבוצתית, נורמות משותפות, סולידריות ורכילות משרדית","קונספטואליות, קוגניטיביות, אמביציה, יצירתיות, רטוריקה, שכנוע והסתגלות"],c:3,e:"לקראת סוף 1970 מדברים על יכולות: קונספטואליות, קוגניטיביות (אינטליגנציה), אמביציה, יצירתיות, רטוריקה ושטף דיבור, יכולת שכנוע ויכולת הסתגלות."},
{t:"גישת התכונות",s:"סיכום",q:"אילו שלושה סוגי צרכים זיהה מקללנד בהקשר של מנהיגות?",o:["צורך בהישג, צורך בעוצמה וצורך בהשתייכות","צורך בביטחון, צורך בהערכה וצורך במימוש עצמי","צורך באוטונומיה, צורך במיומנות וצורך במטרה","צורך בהוגנות, צורך בצדק וצורך במחויבות"],c:0,e:"מקללנד זיהה שלושה סוגי צרכים: צורך בהישג (שאיפה להצטיינות, ביצוע מאתגר, לקיחת סיכונים, משוב מיידי), צורך בעוצמה (רצון להוביל, יוקרה, השפעה) וצורך בהשתייכות (רצון להיות פופולרי, יחסים חבריים)."},
{t:"גישת התכונות",s:"שאלות מבחן",q:"לפי מקללנד, מהו התמהיל המאפיין מנהלים אפקטיביים?",o:["צורך נמוך בכוח, צורך מועט בהישג וצורך בינוני-גבוה בשייכות","צורך בכוח, צורך בינוני-נמוך בשייכות וצורך בינוני בהישג","צורך גבוה בהישג, צורך רב בשייכות וצורך נמוך בכוח","צורך גבוה בשייכות, צורך נמוך בהישג וצורך נמוך בכוח"],c:1,e:"מה שנמצא בקרב מנהיגים: צורך גבוה בשליטה חברתית (כוח), מניע הישג ברמה בינונית, וצורך נמוך במקובלות (שייכות)."},
{t:"גישת התכונות",s:"סיכום",q:"מה מאפיין אדם בעל צורך גבוה בהישג לפי מקללנד?",o:["רצון להיות פופולרי ואהוד ושאיפה ליחסים חבריים וקרובים בסביבת העבודה","נטייה להימנע מקונפליקטים ולחתור לקונצנזוס בכל מחיר","שאיפה להצטיינות, ביצוע מאתגר, לקיחת סיכונים וצורך במשוב מיידי","רצון להוביל, לתת עצות, יוקרה ותפקיד בעל סטטוס גבוה"],c:2,e:"צורך בהישג מתאפיין בשאיפה להצטיינות, בביצוע חשוב ומאתגר, בלקיחת סיכונים ובצורך במשוב מיידי. צורך בעוצמה — ברצון להוביל ובהשפעה על אנשים."},
{t:"גישת התכונות",s:"שאלות מבחן",q:"אדם בעל צורך הישג גבוה לפי מקללנד יבחר במשימות מסוג:",o:["משימות קלות ובטוחות, כי הן מבטיחות לו הצלחה ודאית מראש","משימות קבוצתיות, כי הן מספקות תחושת שייכות","משימות ניהוליות, כי הן מקנות סטטוס ויוקרה","משימות מאתגרות, כי רק אז יבואו יכולותיו לידי ביטוי"],c:3,e:"אדם בעל צורך הישג גבוה יבחר משימות מאתגרות — כי רק במשימה מאתגרת יבואו יכולותיו לידי ביטוי. הצורך בהישג כולל שאיפה להצטיינות ולקיחת סיכונים."},
{t:"גישת התכונות",s:"סיכום",q:"מהן התרומות של גישת התכונות, למרות הביקורת עליה?",o:["ההבנה מהיכן מגיעה הכריזמה, הידיעה מי אינו יכול להיות מנהיג, וההבנה שניתן לשפר מנהיגות","הזיהוי של סדרת תכונות מדויקת ומוסכמת, המנבאת בוודאות מלאה מי יהיה מנהיג אפקטיבי ומי לא","ההוכחה שהמצב ולא האדם הוא הקובע היחיד את אפקטיביות המנהיגות","המסקנה שיש להתאים את סגנון המנהיגות לרמת הבשלות של הכפיפים"],c:0,e:"תרומת הגישה: היא מסבירה מהיכן מגיעה הכריזמה שמחפשים במנהלים (מתיאוריית האדם הדגול), מאפשרת לדעת מי לא יכול להיות מנהיג, ומלמדת שניתן לשפר מנהיגות."},
{t:"גישת התכונות",s:"שאלות מבחן",q:"מהי המסקנה שאליה הגיעה תיאוריית התכונות?",o:["המנהיגות נקבעת אך ורק על ידי הצורך בעוצמה","אין סדרה של תכונות ומיומנויות שיכולה לנבא מנהיגות","קיימת סדרה מוגדרת של שבע תכונות המנבאות מנהיגות","התכונות הפיזיות הן המנבא החזק ביותר למנהיגות"],c:1,e:"תיאוריית התכונות מצאה שאין סדרה של תכונות ומיומנויות שיכולה לנבא מנהיגות — לא נמצאו תכונות, יכולות או מיומנויות שבאופן עקבי ניבאו צמיחה או אפקטיביות מנהיגותית."},
{t:"גישת התכונות",s:"סיכום",q:"מהי אחת הביקורות המרכזיות על גישת התכונות בהקשר של חוסר עקביות בממצאים?",o:["קיימות תכונות שנמצאו בעקביות בכל המחקרים, אך אינן ניתנות למדידה","קיימות תכונות שנמדדו רק בארגונים ציבוריים ולא בארגונים עסקיים","קיימים מנהיגים אפקטיביים ללא התכונות, ומנהיגים לא אפקטיביים שכן ניחנו בהן","קיימים מנהיגים שהתכונות שלהם משתנות עם הזמן, ולכן קשה מאוד למדוד אותן במדויק"],c:2,e:"מהביקורות: לא נמצאו תכונות שניבאו בעקביות אפקטיביות מנהיגותית. קיימים מנהיגים אפקטיביים שלא ניחנו בתכונות אלו, וקיימים מנהיגים לא אפקטיביים שכן ניחנו בהן."},
{t:"גישת התכונות",s:"סיכום",q:"כיצד מנוסחת הביקורת על כך שגישת התכונות \"מונעת\" מאנשים להיהפך למנהיגים?",o:["אם התכונות נרכשות בלמידה, אין טעם להשקיע במיון ובאיתור מועמדים","אם התכונות נקבעות על ידי הקבוצה, הפרט אינו יכול להשפיע כלל על מעמדו בה","אם התכונות תלויות במצב, אין דרך לחזות מי יצליח בתפקיד ניהולי","אם התכונות מולדות וקבועות, מי שלא נולד איתן לא יוכל לעולם להיות מנהיג"],c:3,e:"הביקורת: גישת התכונות \"מונעת\" מאנשים את האפשרות להיהפך למנהיגים, משום שאם התכונות מולדות וקבועות, מי שלא נולד איתן לא יוכל להיות מנהיג. מנגד — ניתן ללמוד להיות מנהיג."},
{t:"גישת התכונות",s:"סיכום",q:"מה טוענת הביקורת על גישת התכונות בהקשר של חברות דמוקרטיות?",o:["מנהיגים צומחים בכל מקום ובכל משפחה, ולכן המנהיגות אינה תכונה תורשתית","מנהיגים נבחרים בהצבעה חופשית, ולכן התכונות האישיות אינן רלוונטיות כלל","מנהיגים מתחלפים בתדירות גבוהה, ולכן קשה למדוד את תכונותיהם","מנהיגים נבחרים לפי מצע ולא לפי אישיות, ולכן אין למדוד תכונות"],c:0,e:"הביקורת: בחברות דמוקרטיות מנהיגים צומחים בכל מקום ובכל משפחה — ולכן מנהיגות אינה תכונה פנימית ומולדת ואינה עוברת בתורשה, כפי שהיה במשפחות המלוכה."},
{t:"גישת התכונות",s:"סיכום",q:"מה נכלל בקטגוריית \"היכולות\" שנבדקה במסגרת גישת התכונות?",o:["הישג, השתייכות ועוצמה כמניעים דומיננטיים בהתנהגות","אינטליגנציה, כושר ביטוי ושכנוע, כישורים בינאישיים ויכולות קוגניטיביות","הסתגלות, אגרסיביות, יצירתיות, עמידה בלחץ, נחישות וביטחון עצמי גבוה במיוחד","יושר, אמינות, לויאליות ומחויבות למטרות הארגון"],c:1,e:"קטגוריית היכולות כוללת אינטליגנציה, כושר ביטוי ושכנוע, כישורים בינאישיים ויכולות קוגניטיביות. תכונות אישיות כוללות הסתגלות, אגרסיביות, יצירתיות, עמידה בלחץ וביטחון עצמי."},
{t:"גישת התכונות",s:"סיכום",q:"מדוע נדרשה גישה חלופית אחרי גישת התכונות?",o:["משום שהגישה עסקה רק בארגונים גדולים ולא התאימה לארגונים קטנים","משום שהגישה דרשה מכשור מדידה יקר שלא היה זמין לחוקרים באותה תקופה","משום שהגישה אכזבה — היא התעלמה מהשפעת המצב ולא ניבאה אפקטיביות בעקביות","משום שהגישה הצליחה מדי — היא זיהתה תכונות רבות מכדי שניתן יהיה למדוד"],c:2,e:"הגישה אכזבה: חוסר עקביות בממצאים, סתירות בין התכונות המוצעות, והתעלמות מן ההשפעה שיש למצבים שונים על עלייתם של מנהיגים ועל תפקודם — ולכן נדרשה גישה חלופית, ההתנהגותית."},
{t:"גישת התכונות",s:"סיכום",q:"מהי הביקורת הנוגעת לקשר בין זהות התכונות לזהות יכולת המנהיגות?",o:["אנשים בעלי תכונות זהות זהים תמיד ביכולת המנהיגות שלהם","אנשים בעלי תכונות שונות אינם יכולים להיות מנהיגים כלל","אנשים משנים את תכונותיהם ברגע שהם מגיעים לתפקיד ניהולי","אנשים בעלי תכונות זהות שונים ביכולת המנהיגות שלהם, ולהיפך"],c:3,e:"אחת הביקורות: אנשים בעלי תכונות זהות שונים ביכולת המנהיגות שלהם, ולהיפך — אנשים בעלי תכונות שונות זהים באפקטיביות המנהיגות שלהם."},
{t:"גישת התכונות",s:"סיכום",q:"מהן דוגמאות למאפיינים שיוחסו למנהיגים בגישת התכונות?",o:["גובה, אסרטיביות, אינטליגנציה, יכולת ורבלית, כריזמה, גמישות וביטחון עצמי","דיוק, יסודיות, תכנון, שמרנות והימנעות משגיאות ומחריגה מהנוהל","חתירה לקונצנזוס, רגישות חברתית ועניין בפוליטיקה הפנימית בארגון","יכולת מדידה, בקרה, פיקוח וקשירת התגמול לתפוקה הנמדדת של העובד"],c:0,e:"מאפיינים לדוגמה שיוחסו למנהיגים: גובה, אסרטיביות, אינטליגנציה, יכולת ורבלית, כריזמה, גמישות וביטחון עצמי — מתוך הניסיון לאתר תכונה או אוסף תכונות ההופכים אדם למנהיג."}

{t:"הגישה ההתנהגותית",s:"סיכום",q:"אילו יתרונות יש בהסתכלות על מנהיגות במונחי התנהגות?",o:["ההתנהגויות תלויות רק במאפייני המצב, ולכן ניתן לחזות אותן במדויק מראש","ההתנהגויות נקבעות על ידי הקבוצה, ולכן קל לשנותן באמצעות נורמות חדשות","ההתנהגויות קלות יותר למדידה, השפעתן על האפקטיביות ישירה יותר, וההתנהגות ניתנת ללמידה","ההתנהגויות קבועות לאורך זמן, אינן משתנות בין מצב למצב, ועוברות בתורשה מדור אחד למשנהו בתוך המשפחה"],c:2,e:"היתרונות: התנהגויות קלות יותר למדידה, השפעת ההתנהגויות על האפקטיביות ישירה יותר, וההתנהגות ניתנת ללמידה — בניגוד לתכונות המולדות."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"כיצד נמדדה האפקטיביות של המנהיג במחקרי הגישה ההתנהגותית?",o:["לפי הרווחיות של הארגון ולפי נתח השוק שלו בענף שבו הוא פועל","לפי מספר שנות הוותק של המנהיג בתפקידו הנוכחי","לפי ציון ה-LPC שקיבל המנהיג בשאלון האישיות","לפי מידת השגת המטרות ולפי עמדות הכפיפים כלפי המנהיג"],c:3,e:"במחקרי הגישה ההתנהגותית נבדק הקשר: התנהגות המנהיג ← אפקטיביות, כאשר האפקטיביות נמדדה לפי מידת השגת המטרות ולפי עמדות הכפיפים כלפי המנהיג."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מהם שלושת דפוסי המנהיגות ההתנהגותית שזוהו?",o:["מנהיג ריכוזי, מנהיג דמוקרטי ומנהיג לא מתערב (לֶסֶה-פֵייר)","מנהיג משימתי, מנהיג מתייחס ומנהיג מאציל סמכויות לחברי הקבוצה","מנהיג מעצב, מנהיג מתגמל ומנהיג מתקן פסיבי","מנהיג פורמלי, מנהיג בלתי פורמלי ומנהיג כריזמטי"],c:0,e:"שלושת דפוסי המנהיגות ההתנהגותית: מנהיג ריכוזי, מנהיג דמוקרטי ומנהיג לא מתערב (לסה פייר). הגישה התמקדה בעיקר בשתי הווריאציות הראשונות."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"כיצד נתפס דפוס הלֶסֶה-פֵייר בגישה ההתנהגותית?",o:["כדפוס המתאים רק לעובדים בעלי בשלות מקצועית ופסיכולוגית גבוהה","כאנטי-תזה למנהיג, כשהריכוזי והדמוקרטי נתפסו כשני קצות רצף אחד","כדפוס האפקטיבי ביותר, המאפשר לקבוצה לפעול באוטונומיה מלאה","כדפוס ביניים בין הריכוזי לדמוקרטי, המשלב את יתרונות שניהם"],c:1,e:"הגישה ההתנהגותית התמקדה בעיקר בשתי הווריאציות — הריכוזי מול הדמוקרטי — וראתה אותן על רצף אחד. הלסה פייר נחשב כאנטי-תזה למנהיג."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מהי ההנחה המשותפת לשתי קבוצות המחקר — מישיגן ואוהיו?",o:["יש להתאים את הדפוס למורכבות המשימה","יש לבנות את המצב סביב סגנונו הקבוע של המנהיג","יש דפוס התנהגותי שהוא אפקטיבי תמיד","יש להתאים את הדפוס לרמת בשלות הכפיפים"],c:2,e:"ההנחה המשותפת למחקרי מישיגן ואוהיו הייתה שיש דפוס התנהגותי שהוא אפקטיבי תמיד — הנחה אוניברסלית, שהתערערה בהמשך והובילה לגישה המצבית."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"לאילו שתי קטגוריות חילקו מחקרי אוניברסיטת מישיגן את סגנון המנהיגות?",o:["התנהגות מנהיגותית מעצבת (transformational) והתנהגות מתגמלת ומתקנת (transactional)","התנהגות אוטוקרטית, ייעוצית וקבוצתית בקבלת ההחלטות בארגון","התנהגות מנחה, תומכת, הישגית ומשתפת בהתאם למאפייני המונהגים","התנהגות ממוקדת משימה (task oriented) והתנהגות ממוקדת בעובד (people oriented)"],c:3,e:"מחקרי אוניברסיטת מישיגן (1945-1950) הסיקו שסגנון המנהיגות נחלק לשתי קטגוריות: התנהגות הממוקדת במשימה (task oriented) והתנהגות הממוקדת בעובד (people oriented)."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מהי המסקנה של מחקרי מישיגן לגבי היכולת לשלב את שני סוגי ההתנהגות?",o:["מנהיגים אינם יכולים לבטא את שני סוגי ההתנהגות בו זמנית","מנהיגים יכולים ואף חייבים לבטא את שניהם בו זמנית","מנהיגים מבטאים את שניהם רק כאשר המשימה מובנית","מנהיגים מחליפים ביניהם בהתאם לרמת הבשלות של כל אחד מהכפיפים"],c:0,e:"לפי מחקרי מישיגן, מנהיגים אינם יכולים לבטא את שני סוגי ההתנהגות בו זמנית — שני הסגנונות נתפסו כשני קצוות של רצף אחד. מחקרי אוהיו שברו את התפיסה הזו."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מהו הכלי המרכזי שבו השתמשו מחקרי אוניברסיטת אוהיו, ולמי הוא הועבר?",o:["תצפיות סמויות — על קבוצות עובדות בתנאי עבודה משתנים במפעל","\"שאלון תיאור ההתנהגות\" — למנהלים על עצמם, ולעמיתים, לממונים ולכפיפים","שאלון ה-LPC — למנהלים בלבד, לתיאור העובד הפחות מועדף עליהם","מבחני מיון פסיכוטכניים — למועמדים לתפקידי ניהול בחברות גדולות ובינוניות בלבד"],c:1,e:"מחקרי אוהיו השתמשו ב\"שאלון תיאור ההתנהגות\", שהועבר למנהלי חברות שידווחו על תפיסת המנהיגות של עצמם, וכן לעמיתים, לממונים ולכפיפים שדירגו את המידה שבה מנהיגם מבצע כל התנהגות."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מהו הממצא המרכזי של מחקרי אוניברסיטת אוהיו לגבי היחס בין שני ממדי המנהיגות?",o:["הוכח שהממד המשימתי חשוב פי שניים מהממד המתייחס","הוכח ששני הממדים משתנים יחד ותמיד באותו כיוון ובאותה עוצמה","נשבר קשר התלות — שני סגנונות המנהיגות הם בלתי-תלויים זה בזה","הוכח שהם קצוות של רצף אחד ולא ניתן לבטא את שניהם יחד"],c:2,e:"במחקרי אוהיו גילו שנשבר קשר התלות: שני סגנונות המנהיגות — יזום מבנה (משימתי) והתחשבות (מתייחס) — הם בלתי-תלויים זה בזה, ולכן מנהיג יכול להיות גבוה בשניהם."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"אילו התנהגויות מאפיינות את ממד \"יזום המבנה\" (המשימתי) במחקרי אוהיו?",o:["מתחשב ברגשותיהם של הכפופים לו ומביע הוקרה כאשר מישהו מהם עושה עבודה טובה במיוחד","מדגיש מוראל גבוה בקרב אנשיו ונותן להם הרגשה טובה בשיחה איתו","מעודד את הכפיפים להשפיע על תחומי עבודתם ונכון להתייעץ איתם","מדגיש עמידה בלוחות זמנים, מותח ביקורת על ביצועים ירודים ומציב ציפיות ברורות"],c:3,e:"ממד יזום המבנה (המשימתי) כולל: הדגשת הצורך לעמוד בלוחות זמנים, מתיחת ביקורת על ביצועים ירודים, הצעת גישות חדשות לפתרון בעיות והצבת ציפיות ביצוע ברורות."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"אילו התנהגויות מאפיינות את ממד \"ההתחשבות\" (המתייחס) במחקרי אוהיו?",o:["מתחשב ברגשות הכפופים, מביע הוקרה, מדגיש מוראל גבוה ונותן הרגשה טובה","מדגיש את הצורך לעמוד בלוחות זמנים ומציב ציפיות ביצוע ברורות","מותח ביקורת על ביצועים ירודים ומציע גישות חדשות לפתרון הבעיות שמתעוררות בעבודה","מגדיר תפקידים ומטלות ומקיים פיקוח קפדני על ביצוע המשימות"],c:0,e:"ממד ההתחשבות (המתייחס) כולל: התחשבות ברגשותיהם של הכפופים, הבעת הוקרה על עבודה טובה, הדגשת מוראל גבוה בקרב האנשים, ומתן הרגשה טובה לכפופים בשיחה עם המנהיג."},
{t:"הגישה ההתנהגותית",s:"שאלות מבחן",q:"לפי מסקנות מחקרי אוניברסיטת אוהיו, מיהו המנהיג האפקטיבי?",o:["מנהיג שאינו מתערב — משום שהקבוצה יודעת בעצמה מה עליה לעשות","מנהיג שהוא גם משימתי וגם מתייחס — התמקדות במשימה בלי לוותר על האנשים","מנהיג שהוא משימתי בלבד — משום שהמשימה קודמת תמיד לאנשים","מנהיג שהוא מתייחס בלבד — משום שהאנשים הם שמשיגים בסופו של דבר את התוצאות"],c:1,e:"לפי אוהיו, המנהיג האפקטיבי צריך להיות משימתי וגם מתייחס: עליו להתמקד במשימה, אך אסור לו שלא להתמקד באנשים. מאחר ששני הממדים בלתי-תלויים, מנהיג יכול להיות גבוה בשניהם."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"על מה מבוסס \"הסריג הניהולי\", ואיזו משבצת מייצגת את המנהל הרצוי?",o:["על שני ערכים בינאריים בכל ממד; הרצוי הוא 1,1 — אי-התערבות מוחלטת","על שלוש דרגות בכל ממד; הרצוי משתנה לפי בשלות הכפיפים ולפי המשימה","על רצף של תשיעונים בשני ממדים; הרצוי הוא 9,9 — גם משימתי וגם מתייחס","על רצף של תשיעונים בשני ממדים; הרצוי הוא 5,5 — פשרה מאוזנת בין השניים"],c:2,e:"הסריג הניהולי מתייחס למשימתי ולמתייחס כרצף של תשיעונים — רצף של עוצמות. הרבה מנהלים נמצאים ב-5,5 ולפי המודל הם צריכים להיות ב-9,9 — גם משימתי וגם מתייחס."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מה מאפיין את סגנון 1,1 בסריג הניהולי?",o:["\"המתחשב\" — דואג למורל, לאנשים ולתנאי העבודה שלהם, ומבקש ולא פוקד עליהם","\"המפשר\" — מנסה לשרוד, לויאלי למערכת וחושש משינוי ומקונפליקט","\"המשימתי\" — מקבל החלטות לבד, דורש ציות ומקיים פיקוח צמוד","\"ההנהלי\" — מתנהג לפי תקנות \"שולחן נקי\", אינו מתערב, והקבוצה פועלת לבד"],c:3,e:"סגנון 1,1 הוא \"ההנהלי\": מתנהג לפי תקנות, \"שולחן נקי\", אינו מתערב, והקבוצה פועלת לבד. זהו הנמוך בשני הממדים."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מה מאפיין את סגנון 1,9 בסריג הניהולי?",o:["\"המתחשב\" — דואג למורל, לאנשים ולתנאי העבודה, ומבקש ולא פוקד","\"המשקיע\" — משקיע במשימה ובאנשים, מלהיב, יוזם ומעורר אמון","\"המשימתי\" — מדיניות נוקשה, דורש ציות ומערכת סנקציות ברורה","\"המפשר\" — יציב בעבודה, לויאלי למערכת וחושש משינוי"],c:0,e:"סגנון 1,9 הוא \"המתחשב\": דואג למורל, דואג לאנשים, דואג לתנאי העבודה — ומבקש ולא פוקד. הוא גבוה בממד האנשים ונמוך בממד המשימה."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מה מאפיין את סגנון 5,5 בסריג הניהולי?",o:["\"המתחשב\" — ממוקד כולו במורל, באנשים ובתנאי העבודה שלהם","\"המפשר\" — מנסה לשרוד, יציב בעבודה, לויאלי למערכת וחושש משינוי ומקונפליקט","\"המשקיע\" — משקיע בו-זמנית במשימה ובאנשים ומעורר בהם אמון וכבוד הדדי לאורך זמן","\"ההנהלי\" — אינו מתערב כלל ומאפשר לקבוצה לפעול באופן עצמאי"],c:1,e:"סגנון 5,5 הוא \"המפשר\": מנסה לשרוד, יציב בעבודה, לויאלי למערכת, חושש משינוי וחושש מקונפליקט. לפי המודל, הרבה מנהלים נמצאים דווקא כאן."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מה מאפיין את סגנון 9,1 בסריג הניהולי?",o:["\"המשקיע\" — מלהיב ויוזם, ומעורר בקרב אנשיו אמון וכבוד הדדי לאורך זמן","\"ההנהלי\" — פועל לפי תקנות בלבד ומשאיר את הקבוצה לפעול לבדה","\"המשימתי\" — מקבל החלטות לבד, מדיניות נוקשה, דורש ציות, פיקוח צמוד וסנקציות ברורות","\"המתחשב\" — דואג למורל ולתנאי העבודה של אנשיו, מבקש ולא פוקד ואינו דורש מהם דבר בכוח"],c:2,e:"סגנון 9,1 הוא \"המשימתי\": מקבל החלטות לבד, מדיניות נוקשה, דורש ציות, פיקוח צמוד ומערכת סנקציות ברורה. הוא גבוה בממד המשימה ונמוך בממד האנשים."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מה מאפיין את סגנון 9,9 בסריג הניהולי?",o:["\"המפשר\" — מגיע לעמק השווה בין הדרישות השונות ומנסה לשרוד בכל מצב שנוצר","\"המשימתי\" — מקבל החלטות לבד ומקיים פיקוח צמוד על הביצוע","\"ההנהלי\" — נמנע מהתערבות ומסתפק בעמידה בתקנות הפורמליות","\"המשקיע\" — משקיע במשימה ובאנשים, מלהיב, יוזם ומעורר אמון וכבוד הדדי"],c:3,e:"סגנון 9,9 הוא \"המשקיע\": משקיע במשימה ומשקיע באנשים, מלהיב, יוזם ומעורר אמון וכבוד הדדי. זהו הסגנון הרצוי לפי הסריג הניהולי."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"לאיזו גישה בפתרון קונפליקטים מקביל סגנון 9,9 בסריג הניהולי?",o:["פתרון בעיות — העמקה בבעיה תוך ניסיון להגשים את מירב הרצונות","פשרה — הגעה לעמק השווה בין הרצון העצמי לרצון האחר","ראש בראש — הכל או לא כלום, הרצון שלי עומד בניגוד לזה של האחר","הימנעות — אי-הגררות לקונפליקט בכל מחיר ובכל מצב"],c:0,e:"כל סגנון בסריג מייצג גם גישה בפתרון קונפליקטים: 1,1 הימנעות; 1,9 ויתור; 5,5 פשרה; 9,1 ראש בראש; 9,9 פתרון בעיות — העמקה בבעיה תוך ניסיון להגשים את מירב הרצונות."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"לאיזו גישה בפתרון קונפליקטים מקביל סגנון 1,9 בסריג הניהולי?",o:["ראש בראש — הכל או לא כלום בכל מחלוקת","ויתור — ביטול הרצון העצמי מפני האחר","הימנעות — אי-הגררות לקונפליקט בכל מחיר","פשרה — הגעה לעמק השווה בין הצדדים"],c:1,e:"סגנון 1,9 (\"המתחשב\") מקביל בפתרון קונפליקטים לוויתור — ביטול הרצון העצמי מפני האחר. סגנון 1,1 מקביל להימנעות, ו-9,1 לראש בראש."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"לאיזו גישה בפתרון קונפליקטים מקביל סגנון 9,1 בסריג הניהולי?",o:["פשרה — חלוקה מאוזנת בין הרצון שלי לבין רצון האחר","הימנעות — התרחקות מכל עימות אפשרי בכל מחיר","ראש בראש — הכל או לא כלום, הרצון שלי בניגוד לרצון האחר","ויתור — ביטול מוחלט של הרצון העצמי מפני רצונו של הצד האחר"],c:2,e:"סגנון 9,1 (\"המשימתי\") מקביל בפתרון קונפליקטים ל\"ראש בראש\": הכל או לא כלום — הרצון שלי בניגוד לרצון האחר."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מהן המגבלות המרכזיות של הגישה ההתנהגותית?",o:["הסתמכות יתר על המצב ועל הנסיבות במקום על התנהגות המנהיג עצמו","קושי רב למדוד התנהגויות בפועל, בהשוואה לקלות היחסית שבמדידת תכונות מולדות","התמקדות בלעדית בכפיפים תוך התעלמות מוחלטת מהתנהגות המנהיג","התעלמות ממשתנים מתווכים ומהקונטקסט, ואי-מציאת דפוס אפקטיבי אוניברסלי"],c:3,e:"מגבלות הגישה: שאלת \"מה קדם למה\", התעלמות ממשתנים המתווכים בין ההתנהגות לתוצאות, אי-מציאת דפוס אפקטיבי אוניברסלי, והתעלמות מן הקונטקסט שבו פועלים מנהיגים — במצבים מסוימים התגלו דפוסים אחרים כאפקטיביים."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"לאיזו גישה הובילו מגבלות הגישה ההתנהגותית?",o:["לגישת התלות — הגישה המצבית","לגישת התכונות — האדם הדגול","לגישה הבירוקרטית של וובר","לגישת יחסי האנוש של מאיו"],c:0,e:"מאחר שלא נמצא דפוס התנהגותי אפקטיבי אוניברסלי, והתברר שבמצבים מסוימים דפוסים אחרים אפקטיביים יותר — נדרשה גישה חלופית: גישת התלות, היא הגישה המצבית."},
{t:"הגישה ההתנהגותית",s:"סיכום",q:"מנהל מקיים פיקוח צמוד, מקבל את ההחלטות לבדו ומפעיל מערכת סנקציות ברורה. באיזו משבצת בסריג הניהולי הוא נמצא?",o:["ב-1,1 — ההנהלי","ב-9,1 — המשימתי","ב-1,9 — המתחשב","ב-5,5 — המפשר"],c:1,e:"אלו מאפייני משבצת 9,1 — \"המשימתי\": מקבל החלטות לבד, מדיניות נוקשה, דורש ציות, פיקוח צמוד ומערכת סנקציות ברורה."}

{t:"הגישה המצבית — פידלר",s:"סיכום",q:"על מה שמה הגישה המצבית את הדגש?",o:["על דפוס ההתנהגות האוניברסלי שנמצא אפקטיבי בכל מצב ובכל ארגון","על מאפייני המונהגים בלבד, שהם הקובעים היחידים את הצלחת המנהיג","על התנהגות המנהיג או על תכונותיו בתוך ההקשר המצבי שבו הוא פועל","על התכונות המולדות של המנהיג, ללא תלות בנסיבות שבהן הוא פועל"],c:2,e:"הגישה המצבית שמה דגש על התנהגות המנהיג או על תכונותיו בתוך ההקשר המצבי שבו הוא פועל — בשונה מגישת התכונות ומהגישה ההתנהגותית, שהיו אוניברסליות."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מהם שני קווי המחקר העיקריים של הגישה המצבית?",o:["המצב כמשתנה תלוי בלבד, והמנהיג כמשתנה בלתי תלוי הקובע לבדו את התוצאה הסופית","התכונות כמשתנה בלתי תלוי, וההתנהגות כמשתנה תלוי הנגזר מהן","המונהגים כמשתנה בלתי תלוי, והמנהיג כמשתנה תלוי הנגזר מרצונם","המצב כמשתנה בלתי תלוי, והמצב כמשתנה ממתן בין התנהגות המנהיג לאפקטיביות"],c:3,e:"שני קווי המחקר: המצב כמשתנה בלתי תלוי (מאפייני המצב ← סגנון המנהיגות), והמצב כמשתנה ממתן/מתנה (תכונות וסגנון ← מאפייני המצב ← אפקטיביות)."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מהי תפיסת המנהיגות של פידלר לגבי הקשר בין ההיסטוריה למנהיג?",o:["ההיסטוריה היא שעושה את המנהיג ולא להפך — דטרמיניזם","המנהיג הוא שעושה את ההיסטוריה — תיאוריית האדם הדגול","אין קשר בין השניים — המנהיגות היא תכונה מולדת קבועה","הקשר דו-כיווני ושווה בעוצמתו בין המנהיג לנסיבות"],c:0,e:"לפי פידלר, המנהיגות היא תולדה של נסיבות: מהות הקבוצה וסוג האתגרים שמולם היא נדרשת להתמודד יכתיבו את סוג המנהיגות שתתפתח. ההיסטוריה היא שעושה את המנהיג ולא להפך — דטרמיניזם."},

{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מה משמעות ציון LPC גבוה (63 ומעלה) לעומת ציון נמוך (57 ומטה)?",o:["LPC גבוה — מנהיג מכוון משימה; LPC נמוך — מנהיג מכוון אנשים","LPC גבוה — מנהיג אפקטיבי; LPC נמוך — מנהיג שאינו אפקטיבי","LPC גבוה — מנהיג מנוסה; LPC נמוך — מנהיג חסר ניסיון בתפקיד","LPC גבוה — מנהיג מכוון אנשים; LPC נמוך — מנהיג מכוון משימה"],c:3,e:"LPC גבוה (ציון 63+) מציין מנהיג מכוון אנשים; LPC נמוך (ציון 57-) מציין מנהיג מכוון משימה. לפי פידלר סגנון המנהיגות הוא מרכיב קשיח."},

{t:"הגישה המצבית — פידלר",s:"שאלות מבחן",q:"לפי פידלר, באילו תנאים יש צורך במנהיג מכוון משימה?",o:["רק כאשר עמדת הכוח של המנהל בקבוצה חזקה","בתנאים הקיצוניים — הנוחים ביותר והקשים ביותר","בתנאי הביניים בלבד, שאינם קיצוניים לשום כיוון","בכל התנאים, ללא תלות במאפייני המצב שנוצר"],c:1,e:"לפי מודל התלות של פידלר, המנהיג מכוון המשימה (LoLPC) אפקטיבי יותר במצבים הקיצוניים, ואילו המנהיג מכוון האנשים (HiLPC) אפקטיבי יותר במצבי הביניים."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"באילו מצבים אפקטיבי יותר, לפי פידלר, המנהיג מכוון האנשים (HiLPC)?",o:["בכל המצבים כאחד","רק כשהמשימה מובנית","במצבי הביניים","במצבים הקיצוניים"],c:2,e:"לפי פידלר, המנהיג מכוון האנשים (HiLPC) אפקטיבי יותר במצבי הביניים, בעוד המנהיג מכוון המשימה (LoLPC) אפקטיבי יותר במצבים הקיצוניים."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"על פי מחקריו של פידלר, מתי הסגנון המשימתי אפקטיבי במיוחד בקצה הקשה של הרצף?",o:["כשהיחסים עם העובדים טובים, המשימה מובנית היטב ועמדת הכוח חזקה מאוד","כשהיחסים טובים אך המשימה מעורפלת ועמדת הכוח בינונית","כשהיחסים גרועים אך המשימה מובנית ועמדת הכוח חזקה מאוד","כשהיחסים עם העובדים גרועים, מבנה המשימה מעורפל ועמדת הכוח חלשה"],c:3,e:"על פי מחקריו של פידלר, הסגנון המשימתי אפקטיבי כאשר היחסים של המנהל עם עובדיו גרועים, מבנה המשימה מעורפל ועמדת הכוח שלו חלשה — קרי בקצה הקשה של הרצף."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מהי מסקנתו המעשית של פידלר להגדלת האפקטיביות של מנהיג?",o:["לבנות את המצב המתאים לסגנונו, ולא ללמדו להתאים את סגנונו למצב","ללמד את המנהיג לזהות את המצב ולהחליף סגנון בהתאם לדרישות המשתנות","לאפשר לקבוצה לבחור את המנהיג המתאים ביותר לכל משימה בנפרד","לפצל את התפקיד בין שני מנהיגים — אחד משימתי ואחד חברתי"],c:0,e:"מסקנת פידלר: כדי להגדיל את האפקטיביות של מנהיג אין ללמדו להתאים את סגנונו למצב אלא לבנות את המצב המתאים לסגנונו. מינוי מנהלים ייעשה לפי סוג המשימה, ופיתוח מנהיגים על ידי יצירת התנאים הנוחים ביותר להם."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"במה נבדל פידלר משאר הגישה המצבית בשאלת ההלימה בין הסגנון למצב?",o:["פידלר גורס שהמצב אינו רלוונטי כלל, בניגוד לשאר הגישה המצבית","הגישה המצבית גורסת שיש להתאים את הסגנון למצב, ופידלר גורס שיש להתאים את המצב לסגנון","הגישה המצבית גורסת שיש סגנון אחד אפקטיבי לכל המצבים, ופידלר גורס שיש להתאים את הסגנון למצב","פידלר גורס שהמנהיג צריך להחליף סגנון בכל משימה, בניגוד לשאר הגישה"],c:1,e:"הגישה המצבית באופן כללי טוענת שיש לבצע הלימה בין סגנון המנהיגות למצב. פידלר מסכים שאין סגנון אפקטיבי אחד, אך אינו סובר שעל המנהיג לסגל את עצמו — לדעתו יש לבנות את המצב סביב הסגנון הקשיח."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מה מאפיין את המנהיג המשימתי במודל של פידלר (1971), ומה משך כהונתו?",o:["חותר לקונצנזוס ומעריך הרמוניה חברתית בקבוצה — וכהונתו תלויה כל העת בהסכמת חבריה","מציג חזון ומעורר השראה — וכהונתו נמשכת כל עוד החזון רלוונטי","נותן עצות, מספק מידע, מתכנן ומתרכז בהשלמת המשימה — וכהונתו זמנית ופגה עם סיומה","מגן על אנשיו, מפייס ומטפח יחסי חברות — וכהונתו נמשכת לאורך זמן"],c:2,e:"המנהיג המשימתי מתבלט כשצריך לבצע תפקיד או משימה מסוימת: נותן עצות, מספק מידע, מעביר ביקורת, מתכנן פעילויות, מונה בעיות, מארגן ומתרכז בהשלמת המשימה. כהונתו זמנית ופגה עם השלמת המשימה."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מה מאפיין את המנהיג החברתי במודל של פידלר (1971)?",o:["מתכנן פעילויות, מונה את הבעיות ומתרכז בהשלמת המשימה — וכהונתו זמנית בלבד ופגה עם סיומה","מציב ציפיות ביצוע ברורות ומותח ביקורת על ביצועים ירודים בקבוצה","עוסק באיתור סטיות וחריגות ומתערב רק כאשר מתגלה תקלה בעבודה","מגן על אנשיו, מעודד, מפייס, מטפח יחסי חברות ודואג ללכידות — ויכול להנהיג לאורך זמן"],c:3,e:"המנהיג החברתי מתבלט כשעולה הצורך לגבש את הקבוצה מבחינה חברתית: מגן על אנשיו, מעודד, מפייס, מטפח יחסי חברות, מספר בדיחות להפגת מתח, דואג לסולידריות, מיישב סכסוכים ומעלה את המורל. הוא יכול להנהיג לאורך זמן."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מהו תפקידה של הקבוצה בארגון לפי פידלר?",o:["היא האמצעי העיקרי להשגת מטרות המנהל","היא מקור הסמכות הפורמלית של המנהל","היא הגורם הקובע את סגנון המנהיגות של המנהל","היא המשתנה התלוי היחיד במודל התלות"],c:0,e:"לפי פידלר, הקבוצה בארגון היא האמצעי העיקרי להשגת מטרות המנהל — ומכאן חשיבות ההלימה בין סגנון המנהיג לבין מאפייני הקבוצה והמשימה."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מהי אחת הביקורות המרכזיות על תיאוריית התלות של פידלר בהקשר של שינוי סגנון?",o:["הטענה שהמודל אינו מבחין כלל בין סגנון משימתי לבין סגנון מכוון אנשים","הטענה שסגנון המנהיגות אינו ניתן לשינוי, בעוד במציאות מנהיגים משנים את התנהגותם","הטענה שסגנון המנהיגות משתנה בקלות רבה מדי בין מצב למצב ולכן אינו ניתן כלל למדידה","הטענה שהמודל מתעלם לחלוטין ממאפייני המצב ומתמקד רק במנהיג עצמו"],c:1,e:"בין הביקורות על תיאוריית ה-LPC: סגנון המנהיגות אינו ניתן לשינוי; התיאוריה אינה מסבירה כיצד ציון ה-LPC משפיע על ביצועי הקבוצה; וסגנון ההתנהגות מוצג כרצף אחד בעל שני קצוות בלבד."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מדוע רואים סמית ופטרסון במודל של פידלר תיאוריה \"תלוית-מצב למחצה\"?",o:["משום שהמודל תקף רק במחצית מהמצבים — הקיצוניים — ולא במצבי הביניים","משום שהמודל בוחן רק את מחצית מהמנהיגים — אלו בעלי LPC נמוך בלבד","משום שהגדרת המצב ביחס למשימות והיחס בין המנהיג לקבוצתו היא קבועה, בעוד שבמציאות הכל משתנה","משום שהמודל מתייחס רק למחצית מהמשתנים המצביים הרלוונטיים לניהול של ארגונים ולהבנת התנהלותם"],c:2,e:"סמית ופטרסון רואים במודל של פידלר ובבאים אחריו תיאוריות תלויות-מצב למחצה, שכן במודלים אלה הגדרת המצב ביחס למשימות והיחס בין המנהיג לקבוצתו היא קבועה — בעוד שבמציאות הארגונית הדינמית המצב, מאפייניו ונטיות המנהיגים משתנים כל הזמן."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מהי הביקורת על היקף גורמי המצב שמציע פידלר?",o:["פידלר מציע הגדרה רחבה מדי של גורמי המצב, שאינה ניתנת כלל למדידה מעשית בפועל","פידלר מתעלם כליל מגורמי המצב ומתמקד באישיות המנהיג בלבד","פידלר מגדיר גורמי מצב המשתנים מדי יום ולכן אינם ניתנים לניבוי","פידלר מציע הגדרה מצומצמת מדי של גורמי המצב המשפיעים על המנהיג ועל יעילותו"],c:3,e:"אחת הביקורות: פידלר מציע הגדרה מצומצמת מדי של גורמי המצב המשפיעים על המנהיג ועל יעילותו — שלושה מאפיינים בלבד."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"על מה מבוססת המלצתו של פידלר בנוגע למינוי מנהלים?",o:["המינוי צריך להיעשות לפי סוג המשימה המוטלת עליהם","המינוי צריך להיעשות לפי הוותק שלהם בארגון","המינוי צריך להיעשות לפי בחירת הקבוצה שתנוהל","המינוי צריך להיעשות לפי ציוני מבחני המיון בלבד"],c:0,e:"פידלר ממליץ שמינוי מנהלים ייעשה לפי סוג המשימה המוטלת עליהם, ושפיתוח מנהיגים ייעשה על ידי יצירת התנאים הנוחים ביותר להם — משום שהסגנון עצמו קשיח."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"מנהל בעל ציון LPC של 65 נכנס לתפקיד שבו היחסים בקבוצה סבירים, המשימה חלקית מובנית וכוחו בינוני. מה צפוי לפי פידלר?",o:["אין דרך לחזות, שכן פידלר אינו מתייחס למצבי ביניים במודל שלו","הוא צפוי להיות אפקטיבי, שכן מנהיג מכוון אנשים מתאים למצבי הביניים","הוא צפוי להיכשל, שכן מנהיג מכוון אנשים מתאים רק למצבים הקיצוניים","הוא צפוי להיות אפקטיבי רק אם ישנה את סגנונו לסגנון משימתי מובהק"],c:1,e:"ציון LPC של 65 (מעל 63) מציין מנהיג מכוון אנשים. לפי מודל התלות, המנהיג מכוון האנשים (HiLPC) אפקטיבי יותר דווקא במצבי הביניים — ולכן הוא מתאים למצב המתואר."},
{t:"הגישה המצבית — פידלר",s:"סיכום",q:"במה התמקד חקר המנהיגות לפי גישת התלות של פידלר?",o:["בזיהוי דפוס ההתנהגות היחיד שהוא אפקטיבי בכל מצב נתון","בזיהוי הצרכים הנפשיים שהמנהיג ממלא עבור המונהגים שלו","בזיהוי ובמיפוי של תנאי מצב לאורך ההיסטוריה אשר הצמיחו מנהיגים","בזיהוי התכונות המולדות המשותפות לכלל המנהיגים שנחקרו לאורך השנים"],c:2,e:"חקר המנהיגות לפי גישה זו התמקד בזיהוי ומיפוי של תנאי מצב לאורך ההיסטוריה האנושית אשר הצמיחו מנהיגים — המנהיגות כתולדה של נסיבות."}
]);

/* ===================== 11. הרסי ובלנשארד ורדין ===================== */
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"בשני אילו גורמים תלוי סגנון המנהיגות הרצוי לפי הרסי ובלנשארד?",o:["באיכות ההחלטה הנדרשת ובמידת המחויבות של העובדים אליה","ביחסי המנהל-עובדים, במבנה המשימה ובעמדת הכוח של המנהל בקבוצה שלו","ברמת האינטליגנציה של המנהיג וברמת הלחץ שבה הוא פועל","ברמת הבגרות המקצועית של הכפיפים וברמת הבגרות הפסיכולוגית שלהם"],c:3,e:"לפי הרסי ובלנשארד, סגנון המנהיגות הרצוי תלוי בשני גורמים: רמת הבגרות המקצועית (בשלות תפקודית) של הכפיפים, ורמת הבגרות הפסיכולוגית שלהם."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מהם שלושת מרכיבי הבשלות המקצועית (התפקודית) לפי הרסי ובלנשארד?",o:["ידע, ניסיון וביטחון עצמי בעבודה, ומיומנות בעבודה","ביטחון בביצוע המשימה, מחויבות כלפיה ומוטיבציה","עצמאות, יכולת ליטול אחריות ומניע ההישג","השכלה, גיל ותרבות ארגונית שנוצרה בארגון"],c:0,e:"שלושת מרכיבי הבשלות המקצועית: ידע, ניסיון וביטחון עצמי בעבודה, ומיומנות בעבודה. מרכיבי הבשלות הפסיכולוגית הם ביטחון בביצוע המשימה, מחויבות כלפיה ומוטיבציה."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מהם שלושת מרכיבי הבשלות הפסיכולוגית לפי הרסי ובלנשארד?",o:["יושר, אמינות ולויאליות כלפי מטרות הארגון","ביטחון בביצוע המשימה, מחויבות כלפי המשימה ומוטיבציה","ידע, ניסיון בעבודה ומיומנות מקצועית בביצוע המשימה בפועל","אינטליגנציה, יצירתיות ויכולת עמידה בלחץ"],c:1,e:"שלושת מרכיבי הבשלות הפסיכולוגית: ביטחון בביצוע המשימה, מחויבות כלפי המשימה ומוטיבציה/הנעה. מרכיבי הבשלות המקצועית הם ידע, ניסיון ומיומנות."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מה נכון לגבי אופייה של הבשלות במודל הרסי ובלנשארד?",o:["הבשלות נקבעת אך ורק לפי ותק העובד בארגון ואינה משתנה עם הזמן","הבשלות היא תכונה מולדת שאינה ניתנת לשינוי באמצעות הכשרה או ניסיון","הבשלות אינה מאפיין אישיות אלא נמדדת כלפי משימה, וייתכנו רמות שונות במשימות שונות","הבשלות היא מאפיין אישיות קבוע ויציב, ולכן היא זהה בכל המשימות שהעובד מבצע בארגון שלו"],c:2,e:"הבשלות היא לא מאפיין אישיות אלא כלפי משימה — ייתכן שאדם יהיה בעל רמות בשלות שונות כלפי משימות שונות."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מה נכון לגבי בשלות של קבוצה לפי הרסי ובלנשארד?",o:["היא בדיוק ממוצע הבשלות של כל חברי הקבוצה, ומשקפת את בשלות כל אחד מהם","היא נקבעת לפי בשלותו של החבר הבשל ביותר בקבוצה, שמושך את השאר אחריו","היא נקבעת לפי בשלותו של החבר הפחות בשל בקבוצה, שהוא החוליה החלשה","אי אפשר לאפיין אותה כסך בשלות משתתפיה, והיא אינה מדד לבשלות העובד הבודד"],c:3,e:"יש גם בשלות קבוצה — אי אפשר לאפיין אותה על ידי סך בשלות משתתפיה אלא על פי בשלות המשימה. בשלות הקבוצה אינה מדד לבשלות עובד או משתתף בקבוצה."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מהי \"בגרות\" לפי הרסי ובלנשארד, ובמה היא קשורה?",o:["מידת העצמאות, היכולת ליטול אחריות ומניע ההישג — וקשורה בהשכלה, בגיל, בניסיון ובתרבות הארגונית","מידת הציות לנהלים והדיוק בביצוע המשימות — וקשורה במידת הפיקוח הצמוד שמפעיל הממונה הישיר עליו בפועל","מידת ההזדהות עם המנהיג והנכונות לחקות אותו — וקשורה בכריזמה של המנהיג","מידת שביעות הרצון מהשכר ומתנאי העבודה — וקשורה בשיטת התגמול בארגון"],c:0,e:"בגרות היא מידת העצמאות, היכולת ליטול אחריות ומניע ההישג שיש ליחידים ולקבוצות העבודה. רמת הבגרות קשורה בהשכלת העובדים, בגילם, בניסיונם בעבודה ובתרבות הארגונית שנוצרה בארגון."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"על איזו הנחת יסוד נשענים ארבעת דפוסי המנהיגות של הרסי ובלנשארד?",o:["על הנחת מקגרגור שהעובדים עצלים מטבעם וזקוקים לפיקוח הדוק","על הנחת אוהיו שהממד המשימתי והממד המתייחס בלתי תלויים זה בזה","על הנחת מישיגן ששני הממדים הם קצוות של רצף אחד שאין לשלב ביניהם","על הנחת פידלר שסגנון המנהיגות הוא מרכיב קשיח שאינו ניתן לשינוי"],c:1,e:"הנחת היסוד של המודל היא הנחת אוהיו — שהמנהיגות המתייחסת והמשימתית הם משתנים בלתי תלויים זה בזה. בהתאם לכך נוצרים ארבעה דפוסי מנהיגות: S1 עד S4."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מהו דפוס S1 במודל הרסי ובלנשארד, ולאיזה מצב מונהגים הוא מתאים?",o:["הדפוס המשתף — מתייחס גבוה ומשימתי נמוך, למונהגים שיש להם יכולת ואין מוכנות","הדפוס המאציל — משימתי ומתייחס נמוכים, למונהגים שיש להם יכולת ויש מוכנות","הדפוס ההוראתי — משימתי גבוה ומתייחס נמוך, למונהגים שאין להם יכולת ואין מוכנות","הדפוס המשווק — משימתי ומתייחס גבוהים, למונהגים שאין להם יכולת אך יש להם מוכנות"],c:2,e:"S1 הוא הדפוס ההוראתי: התנהגות משימתית גבוהה, הגדרת תפקידים ומטלות ופיקוח קפדני. הוא מתאים למונהגים בבשלות נמוכה — אין יכולת ואין מוכנות או חוסר ביטחון."},
{t:"הרסי ובלנשארד ורדין",s:"שאלות מבחן",q:"לפי הרסי ובלנשארד, כאשר אין למונהגים מוכנות ואין בשלות — באיזה סגנון מנהיגות נכון להשתמש?",o:["בסגנון משתף","בסגנון מאציל","בסגנון משווק","בסגנון הוראתי"],c:3,e:"כאשר אין יכולת ואין מוכנות (בשלות נמוכה), נכון להשתמש בסגנון המנהיגות ההוראתי — S1: התנהגות משימתית גבוהה, הגדרת תפקידים ומטלות ופיקוח קפדני."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מהו דפוס S2 (המשווק/המוכר) במודל הרסי ובלנשארד?",o:["מנהיגות משימתית ומתייחסת גבוהות — מגדיר משימות יחד עם התייחסות ושכנוע","מנהיגות משימתית גבוהה ומתייחסת נמוכה — הגדרת מטלות ופיקוח קפדני","מנהיגות מתייחסת גבוהה ומשימתית נמוכה — מתן הוראות כלליות תוך שיתוף הצוות","מנהיגות נמוכה בשני הממדים — השליטה עוברת במלואה אל הקבוצה"],c:0,e:"S2 הוא הדפוס המשווק/המוכר (Selling): מנהיגות משימתית ומתייחסת גבוהות — המנהיג מגדיר משימות יחד עם התייחסות ושכנוע. הוא מתאים למונהגים שאין להם יכולת אך יש להם מוכנות וביטחון."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"לאיזה מצב מונהגים מתאים דפוס S2 (המשווק) לפי הרסי ובלנשארד?",o:["ניסיון, ידע ומוטיבציה גבוהים כאחד — בשלות מלאה בכל הממדים","ניסיון, ידע ויכולת מקצועית נמוכים, אך ביטחון עצמי ומוטיבציה גבוהים","ניסיון, ידע ויכולת מקצועית גבוהים מאוד, אך נכונות ומוטיבציה נמוכים מאוד","ניסיון, ידע ומוטיבציה נמוכים כאחד — חוסר בשלות בכל הממדים"],c:1,e:"S2 מתאים למונהגים בעלי ניסיון, ידע ויכולת מקצועית נמוכים, אך ביטחון עצמי ומוטיבציה גבוהים. הדוגמה בסיכום: טירונים ביחידה מובחרת — מוטיבציה גבוהה אך חסרי ידע מקצועי."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מהו דפוס S3 (המשתף) במודל הרסי ובלנשארד, ולמי הוא מתאים?",o:["מיקוד נמוך במשימה וביחסים — למונהגים שיש להם גם יכולת וגם מוכנות","מיקוד גבוה במשימה ובאנשים — למונהגים שאין להם יכולת אך יש מוכנות","התנהגות משימתית נמוכה והתמקדות ביחסים — למונהגים שיש להם יכולת אך אין מוכנות","התנהגות משימתית גבוהה ופיקוח קפדני — למונהגים שאין להם יכולת ואין להם כל מוכנות"],c:2,e:"S3 הוא הדפוס המשתף: התנהגות משימתית נמוכה, התמקדות ביחסים ומתן הוראות כלליות תוך שיתוף. הוא מתאים למונהגים שיש להם יכולת אך אין מוכנות או שיש חוסר ביטחון — למשל ותיקים במשבר מוטיבציה."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מהו דפוס S4 (המאציל) במודל הרסי ובלנשארד?",o:["מיקוד גבוה במשימה וביחסים — הכוונה צמודה ושכנוע","מיקוד גבוה במשימה ונמוך ביחסים — פיקוח קפדני","מיקוד גבוה ביחסים ונמוך במשימה — שיתוף והתייעצות","מיקוד נמוך במשימה וביחסים — השליטה עוברת לקבוצה"],c:3,e:"S4 הוא הדפוס המאציל (Delegating): מיקוד נמוך במשימה וביחסים — השליטה עוברת לקבוצה. הוא מתאים לעובדים בעלי ניסיון, ידע וכישורים גבוהים לצד ביטחון עצמי, מחויבות ומוטיבציה גבוהים."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"בסיכום מודגמים דפוסי הרסי ובלנשארד באמצעות חיילים. לאיזה דפוס מתאימים \"חיילים ותיקים ביחידה מובחרת הנמצאים במשבר\"?",o:["לדפוס המשתף (S3) — יש להם ידע וכישורים אך חסרה להם מוטיבציה","לדפוס ההוראתי (S1) — חסרים להם גם ידע מקצועי וגם מוטיבציה","לדפוס המשווק (S2) — יש להם מוטיבציה גבוהה אך חסר להם ידע","לדפוס המאציל (S4) — יש להם גם ידע מקצועי וגם מוטיבציה גבוהה"],c:0,e:"חיילים ותיקים ביחידה מובחרת הנמצאים במשבר מאופיינים בידע ובכישורים מקצועיים אך חסרי מוטיבציה — ולכן מתאים להם הדפוס המשתף (S3): יש יכולת ואין מוכנות."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"לאיזה דפוס מתאימים \"חיילים בסוף מסלול, בעלי ידע מקצועי ומוטיבציה גבוהה\"?",o:["לדפוס ההוראתי (S1)","לדפוס המאציל (S4)","לדפוס המשתף (S3)","לדפוס המשווק (S2)"],c:1,e:"חיילים בסוף מסלול, בעלי ידע מקצועי ומוטיבציה גבוהה, מתאימים לדפוס המאציל (S4) — יש יכולת ויש מוכנות, ולכן השליטה יכולה לעבור לקבוצה."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מהן הביקורות המרכזיות על תיאוריית המנהיגות המצבית של הרסי ובלנשארד?",o:["התמקדות במספר רב מדי של משתני מצב, שאינם ניתנים לניתוח בו-זמנית","הנחה שסגנון המנהיגות הוא קשיח ואינו ניתן לשינוי כלל, בניגוד למציאות המוכרת בשטח ובארגונים","מחסור בתמיכה אמפירית, היעדר הבחנה ברורה בין רמות הבגרות, וקושי למדוד מחויבות ויכולות","עודף תמיכה אמפירית שאינה מתיישבת עם ממצאי מחקרי אוהיו ומישיגן"],c:2,e:"הביקורות: מחסור בתמיכה אמפירית; אין הבחנה ברורה בין רמות הבגרות השונות; לא ברור כיצד ניתן למדוד את מחויבות ויכולות העובדים; אין פירוט של התהליך שדרכו דפוסי ההתנהגות משפיעים על התוצאות; וההתייחסות למצב מוגבלת למשתנה אחד."},
{t:"הרסי ובלנשארד ורדין",s:"מחוץ להיקף",q:"לפי המודל של רדין, אילו שאלות יש לשאול על העובדים כדי לאפיין את המצב?",o:["האם הם מרוצים משכרם, האם הם ותיקים, והאם הם מזדהים עם הארגון","האם הם מקיימים ביניהם קשרים חברתיים, והאם נוצרה ביניהם לכידות","האם הם מסכימים עם יעדי הארגון, והאם הם חלוקים ביניהם על החלופות","האם יש להם הידע הדרוש, האם הם מנוסים, והאם הם רוצים לקחת אחריות"],c:3,e:"לפי רדין, לאפיון העובדים יש לשאול: האם הם בעלי הידע הדרוש לביצוע המשימה? האם הם מנוסים? האם הם רוצים לקחת על עצמם אחריות?"},
{t:"הרסי ובלנשארד ורדין",s:"מחוץ להיקף",q:"אילו חמישה מרכיבי מצב מונה המודל של רדין?",o:["העובדים, המשימה, הממונה, העמיתים ותרבות הארגון","הידע, הניסיון, המיומנות, הביטחון והמוטיבציה","היחסים, מבנה המשימה, עמדת הכוח, הלחץ והניסיון","איכות ההחלטה, מקובלותה, המידע, המבנה וההסכמה"],c:0,e:"רדין מונה חמישה מרכיבי מצב: העובדים (ידע, ניסיון, נכונות לאחריות), המשימה (פשוטה או מורכבת, שגרתית או חדשנית), הממונה (מה הוא מצפה), העמיתים (תלות ולחץ), ותרבות הארגון (בירוקרטית ושמרנית או דינמית וחדשנית)."},
{t:"הרסי ובלנשארד ורדין",s:"מחוץ להיקף",q:"לפי הדוגמה במודל של רדין: עובדים חדשים חסרי ניסיון ובעלי ידע מקצועי מועט, ומשימה בינונית במורכבותה. מהו הסגנון המתאים?",o:["הסגנון \"המקושר\" — מוכוונות גבוהה לאנשים ונמוכה למשימה","הסגנון \"המשלב\" — מוכוונות גבוהה הן לאנשים והן למשימה","הסגנון \"הרגוע\" — מוכוונות נמוכה הן לאנשים והן למשימה","הסגנון \"המסור\" — מוכוונות גבוהה למשימה ונמוכה לאנשים"],c:1,e:"בדוגמה I של רדין: המנהל דירג את עובדיו החדשים כחסרי ניסיון ובעלי ידע מקצועי מועט, ואת המשימה כבינונית במורכבותה ובמסגרת הזמן. הסגנון המתאים הוא ה\"משלב\" — מוכוונות גבוהה הן לאנשים והן למשימה."},
{t:"הרסי ובלנשארד ורדין",s:"מחוץ להיקף",q:"לפי הדוגמה השנייה במודל של רדין: העובדים מומחים והמשימה פשוטה. מהו הסגנון המוצדק?",o:["הסגנון המשימתי","הסגנון ההוראתי","הסגנון הרגוע","הסגנון המשלב"],c:2,e:"בדוגמה II של רדין: כאשר העובדים מומחים והמשימה פשוטה, נכון ומוצדק לנקוט בסגנון הרגוע — אין צורך במוכוונות גבוהה לא למשימה ולא לאנשים."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"מהן הביקורות הכלליות על הגישה המצבית כולה?",o:["תמיכה אמפירית רחבה מדי, המקשה על בחירת המודל המתאים לכל מצב","התעלמות מוחלטת ממאפייני העובדים ומן המשימה, והתמקדות במנהיג ובתכונותיו בלבד","הנחה שקיים סגנון מנהיגות אחד אפקטיבי, בניגוד לממצאים בשטח","תמיכה אמפירית מוגבלת, מורכבות המצב אינה משתקפת בתיאוריות, וקושי ביישום"],c:3,e:"הביקורות על הגישה המצבית: תמיכה אמפירית מוגבלת; האם יש דרך אחת נכונה לכל מצב? האם כל מי שינתח את אותו מצב יגיע לאותה מסקנה? מורכבות המצב אינה משתקפת בתיאוריות; וקיים קושי ביישום."},
{t:"הרסי ובלנשארד ורדין",s:"סיכום",q:"עובדת חדשה בעלת מוטיבציה גבוהה מאוד אך ללא ידע מקצועי בתחום. איזה סגנון מתאים לה לפי הרסי ובלנשארד?",o:["הסגנון המשווק (S2) — הגדרת משימות יחד עם התייחסות ושכנוע","הסגנון ההוראתי (S1) — הגדרת מטלות ופיקוח קפדני ללא התייחסות","הסגנון המשתף (S3) — מתן הוראות כלליות תוך שיתוף בהחלטות","הסגנון המאציל (S4) — העברת השליטה המלאה אל העובדת עצמה"],c:0,e:"עובדת בעלת מוטיבציה וביטחון גבוהים אך ידע ויכולת מקצועית נמוכים מתאימה לדפוס S2 — המשווק/המוכר: מנהיגות משימתית ומתייחסת גבוהות, הגדרת משימות יחד עם התייחסות ושכנוע."}
]);

/* ===================== 12. וורום-ייטון, משאבים קוגניטיביים ונתיב-מטרה ===================== */
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"במה עוסק המודל הנורמטיבי של וורום וייטון (1973)?",o:["בהשפעת רמת הלחץ על תרומת האינטליגנציה לביצועי הקבוצה","במצבים של קבלת החלטות ובמידת שיתוף העובדים המתאימה לכל מצב","ברמת הבשלות המקצועית והפסיכולוגית של הכפיפים בכל משימה ומשימה","ביחסי המנהל-עובדים, במבנה המשימה ובעמדת הכוח של המנהל"],c:1,e:"המודל הנורמטיבי של וורום וייטון מתייחס למצבים של קבלת החלטות. אין סגנון אחד שמתאים לכל מצב — במצבי החלטה שונים נדרשות רמות שונות של תשומות (שיתוף) מצד הכפיפים."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מהן שלוש קטגוריות קבלת ההחלטות במודל של וורום וייטון?",o:["מנחה, תומך והישגי לפי מאפייני העובד","משימתי, מתייחס ומשלב בין שני הממדים","אוטוקרטי (A), ייעוצי (C) וקבוצתי (G)","הוראתי (S1), משווק (S2) ומשתף (S3)"],c:2,e:"שלוש הקטגוריות: אוטוקרטי (A) — המנהיג מקבל את ההחלטות מבלי לאסוף מידע מהעובדים; ייעוצי (C) — אוסף מידע מהכפיפים אך מחליט בעצמו; קבוצתי (G) — הקבוצה מקבלת את ההחלטה והמנהל הוא חבר נוסף."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מה מאפיין את הדפוס C-I במודל של וורום וייטון?",o:["המנהיג משתף את העובדים כקבוצה, שומע את דעותיהם ואז מחליט בעצמו","המנהיג אוסף מידע מן העובדים ואז מקבל את ההחלטה בעצמו וללא כל התייעצות","המנהיג משמש כחבר נוסף בקבוצה ומקבל את ההחלטה שהתקבלה בה","המנהיג משתף כל אחד מהעובדים בנפרד, שומע את דעותיהם ואז מחליט בעצמו"],c:3,e:"בדפוס C-I המנהיג משתף כל אחד מהעובדים בנפרד בבעיה, שומע את דעותיהם ולאחר מכן מקבל את ההחלטה בעצמו. ב-C-II הוא משתף את העובדים כקבוצה ואז מחליט בעצמו."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מה מאפיין את הדפוס G-II במודל של וורום וייטון?",o:["החלטה קבוצתית — המנהיג חבר נוסף, אינו מנסה להשפיע ומקבל את החלטת הקבוצה","החלטה אישית — המנהיג מחליט לאור המידע הזמין לו בלבד וללא כל התייעצות עם אחרים","החלטה מדורגת — המנהיג מחליט ומביא את ההחלטה לאישור הקבוצה בדיעבד","החלטה משותפת — המנהיג והקבוצה מחליטים יחד, אך למנהיג זכות וטו"],c:0,e:"בדפוס G-II ההחלטה קבוצתית: המנהיג משמש כחבר נוסף בקבוצה, אינו מנסה להשפיע על הקבוצה ומקבל את ההחלטה המתקבלת בקבוצה."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"בשני אילו משתנים תלויה בחירת סגנון קבלת ההחלטות המתאים במודל של וורום וייטון?",o:["ברמת הלחץ ובניסיונו של המנהיג בתפקיד","באיכות ההחלטה ובמחויבות העובדים אליה","בבשלות המקצועית ובבשלות הפסיכולוגית","ביחסי המנהל-עובדים ובמבנה המשימה"],c:1,e:"בחירת הסגנון תלויה בשני משתנים: איכות ההחלטה — המידה שבה יש להחלטה סיכוי להשפיע על תפקוד הארגון; ומחויבות העובדים — המידה שבה מחויבותם להחלטה שהתקבלה היא חיונית."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מהי \"איכות ההחלטה\" כמשתנה במודל של וורום וייטון?",o:["המידה שבה ההחלטה מתקבלת במהירות ובעלות נמוכה","המידה שבה ההחלטה תואמת את הנהלים הכתובים בארגון","המידה שבה יש להחלטה סיכוי להשפיע על תפקוד הארגון","המידה שבה העובדים מקבלים את ההחלטה ומזדהים איתה"],c:2,e:"איכות ההחלטה היא המידה שבה יש להחלטה סיכוי להשפיע על תפקוד הארגון. המשתנה השני הוא מחויבות העובדים — המידה שבה מחויבותם להחלטה חיונית."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"אילו משתני מצב נלקחים בחשבון במודל הנורמטיבי של קבלת ההחלטות?",o:["ידע, ניסיון, מיומנות, ביטחון עצמי, מחויבות ומוטיבציה של כל אחד ואחד מן העובדים בצוות","יחסי המנהל-עובדים, מבנה המשימה ועמדת הכוח של המנהל בקבוצה","גיוון המיומנויות, זהות המשימה, משמעותה, האוטונומיה והמשוב","אופי המטלה, מבנה הקבוצה, חשיבות איכות ההחלטה וכמות המידע שברשות המנהיג והעובדים"],c:3,e:"משתני המצב במודל: אופי המטלה, מבנה הקבוצה, חשיבות איכות ההחלטה, כמות המידע הרלוונטי שיש למנהיג ולעובדים, המידה שבה הבעיה אינה מובנית ומצריכה פתרון יצירתי, חשיבות מקובלות ההחלטה, מידת הסכמת העובדים עם יעדי הארגון, ומידת חוסר ההסכמה בין העובדים ביחס לחלופות."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מהן הביקורות על המודל הנורמטיבי של קבלת ההחלטות?",o:["הוא עוסק רק בהיבט אחד של מנהיגות, מפשט את התהליך, ומתעלם מכך שייתכן שלמנהלים חסרות המיומנויות ליישמו","הוא עוסק במספר רב מדי של היבטי מנהיגות בו-זמנית, ולכן אינו ניתן ליישום מעשי בארגונים גדולים ומורכבים במיוחד","הוא מניח שסגנון קבלת ההחלטות קשיח ואינו ניתן לשינוי, בניגוד לממצאים האמפיריים","הוא מתעלם ממאפייני המצב ומתייחס אך ורק לאישיותו ולתכונותיו של המנהיג עצמו"],c:0,e:"הביקורות: המודל עוסק רק בהיבט אחד של מנהיגות — תהליכי קבלת החלטות; הוא מפשט את תהליך קבלת ההחלטות; והוא מתעלם מהאפשרות שלמנהלים אין את המיומנויות הנדרשות ליישום כל תהליך החלטה."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מהי השאלה שממנה יוצאת תיאוריית המשאבים הקוגניטיביים?",o:["מדוע יש עובדים בעלי יכולת גבוהה שאינם מגלים מוטיבציה לעבודה","מדוע יש מנהיגים אינטליגנטיים שאינם אפקטיביים, למרות יתרונותיהם הקוגניטיביים","מדוע יש מנהיגים כריזמטיים שאינם מצליחים לגייס את אנשיהם למשימה המרכזית שהוטלה עליהם","מדוע יש מנהיגים ותיקים שאינם מצליחים להסתגל לשינויים בסביבה"],c:1,e:"התיאוריה יוצאת מהשאלה: אם אנשים אינטליגנטיים לומדים מהר יותר, מקבלים החלטות טובות יותר ומפתחים פתרונות טובים יותר — למה יש מנהיגים אינטליגנטיים שאינם אפקטיביים? התשובה: רמת הלחץ."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מתי תורמות יכולותיו הקוגניטיביות של המנהיג לביצועי הקבוצה, לפי תיאוריית המשאבים הקוגניטיביים?",o:["כאשר רמת הלחץ בקבוצה גבוהה במיוחד","כאשר הכפיפים הם בעלי בשלות נמוכה","כאשר סגנון מנהיגותו מכוון משימה גבוה","כאשר סגנון מנהיגותו מכוון אנשים גבוה"],c:2,e:"הניבוי הראשון של התיאוריה: יכולותיו הקוגניטיביות של המנהיג תורמות לביצועי הקבוצה אם סגנון מנהיגותו מכוון משימה גבוה."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"כיצד ממתן הלחץ את השפעת האינטליגנציה על ביצועי הקבוצה?",o:["בלחץ נמוך לאינטליגנציה גבוהה השפעה שלילית וברורה; בלחץ גבוה השפעתה חיובית ומשמעותית מאוד","לאינטליגנציה גבוהה השפעה חיובית בכל רמות הלחץ, ללא הבדל של ממש ביניהן","לאינטליגנציה אין כל השפעה על הביצועים, ורק הניסיון קובע את התוצאה","בלחץ נמוך לאינטליגנציה גבוהה השפעה חיובית; בלחץ גבוה אין לה השפעה או שהשפעתה שלילית"],c:3,e:"לחץ מתנה את השפעת האינטליגנציה על ביצוע הקבוצה: בתנאי לחץ נמוך לאינטליגנציה גבוהה השפעה חיובית המגדילה את הביצוע; בתנאי לחץ גבוה לאינטליגנציה גבוהה אין השפעה, או שישנה השפעה שלילית."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מהן הביקורות על תיאוריית המשאבים הקוגניטיביים?",o:["היא עוסקת ברמת אינטליגנציה כללית, מתעלמת מהבדלים ביכולת להתמודד עם לחץ, ותמיכתה האמפירית מועטה","היא עוסקת ברמת אינטליגנציה ספציפית מדי, שאינה ניתנת למדידה בכלים סטנדרטיים ומקובלים במחקר הארגוני","היא מניחה שהלחץ אינו משפיע כלל על הביצועים, בניגוד לממצאים במחקרים","היא מתמקדת במאפייני המונהגים ומתעלמת לחלוטין מיכולותיו של המנהיג"],c:0,e:"הביקורות: המודל עוסק ברמת אינטליגנציה כללית; אינו לוקח בחשבון יחסים בין המשתנים הבלתי תלויים; מתעלם מהאפשרות שאנשים שונים זה מזה ביכולתם להתמודד עם לחץ; ותמיכתו האמפירית מועטה."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מה גורסת תיאוריית נתיב-המטרה של האוס (1977) לגבי תפקיד המנהיג?",o:["על המנהיג להתמקד באיתור חריגות וסטיות ולתקנן במהירות המרבית","על המנהיג לסייע למונהגים להשיג את מטרתם ולהסיר מחסומים בדרך להצלחה","על המנהיג לבנות את המצב המתאים לסגנונו הקשיח ולא להתאים את עצמו למצב","על המנהיג לחתור לקונצנזוס ולהימנע מנקיטת עמדה בכל מחלוקת בקבוצה"],c:1,e:"לפי תיאוריית נתיב-המטרה, מנהיגים חייבים לסייע למונהגים להשיג את מטרתם ולהסיר מחסומים להצלחה, לספק כיוון ותמיכה כדי שהמטרות יושגו ויהיו בהלימה ליעדי הארגון, ולשנות התנהגויות כדי להתאימן למצב."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"על איזו תיאוריית מוטיבציה מבוססת תיאוריית נתיב-המטרה?",o:["על היררכיית הצרכים של מסלאו","על התיאוריה הדו-גורמית של הרצברג","על תורת הציפייה של ורום","על תיאוריית ההוגנות של אדמס"],c:2,e:"המודל מבוסס על תורת הציפייה של ורום: העובדים בוחרים את רמת המאמץ שלהם מתוך ציפייה לתגמול, ולכן על המנהיג להפעיל את שרשרת המוטיבציה — מאמץ, ביצוע, תגמול — ולסלק את המכשולים שבדרך."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מהם ארבעת סגנונות המנהיגות שמציעה תיאוריית נתיב-המטרה?",o:["הוראתי, משווק, משתף ומאציל","אוטוקרטי, ייעוצי, קבוצתי ומעורב","מעצב, מתגמל, מתקן ואי-מנהיגות","מנחה/מכוון, תומך, הישגי ומשתף"],c:3,e:"ארבעת הסגנונות: מנחה/מכוון — מבהיר את הדרך למטרה בהנחיות ברורות (דומה למשימתי); תומך — מגלה הבנה ואמפתיה (דומה למתחשב); הישגי — מדרבן להצטיין בהצבת סטנדרטים גבוהים ובהבעת אמון; ומשתף — מעודד להשפיע על תחומי העבודה ונכון להתייעץ."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מהו הסגנון ההישגי בתיאוריית נתיב-המטרה?",o:["מדרבן את המונהגים להצטיין באמצעות הצבת סטנדרטים גבוהים תוך הבעת אמון","מבהיר את הדרך למטרה תוך מתן הנחיות ברורות ומפורטות לביצוע","מגלה הבנה ואמפתיה לצורכי המונהגים ומספק להם בסיס רגשי","מעודד את המונהגים להשפיע על תחומי עבודתם ונכון תמיד להתייעץ איתם בהחלטות"],c:0,e:"הסגנון ההישגי מדרבן את המונהגים להצטיין על ידי הצבת סטנדרטים גבוהים תוך הבעת אמון ביכולתם. המנחה דומה למשימתי, התומך למתחשב, והמשתף מעודד השפעה והתייעצות."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"אילו ארבעה מאפייני מונהגים קובעים את מידת שביעות הרצון מן המנהיג בתיאוריית נתיב-המטרה?",o:["גיוון מיומנויות, זהות המשימה, אוטונומיה ומשוב על איכות הביצוע","צורך בהשתייכות, צורך במבנה ברור של משימות, מיקוד שליטה ומסוגלות עצמית","ידע, ניסיון, מיומנות בעבודה וביטחון עצמי בביצוע המשימה שהוטלה עליהם בפועל","הישג, השתייכות, עוצמה ומידת ההזדהות עם מטרותיו של הארגון"],c:1,e:"ארבעת מאפייני המונהגים: צורך בהשתייכות, צורך במבנה ברור של משימות, מיקוד שליטה ומסוגלות עצמית. בעלי צורך בהשתייכות יעדיפו סגנון תומך, והמעדיפים מבנה משימות ברור יעדיפו סגנון מנחה."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מה קורה להשפעת המנהיג עם הגדלת המסוגלות העצמית של המונהג, לפי האוס?",o:["הצורך בסגנון תומך יורד, אך השפעת המנהיג נותרת קבועה","אין קשר בין המסוגלות העצמית לבין סגנון המנהיגות הנדרש","הצורך בסגנון מנהיגות מנחה יורד, ולכן פוחתת השפעת המנהיג","הצורך בסגנון מנהיגות מנחה עולה, ולכן גדלה השפעת המנהיג"],c:2,e:"האוס שיער שעם הגדלת המסוגלות העצמית יורד הצורך בסגנון מנהיגות \"מנחה\", וכך פוחתת השפעת המנהיג."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"איזה סגנון מנהיגות נעדיף למשימות מונוטוניות, לפי תיאוריית נתיב-המטרה?",o:["סגנון מנחה, שיבהיר את הדרך למטרה","סגנון הישגי, שיציב סטנדרטים גבוהים","סגנון משתף, שיאפשר השפעה על העבודה","סגנון תומך, שיספק למונהגים בסיס רגשי"],c:3,e:"למשימות מונוטוניות נעדיף סגנון תומך, שיספק למונהגים בסיס רגשי. כאשר המשימה ברורה ומערכת הסמכות חזקה — אין צורך בסגנון מנהיגות מנחה."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מהי החולשה המרכזית של הגישה המצבית שהובילה להתפתחות גישה חדשה?",o:["היא טשטשה את ייחודה של תופעת המנהיגות — אם הכל תלוי במצב, לא ברור במה ניכרת יכולת ההשפעה","היא הדגישה יתר על המידה את הערכים האישיים של המנהיג ואת עוצמת החזון שהוא מציג בפני אנשיו ובפני הארגון","היא התמקדה בתכונות מולדות בלבד והתעלמה מהיכולת ללמוד התנהגויות חדשות","היא הניחה שקיים סגנון מנהיגות אחד שנכון לכל המצבים ולכל סוגי הארגונים"],c:0,e:"החולשה: הגישה טשטשה את ייחודה של תופעת המנהיגות — אם המנהיגות תלויה אך ורק באינטראקציה עם המצב, לא ברור במה ניכרת יכולתה להשפיע על הסיטואציה. גברה הכמיהה למנהיגות חזקה שאינה נגררת אחר המצב."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"מהי הביקורת על הדרישה שמציבה הגישה המצבית מן המנהיגים?",o:["היא דורשת מהמנהיגים לוותר על סמכותם הפורמלית לטובת הקבוצה","היא דורשת יכולות אבחון גבוהות מאוד ויכולת הסתגלות רבה, בעוד שבפועל מנהיגים דבקים בסגנון אחד","היא דורשת מהמנהיגים לדבוק בסגנון אחד קבוע ויציב, בעוד שבפועל הם משנים אותו כל הזמן ובכל מצב","היא דורשת מהמנהיגים ידע טכני מעמיק בכל תחומי הפעילות של הארגון"],c:1,e:"הביקורת: הגישה דורשת מהמנהיגים יכולות אבחון גבוהות מאוד של המצב ושל המונהגים, וכן יכולת גמישות והסתגלות רבה — אך בפועל מנהיגים נוטים לעיתים קרובות לדבוק בסגנון מנהיגות אחד עיקרי."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"אילו שני מרכיבים מתורת הציפייה מיישם המנהיג כשהוא קובע יעדים ומעניק תגמולים נחשקים?",o:["איכות ההחלטה ומקובלות ההחלטה","בשלות מקצועית ובשלות פסיכולוגית","תכליתיות (instrumentality) וערכיות (valence)","ציפייה (expectancy) ומסוגלות עצמית של הפרט העובד"],c:2,e:"קביעת יעדים והענקת תגמולים נחשקים לעובדים המשיגים אותם מיישמת את התכליתיות (instrumentality) ואת הערכיות (valence). העלאת אמונת העובדים ביכולתם להשיג את היעדים מיישמת את הציפייה (expectancy)."},
{t:"קבלת החלטות ונתיב-מטרה",s:"מחוץ להיקף",q:"בתרגיל נאס\"א שנעשה בכיתה — מה הוא בא להדגים?",o:["שקבלת החלטות של יחיד מהירה ומדויקת מזו של קבוצה","שהלחץ פוגע ביכולת הקבוצה להגיע להחלטה מוסכמת","שהמנהיג הבלתי פורמלי הוא שקובע את החלטת הקבוצה","שקבלת החלטות בקבוצה טובה יותר מהחלטה של יחיד"],c:3,e:"תרגיל נאס\"א שנעשה בכיתה בא להראות שקבלת החלטות בקבוצה היא טובה יותר מאשר החלטה של יחיד לבדו."}
]);

/* ===================== 13. מנהיגות מעצבת ===================== */
{t:"מנהיגות מעצבת",s:"סיכום",q:"מהי ההגדרה של מנהיגות בפרק המנהיגות המעצבת?",o:["הנעת אנשים לביצוע משימות לאורך זמן תוך מיצוי אמצעי ההנעה ושימוש מזערי באמצעי כפייה","הנעת אנשים לביצוע משימות באמצעות מערכת סנקציות ברורה ופיקוח צמוד ורציף על אופן הביצוע","קבלת החלטות טובות ויישומן ביעילות, לטווח הקצר ולטווח הארוך של הארגון","התאמת סגנון הפעולה של המנהל לרמת הבשלות המקצועית והפסיכולוגית של הכפיפים"],c:0,e:"מנהיגות מוגדרת כאן כהנעת אנשים לביצוע משימות לאורך זמן תוך מיצוי אמצעי ההנעה ותוך שימוש מזערי באמצעי כפייה."},
{t:"מנהיגות מעצבת",s:"שאלות מבחן",q:"מהם ארבעת מרכיבי המנהיגות המעצבת שבהם יש לקבל ציון גבוה כדי להיחשב מנהיג?",o:["הוראה, שיווק, שיתוף והאצלת סמכויות בהתאם לבשלות הכפיפים","כריזמה, הנעה באמצעות השראה, אתגור אינטלקטואלי והתייחסות פרטנית","תגמול מותנה, ניהול חריגים אקטיבי, בקרת חריגים פסיבית ואי-מנהיגות","הפקת תוצאות, מנהלנות, יזמות ויצירתיות וגיוס שיתוף פעולה"],c:1,e:"ארבעת מרכיבי המנהיגות המעצבת: כריזמה (מיוחסת והתנהגותית), הנעה באמצעות השראה, אתגור אינטלקטואלי והתייחסות פרטנית. כדי להיחשב מנהיג יש לקבל בהם ציון גבוה."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"כיצד מוגדר המנהיג המעצב לפי ד\"ר טלי דביר ופרופ' דוב עדן?",o:["מי שמאתר חריגות ומתקן אותן במהירות המרבית","מי שמתאים את סגנונו לדרישות המשתנות של המצב","מי שגורם לאנשים רגילים לעשות דברים יוצאי דופן","מי שמצליח לשמר את הרמה הקיימת של הביצועים"],c:2,e:"לפי ד\"ר טלי דביר ופרופ' דוב עדן, מנהיג מעצב הוא מי שגורם לאנשים רגילים לעשות דברים יוצאי דופן."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"מהי הכריזמה כמרכיב במנהיגות המעצבת?",o:["יכולת להציב יעדים ברורים ולהבהיר את התגמול או את העונש הצפוי בגין עמידה בהם או אי-עמידה","יכולת לאתר סטיות וחריגות בעבודת המונהגים ולתקנן במהירות המרבית האפשרית","יכולת להעריך את הפוטנציאל של כל מונהג ולהטיל עליו מטלות בדרגת קושי עולה","יכולת להלהיב לביצוע משימה, להשרות נאמנות לארגון ולראות את המהותי — ותחושת שליחות"],c:3,e:"כריזמה היא היכולת להלהיב לביצוע משימה, להשרות נאמנות לארגון ולראות את המהותי והחשוב — לצד תחושת שליחות."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"אילו התנהגויות מאפיינות את המנהיג הכריזמטי?",o:["מפגין ביטחון ואמונה ביכולת המונהגים, לוקח אחריות מלאה לפעולותיהם ומהווה דוגמה אישית","מגדיר תקנים כלליים ונמנע ממעורבות כל עוד לא מתגלות טעויות בביצוע","מציג דרכים חדשות לתפיסת המציאות ומעודד חלופות יצירתיות אצל אנשיו","מכיר היטב את כל כפופיו ויודע מהי הדרך הנכונה ביותר להפעיל כל אחד ואחד מהם בנפרד ובאופן אישי"],c:0,e:"המנהיג הכריזמטי מפגין ביטחון ואמונה ביכולת המונהגים, לוקח אחריות מלאה לפעולותיהם, ממקד אותם בחשיבות היותם גוף מלוכד, מעדיף את צורכיהם על פני אינטרסים אישיים, מפגין דבקות במטרות, מהווה דוגמה אישית, מפגין סטנדרטים אתיים גבוהים ומתנהג באופן עקבי."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"מהן תגובות המונהגים למנהיג כריזמטי?",o:["המונהגים מפגינים אדישות וחוסר אכפתיות ומתמקדים ביעדיהם האישיים","המנהיג ומטרותיו הופכים למודל לחיקוי והזדהות, ומתעוררים הערצה, כבוד ואמון","המונהגים משתפים פעולה משיקולי כדאיות בלבד, בהתאם לאטרקטיביות התגמול","המונהגים נמנעים מלקיחת סיכונים ומטעויות, ומשמרים שיטות עבודה מסורתיות"],c:1,e:"תגובות המונהגים למנהיג כריזמטי: המנהיג ומטרותיו הופכים למודל לחיקוי והזדהות; מתעוררים הערצה, הערכה, כבוד ואמון; והמונהגים משקיעים כמיטב יכולתם כדי להראות את תמיכתם במנהיג."},
{t:"מנהיגות מעצבת",s:"שאלות מבחן",q:"העובדים חושבים שירון \"סוחף וממגנט\". במה, לדעתם, הוא ניחן?",o:["באתגור אינטלקטואלי","בתגמול מותנה","בכריזמה מיוחסת","בהתייחסות פרטנית"],c:2,e:"תפיסת העובדים את המנהיג כסוחף וממגנט היא ביטוי לכריזמה מיוחסת — הכריזמה כפי שהיא מיוחסת לו על ידי המונהגים, להבדיל מהכריזמה ההתנהגותית הנמדדת בהתנהגויות בפועל."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"לאילו שני סוגים נחלקת הכריזמה במודל המנהיגות המעצבת?",o:["כריזמה פורמלית וכריזמה בלתי פורמלית","כריזמה אישית וכריזמה ארגונית","כריזמה מולדת וכריזמה נרכשת","כריזמה מיוחסת וכריזמה התנהגותית"],c:3,e:"הכריזמה במודל המנהיגות המעצבת נחלקת לכריזמה מיוחסת — כפי שהמונהגים מייחסים אותה למנהיג — ולכריזמה התנהגותית, הנמדדת בהתנהגויותיו בפועל."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"מהי \"הנעה באמצעות השראה\", ועל מה היא משפיעה בראש ובראשונה?",o:["יכולת לעורר רגשות, להחיות ולהלהיב — וההשפעה היא קודם כל על רגשות המונהגים","יכולת להציב יעדים מדידים ולקשור אליהם תגמול — וההשפעה היא על חישוב הכדאיות","יכולת לאתר תחומים מועדים לפורענות — וההשפעה היא על רמת הזהירות של המונהגים","יכולת לאבחן את צורכי הפרט — וההשפעה היא על תחושת השייכות של כל מונהג"],c:0,e:"הנעה באמצעות השראה היא היכולת לעורר רגשות, להחיות ולהלהיב. אפשר לעורר השראה בדרכים שונות — שיחה רציונלית, ההברקה שבפריצה קדימה או היופי שבהצגת טיעון — ובכולן ההשפעה היא קודם כל על רגשותיהם של המונהגים."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"אילו התנהגויות מאפיינות הנעה באמצעות השראה?",o:["מבהיר את התגמול והעונש בתמורה להשגת היעדים או לאי-השגתם במועד","נותן תחושת משמעות ואתגר, מפגין התלהבות ואופטימיות ומציג חזון ברור למצבים עתידיים","מעריך רעיונות של אחרים, מעודד חלופות יצירתיות וקורא תגר על צורות מחשבה ישנות ומקובלות","פועל כחונך ומנטור, מאבחן הבדלים בין הפרטים ונותן אקלים תומך בלמידה"],c:1,e:"התנהגויות ההנעה בהשראה: נותן תחושת משמעות ואתגר למשימות, מפגין התלהבות ואופטימיות, מציג חזון ברור לגבי מצבים עתידיים רצויים, מחלחל את החזון, ומיישר קו בין מטרות אישיות למטרות צוותיות וארגוניות."},
{t:"מנהיגות מעצבת",s:"שאלות מבחן",q:"גלית מניעה אנשים בסיוע חזון, מבררת מה חזונם ובונה יחד עימם חזון משותף, וגם יש לה רעיונות מבריקים בעיני העובדים. באיזה סגנון היא ניחנת?",o:["בסגנון של ניהול חריגים אקטיבי","בסגנון של אי-מנהיגות","בסגנון של הנעה באמצעות השראה","בסגנון של תגמול מותנה"],c:2,e:"בניית חזון משותף, חילחולו ויישור קו בין מטרות אישיות לארגוניות הם ליבת ההנעה באמצעות השראה — אחד מארבעת מרכיבי המנהיגות המעצבת."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"מהן תגובות המונהגים להנעה באמצעות השראה?",o:["שיתוף פעולה מחושב לפי שיקולי כדאיות, ומאמץ התלוי במידת האטרקטיביות של התגמול שהובטח להם","הימנעות מסיכונים, צייתנות עיוורת ושימור שיטות עבודה מסורתיות בלבד","אדישות, חוסר אכפתיות והתמקדות ביעדים אישיים על חשבון יעדי הארגון","מוכנות להשקיע מאמץ יתר, התלהבות לקחת משימות אתגריות וראיית החזון הארגוני כחזון אישי"],c:3,e:"תגובות המונהגים: הם מוכנים להשקיע מאמץ יתר כדי לעמוד במשימה, נלהבים לקחת על עצמם משימות אתגריות, ורואים בחזון הצוותי או הארגוני את החזון האישי שלהם."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"מהו האתגור האינטלקטואלי כמרכיב במנהיגות מעצבת?",o:["הצגת דרכים חדשות ומאתגרות של תפיסת המציאות — הפיכת משבר להזדמנות וכישלון ללמידה","הצגת יעדים ברורים ומדידים לצד תגמול או עונש הצפוי בגין עמידה בהם או אי-עמידה","הצגת דוגמה אישית וסטנדרטים אתיים גבוהים המעוררים הערצה והזדהות אצל המונהגים","הצגת מטלות בדרגת קושי עולה לכל מונהג בהתאם לפוטנציאל האישי שזוהה אצלו"],c:0,e:"אתגור אינטלקטואלי מציג דרכים חדשות ומאתגרות של תפיסת המציאות: הפיכת משבר להזדמנות, הפיכת כישלון ללמידה והפיכת הצלחה לציון דרך."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"אילו התנהגויות מאפיינות מנהיג המפעיל אתגור אינטלקטואלי?",o:["נמנע ממעורבות כל עוד לא מתגלות טעויות, ומתערב רק כשמתגלה תקלה","מעודד חלופות יצירתיות, קורא תגר על מחשבה ישנה ואינו מותח ביקורת ציבורית על טעויות אישיות","מפגין דבקות רבה בהשגת המטרות, מהווה דוגמה אישית לאנשיו ומתנהג תמיד באופן עקבי ולא שרירותי כלפיהם","מכיר היטב את כפופיו ויודע מהי הדרך הנכונה להפעיל כל אחד מהם"],c:1,e:"האתגור האינטלקטואלי כולל: עידוד להסתכל על בעיות בדרכים שונות מהמקובל, הערכת רעיונות של אחרים, עידוד חלופות יצירתיות, קריאת תגר על צורות מחשבה ישנות, פיתוח חשיבה עצמאית-ביקורתית, חשיבה ביקורתית גם כלפי רעיונות המנהיג עצמו, ואי-מתיחת ביקורת ציבורית על טעויות אישיות."},
{t:"מנהיגות מעצבת",s:"שאלות מבחן",q:"איזה סוג מנהיגות הודגם בסרט \"מונה ליזה\" שהוצג בכיתה?",o:["תגמול מותנה","ניהול חריגים פסיבי","אתגור אינטלקטואלי","התייחסות פרטנית"],c:2,e:"סוג המנהיגות שנראה בסרט \"מונה ליזה\" הוא אתגור אינטלקטואלי — הצגת דרכים חדשות ומאתגרות של תפיסת המציאות וקריאת תגר על צורות מחשבה ישנות."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"מהי ההתייחסות הפרטנית כמרכיב במנהיגות מעצבת?",o:["גישה תוצאתית לאנשים — מדידת התפוקה של כל אחד וקשירת התגמול לרמת הביצוע שהושגה בפועל","גישה בקרתית לאנשים — מעקב צמוד אחר ביצועיהם ואיתור מהיר של חריגות","גישה נמנעת — הימנעות ממעורבות בעבודת המונהגים כל עוד אין תקלות","גישה התפתחותית לאנשים — הערכת הפוטנציאל של כל אחד והטלת מטלות בדרגת קושי עולה"],c:3,e:"התייחסות פרטנית היא גישה התפתחותית לאנשים. המנהיג יודע להעריך את הפוטנציאל של כל אחד, מטיל מטלות בדרגת קושי עולה, משתמש בהשפעה אישית ובמגע קרוב פנים אל פנים, מכיר היטב את הכפופים לו ויודע כיצד להפעיל כל אחד מהם."},
{t:"מנהיגות מעצבת",s:"שאלות מבחן",q:"משה הוא מנהל בכיר, אך מגיע כל יום, הולך מחדר לחדר ומכיר את המונהגים אישית. באיזה סגנון הוא ניחן?",o:["בהתייחסות פרטנית","בכריזמה מיוחסת","באתגור אינטלקטואלי","בהנעה בהשראה"],c:0,e:"משה בעל סגנון של התייחסות פרטנית: הוא משתמש בהשפעה אישית ובמגע קרוב פנים אל פנים, מכיר היטב את הכפופים לו ויודע מהי הדרך הנכונה להפעיל כל אחד מהם."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"אילו התנהגויות מאפיינות מנהיג המפעיל התייחסות פרטנית?",o:["מבהיר את היעדים ואת התגמול או העונש שיינתן בתמורה להשגתם","פועל כחונך ומנטור, יוצר תחושת שייכות, נותן אקלים תומך ומראה דאגה לצרכים האישיים","מציג חזון ברור ומחלחל אותו, ומיישר קו בין המטרות האישיות למטרות הצוותיות והארגוניות","קורא תגר על צורות מחשבה ישנות ומעודד חלופות יצירתיות ולמידה"],c:1,e:"ההתייחסות הפרטנית כוללת: תשומת לב מיוחדת לצורכי ההישג וההתפתחות של כל פרט, יצירת תחושת שייכות, פעולה כחונך ומנטור, אבחון וקבלה של הבדלים, אקלים תומך בלמידה, האצלת משימות מתאימות, דאגה לצרכים האישיים, זמינות ונגישות, ואמונה בהתפתחות מתמדת."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"מהן תגובות המונהגים להתייחסות פרטנית?",o:["הימנעות מסיכונים ומטעויות ושימור שיטות העבודה המסורתיות","שיתוף פעולה מחושב, התלוי בגובה התגמול או בחומרת העונש","מיצוי הפוטנציאל האישי, שאיפה להתפתחות ורצון לקבל משימות שמאפשרות ללמוד","נכונות להשקיע מאמץ יתר מתוך הזדהות עם החזון הארגוני המשותף"],c:2,e:"תגובות המונהגים להתייחסות פרטנית: מיצוי מלוא הפוטנציאל האישי, הפגנת שאיפה ורצון להתפתחות אישית, ושאיפה לקבלת משימות שתאפשרנה ללמוד דברים חדשים."},
{t:"מנהיגות מעצבת",s:"שאלות מבחן",q:"לפי מודל בס ואבוליו, מנהל שהוא מנהיג יתאפיין ב:",o:["מנהיגות מתגמלת בלבד","ניהול חריגים אקטיבי","אי-מנהיגות פסיבית","מנהיגות מתמירה/מעצבת"],c:3,e:"לפי מודל בס ואבוליו, מנהל שהוא מנהיג יתאפיין במנהיגות מתמירה/מעצבת — ארבעת מרכיביה הם כריזמה, הנעה בהשראה, אתגור אינטלקטואלי והתייחסות פרטנית."},
{t:"מנהיגות מעצבת",s:"שאלות מבחן",q:"טיפוס E אצל אדיג'ס — לאיזה סגנון מנהיגות הוא מקביל במודל של בס ואבוליו?",o:["למנהיגות המעצבת","למנהיגות המתגמלת","לניהול חריגים פסיבי","לאי-מנהיגות"],c:0,e:"טיפוס E אצל אדיג'ס — היזם, איש החזון והשינוי — מקביל למנהיגות המעצבת במודל של בס ואבוליו. שניהם עוסקים בחזון, ביוזמה ובשינוי."},
{t:"מנהיגות מעצבת",s:"שאלות מבחן",q:"אם תרצו לקדם ראש צוות לתפקיד מנהל בכיר — במה תעשו שימוש?",o:["בבדיקת רמת הבשלות המקצועית של הכפיפים שלו בלבד, לפי הרסי ובלנשארד","בבדיקת דפוסי הניהול שלו לפי אדיג'ס ובבדיקת ממוצע המנהיגות המעצבת שלו לפי בס ואבוליו","בבדיקת ותק בלבד — מספר השנים שבהן הוא משמש כראש צוות בארגון","בבדיקת ציון ה-LPC שלו בלבד, כדי לקבוע אם הוא מנהיג מכוון משימה או מנהיג מכוון אנשים בלבד"],c:1,e:"לקידום ראש צוות למנהל בכיר: לפי אדיג'ס יש לבדוק אילו דפוסי ניהול יש לאדם, ובמקביל לבדוק אם יש לו ממוצע גבוה במנהיגות מעצבת לפי מודל בס ואבוליו."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"מנהלת מעודדת את הצוות לראות בכישלון האחרון הזדמנות ללמידה, ומבקשת מכל אחד להציע חלופה שונה מהמקובל. איזה מרכיב מעצב היא מפעילה?",o:["כריזמה התנהגותית","תגמול מותנה","אתגור אינטלקטואלי","התייחסות פרטנית"],c:2,e:"הפיכת כישלון ללמידה ועידוד חלופות יצירתיות השונות מהמקובל הם ליבת האתגור האינטלקטואלי — אחד מארבעת מרכיבי המנהיגות המעצבת."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"מדוע מדגיש המודל שהמנהיג הכריזמטי מתנהג באופן עקבי ולא שרירותי?",o:["משום שהעקביות מאפשרת למדוד את תפוקתו ולהשוותה לתקן שנקבע מראש","משום שהעקביות נדרשת כדי לעמוד בנהלים הכתובים ובדרישות הרגולציה","משום שהעקביות מונעת מהמונהגים לקחת סיכונים ולסטות מהשיטה הקיימת","משום שהעקביות היא חלק מהיותו דוגמה אישית ומבססת את האמון והכבוד כלפיו"],c:3,e:"מבין ההתנהגויות המאפיינות את המנהיג הכריזמטי: התנהגותו מהווה דוגמה אישית לאנשיו, הוא מפגין סטנדרטים אתיים ומוסריים גבוהים ומתנהג באופן עקבי ולא שרירותי — וכל אלה מבססים הערצה, כבוד ואמון."},
{t:"מנהיגות מעצבת",s:"שאלות מבחן",q:"מה ההבדל בין פיתוח צוות לבין בניית צוות?",o:["פיתוח צוות נעשה לצוות שכבר עובד ויש לו היסטוריה, וצריך למנפו לביצועים גבוהים","פיתוח צוות נעשה לצוות חדש שטרם התגבש, ובניית צוות נעשית לצוות ותיק","אין ביניהם הבדל מהותי — שני המונחים מתארים את אותו תהליך ארגוני","פיתוח צוות עוסק במיומנויות טכניות בלבד, ובניית צוות ביחסים בינאישיים"],c:0,e:"פיתוח צוות נעשה לצוות שעובד כבר, יש לו היסטוריה, ויש צורך למנף אותו לביצועים גבוהים — בשונה מבניית צוות, שנעשית בצוות חדש."},
{t:"מנהיגות מעצבת",s:"מחוץ להיקף",q:"לפי מודל הרזולוציה: עובד עומד ביעדים ועובד על פי השיטה. מהי שיטת הניהול הנכונה מולו?",o:["להציב לו יעדים נוספים ולהגדיל את העומס","לשבח, לתת דוגמה אישית ולהשתמש בו כדגל","לפקח עליו מקרוב ולאתר סטיות בעבודתו","להימנע מכל מעורבות כל עוד אין תקלות"],c:1,e:"במצב שבו העובד עומד ביעדים וגם עובד על פי השיטה, שיטת הניהול הנכונה היא לשבח אותו, לתת בו דוגמה אישית ולהשתמש בו כדגל עבור שאר הצוות."},
{t:"מנהיגות מעצבת",s:"סיכום",q:"באילו דרכים ניתן לעורר השראה, לפי הסיכום?",o:["בפיקוח צמוד, במעקב אחר חריגות ובתיקון מהיר של כל סטייה מהתקן","בהאצלת סמכויות מלאה, בהעברת השליטה לקבוצה ובהימנעות ממעורבות","בשיחה רציונלית ואינטלקטואלית, בהברקה שבפריצה קדימה או ביופי שבהצגת טיעון","בהצבת יעדים מדידים, במתן משוב שוטף ובקשירת התגמול לרמת הביצוע שהושגה בפועל"],c:2,e:"אפשר לעורר השראה באופנים שונים: על ידי שיחה רציונלית מחושבת ואינטלקטואלית, על ידי ההברקה שבפריצה קדימה, או על ידי היופי שבהצגת טיעון מסוים. בכל אלה ההשפעה היא קודם כל על הרגשות."}
]);

/* ===================== 14. מנהיגות מתגמלת והטווח המלא ===================== */
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מהם שלושת סגנונות המנהיגות במודל הטווח המלא?",o:["הוראתי, משווק, משתף ומאציל לפי הבשלות","אוטוקרטי, ייעוצי וקבוצתי בקבלת החלטות","מנחה, תומך, הישגי ומשתף לפי מאפייני העובד","אי-מנהיגות, מנהיגות מעצבת ומנהיגות מתגמלת"],c:3,e:"סגנונות המנהיגות במודל הטווח המלא: אי-מנהיגות, מנהיגות מעצבת ומנהיגות מתגמלת. המנהיגות המתגמלת מתחלקת לתגמול בונה, מנהיגות מתקנת אקטיבית ומנהיגות מתקנת פסיבית."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מה הכינוי הנלווה לאי-מנהיגות, ומה מאפיין אותה?",o:["\"שבת והנח\" — אין הגדרה של ציפיות, יעדים ותגמולים, ויש הימנעות מנקיטת עמדה","\"מקלות וגזרים\" — הצבת יעדים ברורה לצד תגמול או עונש בהתאם לרמת הביצוע שהושגה בפועל","\"כיבוי שריפות\" — התערבות רק כאשר מתגלה תקלה או טעות בעבודה","\"זאב בודד\" — ביצוע עצמאי של המשימה במקום הדרכה ופיתוח של הכפיפים"],c:0,e:"אי-מנהיגות מכונה \"שבת והנח\": אין הגדרה ברורה של ציפיות, יעדים, תפקידים, תגמולים או עונשים; יש הימנעות מנקיטת עמדה ומקבלת החלטות, נטייה לעכב דברים, הפגנת אדישות ואין מעורבות פעילה בעבודת המונהגים."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מהן תגובות המונהגים לאי-מנהיגות?",o:["שיתוף פעולה משיקולי כדאיות בהתאם לאטרקטיביות התגמול שהובטח להם","הפגנת אדישות וחוסר אכפתיות והתמקדות ביעדים אישיים גם בסתירה ליעדי הארגון","הערצה, הערכה וכבוד כלפי המנהיג, והשקעה מרבית כדי להראות תמיכה בו","הימנעות מלקיחת סיכונים ומטעויות ושימור שיטות העבודה המסורתיות הקיימות בארגון"],c:1,e:"תגובות המונהגים לאי-מנהיגות: הפגנת אדישות וחוסר אכפתיות, והתמקדות בהשגת יעדים אישיים גם אם הם נמצאים בסתירה עם יעדי הארגון."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מהו הכינוי הנלווה למנהיגות המתגמלת, ולאילו שלושה סוגים היא נחלקת?",o:["\"אנשים רגילים, דברים יוצאי דופן\" — כריזמה, הנעה בהשראה ואתגור אינטלקטואלי מתמיד","\"ניהול על פי השכל הישר\" — יצרן, מינהלן, יזם ואינטגרטור","\"מקלות וגזרים\" — תגמול בונה, מנהיגות מתקנת אקטיבית ומנהיגות מתקנת פסיבית","\"שבת והנח\" — הימנעות, עיכוב ואדישות כלפי עבודת המונהגים בארגון"],c:2,e:"המנהיגות המתגמלת מכונה \"מקלות וגזרים\", והיא נחלקת לתגמול בונה, מנהיגות מתקנת אקטיבית ומנהיגות מתקנת פסיבית (\"כיבוי שריפות\")."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"שאלות מבחן",q:"לפי בס ואבוליו, לאיזו קבוצה שייכים תגמול מותנה, ניהול חריגים אקטיבי וניהול חריגים פסיבי?",o:["למנהיגות המעצבת — הצד המנהיגותי של המודל","לאי-מנהיגות — הקצה הפסיבי של המודל","לגישה המצבית — התאמת הסגנון לנסיבות","למנהיגות המתגמלת — הצד הניהולי של המודל"],c:3,e:"תגמול מותנה, ניהול חריגים אקטיבי וניהול חריגים פסיבי שייכים למנהיגות המתגמלת — הצד הניהולי במודל בס ואבוליו. הצד המנהיגותי הוא המנהיגות המעצבת."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מה מאפיין את התגמול הבונה כמרכיב במנהיגות המתגמלת?",o:["הצבה ברורה של היעדים ושל האחראים להם, איתור צרכי המונהגים והבהרת התגמול או העונש","הימנעות מהגדרת יעדים או ציפיות ברורות, ונטייה לעכב את ההחלטות ולהפגין אדישות מוחלטת כלפי הצוות","מעקב ובקרה צמודה אחר חריגות וסטיות ותיקונן במהירות המרבית האפשרית","הצגת דרכים חדשות לתפיסת המציאות ועידוד חשיבה עצמאית וביקורתית"],c:0,e:"תגמול בונה: הצבה ברורה ומובנת של היעדים שיש להשיג ומי אחראי להשגתם, איתור צרכי המונהגים, והבהרת התגמול או \"העונש\" בתמורה להשגת היעדים או לאי-השגתם. המנהיג נוטל חלק פעיל בהשגת המשימה ונותן משוב בונה ושבח."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מהן תגובות המונהגים לתגמול בונה?",o:["אדישות וחוסר אכפתיות והתמקדות ביעדים אישיים בלבד","שיתוף פעולה משיקולי כדאיות, כשהמאמץ תלוי באטרקטיביות התגמול או ברתיעה מהעונש","הזדהות מלאה עם החזון הארגוני המשותף וראייתו כחזון אישי של כל אחד ואחד מן המונהגים","מיצוי מלוא הפוטנציאל האישי ושאיפה למשימות שמאפשרות ללמוד"],c:1,e:"תגובות המונהגים לתגמול בונה: שיתוף פעולה עם המנהיג משיקולי כדאיות; מידת המאמץ המושקע תלויה במידת האטרקטיביות של התגמול הרצוי או במידת הרתיעה מהעונשים הצפויים; והגעה לרמת הביצוע הנדרשת."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"שאלות מבחן",q:"גלית חושבת שיש להניע עובדים בעזרת תשלום שכר, משוב שלילי וחיובי והצבת יעדים. מהו סגנון הניהול שלה?",o:["התייחסות פרטנית","אי-מנהיגות","תגמול מותנה","הנעה בהשראה"],c:2,e:"הצבת יעדים, מתן משוב חיובי ושלילי וקשירת התגמול הכספי לביצוע הם ליבת התגמול המותנה (התגמול הבונה) — מרכיב במנהיגות המתגמלת."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מה מאפיין את המנהיגות המתקנת האקטיבית?",o:["הימנעות ממעורבות כל עוד לא מתגלות טעויות, והתערבות רק לאחר שהתקלה נודעה","הצבת יעדים ברורים לצד הבהרת התגמול או העונש הצפוי בתמורה לביצוע","עידוד המונהגים לחשוב באופן עצמאי ולהציע חלופות יצירתיות לבעיות","התמקדות באיתור חריגים וסטיות, מעקב ובקרה צמודה ותיקון מהיר של הבעיות"],c:3,e:"המנהיגות המתקנת האקטיבית: התמקדות באיתור חריגים, סטיות וכישלונות; השקעת אנרגיה במעקב ובבקרה צמודה על צעדי המונהגים; מעקב פעיל אחר תחומים מועדים לפורענות; וניסיון לאתר ולתקן את הבעיות במהירות המרבית."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"שאלות מבחן",q:"ראש צוות עסוק באופן אובססיבי באיתור סטיות, כישלונות ואי-עמידה ביעדים. מהו דפוס הניהול שלו?",o:["ניהול חריגים אקטיבי","ניהול חריגים פסיבי","תגמול מותנה בונה","אתגור אינטלקטואלי"],c:0,e:"עיסוק אובססיבי באיתור סטיות, כישלונות ואי-עמידה ביעדים הוא ניהול חריגים אקטיבי — מעקב ובקרה צמודה על צעדי המונהגים ומעקב פעיל אחר תחומים מועדים לפורענות."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מהן תגובות המונהגים למנהיגות מתקנת אקטיבית?",o:["הערצה וכבוד כלפי המנהיג והפיכתו למודל לחיקוי ולהזדהות מלאה","הימנעות מלקיחת סיכונים, שימור שיטות מסורתיות, וסכנה לצייתנות עיוורת ול\"ראש קטן\"","נכונות להשקיע מאמץ יתר והתלהבות לקחת על עצמם משימות אתגריות וחדשות לחלוטין עבורם","מיצוי מלוא הפוטנציאל האישי ורצון להתפתחות מקצועית מתמדת בארגון"],c:1,e:"תגובות המונהגים: הימנעות מלקיחת סיכונים ומטעויות, שימור שיטות עבודה מסורתיות והימנעות מניסיונות חדשניים, וסכנה לצייתנות עיוורת, ל\"ראש קטן\" ול\"כסת\"ח\"."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מה מאפיין את המנהיגות המתקנת הפסיבית (\"כיבוי שריפות\")?",o:["הצבה ברורה של היעדים ואיתור צרכי המונהגים עוד לפני קביעת התגמול שיינתן","הצגת חזון ברור למצבים עתידיים רצויים וחילחולו בקרב כל הצוות","הגדרת תקנים כלליים והימנעות ממעורבות כל עוד לא מתגלות טעויות או תקלות","מעקב פעיל ובקרה צמודה אחר כל צעד של המונהגים לאורך כל הדרך"],c:2,e:"המנהיגות המתקנת הפסיבית מתבססת על איתור טעויות ותיקונן, הגדרת תקנים כלליים לביצוע והימנעות מכל מעורבות באופן הביצוע כל עוד לא מתגלות טעויות. המנהיג מתערב רק כשתקלה מגיעה לידיעתו."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"באיזה משפט מאמין המנהיג המתקן הפסיבי?",o:["\"קיימת דרך אחת טובה ביותר\"","\"אין דרך אחת לנהל — זה תלוי מצב\"","\"אנשים רגילים עושים דברים יוצאי דופן\"","\"אם זה לא שבור — אל תתקן!\""],c:3,e:"המנהיג המתקן הפסיבי מאמין במשפט \"אם זה לא שבור — אל תתקן!\", ומתמקד בכיבוי שריפות: הוא מתערב רק כאשר תקלה מגיעה לידיעתו ופועל להחזרת הדברים לקדמותם."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מהן תגובות המונהגים למנהיגות מתקנת פסיבית?",o:["הנעה המבוססת על חשש מתגובה חריפה של המנהיג בכל תקלה, ושמירת הרמה הקיימת","הנעה המבוססת על הזדהות מלאה עם החזון הארגוני ועל ראייתו כחזון אישי משלהם","הנעה המבוססת על רצון להתפתח, ללמוד ולמצות את הפוטנציאל האישי","הנעה המבוססת על אדישות מוחלטת ועל התמקדות ביעדים אישיים בלבד"],c:0,e:"תגובות המונהגים למנהיגות מתקנת פסיבית: הנעה המבוססת על חשש מתגובה חריפה של המנהיג בכל תקלה או כישלון, ושמירה על הרמה הקיימת בלבד."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"שאלות מבחן",q:"מה נכון לפי מודל מנהיגות הטווח המלא?",o:["הדפוס האפקטיבי נקבע אך ורק לפי רמת הבשלות של הכפיפים","ככל שמאמצים דפוסי מנהיגות מעצבת, המנהיגות אפקטיבית יותר","ככל שמאמצים דפוסי מנהיגות מתקנת פסיבית, המנהיגות אפקטיבית יותר","כל הדפוסים אפקטיביים במידה שווה, וההבדל ביניהם סגנוני בלבד"],c:1,e:"לפי מודל הטווח המלא, ככל שמאמצים דפוסי מנהיגות מעצבת כך המנהיגות אפקטיבית יותר. המנהיגות המעצבת היא הדפוס האפקטיבי ביותר ליצירת שינוי והשפעה."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"שאלות מבחן",q:"מהו הדפוס האפקטיבי ביותר ליצירת שינוי והשפעה לפי מודל הטווח המלא?",o:["ניהול החריגים האקטיבי","ניהול החריגים הפסיבי","המנהיגות המעצבת","התגמול המותנה"],c:2,e:"לפי מודל הטווח המלא, המנהיגות המעצבת היא הדפוס האפקטיבי ביותר ליצירת שינוי והשפעה — בעוד המנהיגות המתגמלת מביאה לרמת הביצוע הנדרשת בלבד."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"שאלות מבחן",q:"מנהיגות מתקנת אקטיבית ומנהיגות מתקנת פסיבית נחשבות ל:",o:["שלבים במחזור החיים","מקורות כוח בארגון","תיאוריות מוטיבציה","סגנונות מנהיגות"],c:3,e:"המנהיגות המתקנת האקטיבית והמנהיגות המתקנת הפסיבית נחשבות לסגנונות מנהיגות — שני מרכיבים בתוך המנהיגות המתגמלת במודל הטווח המלא."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מה ההבדל המרכזי בין המנהיגות המתקנת האקטיבית לפסיבית?",o:["האקטיבית עוקבת מראש אחר תחומים מועדים לפורענות; הפסיבית מתערבת רק אחרי שהתקלה נודעה","האקטיבית מתערבת רק אחרי שהתקלה נודעה; הפסיבית עוקבת מראש אחר תחומים מועדים לפורענות בארגון","האקטיבית מציגה חזון ברור; הפסיבית מבהירה את התגמול הצפוי בגין הביצוע","האקטיבית נמנעת מהגדרת יעדים; הפסיבית מגדירה יעדים ואחראים לכל אחד מהם"],c:0,e:"המתקנת האקטיבית מקיימת מעקב פעיל ומראש אחר תחומים מועדים לפורענות ומנסה לאתר ולתקן במהירות. המתקנת הפסיבית נמנעת מכל מעורבות כל עוד לא מתגלות טעויות, ומתערבת רק כשהתקלה מגיעה לידיעת המנהיג."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"שאלות מבחן",q:"משה בנה צוות חדש, ואילו יעקב עובד לבדו. אילו דפוסי מנהיגות מתאימים לכל אחד מהם?",o:["לשניהם אי-מנהיגות, שכן אין צורך בהתערבות","למשה מנהיגות משימתית, וליעקב מנהיגות מעצבת","למשה מנהיגות מעצבת, וליעקב מנהיגות משימתית","לשניהם מנהיגות מתקנת פסיבית באותה מידה"],c:1,e:"לצוות חדש שנבנה מתאימה מנהיגות משימתית — הגדרת תפקידים, מטלות והכוונה. לעובד הפועל לבדו לאורך זמן מתאימה מנהיגות מעצבת, המניעה מתוך חזון ומשמעות."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מנהל אינו מגדיר ציפיות או יעדים, נמנע מהחלטות, נוטה לעכב דברים ואינו מעורב בעבודת הצוות. באיזה סגנון מדובר?",o:["בתגמול מותנה בונה","במנהיגות מעצבת","באי-מנהיגות (\"שבת והנח\")","במנהיגות מתקנת פסיבית"],c:2,e:"אלו מאפייני אי-מנהיגות — \"שבת והנח\": אין הגדרה ברורה של ציפיות, יעדים, תפקידים, תגמולים או עונשים; הימנעות מנקיטת עמדה ומקבלת החלטות; נטייה לעכב דברים; הפגנת אדישות; ואין מעורבות פעילה."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מהי הסכנה המרכזית בשימוש מוגזם במנהיגות מתקנת אקטיבית?",o:["התלהבות יתר של המונהגים והתנפלות על משימות מסוכנות מדי","אובדן שליטה של המנהיג על הנעשה בצוות ופיזור אחריות מוחלט בין כל חבריו","עלייה חדה בתחלופת העובדים בשל היעדר משוב על הביצועים","צייתנות עיוורת, \"ראש קטן\" והימנעות מניסיונות חדשניים בקרב המונהגים"],c:3,e:"תגובות המונהגים למנהיגות מתקנת אקטיבית כוללות הימנעות מלקיחת סיכונים ומטעויות, שימור שיטות עבודה מסורתיות והימנעות מניסיונות חדשניים — עם סכנה לצייתנות עיוורת, ל\"ראש קטן\" ול\"כסת\"ח\"."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מנהל מודיע לצוות מהם היעדים לרבעון, מי אחראי לכל יעד, ומהו הבונוס שיינתן בגין עמידה בהם. באיזה סגנון מדובר?",o:["בתגמול בונה (תגמול מותנה)","במנהיגות מתקנת אקטיבית","בהנעה באמצעות השראה","באתגור אינטלקטואלי"],c:0,e:"הצבה ברורה ומובנת של היעדים ושל האחראים להם, לצד הבהרת התגמול בתמורה להשגתם, היא ליבת התגמול הבונה — התגמול המותנה במנהיגות המתגמלת."},
{t:"מנהיגות מתגמלת והטווח המלא",s:"סיכום",q:"מה נותן המנהיג המפעיל תגמול בונה, מעבר להצבת היעדים ולהבהרת התגמול?",o:["עידוד לחשיבה עצמאית-ביקורתית ולהעלאת חלופות יצירתיות","משוב בונה ושבח כאשר המונהגים ראויים לכך, או מניעתם כאשר אינם","חזון ברור לגבי מצבים עתידיים רצויים והתלהבות ואופטימיות","חניכה אישית, אקלים תומך ומטלות בדרגת קושי הולכת ועולה"],c:1,e:"בתגמול בונה המנהיג נוטל חלק פעיל בהשגת המשימה, ונותן משוב בונה ושבח — או מונע משוב ושבח ונותן \"עונשים\" — כאשר המונהגים ראויים לכך."}
]);
