/* ===================== 15. מוטיבציה — יסודות ותיאוריות תוכן ===================== */
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהם ארבעת השלבים במודל המוטיבציה הפשוט?",o:["תכנון, ארגון, הנהגה ובקרה","ציפייה, תכליתיות, ערכיות ומאמץ","צורך, התנהגות, תגמול ומשוב","תשומות, עיבודים, תפוקות וייצוא"],c:2,e:"מודל המוטיבציה הפשוט: צורך — יוצר את השאיפה לסיפוקו; התנהגות — ביטויה בפעולות למימוש הצורך; תגמול — סיפוק הצרכים; ומשוב — התגמול מיידע את האדם אם ההתנהגות הייתה נכונה וניתן להשתמש בה שוב."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהן שלוש הגישות בהתפתחות התפיסה של הנעת עובדים, ואיזה \"אדם\" מייצגת כל אחת?",o:["הגישה המכניסטית (האדם הרציונלי), הבירוקרטית (האדם המשפטי) והמצבית (האדם הגמיש)","גישת התכונות (האדם הדגול), ההתנהגותית (האדם הנלמד) והמצבית (האדם המסתגל)","גישת התוכן (האדם הצרכני), גישת התהליך (האדם המחשב) והמעצבת (האדם המונע)","הגישה הקלאסית (האדם הכלכלי), יחסי אנוש (האדם החברתי) ומשאבי אנוש (האדם השלם)"],c:3,e:"התפתחות הגישות להנעה: הגישה הקלאסית — הניהול המדעי — אנשים יעבדו קשה יותר בעבור תשלום גבוה יותר (האדם הכלכלי); גישת יחסי אנוש — תגמולים לא-חומריים העונים על צרכים חברתיים (האדם החברתי); וגישת משאבי אנוש — עובדים הם יצורים מורכבים המונעים על ידי גורמים רבים (האדם השלם)."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי התרומה העיקרית של מחקרי ההנעה לתפיסה התיאורטית?",o:["כסף אינו הגורם היחיד, והיחסים החברתיים הם גורם הנעה משמעותי לא פחות מתמריצים כלכליים","כסף הוא הגורם היחיד המניע עובדים, וכל שאר הגורמים משניים לו בהשפעתם","היחסים החברתיים אינם משפיעים כלל על ההנעה, ורק תנאי העבודה הפיזיים הם שקובעים אותה בפועל","המוטיבציה נקבעת מראש לפי אישיות העובד ואינה ניתנת להשפעה מצד הארגון"],c:0,e:"התרומה העיקרית: שינוי בתפיסה התיאורטית — לא עוד השקפה כלכלית בהקשר של הנעת עובדים. כסף אינו גורם יחיד, ויחסים חברתיים הם גורם הנעה משמעותי לא פחות מתמריצים כלכליים, וכך גם המנהיגות הלא פורמלית."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי מוטיבציה, לפי ההגדרה בסיכום?",o:["מידת המחויבות של העובד לארגון ולערכיו לאורך שנות עבודתו בו","הדחף או הגירוי הגורם לבני האדם לפעול — הנכונות להתאמץ ולהשקיע אנרגיה","היכולת של הפרט לבצע את המשימה שהוטלה עליו ברמה המקצועית הנדרשת","מידת שביעות הרצון של העובד מתנאי העבודה ומיחסו של הממונה הישיר כלפיו"],c:1,e:"מוטיבציה היא הדחף או הגירוי הגורם לבני האדם לפעול — הנכונות להתאמץ ולהשקיע אנרגיה לביצוע המשימה, במישור הפיזי, האינטלקטואלי, הרגשי ואחר."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהם שלושת מרכיבי המפתח בהגדרת מוטיבציה?",o:["ציפייה, תכליתיות וערכיות","גיוון, אוטונומיה ומשוב","עוצמה, כיוון והתמדה","ידע, ניסיון ומיומנות"],c:2,e:"שלושת מרכיבי המפתח: עוצמה — עוצמת המאמץ המושקע; כיוון — איכות המאמץ וניתובו לכיוון הרצוי לארגון; והתמדה — לאורך כמה זמן האדם ממשיך במאמציו."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהו מרכיב ה\"כיוון\" במוטיבציה?",o:["עוצמת המאמץ — כמה קשה האדם ינסה להשיג את המטרה","משך המאמץ — לאורך כמה זמן האדם ממשיך במאמציו","מקור המאמץ — האם הוא נובע מגורם פנימי או מגורם חיצוני כלשהו","איכות המאמץ — ניתובו לכיוון שרצוי לארגון ועקבי עם יעדיו"],c:3,e:"הכיוון הוא איכות המאמץ: ניתוב המאמץ לכיוון שרצוי לארגון, כזה שהוא עקבי עם יעדי הארגון. העוצמה היא כמה קשה האדם ינסה, וההתמדה היא לאורך כמה זמן."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה ההבדל בין תיאוריות תוכן לתיאוריות תהליך במוטיבציה?",o:["תיאוריות התוכן מסבירות מה מניע עובדים ומדגישות צרכים; תיאוריות התהליך מתמקדות בקשר בין הצורך להתנהגות","תיאוריות התוכן מתמקדות בקשר שבין הצורך להתנהגות; תיאוריות התהליך מסבירות מה מניע עובדים ומדוע יתאמצו","תיאוריות התוכן עוסקות בתגמול חיצוני בלבד; תיאוריות התהליך עוסקות בתגמול פנימי בלבד","תיאוריות התוכן חלות על עובדים זוטרים; תיאוריות התהליך חלות על מנהלים בכירים"],c:0,e:"תיאוריות של תוכן מסבירות מה מניע עובדים ומדוע יתאמצו בעבודה — ומדגישות את הצרכים האנושיים. תיאוריות תהליכיות מתמקדות בתהליך המקשר בין הצורך לבין ההתנהגות — איך עובדים מחפשים תגמול בעבודה."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"אילו צרכים של מסלאו נכללים ב\"צרכי הצמיחה\" (Growth) של אלדרפר?",o:["צרכים פיזיים — משכורת סבירה, סביבת עבודה סבירה, הפסקות וחופשות","מימוש עצמי וצורכי הערכה — קידום, טקסי הענקת פרסים, פרסום וסמלי סטטוס","צרכים חברתיים — אירועים חברתיים, פעילויות, מסיבות ופיקניקים בארגון","צורכי ביטחון — קביעות בעבודה, משכורת קבועה, קרנות פנסיה וביטוח חיים"],c:1,e:"אלדרפר (ERG) מקבץ את חמש הרמות של מסלאו לשלוש: קיומיים (Existence), קשר (Relatedness) וצמיחה (Growth). צרכי הצמיחה כוללים מימוש עצמי (צורכי הגשמה) וצורכי הערכה — קידום, טקסי הענקת פרסים, פרסום וסמלי סטטוס."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"אילו צרכים של מסלאו נכללים ב\"צרכים הקיומיים\" (Existence) של אלדרפר?",o:["צורכי הערכה — קידום, פרסום, טקסי פרסים וסמלי סטטוס בארגון","צורכי מימוש עצמי — הגשמה, משמעות ומיצוי הפוטנציאל האישי","צורכי ביטחון וצרכים פיזיים — קביעות, פנסיה, ביטוח, בטיחות ומשכורת סבירה","צרכים חברתיים — אירועים, פעילויות, מסיבות ופיקניקים המחזקים את תחושת השייכות"],c:2,e:"הצרכים הקיומיים (Existence) אצל אלדרפר כוללים את צורכי הביטחון של מסלאו (קביעות, משכורת קבועה, פנסיה, ביטוח, בטיחות) ואת הצרכים הפיזיים (משכורת סבירה, סביבת עבודה, הפסקות וחופשות)."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"\"לפי מסלאו, כדי שהמוטיבציה של העובד תהיה גבוהה יש לגרום לו להגיע לשלב של הגשמה עצמית\" — מה נכון?",o:["נכון — רק ההגשמה העצמית מייצרת מוטיבציה גבוהה אצל כל אחד ואחד מן העובדים","נכון — אך רק אצל עובדים בעלי השכלה גבוהה וותק רב בארגון","לא נכון — משום שמסלאו כלל אינו עוסק במוטיבציה של עובדים","לא נכון — יש לזהות באיזה שלב נמצא העובד ולספק את הצורך שבו הוא נמצא"],c:3,e:"הטענה אינה נכונה. ארגון המיישם את היררכיית הצרכים של מסלאו צריך לזהות באיזה שלב נמצא העובד ולדאוג לספק לו את הצורך של אותו שלב — ולא לכוון את כולם להגשמה עצמית."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"ארגון המיישם את היררכיית הצרכים של מסלאו — מה עליו לעשות?",o:["לזהות באיזה שלב נמצא העובד ולדאוג לספק לו את הצורך של אותו שלב","לספק לכל העובדים את אותם תנאים בדיוק, כדי לשמור על שוויון מלא ביניהם","להתמקד בצרכים הקיומיים בלבד, שהם הבסיס לכל שאר הצרכים","לדלג על השלבים הנמוכים ולהתמקד ישירות במימוש העצמי"],c:0,e:"ארגון המיישם את מסלאו צריך לזהות באיזה שלב נמצא העובד ולדאוג לספק לו את הצורך המתאים לאותו שלב — הצרכים בנויים בהיררכיה, ולכל עובד מיקום אחר בה."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהם שלושת העקרונות בתיאוריית הצרכים של אלדרפר (1969)?",o:["הצרכים נרכשים חברתית ואינם מולדים; הם כוללים הישג, עוצמה והשתייכות; והם נמדדים בכלי אבחון ארגוני","ככל שצורך מסופק יותר רוצים לספק צרכים גבוהים יותר; ככל שמסופק פחות רוצים לספקו יותר; וככל שמסופק פחות רוצים לספק צרכים אחרים","הצרכים מסודרים בהיררכיה נוקשה שאין לדלג עליה; לא ניתן לעבור שלב; ורק לאחר סיפוק מלא עוברים לשלב הבא","הצרכים נחלקים להיגיינים ולמוטיבטורים; ההיגיינים מונעים אי-שביעות רצון; והמוטיבטורים מייצרים שביעות רצון"],c:1,e:"שלושת העקרונות של אלדרפר: 1. ככל שצורך מסופק יותר, כך רוצים לספק יותר את הצרכים הגבוהים. 2. ככל שצורך מסופק פחות, רוצים לספק אותו יותר. 3. ככל שצורך מסופק פחות, רוצים לספק יותר צרכים אחרים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"אילו גורמים נחשבים \"היגיינים\" (חיצוניים) בתיאוריה הדו-גורמית של הרצברג?",o:["גיוון מיומנויות, זהות המשימה, אוטונומיה ומשוב על הביצוע","צורך בהישג, צורך בעוצמה וצורך בהשתייכות בקרב העובדים","משכורת, תנאי עבודה, בונוסים, יחס הממונה וביטחון בעבודה","עניין בעבודה, תחושת אתגר, תחושת הישג ואחריות אישית"],c:2,e:"הגורמים ההיגייניים (חיצוניים/חומריים) קשורים לסביבת העבודה ולתנאיה: משכורת, תנאי עבודה, בונוסים, יחס הממונה וביטחון בעבודה. המוטיבטורים קשורים לתוכן העיסוק: עניין, אתגר, הישג ואחריות."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"אילו גורמים נחשבים \"מוטיבטורים\" (פנימיים) אצל הרצברג?",o:["משכורת, בונוסים וביטחון בעבודה — הקשורים לתנאי ההעסקה","יחס הממונה ותנאי העבודה הפיזיים — הקשורים לסביבת העבודה","קביעות בעבודה וקרן פנסיה — הקשורים לביטחון הכלכלי של העובד ומשפחתו","עניין בעבודה, תחושת אתגר והישג ואחריות — הקשורים לתוכן העיסוק"],c:3,e:"הגורמים הפנימיים — המוטיבטורים — קשורים לתוכן העיסוק ולעצם ביצוע העבודה: עניין בעבודה, תחושת אתגר והישג, ואחריות."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"לאיזה מצב מביא סיפוק צרכי ההיגיינה לפי הרצברג?",o:["למצב ניטרלי — היעדר חוסר שביעות רצון, אך לא לשביעות רצון ומוטיבציה","למוטיבציה גבוהה ולשביעות רצון מלאה מן העבודה ומתוכן העיסוק של העובד עצמו","לחוסר שביעות רצון מוגבר, בשל ציפיות שעולות עם הזמן","לאדישות מוחלטת של העובד כלפי העבודה וכלפי הארגון"],c:0,e:"סיפוק צרכי היגיינה מעביר מחוסר שביעות רצון ומוטיבציה נמוכה למצב ניטרלי — היעדר חוסר שביעות רצון. רק סיפוק הצרכים ההניעתיים (המוטיבטורים) מביא לשביעות רצון ולמוטיבציה גבוהה."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"לפי הרצברג, מה יש לתת לעובד כדי להניע אותו?",o:["ביטחון תעסוקתי וקביעות","עניין, אתגר, אוטונומיה ואחריות","העלאה בשכר ובונוס שנתי","שיפור בתנאי העבודה הפיזיים"],c:1,e:"לפי הרצברג, ההנעה נובעת מהגורמים הפנימיים — המוטיבטורים: עניין בעבודה, תחושת אתגר והישג, אוטונומיה ואחריות. הגורמים ההיגייניים מונעים חוסר שביעות רצון אך אינם מניעים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"ארגון שרוצה לדאוג למוטיבציה גבוהה של עובדיו ומיישם את התיאוריה הדו-גורמית — במה עליו להתמקד?",o:["בשכר ובתנאים הנלווים","בביטחון התעסוקתי בלבד","בגורמים המוטיבטורים","בגורמים ההיגייניים"],c:2,e:"ארגון המיישם את תיאוריית שני הגורמים של הרצברג וחותר למוטיבציה גבוהה צריך לדאוג לגורמים המוטיבטורים — עניין, אתגר, הישג ואחריות — ולא להסתפק בהיגייניים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"אור טוען שהוא נהנה מעבודתו בעיקר בזכות האפשרות להתפתח, ללמוד ולהתקדם. מה ניתן להסיק לפי הרצברג?",o:["שהגורמים ההיגייניים מסופקים בעבודתו במלואם","שהוא נמצא במצב ניטרלי של היעדר חוסר שביעות רצון","שהוא בעל צורך גבוה בהשתייכות לפי מודל מקללנד","שהגורמים הפנימיים — המוטיבטורים — מסופקים בעבודתו"],c:3,e:"התפתחות, למידה והתקדמות הם גורמים פנימיים הקשורים לתוכן העיסוק — כלומר מוטיבטורים. מכאן שהגורמים הפנימיים מסופקים בעבודתו של אור."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"במה עוסקת תיאוריית הצרכים של מקללנד (1961), ומה ייחודה?",o:["בצרכים חברתיים נרכשים — היא תיאוריית מניעה וכלי אבחוני של מפת צרכים לארגון","בצרכים ביולוגיים מולדים — היא מתארת את הדחפים הבסיסיים ביותר של האדם ושל התנהגותו","בתנאי הסביבה החומריים — היא מתארת מה מונע חוסר שביעות רצון","בתהליך החישוב של כדאיות המאמץ — היא מתארת איך מתקבלת ההחלטה"],c:0,e:"תיאוריית הצרכים של מקללנד היא תיאוריית מניעה וכלי אבחוני של מפת צרכים הולמת לארגון, והיא עוסקת בצרכים חברתיים נרכשים: הישגיות, עוצמה והשתייכות."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי המגבלה של מודל מקללנד בהשוואה למסלאו?",o:["אין בו התייחסות לתהליך שבין הצורך להתנהגות","אין בו צרכים בסיסיים, וחסרים בו צרכים נוספים","אין בו כלל התייחסות לצורך בהישג ובעוצמה","אין בו הבחנה בין גורמים פנימיים לחיצוניים"],c:1,e:"בתיאוריה של מקללנד אין צרכים בסיסיים וחסרים בה צרכים נוספים — היא עוסקת רק בשלושה צרכים חברתיים נרכשים: הישגיות, עוצמה והשתייכות."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה מאפיין אדם בעל צורך גבוה בהשתייכות לפי מקללנד?",o:["רוצה להוביל, לתת עצות ולזכות ביוקרה ובתפקיד בעל סטטוס גבוה","מעדיף עבודה שגרתית וברורה ונמנע מכל סיכון או שינוי בתפקידו","רוצה להיות פופולרי, שואף ליחסים חבריים, אינו אוהב להיות לבד ואוהב לעזור","שואף להצטיינות, בוחר במשימות מאתגרות וזקוק למשוב מיידי וישיר על ביצועיו"],c:2,e:"הצורך בהשתייכות: רצון להיות פופולרי, שיחשבו עליו טובות, שאיפה ליחסים חבריים, אי-אהבה להיות לבד בעבודה ואהבה לעזור לאחרים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה מאפיין אדם בעל צורך גבוה בעוצמה לפי מקללנד?",o:["שאיפה להצטיינות, לביצוע מאתגר, לקיחת סיכונים וצורך במשוב מיידי","רצון להיות פופולרי, שאיפה ליחסי חברות ואי-אהבה לעבוד לבד","נטייה לדיוק, ליסודיות, לתכנון ולהימנעות משגיאות בעבודה","רצון להוביל, לתת עצות, יוקרה, תפקיד בעל סטטוס והשפעה על אנשים"],c:3,e:"הצורך בעוצמה: רצון להוביל, לתת עצות, יוקרה, תפקיד עם סטטוס והשפעה על אנשים. זהו הצורך שנמצא גבוה במיוחד אצל מנהלים אפקטיביים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מדוע מכונים הגורמים ההיגייניים אצל הרצברג \"חיצוניים\"?",o:["משום שהם קשורים לסביבת העבודה ולתנאיה, ולא לתוכן העיסוק עצמו","משום שהם נקבעים על ידי גורמים מחוץ לארגון, כמו השוק והרגולציה","משום שהם נמדדים באמצעות שאלונים חיצוניים ולא באמצעות דיווח עצמי","משום שהם משפיעים רק על עובדים חיצוניים ולא על עובדי הארגון עצמו"],c:0,e:"הצרכים החיצוניים — ההיגייניים או החומריים — נקראים כך משום שהם קשורים לסביבת העבודה ולתנאיה: משכורת, תנאי עבודה, בונוסים, יחס הממונה וביטחון בעבודה. הפנימיים קשורים לתוכן העיסוק עצמו."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מנהל העלה את שכר כל עובדיו ושיפר את המשרדים, אך המוטיבציה לא עלתה. כיצד מסביר זאת הרצברג?",o:["הוא לא זיהה נכון את שלב הצרכים של כל עובד בפירמידת מסלאו","הוא שיפר גורמים היגייניים בלבד, ואלה מביאים למצב ניטרלי ולא למוטיבציה","הוא שיפר מוטיבטורים, ולכן הייתה צריכה להיות עלייה חדה במוטיבציה","הוא פגע בגורמים הפנימיים דווקא, ולכן המוטיבציה אף עלולה לרדת"],c:1,e:"שכר ותנאי עבודה הם גורמים היגייניים. סיפוקם מעביר מחוסר שביעות רצון למצב ניטרלי בלבד — ורק סיפוק המוטיבטורים (עניין, אתגר, הישג, אחריות) מביא לשביעות רצון ולמוטיבציה גבוהה."}
]);

{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי \"זהות המשימה\" (task identity) לפי הקמן ואולדהם?",o:["המידה שבה לעבודה יש השפעה על אחרים בארגון ומחוצה לו","המידה שבה התפקיד כולל פעילויות המצריכות מיומנויות שונות","המידה שבה לעובד יש חופש לתכנן ולבצע את תפקידו כרצונו","המידה שבה העבודה מצריכה השלמת משימה מההתחלה ועד הסוף"],c:3,e:"זהות המשימה (task identity) היא המידה שבה העבודה מצריכה השלמת משימה מההתחלה ועד הסוף — בשונה מחשיבות המשימה, שהיא מידת ההשפעה על אחרים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי \"חשיבות המשימה\" (task significance) לפי הקמן ואולדהם?",o:["המידה שבה לעבודה יש השפעה על אחרים — למשל חוקרים המפתחים תרופה למחלה","המידה שבה העבודה מצריכה השלמת המשימה מהתחלתה ועד סופה","המידה שבה התפקיד מצריך מספר מיומנויות ויכולות של העובד","המידה שבה העובד מקבל אינפורמציה שוטפת על האפקטיביות של ביצועיו בפועל בעבודה"],c:0,e:"חשיבות המשימה (task significance) היא המידה שבה לעבודה יש השפעה על אחרים — לדוגמה, חוקרים העובדים על פיתוח תרופה למחלה סופנית."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי האוטונומיה כמאפיין תפקיד לפי הקמן ואולדהם?",o:["המידה שבה העובדים מקבלים משוב על האפקטיביות של הביצועים שלהם","המידה שבה לעובדים יש חופש לתכנן, לקבוע זמנים ולבצע את תפקידם כרצונם","המידה שבה העובדים יכולים לבחור עם מי לעבוד ובאיזה צוות בארגון הם רוצים להשתלב","המידה שבה העובדים משתתפים בקבלת ההחלטות האסטרטגיות של הארגון"],c:1,e:"אוטונומיה (autonomy) היא המידה שבה לעובדים יש חופש לתכנן, לקבוע זמנים ולבצע את תפקידם כרצונם."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"אילו מבין חמשת מאפייני התפקיד משפיעים יותר מהשאר על המוטיבציה, לפי הנוסחה של הקמן ואולדהם?",o:["זהות המשימה וחשיבותה","חשיבות המשימה והמשוב","האוטונומיה והמשוב","גיוון המיומנויות וזהות המשימה"],c:2,e:"הקמן ואולדהם יצרו נוסחה לחישוב פוטנציאל המוטיבציה. על פיה ניתן לראות כי לאוטונומיה ולמשוב יש השפעה גדולה יותר על המוטיבציה מאשר לשאר הממדים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהן שלוש התוצאות ברמת הפרט הנובעות ממאפייני התפקיד?",o:["עוצמת המאמץ, כיוון המאמץ והתמדה בו לאורך זמן ממושך","הישגיות, עוצמה והשתייכות כצרכים נרכשים","ציפייה, תכליתיות וערכיות של התגמול הצפוי","חשיבות וערך העבודה, אחריות, ותפיסת התוצאות והבנתן"],c:3,e:"התוצאות ברמת הפרט לפי מודל מאפייני התפקיד: חשיבות/ערך העבודה, אחריות, ותפיסה והבנה של התוצאות."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי \"העשרת תפקיד\"?",o:["מתן אחריות ואתגר לעובד — תפקיד מעניין יותר ממה שהיה לו קודם","הוספת משימות נוספות באותה רמת מורכבות כדי למלא את יום העבודה","העלאת שכרו של העובד והוספת הטבות נלוות לחוזה ההעסקה שלו","העברת העובד לתפקיד אחר בארגון באותה דרגה ובאותם תנאים"],c:0,e:"העשרת תפקיד משמעה לתת אחריות ואתגר — לתת לעובד תפקיד מעניין יותר ממה שהיה לו ולאפשר לו אתגר ועניין. הקמן ואולדהם דיברו גם על הגדלת תפקיד וגם על העשרתו."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"על פי הקמן ואולדהם — מה נכון לגבי העשרת התפקיד?",o:["העשרת התפקיד מחליפה את הצורך בתגמול כספי","ניתן להעלות מוטיבציה בעזרת העשרת התפקיד","העשרת התפקיד משפיעה על שביעות הרצון בלבד","העשרת התפקיד רלוונטית רק לעובדים בכירים"],c:1,e:"לפי הקמן ואולדהם — תיאוריית העשרת התפקיד והגדלת התפקיד — ניתן להעלות מוטיבציה בעזרת העשרת התפקיד, כלומר מתן אחריות ואתגר לעובד."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהן תיאוריות התהליך (\"מוטיבציה 2.0\") שנלמדו?",o:["פידלר והרסי ובלנשארד — תיאוריות מצביות תלויות-נסיבות ומצב הארגון","טיילור, וובר, מאיו ומקגרגור — ארבע הגישות הניהוליות","תורת המטרה (לוק), תיאוריית ההוגנות (אדמס) ותיאוריית הציפיות (ורום)","מסלאו, אלדרפר, הרצברג ומקללנד — ארבע תיאוריות הצרכים"],c:2,e:"תיאוריות התהליך — \"מוטיבציה 2.0\" בסיכום — מתמקדות בתהליך המקשר בין הצורך להתנהגות: תורת המטרה של לוק (SMART), תיאוריית ההוגנות של אדמס ותיאוריית הציפיות של ורום."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי התיאוריה של LOCKE?",o:["תיאוריית ההוגנות","תיאוריית הציפיות","התיאוריה הדו-גורמית","תיאוריית הצבת המטרות"],c:3,e:"התיאוריה של לוק (Locke) היא תיאוריית הצבת המטרות (תורת המטרה), שעליה נשען גם מודל SMART."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה חידש לוק ביחס לתיאוריות התהליך שקדמו לו?",o:["הוא הצביע על מוטיבציה פנימית: עצם הרצון להשיג מטרה מושכת ומאתגרת הוא שיוצר את המוטיבציה","הוא הצביע על כך שרק תגמול חיצוני כספי מסוגל להניע עובדים לאורך זמן","הוא הצביע על כך שהמוטיבציה נובעת אך ורק מהשוואת התגמול שהתקבל לזה של עובדים אחרים בארגון עצמו","הוא הצביע על כך שהמוטיבציה תלויה בסיפוק הצרכים לפי סדר היררכי קבוע"],c:0,e:"עד לוק עסקו תיאוריות התהליך בסוגי תגמולים חיצוניים או פנימיים. לוק מדבר על מוטיבציה פנימית: היכולת של אדם להשיג מטרה שהוא רוצה היא כשלעצמה גורם מניע — הרצון להשיג מטרה הוא שיוצר את המוטיבציה."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"על מה נשען מודל SMART, ומה משמעות ראשי התיבות?",o:["על התיאוריה של מסלאו — שלב, מדידה, אבחון, רמה ותכנון","על התיאוריה של לוק — ספציפי, מדיד, בר-השגה, ריאלי ותחום בזמן","על התיאוריה של ורום — ציפייה, מדידה, אמון, תגמול וזמן","על התיאוריה של אדמס — השוואה, מדידה, איזון, ריאליות וזמן קצוב"],c:1,e:"מודל SMART נשען על התיאוריה של לוק — מודל הצבת מטרות/יעדים: Specific (ספציפי), Measurable (מדיד), Achievable (בר-השגה), Real (ריאלי) ו-Time (תחום בזמן)."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה משמעות ה-A במודל SMART?",o:["Approved — היעד חייב להיות מאושר על ידי ההנהלה הבכירה של הארגון","Accountable — היעד חייב להיות משויך לאחראי מוגדר אחד ויחיד","Achievable — היעד חייב להיות בר-השגה בלוחות הזמנים ובאמצעים שהוגדרו","Ambitious — היעד חייב להיות שאפתני ולמתוח את גבולות היכולת של העובד עצמו"],c:2,e:"ה-A במודל SMART הוא Achievable: היעד חייב להיות בר-השגה, בלוחות הזמנים ובאמצעים שהוגדרו לעובד — למשל, האם יש לארגון את המשאבים להשגתו."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מנהל אומר לצוות: \"היו אנשי מכירות תותחים — אני סומך עליכם\". האם הוא מיישם את תיאוריית הצבת המטרות של לוק?",o:["נכון — הוא הציב יעד מאתגר והביע אמון בצוות","נכון — הוא יישם את מרכיב הריאליות שבמודל","לא נכון — משום שלוק אינו עוסק בהצבת יעדים","לא נכון — היעד אינו ספציפי, מדיד או תחום בזמן"],c:3,e:"אמירה כללית מסוג זה אינה מיישמת את תיאוריית הצבת המטרות: לפי מודל SMART היעד חייב להיות ספציפי ומוגדר היטב, מדיד, בר-השגה, ריאלי ותחום בזמן — ואף אחד מהתנאים לא מתקיים כאן."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"על אילו תיאוריות נשענת תיאוריית ההוגנות של אדמס (1965)?",o:["תורת החליפין החברתי של הומנס ותורת הדיסוננס הקוגניטיבי של פסטינגר","תורת הציפייה של ורום ותיאוריית הצבת המטרות של לוק","היררכיית הצרכים של מסלאו והתיאוריה הדו-גורמית של הרצברג בתחום המוטיבציה","תיאוריית התכונות של קרלייל ומודל התלות של פידלר"],c:0,e:"תיאוריית ההוגנות נשענת על תורת החליפין החברתי של הומנס (איזון אדם-סביבה), על תורת הדיסוננס הקוגניטיבי של פסטינגר (איזון עצמי) ועל תורת ההשוואה החברתית."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהו עקרון ההוגנות של אדמס אצל יחידים?",o:["היחיד משווה את המאמץ שהשקיע לתוצאה שהתקבלה בפועל בסוף התהליך","היחיד משווה את יחס התגמול לתשומה שלו לזה של אחרים באותו תפקיד","היחיד משווה את התגמול שלו לתגמול שקיבל בעברו בארגונים קודמים","היחיד משווה את התגמול שלו לרמת הצרכים שבה הוא נמצא בפירמידה"],c:1,e:"לפי עקרון ההוגנות של אדמס, יחידים משווים את יחסי התגמול/תשומה (השקעה) שלהם לאלה של אחרים באותו תפקיד: תגמול הוגן = יחס שווה; תגמול יתר = יחס גבוה יותר; תגמול חסר = יחס נמוך יותר."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"רביד ודנה עובדות באותה עבודה, משקיעות אותה השקעה ומגיעות מאותו רקע. רביד מרוויחה יותר מדנה. מה מצבן לפי אדמס?",o:["שתיהן במצב של תגמול הוגן, שכן ההשקעה זהה","שתיהן במצב של תגמול חסר ביחס לשוק העבודה","רביד במצב של תגמול יתר ודנה במצב של תגמול חסר","רביד במצב של תגמול חסר ודנה במצב של תגמול יתר"],c:2,e:"תגמול יתר: התגמול ליחיד חלקי התשומה שלו גדול מזה של האחר. תגמול חסר: היחס קטן מזה של האחר. רביד מקבלת יותר על אותה השקעה — תגמול יתר; דנה — תגמול חסר."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה קורה כאשר תחושת אי-ההוגנות עוברת סף מסוים?",o:["היחידים יסתגלו למצב ויפסיקו להשוות את עצמם לאחרים","היחידים ידווחו על כך לממונים ויחכו להחלטת ההנהלה","היחידים יגדילו את תפוקתם כדי להצדיק את התגמול","היחידים יפעלו כדי לשנות את המצב הבלתי הוגן שנוצר"],c:3,e:"יחידים מרגישים לחץ ואי-נוחות כאשר תגמוליהם אינם הוגנים. כאשר הלחץ עובר סף מסוים, היחידים יפעלו כדי לשנות את המצב הבלתי הוגן."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהם ארבעת הפתרונות האפשריים למצבי אי-הוגנות לפי אדמס?",o:["שינוי תפיסה, שינוי האחר, נקיטת פעולה ליצירת יחסים הוגנים, ועזיבת השדה","הגדלת התפוקה, הקטנת התפוקה, בקשת העלאה בשכר, ופנייה אל ועד העובדים בארגון","דיווח לממונה, פנייה למשאבי אנוש, הגשת תלונה, ותביעה משפטית","הפחתת המאמץ, שיפור האיכות, שינוי התפקיד, והסבה מקצועית מלאה"],c:0,e:"פתרונות למצבי אי-הוגנות לפי אדמס: א. שינוי תפיסה. ב. שינוי האחר. ג. נקיטה בפעולה ליצירת יחסים הוגנים. ד. עזיבת השדה."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מיהם \"האחרים\" שאליהם משווה עצמו הפרט בתיאוריית ההוגנות?",o:["מנהלי הארגון בלבד, כמדד לפער השכר המרבי בארגון","קבוצות חברות, קבוצות התייחסות, ניסיון עבר ונורמה חברתית","הממונים הישירים בלבד, ורק בתוך אותה יחידה ארגונית בדיוק","עובדים בארגונים מתחרים בלבד, ורק באותו תחום עיסוק"],c:1,e:"ה\"אחרים\" שאליהם משווה הפרט את עצמו יכולים להיות: א. קבוצות חברות. ב. קבוצות התייחסות. ג. ניסיון עבר. ד. נורמה חברתית."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"כיצד פותרים חוסר איזון לפי תיאוריית החליפין, לעומת תיאוריית הדיסוננס?",o:["לפי שתיהן — פנייה לממונה בבקשה לתקן את התגמול שהתקבל","לפי שתיהן — עזיבת מקום העבודה ומעבר לארגון אחר בשוק","לפי החליפין — שינוי בהתנהגות העובד; לפי הדיסוננס — שינוי תפיסתי אצל העובד","לפי החליפין — שינוי תפיסתי אצל העובד; לפי הדיסוננס — שינוי בהתנהגותו"],c:2,e:"לפי תיאוריית החליפין הפתרון הוא שינוי בהתנהגות העובד — שינוי כמות התפוקה או איכותה. לפי תיאוריית הדיסוננס הפתרון הוא שינוי תפיסתי — למשל שכנוע עצמי שהתוספת מגיעה, או שינוי מושא ההשוואה."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהו \"שינוי מושא ההשוואה\" כפתרון לאי-הוגנות?",o:["הקטנת התפוקה עד שהיא תואמת את התגמול שהתקבל","דרישה מהממונה לשנות את שיטת התגמול בארגון כולו","עזיבת הארגון ומעבר לעבודה במקום שבו התגמול הוגן","השוואת עצמי למישהו אחר שביחס אליו המשוואה מאוזנת"],c:3,e:"שינוי מושא ההשוואה הוא פתרון תפיסתי: השוואת עצמי למישהו אחר שביחס אליו המשוואה כן מאוזנת. זהו יישום של תיאוריית הדיסוננס הקוגניטיבי."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי הנחת היסוד של ורום (1964) לגבי התנהגות האדם?",o:["האדם הוא יצור רציונלי והדוניסט, המחשב כדאיות כדי למקסם עונג ולמנוע כאב","האדם הוא יצור חברתי, המונע בעיקר מהשתייכות לקבוצה ומהכרת עמיתיו","האדם הוא יצור מורכב, המונע ממכלול צרכים המסודרים בהיררכיה קבועה","האדם הוא יצור פסיבי, שהתנהגותו נקבעת אך ורק על ידי תגמולים ועונשים חיצוניים"],c:0,e:"ורום טוען שהתנהגות האדם היא תוצאה של תהליך הסקת מסקנות: האדם הוא יצור רציונלי המפעיל מערכת שיקולים, וגם יצור הדוניסט השואף למקסם עונג ולמנוע כאב — ולכן המוטיבציה נובעת מחישוב כדאיות."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהם שלושת המרכיבים במודל הבסיסי של ורום?",o:["תשומה, תפוקה והשוואה לאחרים באותו תפקיד","תוצאה (outcome), ערך (valence) וציפייה (expectancy)","עוצמה, כיוון והתמדה של המאמץ המושקע","ספציפיות, מדידות והשגתיות של היעד שהוצב לעובד על ידי הממונה"],c:1,e:"שלושת המרכיבים במודל הבסיסי של ורום: תוצאה (outcome) — כל מה שנובע מהשקעת מאמץ; ערך (valence) — חשיבותה היחסית של התוצאה לפרט; וציפייה (expectancy) — ההסתברות שהפרט מייחס להשגת התוצאה בהתנהגות מסוימת."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהן שלוש השאלות שחוזק המוטיבציה הוא פונקציה שלהן לפי ורום?",o:["מה השקעתי, מה קיבלתי, ומה קיבלו אחרים באותו תפקיד","מה הידע שלי, מה הניסיון שלי, ומה רמת הביטחון העצמי שלי","האם אני יכול לבצע, מה התגמול שאקבל, וכמה שווה התגמול בעיניי","מה היעד, מי אחראי לו, ומהו לוח הזמנים שנקבע להשגתו"],c:2,e:"חוזק המוטיבציה הוא פונקציה של שלוש שאלות: האם אני יכול לבצע את ההתנהגות (ציפייה)? מה התגמול שאקבל על הביצוע (תכליתיות/תוצאה)? וכמה שווה התגמול בעיניי (ערכיות)?"},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"יעל אומרת: \"לא אגיש מועמדות לתפקיד כי אין לי את הכישורים להתקבל\". איזה מרכיב אצל ורום נמוך אצלה?",o:["מרכיב הערכיות","מרכיב התכליתיות","מרכיב ההוגנות","מרכיב הציפייה"],c:3,e:"הציפייה (expectancy) היא האמונה שאני יכול להצליח בביצוע. יעל אינה מאמינה שיש לה הכישורים להתקבל — ולכן מרכיב הציפייה שלה נמוך."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"\"ציפייה\" היא מרכיב במודל של מי?",o:["מודל הציפיות של ורום","מודל ההוגנות של אדמס","מודל הצבת המטרות של לוק","מודל מאפייני התפקיד של הקמן"],c:0,e:"הציפייה (expectancy) היא מרכיב מרכזי במודל הציפיות של ורום, לצד הערכיות (valence) והתכליתיות (instrumentality)."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי \"תכליתיות\" (אינסטרומנטליות) במודל של ורום?",o:["היחס בין מה שהשקעתי לבין מה שקיבלתי בתמורה","האמונה שהביצוע קשור לתגמול — מה אקבל בתמורה לביצוע","האמונה שאני יכול להצליח לבצע את ההתנהגות הנדרשת","החשיבות והמשמעות שאני נותן לתגמול שאקבל בסוף"],c:1,e:"התכליתיות היא האמונה שהביצוע קשור לתגמול — השאלה האינסטרומנטלית: מה אקבל בתמורה לביצוע. הציפייה היא האמונה שאוכל לבצע, והערכיות היא כמה שווה לי התגמול."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי הנוסחה הבסיסית של המוטיבציה לפי ורום?",o:["תגמול חלקי תשומה בהשוואה לאחר = מוטיבציה","ספציפיות ועוד מדידות ועוד השגתיות = מוטיבציה","ציפייה כפול תכליתיות כפול ערכיות = מוטיבציה","ציפייה ועוד תכליתיות ועוד ערכיות = מוטיבציה"],c:2,e:"לפי ורום: ציפייה (האמונה שאני יכול להצליח) כפול תכליתיות (האמונה שהביצוע קשור לתגמול) כפול ערכיות (המשמעות שאני נותן לתגמול) = מוטיבציה — הנכונות שלי להשקיע מאמץ."}
]);

{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"עבודת מוכר בחנות היא מטלה מסוג ____, ולכן כדי להגדיל מוטיבציה כדאי לתת תגמולי ____",o:["אלגוריתמית (מכניסטית) — ולכן תגמולי \"כעת ש...\"","יוריסטית (חקירתית) — ולכן תגמולי \"אם... אז\"","אלגוריתמית (מכניסטית) — ולכן תגמולי \"אם... אז\"","יוריסטית (חקירתית) — ולכן תגמולי \"כעת ש...\""],c:2,e:"עבודת מוכר בחנות היא מטלה אלגוריתמית (מכניסטית) — סדרת פעולות מוכרת המובילה לתוצאה מוגדרת. במטלות כאלה מקלות וגזרים — תגמולי \"אם... אז\" — פועלים היטב."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"פרויקט ייעוצי לחברה הוא מטלה מסוג ____, ולכן כדי להגדיל מוטיבציה כדאי לתת תגמולי ____",o:["אלגוריתמית (מכניסטית) — ולכן תגמולי \"אם... אז\" המותנים בביצוע","יוריסטית (חקירתית) — ולכן תגמולי \"אם... אז\" בסכומים גבוהים","אלגוריתמית (מכניסטית) — ולכן תגמולי \"כעת ש...\" הניתנים בדיעבד","יוריסטית (חקירתית) — ולכן תגמולי \"כעת ש...\", שאינם מותנים מראש"],c:3,e:"פרויקט ייעוצי הוא מטלה יוריסטית — אין בה אלגוריתם והיא מחייבת להמציא פתרון מחדש. תגמולי \"אם... אז\" עלולים דווקא לפגוע בה, ולכן עדיפים תגמולים שאינם מותנים מראש."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה ההשלכה הרחבה של הפגיעה שגורמים עקרונות מוטיבציה 2.0?",o:["הם עלולים לפגוע בביצוע מטלות יוריסטיות, שעליהן נשענת הכלכלה המודרנית","הם עלולים לפגוע רק במטלות אלגוריתמיות פשוטות, שכמותן הולכת ופוחתת","הם משפרים את הביצוע בכל סוגי המטלות, ולכן כדאי להרחיב מאוד את השימוש בהם","הם משפיעים רק על עובדים צעירים, ולכן ההשלכה על הארגון מוגבלת"],c:0,e:"העקרונות של מוטיבציה 2.0 עלולים לפגוע בביצוע מטלות יוריסטיות — ואלה בדיוק המטלות שעליהן נשענת הכלכלה המודרנית."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהן שלוש השיטות להרחבת מוטיבציה שמציע פינק (2012)?",o:["הצבת יעדים, מתן משוב שוטף והערכת ביצועים תקופתית","פדקס דיי, ROWE, והקדשת 10%-20% מזמן העבודה לנושאים אחרים","העלאת שכר, בונוס שנתי ומענק התמדה על שנות ותק בארגון","פיקוח צמוד, מדידת תפוקה וקשירת השכר לרמת הביצוע האישית בפועל"],c:1,e:"שלוש השיטות: פדקס דיי — הכרזה על 24 שעות להכנת מוצר או תהליך שאינו קשור ישירות לתפקיד; ROWE — סביבת עבודה ללא לוחות זמנים; והקדשת 10%-20% מזמן העבודה לנושאים אחרים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהו \"פדקס דיי\"?",o:["הקדשת חמישית מזמן העבודה השבועי לפרויקטים אישיים של העובד","יום שבו כל עובד מלווה עובד אחר בארגון ולומד את תפקידו","הכרזה על 24 שעות להכנת מוצר או תהליך שאינו קשור ישירות לתפקיד","סביבת עבודה ללא לוחות זמנים, ללא שעות נוכחות וללא מדיניות חופשות"],c:2,e:"פדקס דיי הוא הכרזה על 24 שעות להכנת מוצר או תהליך שאינו קשור ישירות לתפקיד. ROWE הוא סביבת עבודה ללא לוחות זמנים — אין שעות נוכחות או מדיניות חופשות."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהו ROWE כשיטה להרחבת מוטיבציה?",o:["24 שעות רצופות שבהן מכינים מוצר שאינו קשור ישירות לתפקידו של העובד","הקדשת 10%-20% מזמן העבודה לנושאים שמחוץ להגדרת התפקיד","תוכנית תגמול המבוססת על תוצאות בלבד ולא על שעות עבודה","סביבת עבודה ללא לוחות זמנים — אין שעות נוכחות ואין מדיניות חופשות"],c:3,e:"ROWE הוא סביבת עבודה ללא לוחות זמנים — אין שעות נוכחות או מדיניות חופשות. זו אחת משלוש השיטות שמציע פינק להרחבת המוטיבציה."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה מאפיין התנהגות מטיפוס X לעומת התנהגות מטיפוס I אצל פינק?",o:["X מונעת מתשוקות חיצוניות ומתגמולים; I מונעת מתשוקות פנימיות ומסיפוק מהפעילות עצמה","X מונעת מתשוקות פנימיות ומסיפוק אישי; I מונעת מתגמולים חיצוניים ומעונשים המתקבלים בסביבה","X מתאימה לעובדים ותיקים; I מתאימה לעובדים חדשים בתחילת דרכם","X מתאימה למטלות יוריסטיות; I מתאימה למטלות אלגוריתמיות בלבד"],c:0,e:"התנהגות מטיפוס X היא מערכת ההפעלה של מוטיבציה 2.0: מונעת מתשוקות חיצוניות, מתייחסת פחות לסיפוק הפנימי ובבסיסה הדחף השני. התנהגות מטיפוס I היא מערכת ההפעלה של מוטיבציה 3.0: מונעת מתשוקות פנימיות, מתייחסת יותר לסיפוק הפנימי מהפעילות עצמה ובבסיסה הדחף השלישי."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה גילה הניסוי של הארלו ואחרים (1949) בקופים?",o:["הקופים פתרו את המנגנון מהר יותר ככל שהוגדל התגמול שהובטח להם","הקופים פתרו את המנגנון ללא כל תמריץ חיצוני — כי הפתרון עצמו סיפק אותם","הקופים פתרו את המנגנון רק לאחר שקיבלו מזון כתגמול על כל הצלחה שלהם בניסוי","הקופים לא הצליחו לפתור את המנגנון ללא הדרכה מפורשת מהחוקרים"],c:1,e:"בניסוי הארלו איש לא לימד את הקופים כיצד לפרק את המנגנון והם לא תוגמלו במזון, בחיבה או בשבח — ובכל זאת הושגה למידה משמעותית וביצועים יעילים. הארלו העלה תיאוריה חדשה: הדחף השלישי — מוטיבציה פנימית. הקופים פתרו את הבעיה כי זה סיפק אותם, והסיפוק הוא התגמול."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה קרה בניסוי הארלו כאשר הוכנס מזון כתגמול?",o:["הקופים הפסיקו לחלוטין לעסוק במנגנון והתמקדו רק במזון","לא נצפה כל שינוי בביצועים בהשוואה למצב שלפני התגמול","הקופים טעו יותר והגיעו לפתרון בתדירות נמוכה יותר — הביצועים נפגעו","הקופים שיפרו את ביצועיהם באופן ניכר והגיעו אל הפתרון מהר הרבה יותר"],c:2,e:"בנטרול ההסברים האחרים: הכנסת מזון (דחף פנימי ביולוגי) הובילה לכך שהקופים טעו יותר והגיעו לפתרון בתדירות נמוכה יותר — כלומר הייתה פגיעה בביצועים. תגמולים ועונשים מבחוץ לא שינו את הביצועים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה נמצא בקבוצת הניסוי A במפגש השלישי בניסוי של דיסי?",o:["המשתתפים שיחקו יותר מבמפגש הראשון, מתוך עניין שגבר","המשתתפים שיחקו בדיוק אותו זמן כמו במפגש הראשון","המשתתפים סירבו להשתתף במפגש לאחר שהתשלום הופסק","המשתתפים שיחקו פחות מבמפגש הראשון, לאחר שהתשלום הופסק"],c:3,e:"בקבוצה A: במפגש הראשון (ללא תשלום) שיחקו 3-4.5 דקות; במפגש השני (בתשלום) יותר מחמש דקות; ובמפגש השלישי — שוב ללא תשלום — שיחקו פחות, כ-2 עד 3 דקות, מתחת למפגש הראשון."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה קרה בקבוצת הבקרה B בניסוי של דיסי?",o:["היא לא קיבלה תשלום באף מפגש, ובמפגש השלישי אף שיחקה מעט יותר מקודם","היא קיבלה תשלום בכל שלושת המפגשים והפגינה עניין הולך וגובר במשחק עצמו","היא קיבלה תשלום רק במפגש השלישי, ואז עלה זמן המשחק בחדות","היא הפסיקה להשתתף בניסוי לאחר המפגש הראשון בשל חוסר עניין"],c:0,e:"קבוצה B לא קיבלה תשלום באף אחד משלושת המפגשים ושיחקה בממוצע 3-4.5 דקות. במפגש השלישי, לאחר יציאת דיסי מהחדר, היא שיחקה מעט יותר מהמפגשים הקודמים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהו \"אפקט סוייר\" (מארק טוויין)?",o:["תהליך שבו העובד משווה את יחס התגמול-תשומה שלו לזה של עמיתיו","פעולה שיכולה להפוך משחק לעבודה או עבודה למשחק — תגמול חומרי הופך מטלה מעניינת למשעממת","תופעה שבה ציפייה חיובית של המנהל כלפי העובד שלו מובילה לשיפור ניכר וברור בביצועיו בפועל","תופעה שבה עצם הידיעה שצופים בעובד מובילה לעלייה בתפוקתו בעבודה"],c:1,e:"אפקט סוייר משמעו פעולה שיכולה להפוך משחק לעבודה או להפוך עבודה למשחק. תגמולים חומריים יכולים להפוך מטלה ממעניינת למשעממת, והקטנת המוטיבציה הפנימית מפילה ביצועים ויצירתיות."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"בניסוי הילדים והפרסים — איזו קבוצה הפגינה פחות עניין כעבור שבועיים?",o:["הקבוצה שלא קיבלה כל פרס לאורך הניסוי","כל שלוש הקבוצות הפגינו עניין זהה בציור","הקבוצה שציפתה לפרס והובטח לה פרס מראש","הקבוצה שקיבלה פרסים באופן בלתי צפוי"],c:2,e:"שבועיים לאחר מכן, הילדים שקיבלו פרסים באופן לא צפוי ואלה שלא קיבלו כלל הפגינו עניין בציור. דווקא הילדים מהקבוצה הראשונה — שציפו לקבל פרס אם יציירו (\"אם... אז\") — הפגינו פחות עניין, בשל אפקט סוייר."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהן ההשלכות של שימוש בתגמולים חיצוניים מסוג \"אם... אז\"?",o:["הם מגבירים את המוטיבציה הפנימית, וככל שהם גבוהים יותר הם משפרים את הביצועים משמעותית","הם אינם משפיעים כלל על המוטיבציה הפנימית או על רמת הביצועים","הם משפיעים רק על מטלות אלגוריתמיות ואינם רלוונטיים למטלות אחרות","הם מפחיתים מוטיבציה פנימית, וככל שהם גבוהים יותר הם מפחיתים משמעותית את הביצועים"],c:3,e:"תגמולי \"אם... אז\" מפחיתים מוטיבציה פנימית (דחף 3), וככל שהם גבוהים יותר הם מפחיתים משמעותית את הביצועים. לא ניתן להניח ששימוש בתגמולים או הגדלתם יביא לשיפור בביצועים — גם לא תגמולים מותנים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה נכון לגבי היכולת להניע אנשים ללא תגמולים חומריים?",o:["ניתן לגייס ולקדם עובדים מסוג I, לבצע העשרת תפקיד, ולהשתמש בפדקס דיי וב-ROWE","ניתן להסתמך אך ורק על העלאות שכר ובונוסים, שהם התמריץ היחיד היעיל","ניתן להניע רק עובדים ותיקים, שכבר סיפקו את צורכיהם הכלכליים הבסיסיים","ניתן להניע רק במטלות אלגוריתמיות, שבהן התוצאה ברורה ומדידה מראש"],c:0,e:"ניתן להניע ללא תגמולים חומריים בכמה דרכים: לגייס ולקדם עובדים מסוג I (המונעים מתשוקות פנימיות), לבצע העשרת תפקיד, ולהשתמש בשיטות כמו פדקס דיי, ROWE והקדשת 10%-20% מהזמן."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי הטענה של ניטשה, שאותה מביא פרופ' דן אריאלי?",o:["הדברים המתגמלים ביותר נובעים מהביטחון","הדברים המתגמלים ביותר נובעים מהקושי","הדברים המתגמלים ביותר נובעים מההצלחה","הדברים המתגמלים ביותר נובעים מההכרה"],c:1,e:"הפילוסוף הגרמני פרידריך ניטשה טען שהדברים המתגמלים ביותר נובעים מהקושי — ומוטיבציות רבות נובעות מהקושי. זו הטענה שמביא פרופ' דן אריאלי."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מה קורה, לפי פינק, כאשר מוסד שם דגש על טווח קצר ובוחר לשלוט בהתנהגות אנושית?",o:["הוא מגביר את המוטיבציה הפנימית","הוא מייתר את הצורך בתגמול חיצוני","הוא עושה נזק לטווח הארוך","הוא משפר את הביצועים לאורך זמן"],c:2,e:"לפי פינק, כאשר מוסד — משפחה, בית ספר, חברה, קבוצת ספורט וכדומה — שם דגש על טווח קצר ובוחר לשלוט בהתנהגות אנושית, הוא עושה נזק לטווח הארוך."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"אילו דרכים מונה הסיכום להגברת המוטיבציה הפנימית בארגון?",o:["העלאת שכר, בונוסים שנתיים, מענקי התמדה והטבות נלוות לעובדים הוותיקים בארגון","פיקוח צמוד, מעקב אחר חריגות ותיקון מהיר של סטיות מהתקן","קיצור שבוע העבודה, הוספת ימי חופשה ושיפור המשרדים","עיצוב עיסוקים והעשרתם, מודל הקמן ואולדהם, העצמת עובדים וניהול לפי יעדים"],c:3,e:"הגברת המוטיבציה הפנימית: עיצוב עיסוקים — הרחבת והעשרת עיסוקים; המודל של הקמן ואולדהם — העשרת תפקיד לפי חמשת המאפיינים; העצמת עובדים; וניהול לפי יעדים."},

{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"מהו \"אחדות הפיקוד\" בעקרונות המנהל של פיול?",o:["לכל פעילות בארגון יש מנהל אחראי אחד","כל היחידות חותרות לאותה מטרה ארגונית","הסמכות ניתנת בצמוד לאחריות המוטלת","כל עובד מקבל הוראות רק ממנהל אחד"],c:3,e:"לפי פיול, כל עובד מקבל הוראות רק ממנהל אחד — זהו עקרון אחדות הפיקוד. במקביל, לכל פעילות יש מנהל אחראי, וזהו עקרון אחדות הכיוון."},
{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"לפי פיול, מהו היחס בין הסמכות לאחריות?",o:["הסמכות ניתנת בצמוד לאחריות, כדי להבטיח ביצוע משימות","הסמכות ניתנת בנפרד מהאחריות, כדי לאפשר בקרה עצמאית","האחריות ניתנת תמיד ללא סמכות, כדי לעודד יוזמה אישית","הסמכות והאחריות מרוכזות שתיהן בדרג ההנהלה הבכירה בלבד"],c:0,e:"אצל פיול הסמכות ניתנת בצמוד לאחריות, כדי להבטיח ביצוע משימות. חלוקת העבודה מאפשרת התמחות שמגבירה יעילות, והמשמעת נובעת מכבוד הדדי."},
{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"מהו \"אחדות המטרות\" שמדגיש פיול?",o:["קביעת מטרות זהות לכל היחידות בארגון","העדפת טובת הארגון על פני אינטרסים אישיים","העדפת האינטרס האישי של העובד על פני הארגון","איחוד כל המטרות למטרה מדידה אחת ויחידה"],c:1,e:"אחדות המטרות אצל פיול משמעה העדפת טובת הארגון על פני אינטרסים אישיים. פיול מדגיש גם יציבות תעסוקתית, עידוד יוזמה, טיפוח רוח צוות והגינות כלפי העובדים."},
{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"אילו עקרונות נוספים מדגיש פיול, מעבר לחלוקת עבודה ולהיררכיה?",o:["תקשורת כתובה, תיעוד מלא והפרדה ברורה בין רכוש הפרט לרכוש הארגון","התמקדות בלקוח, שיפור מתמיד, מדידות מדויקות והעצמת עובדים","יציבות תעסוקתית, עידוד יוזמה, טיפוח רוח צוות והגינות כלפי העובדים","מדידת זמן ותנועה, תקני תפוקה וקשירת השכר לביצוע הנמדד"],c:2,e:"פיול מדגיש גם את חשיבות היציבות התעסוקתית, עידוד יוזמה מצד העובדים, טיפוח רוח צוות ושמירה על אחדות מטרות. ההגינות כלפי העובדים מחזקת את תחושת המחויבות."},
{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"לפי הארגון הביורוקרטי של וובר, ממה נובעת סמכותו של המנהל?",o:["מאישיותו ומהכריזמה שלו","מוותקו בארגון ומניסיונו","מהסכמת הכפיפים לסמכותו","מתפקידו ולא מאישיותו"],c:3,e:"בארגון הביורוקרטי של וובר הסמכות נובעת מתפקיד המנהל ולא מאישיותו, וניהול תקין מתבסס על מקצועיות, אובייקטיביות ושוויון."},
{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"כיצד נתפס העובד בארגון הביורוקרטי של וובר?",o:["כחלק ממערכת פורמלית, המבצע את תפקידו לפי חוקים ונהלים קבועים מראש","כיצור חברתי המונע מנורמות קבוצתיות ומיחסים בלתי פורמליים בקבוצה","כאדם מורכב שיש לקבוע לו תקנים אינדיבידואליים ולא כלליים","כשותף מלא לקבלת ההחלטות האסטרטגיות בכל דרגי הארגון"],c:0,e:"בארגון הביורוקרטי העובד נתפס כחלק ממערכת פורמלית, המבצע את תפקידו בהתאם לחוקים ולנהלים הקבועים מראש, ללא שיקולים אישיים או רגשיים. מטרת הגישה: יעילות, סדר ויציבות ארגונית לאורך זמן."},
{t:"תוספות לסיכום המקוצר",s:"שאלות מבחן",q:"איזה דפוס ניהולי לפי אדיג'ס מתאים למנכ\"ל ארגון?",o:["האינטגרטור (I)","היזם (E)","היצרן (P)","המינהלן (A)"],c:1,e:"הדפוס המתאים למנכ\"ל ארגון לפי אדיג'ס הוא היזם (E). התפקידים האופייניים ל-E הם מוביל פרויקטים, חדשנות, מנכ\"ל, מנהל פיתוח עסקי, מנהל שיווק ויועץ עצמאי."},
{t:"תוספות לסיכום המקוצר",s:"שאלות מבחן",q:"מנהל ממוקד עובדים הוא, לפי אדיג'ס, מנהל מסוג:",o:["מינהלן","יזם","מתכלל (האינטגרטור)","יצרן התוצאות"],c:2,e:"מנהל ממוקד עובדים הוא המתכלל — האינטגרטור (I), שתפקידו לבנות ולגבש צוות של אנשים ולכוון אותם להרמוניה חברתית."},
{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"אילו תפקידים אופייניים ליזם (E) לפי הסיכום?",o:["חשבונאות, בקרת תקציב, ביקורת פנים ומערכות מידע","מכירות, גיוס לקוחות ועמידה ביעדי ההכנסה הרבעוניים של הארגון","משאבי אנוש, רווחה, יחסי עבודה ופיתוח ארגוני","מוביל פרויקטים, חדשנות, מנכ\"ל, מנהל פיתוח עסקי ומנהל שיווק"],c:3,e:"התפקידים האופייניים ליזם (E): מוביל פרויקטים, חדשנות, מנכ\"ל, מנהל פיתוח עסקי, מנהל שיווק ויועץ עצמאי. לעומתו, מכירות אופייני ל-P, חשבונאות ל-A ומשאבי אנוש ל-I."},
{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"מהו השם הנוסף למנהיגות המתגמלת במודל של בס ואבוליו?",o:["מנהיגות עסקתית","מנהיגות מתמירה","מנהיגות מעצבת","מנהיגות מפתחת"],c:0,e:"המנהיגות המתגמלת נקראת גם מנהיגות עסקתית (transactional) — \"מקלות וגזרים\", תגמול מותנה. המנהיגות המעצבת נקראת גם מנהיגות מתמירה."},
{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"באיזה שם נוסף מכונה אי-המנהיגות במודל הטווח המלא?",o:["מנהיגות מתקנת","מנהיגות לסה פייר","מנהיגות עסקתית","מנהיגות מתמירה"],c:1,e:"אי-מנהיגות מכונה גם מנהיגות לסה פייר, ובקיצור \"שב והנח\": אין הגדרה ברורה של ציפיות, יעדים, תפקידים, תגמולים או עונשים, ואין מעורבות פעילה בעבודת המונהגים."},
{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"באיזה כינוי מתוארת תגובת המונהגים לאי-מנהיגות בסיכום?",o:["\"כסת\"ח\"","\"Yes men\"","\"טפלון\"","\"ראש קטן\""],c:2,e:"תגובת המונהגים לאי-מנהיגות מתוארת כ\"טפלון\" — אדישות וחוסר אכפתיות, שדבר אינו נדבק אליו. \"ראש קטן\" ו\"כסת\"ח\" מתארים תגובה לניהול חריגים אקטיבי, ו-\"Yes men\" את כפיפי המינהלן."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"לפי המבנה של הסיכום, אילו תיאוריות נכללות ב\"מוטיבציה 1.0\"?",o:["תיאוריות התהליך — לוק, אדמס וורום, העוסקות בחישוב הכדאיות","תיאוריות המוטיבציה הפנימית של פינק — אוטונומיה, מיומנות ומטרה","התיאוריות המצביות — פידלר והרסי ובלנשארד, התלויות בנסיבות","תיאוריות התוכן — הרצברג, מסלאו, אלדרפר, מקללנד והקמן ואולדהם"],c:3,e:"בסיכום, \"מוטיבציה 1.0 — מוטיבציה בשל צרכים\" היא הכותרת לתיאוריות התוכן: הרצברג, מסלאו, אלדרפר (ERG), מקללנד וגישת מאפייני התפקיד של הקמן ואולדהם."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"אילו תיאוריות נכללות ב\"מוטיבציה 2.0\" לפי מבנה הסיכום?",o:["תיאוריות התהליך — תורת המטרה, ההוגנות והציפיות","תיאוריות התוכן — מסלאו, הרצברג, אלדרפר ומקללנד","תיאוריות המוטיבציה הפנימית — אוטונומיה, שליטה ותכלית","התיאוריות ההתנהגותיות — מישיגן, אוהיו והסריג הניהולי"],c:0,e:"\"מוטיבציה 2.0 — מוטיבציית אם תעשה אז\" היא הכותרת לתיאוריות התהליכיות: תורת המטרה של לוק, תיאוריית ההוגנות של אדמס ותיאוריית הציפיות של ורום."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהי הנוסחה לחישוב פוטנציאל המוטיבציה (MPS) של הקמן ואולדהם?",o:["(משוב × אוטונומיה)/(מגוון + זהות + חשיבות)","משוב × אוטונומיה × (מגוון + זהות + חשיבות)/3","(משוב + אוטונומיה + מגוון + זהות + חשיבות) חלקי 5","משוב + אוטונומיה × (מגוון + זהות + חשיבות)"],c:1,e:"MPS = משוב × אוטונומיה × (מגוון + זהות + חשיבות)/3. מהנוסחה עולה שלאוטונומיה ולמשוב יש השפעה גדולה יותר על המוטיבציה מאשר לשאר הממדים, משום שהם מוכפלים ואינם ממוצעים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מדוע לאוטונומיה ולמשוב השפעה גדולה יותר על המוטיבציה בנוסחת ה-MPS?",o:["משום שהם היחידים שנמדדים באופן אובייקטיבי בשטח","משום שהם מוגדרים כמאפיינים חיצוניים ולא פנימיים","משום שהם מוכפלים בנוסחה, בעוד שלושת האחרים ממוצעים","משום שהם מופיעים בנוסחה פעמיים כל אחד מהם ובמשקל כפול"],c:2,e:"בנוסחה MPS = משוב × אוטונומיה × (מגוון + זהות + חשיבות)/3, המשוב והאוטונומיה הם גורמי הכפל, ואילו שלושת המאפיינים האחרים נכנסים כממוצע — ולכן השפעתם על התוצאה קטנה יותר."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהם מרכיבי מודל SWOT?",o:["ספציפי, מדיד, בר-השגה ותחום בזמן","עוצמה, כיוון, התמדה ומיקוד","תשומות, עיבודים, תפוקות ומשוב","חוזקות, חולשות, הזדמנויות ואיומים"],c:3,e:"מודל SWOT כולל חוזקות, חולשות, הזדמנויות ואיומים. הוא מוזכר בסיכום לצד מודל SMART בהקשר של הצבת יעדים."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהם שלושת הצרכים העומדים בבסיס \"התנהגות מטיפוס I\" לפי פינק?",o:["אוטונומיה, שליטה ותכלית","הישג, עוצמה והשתייכות חברתית","קיום, קשר וצמיחה","עוצמה, כיוון והתמדה"],c:0,e:"במרכז \"התנהגות מטיפוס I\" עומד הדחף השלישי: הצורך לחוש אוטונומיה (היכולת לנהל את עצמנו), שליטה (הרצון לשפר ולשכלל את יכולותינו בתחומים החשובים לנו) ותכלית (הצורך להשתייך למשהו גדול יותר מאיתנו)."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"ממה מונעים עובדים מסוג I, לפי פינק?",o:["מהשוואת התגמול שלהם לזה של עמיתיהם באותו תפקיד","מהסיפוק וההנאה מהפעילות עצמה, מהאתגר ומהיכולת לתרום ולהתפתח","מהתגמול החיצוני הניתן להם בסוף התהליך ומגובה הבונוס השנתי","מהחשש מתגובה חריפה של המנהל בכל תקלה או כישלון"],c:1,e:"עובדים מסוג I מונעים בעיקר מהסיפוק וההנאה שהם מפיקים מהפעילות עצמה, מהאתגרים שהיא מציבה ומהיכולת שלהם לתרום ולהתפתח — ולאו דווקא מהתגמול החיצוני הניתן בסוף התהליך."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"מהן שלוש רמות הצרכים במודל ERG של אלדרפר?",o:["צורך בהישג, צורך בעוצמה וצורך בהשתייכות","צרכים היגייניים חיצוניים, צרכים מוטיבטוריים פנימיים וצרכים ניטרליים","צרכים קיומיים (Existence), צרכי קשר (Relatedness) וצרכי צמיחה (Growth)","צרכים פיזיים, צורכי ביטחון וצורכי הערכה עצמית"],c:2,e:"מודל ERG של אלדרפר מקבץ את חמש הרמות של מסלאו לשלוש: צרכים קיומיים (Existence), צרכי קשר (Relatedness) וצרכי צמיחה (Growth)."},
{t:"מוטיבציה — ירד מהמבחן",s:"מחוץ להיקף",q:"לפי הרצברג, מה קורה כאשר הצרכים ההיגייניים אינם מסופקים?",o:["מצב ניטרלי של היעדר חוסר שביעות רצון","שביעות רצון ומוטיבציה גבוהה במיוחד","אין השפעה כלל על שביעות הרצון","חוסר שביעות רצון ומוטיבציה נמוכה"],c:3,e:"אצל הרצברג: אי-סיפוק צרכים היגייניים גורם לחוסר שביעות רצון ולמוטיבציה נמוכה, ואילו סיפוקם מביא רק להיעדר חוסר שביעות רצון. אי-סיפוק הצרכים הפנימיים מביא למצב ניטרלי, וסיפוקם — לשביעות רצון ולמוטיבציה גבוהה."},
{t:"תוספות לסיכום המקוצר",s:"סיכום",q:"בשאלון ה-LPC של פידלר, מה משמעות דירוג גבוה שנותן המנהיג לעובד הפחות מועדף עליו?",o:["המנהיג מכוון אנשים (חברתי), למרות דעתו השלילית על אותו עובד","המנהיג מכוון מטרה (משימתי), משום שהוא מתעלם מהיבטים אישיים","המנהיג אינו אפקטיבי, משום שאינו מבחין בין עובדים טובים לחלשים","המנהיג נמצא בשלב מוקדם של היכרות עם הצוות ואינו יכול לדרג"],c:0,e:"אם המנהיג דירג את העובד הלא מועדף עליו גבוה — למרות דעתו השלילית עליו — הוא מכוון אנשים (חברתי). אם נתן לו ציון נמוך — הוא מכוון מטרה (משימתי)."},

    w.style.borderColor="var(--errBd)";
    w.innerHTML="<b style='color:var(--errTx)'>⚠ "+nOut+" מהשאלות שנבחרו הן מחוץ להיקף המבחן</b> — "+
      "נושאים שהיו בסיכום הישן ונשמטו מהסיכום המקוצר (רדין, וורום-ייטון, נתיב-מטרה, צדק ארגוני ועוד). "+
      "הן מסומנות בתווית אדומה, ואינן מופיעות בחוברת החומר הפתוח. "+
      "לתרגול לפי הסיכום החדש בלבד — בחרו בהיקף <b>היקף המבחן</b>.";
    c.appendChild(w);
  }

  var go=E("button",{"class":"btn btn-pri"},
    sel.mode==="exam"?"התחלת סימולציית מבחן":"התחלת תרגול");
  go.style.width="100%";
  if(n===0){go.disabled=true;go.textContent="בחרו לפחות נושא אחד";}
  go.onclick=function(){ sel.mode==="exam"?examStart():practiceStart(); };
  c.appendChild(go);

  /* הדפסה — המבחן פתוח-חומר, ולכן אפשר להיכנס איתו לכיתה */
  var pr=E("div",{"class":"toolbar"});
  pr.style.marginTop="12px";
  pr.appendChild(E("span",{"class":"lbl"},"הדפסה:"));
  var p1=E("button",{"class":"iconbtn"},"🖨 השאלות עם התשובות");
  p1.onclick=function(){printSheet(true);};
  var p2=E("button",{"class":"iconbtn"},"🖨 השאלות בלבד");
  p2.onclick=function(){printSheet(false);};
  pr.appendChild(p1);pr.appendChild(p2);
  c.appendChild(pr);
  c.appendChild(E("div",{"class":"scopehint"},
    "מדפיס את "+n+" השאלות שנבחרו למעלה — לפי הנושאים וההיקף. "+
    "לחוברת החומר עצמו יש קובץ נפרד (הקישור בראש העמוד)."));

  app.appendChild(c);
}

/* ---------- גיליון הדפסה ---------- */
/* נבנה אל תוך #print, שמוסתר במסך ומוצג רק בהדפסה. כך אין צורך
   בחלון חדש (שחוסמי חלונות קופצים עוצרים) והעיצוב נשאר בקובץ אחד. */
function printSheet(withAnswers){
  var arr=filterBank();
  if(!arr.length){alert("לא נבחרו שאלות להדפסה.");return;}
  var box=document.getElementById("print");
  box.className = withAnswers ? "" : "cols";   /* בלי תשובות — צפוף יותר, שתי עמודות */
  var esc=function(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;};
  var h='<div class="prhead"><h2>בוחן תרגול — מנהיגות בניהול</h2><div>'+
        arr.length+" שאלות · "+(SCOPE[sel.src]?SCOPE[sel.src].name:sel.src)+
        " · "+(withAnswers?"עם תשובות והסברים":"ללא תשובות")+"</div></div>";
  arr.forEach(function(q,i){
    h+='<div class="pq"><div class="pt">'+esc(q.t)+
       (q.s===OUT_OF_SCOPE?' · <b>⚠ מחוץ להיקף המבחן</b>':'')+'</div>'+
       '<div><span class="pn">'+(i+1)+'.</span> '+esc(q.q)+'</div>';
    q.o.forEach(function(o,k){ h+='<div class="po">'+LET[k]+". "+esc(o)+"</div>"; });
    if(withAnswers)
      h+='<div class="po pa">✔ '+LET[q.c]+". "+esc(q.o[q.c])+'</div>'+
         '<div class="po pe">'+esc(q.e)+"</div>";
    h+="</div>";
  });
  box.innerHTML=h;
  window.print();
}

/* ---------- shared bits ---------- */
function bar(frac){
  var b=E("div",{"class":"bar"});
  b.innerHTML='<i style="width:'+(frac*100)+'%"></i>';
  return b;
}
function metaRow(q){
  var r=E("div",{"class":"qmeta"});
  r.innerHTML='<span class="pill">'+q.t+'</span><span class="pill" style="background:'+srcBg(q.s)+';color:'+srcFg(q.s)+'">'+((SRC_META[q.s]||{}).full||q.s)+'</span>';
  return r;
}
function topBar(extraHtml){
  var t=E("div",{"class":"toolbar"});
  var back=E("button",{"class":"iconbtn"},"→ חזרה להגדרות");
  back.onclick=function(){if(!timer||confirm("לצאת מהמבחן? התשובות לא יישמרו."))setup();};
  t.appendChild(back);
  t.appendChild(E("span",{"class":"spacer"}));
  if(extraHtml)t.appendChild(E("span",{},extraHtml));
  var th=E("button",{"class":"iconbtn"},"◐");
  th.onclick=toggleTheme;t.appendChild(th);
  return t;
}

/* ---------- practice mode ---------- */
function practiceStart(){
  quiz=buildQuiz();
  /* אותה דגימה מאוזנת של המבחן — סבב קצר שמרוכז בשניים-שלושה נושאים
     אינו מייצג, והמאגר אינו מאוזן בין הנושאים. */
  if(sel.pcount&&quiz.length>sel.pcount)
    quiz=shuffle(balancedPick(quiz,sel.pcount));
  idx=0;score=0;wrong=[];ansMap=[];
  pRender();
}
function pRender(){
  if(idx>=quiz.length)return pResults();
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar());
  var st=E("div",{"class":"stats"});
  function statsHtml(done){
    var seen=idx+(done?1:0);
    return "<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span>"+
      "<span>נכונות: <b>"+score+"</b></span>"+
      "<span>שגויות: <b>"+wrong.length+"</b></span>"+
      "<span class='spacer'></span><span>הצלחה: <b>"+(seen?Math.round(score/seen*100)+"%":"—")+"</b></span>";
  }
  st.innerHTML=statsHtml(false);
  c.appendChild(st);
  c.appendChild(bar(idx/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  answered=false;
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){
      if(answered)return;
      answered=true;
      var all=box.querySelectorAll(".opt");
      for(var k=0;k<all.length;k++)all[k].className="opt locked";
      all[q.c].className="opt correct locked";
      if(i===q.c){score++;}
      else{all[i].className="opt wrong locked";wrong.push(q);}
      st.innerHTML=statsHtml(true);
      var ex=E("div",{"class":"expl"});
      ex.innerHTML='<span class="tag">'+(i===q.c?"נכון · ":"התשובה הנכונה: "+LET[q.c]+" · ")+'</span>'+q.e;
      c.insertBefore(ex,navRow);
      nextBtn.disabled=false;nextBtn.className="btn btn-pri";
    };
    box.appendChild(b);
  });
  c.appendChild(box);

  var navRow=E("div",{"class":"nav"});
  var nextBtn=E("button",{"class":"btn"},idx===quiz.length-1?"סיום וצפייה בציון":"השאלה הבאה ←");
  nextBtn.disabled=true;
  nextBtn.onclick=function(){idx++;pRender();};
  var skip=E("button",{"class":"btn"},"דילוג");
  skip.onclick=function(){idx++;pRender();};
  navRow.appendChild(nextBtn);navRow.appendChild(skip);
  c.appendChild(navRow);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function pResults(){
  results(score,quiz.length,wrong,practiceStart,function(){
    quiz=wrong.slice();if(sel.shuffle)shuffle(quiz);
    idx=0;score=0;wrong=[];pRender();
  },null);
}

/* ---------- exam mode ---------- */
/* דגימה מאוזנת בין נושאים: המאגר אינו מאוזן (יש נושאים עם יותר שאלות
   מאחרים, לפי כמה חומר יש עליהם), ולכן דגימה אקראית פשוטה תיתן מבחן
   שרובו שניים-שלושה נושאים. כאן לוקחים לסירוגין מכל נושא בתורו. */
function balancedPick(arr,n){
  var byTopic={},order=[];
  arr.forEach(function(q){ if(!byTopic[q.t]){byTopic[q.t]=[];order.push(q.t);} byTopic[q.t].push(q); });
  var out=[],i=0;
  while(out.length<n){
    var added=false;
    for(var k=0;k<order.length&&out.length<n;k++){
      var pool=byTopic[order[k]];
      if(i<pool.length){ out.push(pool[i]); added=true; }
    }
    if(!added)break;      /* מוצו כל הנושאים */
    i++;
  }
  return out;
}
function examStart(){
  quiz=buildQuiz();
  if(sel.count&&quiz.length>sel.count)
    quiz=sel.balanced?shuffle(balancedPick(quiz,sel.count)):quiz.slice(0,sel.count);
  idx=0;ansMap=new Array(quiz.length);
  timeLeft=sel.minutes*60;
  if(sel.minutes)startTimer();
  eRender();
}
function startTimer(){
  stopTimer();
  timer=setInterval(function(){
    timeLeft--;
    var el=document.getElementById("clock");
    if(el)el.textContent=fmt(timeLeft);
    if(timeLeft<=0){stopTimer();examSubmit(true);}
  },1000);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function eRender(){
  var q=quiz[idx];
  app.innerHTML="";
  var c=E("div",{"class":"card"});
  c.appendChild(topBar(sel.minutes?'זמן שנותר: <span class="clock" id="clock">'+fmt(timeLeft)+'</span>':""));
  var nAns=0;for(var i=0;i<ansMap.length;i++)if(ansMap[i]!=null)nAns++;
  var st=E("div",{"class":"stats"});
  st.innerHTML="<span>שאלה <b>"+(idx+1)+"</b> / <b>"+quiz.length+"</b></span><span>נענו: <b>"+nAns+"</b></span>";
  c.appendChild(st);
  c.appendChild(bar(nAns/quiz.length));
  c.appendChild(metaRow(q));
  c.appendChild(E("div",{"class":"qtext"},q.q));

  var box=E("div");
  q.o.forEach(function(txt,i){
    var b=E("button",{"class":"opt"+(ansMap[idx]===i?" picked":"")});
    b.innerHTML='<span class="ltr">'+LET[i]+'</span><span>'+txt+'</span>';
    b.onclick=function(){ansMap[idx]=i;eRender();};
    box.appendChild(b);
  });
  c.appendChild(box);

  var nav=E("div",{"class":"nav"});
  var prev=E("button",{"class":"btn"},"→ הקודמת");
  prev.disabled=idx===0;prev.onclick=function(){idx--;eRender();};
  var next=E("button",{"class":"btn btn-pri"},"הבאה ←");
  next.disabled=idx===quiz.length-1;next.onclick=function(){idx++;eRender();};
  nav.appendChild(prev);nav.appendChild(next);
  c.appendChild(nav);

  c.appendChild(E("div",{"class":"ptitle",style:"margin-top:16px"},"מפת שאלות — לחצו למעבר"));
  var pal=E("div",{"class":"palette"});
  quiz.forEach(function(_,i){
    var b=E("button",{"class":"pbtn"+(ansMap[i]!=null?" ans":"")+(i===idx?" cur":"")},String(i+1));
    b.onclick=function(){idx=i;eRender();};
    pal.appendChild(b);
  });
  c.appendChild(pal);

  var sub=E("button",{"class":"btn btn-pri"},"הגשת המבחן");
  sub.style.width="100%";sub.style.marginTop="14px";
  sub.onclick=function(){
    var un=quiz.length-nAns;
    if(un>0&&!confirm("נותרו "+un+" שאלות ללא מענה. להגיש בכל זאת?"))return;
    examSubmit(false);
  };
  c.appendChild(sub);
  app.appendChild(c);
  window.scrollTo(0,0);
}
function examSubmit(auto){
  stopTimer();
  var sc=0,wr=[];
  quiz.forEach(function(q,i){ if(ansMap[i]===q.c)sc++; else wr.push({q:q,given:ansMap[i]}); });
  results(sc,quiz.length,wr.map(function(x){return x.q;}),examStart,null,wr,auto);
}

/* ---------- results ---------- */
function results(sc,total,wr,onAgain,onRetryWrong,detail,auto){
  stopTimer();
  app.innerHTML="";
  var pct=total?Math.round(sc/total*100):0;
  var c=E("div",{"class":"card result"});
  if(auto)c.appendChild(E("div",{"class":"note"},"<b>הזמן נגמר</b> — המבחן הוגש אוטומטית."));
  c.appendChild(E("div",{"class":"big"},pct));
  var g = pct>=90?"מצוין — שליטה מלאה בחומר":
          pct>=80?"טוב מאוד":
          pct>=70?"טוב — כדאי לחזור על הנושאים החלשים":
          pct>=60?"עובר — מומלץ לחזור ולתרגל":
                  "מתחת לציון עובר — כדאי לחזור על החומר ולתרגל שוב";
  c.appendChild(E("div",{"class":"grade"},sc+" מתוך "+total+" · "+g));

  var nav=E("div",{"class":"nav"});
  var again=E("button",{"class":"btn btn-pri"},"סבב חדש");
  again.onclick=onAgain;nav.appendChild(again);
  if(onRetryWrong&&wr.length){
    var rw=E("button",{"class":"btn"},"תרגול "+wr.length+" השגויות");
    rw.onclick=onRetryWrong;nav.appendChild(rw);
  }
  var home=E("button",{"class":"btn"},"הגדרות");
  home.onclick=setup;nav.appendChild(home);
  c.appendChild(nav);
  app.appendChild(c);

  if(detail&&detail.length){
    var d=E("div",{"class":"card"});
    d.appendChild(E("div",{"class":"ptitle"},"סקירת "+detail.length+" השאלות שנענו לא נכון"));
    detail.forEach(function(x){
      var r=E("div",{"class":"rev"});
      var given = x.given==null?"<i>לא נענתה</i>":LET[x.given]+". "+x.q.o[x.given];
      r.innerHTML='<div class="rq">'+x.q.q+'</div>'+
        '<div class="ra">התשובה שלך: '+given+'</div>'+
        '<div class="rc">התשובה הנכונה: '+LET[x.q.c]+". "+x.q.o[x.q.c]+'</div>'+
        '<div style="margin-top:6px;color:var(--muted)">'+x.q.e+'</div>';
      d.appendChild(r);
    });
    app.appendChild(d);
  } else if(wr.length){
    var d2=E("div",{"class":"card"});
    d2.appendChild(E("div",{"class":"ptitle"},"נושאים לחזרה"));
    var byTopic={};
    wr.forEach(function(q){byTopic[q.t]=(byTopic[q.t]||0)+1;});
    var ul=E("div",{"class":"toolbar"});
    Object.keys(byTopic).forEach(function(t){
      ul.appendChild(E("span",{"class":"pill"},t+" — "+byTopic[t]+" שגיאות"));
    });
    d2.appendChild(ul);
    app.appendChild(d2);
  }
  window.scrollTo(0,0);
}

setup();
})();
</script>
